    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:49.240Z","entries":{"college:panjab-university":[{"id":1122,"date":"2026-11-04T06:54:54","date_gmt":"2026-11-04T06:54:54","guid":{"rendered":"https://staging.a3educarehub.in/colleges/panjab-university/"},"modified":"2026-11-04T06:54:54","modified_gmt":"2026-11-04T06:54:54","slug":"panjab-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/panjab-university/","title":{"rendered":"Panjab University"},"content":{"rendered":"","protected":false},"featured_media":1202,"template":"","class_list":["post-1122","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Panjab University, established in 1882, reports 35th place among universities and 3rd among state universities in NIRF 2025. Its 21 residence halls house nearly 7,600 students, and its campus housing was designed by the Swiss architect Pierre Jeanneret.","college_overview":"<p>Panjab University traces its establishment to 1882 and works today under the Panjab University Act of 1947. Its 2026 handbook gives NIRF 2025 positions of 35th among universities, 3rd among state universities and 3rd in Pharmacy.</p><p>Its first hostel, now Mehr Chand Mahajan Hall, had its foundation stone laid on 30 March 1958. The residential campus was designed by Pierre Jeanneret and now counts 21 halls, including eight for men and eleven for women.</p><p>The university has implemented NEP 2020 in all teaching departments, and it reaches beyond Chandigarh through regional centres at Sri Muktsar Sahib and Ludhiana.</p>","location":"Chandigarh, India","city":"Chandigarh","state":"Chandigarh","established":"1882","affiliation":"Established under the Panjab University Act VII of 1947","recognition":"<ul><li><strong>NIRF 2025, as stated in the handbook:</strong> 35th among universities, 3rd among state universities, 3rd in Pharmacy, 37th in Research</li><li><strong>NIRF Innovation 2025:</strong> 11-50 band</li></ul>","courses_offered":"<p>Courses are listed faculty by faculty in Part B of the Handbook of Information.</p><ul><li>Teaching departments in Chandigarh, under NEP 2020</li><li>University Business School</li><li>Pharmacy</li><li>Law: Department of Laws and University Institute of Legal Studies</li><li>Regional centres at Sri Muktsar Sahib and Ludhiana</li></ul>","admission_process":"<p>Applicants follow the Handbook of Information, which sets out rules, seats, eligibility and fees. For 2026, the UG online form closed on 1 July, and admissions were due to finish by 10 September.</p>","eligibility":"<p>Each course's conditions are in the Handbook of Information. International students from non-English-speaking countries need at least IELTS Band 5 or TOEFL 60.</p>","entrance_exams":"As listed in the Handbook of Information for each course","fees_information":"<p>The Handbook of Information sets out the fee structure for each course. The hostel handbook for 2026-27 covers residence charges.</p>","campus_facilities":"<p>The residential campus was designed by Pierre Jeanneret, who served as chief architect for much of Chandigarh.</p>","hostel_information":"<p>There are 21 residence halls: eight for men, eleven for women, one working women's hostel and one international hostel, with room for nearly 7,600 students. Admission rules and charges are in the 2026-27 hostel handbook.</p>","placement_information":"<p>University Business School's handbook names companies that have selected its students for summer placements, including Nestle, Airtel, ONGC and NTPC.</p>","scholarships":"<p>The fee concession rules below are from Part C of the Handbook of Information 2026. Concessions are granted by the Dean of University Instruction, last for one year, and must be applied for through the department by 30 November.</p><h4>Means-cum-Merit Tuition Fee Support</h4><p>For students on regular degree courses, not diplomas or certificates, who passed the qualifying examination with at least 50% marks. Support depends on annual family income:</p><ul><li>Up to Rs 1,00,000: 100% of the tuition fee</li><li>Rs 1,00,001 to Rs 1,50,000: 75%</li><li>Rs 1,50,001 to Rs 2,50,000: 50%</li><li>Rs 2,50,001 to Rs 3,50,000: 10%</li><li>Rs 3,50,001 to Rs 4,50,000: 5%</li></ul><p>To keep the support in later years, a student needs at least 60% in Science or Engineering, or 55% in other departments, with no reappear or compartment.</p><h4>Other university concessions</h4><ul><li><strong>Freeship:</strong> the university may provide freeship on five per cent of seats for meritorious students from economically weaker sections in partially self-supporting courses. It covers the tuition fee and 50% of user and maintenance charges.</li><li><strong>Tuition exemption:</strong> up to 10% of the students in a class.</li><li><strong>Brothers and sisters:</strong> the eldest pays full fees and the younger ones pay half the tuition fee.</li><li><strong>Student Aid Fund:</strong> for needy students with at least 50% in the previous examination, in income slabs up to Rs 4,00,000. Students on self-financing courses are not eligible.</li><li><strong>Loss of parents:</strong> tuition fee concession where both parents are not surviving, or where the father has died and the mother cannot bear the cost, with family income up to Rs 2,50,000.</li><li><strong>Completely blind students:</strong> free education, including the examination fee, for progressive courses, with family income up to Rs 2.5 lakh. Students with a physical disability may receive the concession and financial assistance available to blind students.</li><li><strong>Transgender students:</strong> fee concession, with income up to Rs 2.5 lakh a year.</li><li><strong>Orphan children:</strong> additional seats for one male and one female student, with concession of course, regular examination and hostel fees.</li><li><strong>Kargil War:</strong> fee exemption for wards of martyrs or of those permanently disabled, with a valid Ministry of Defence certificate.</li></ul><h4>Government and outside schemes</h4><p>The handbook says scholarships are offered under schemes of Punjab, Haryana, Himachal Pradesh and the Union Territory of Chandigarh, with details from their Directors of Education. Some aid is also available from the Panjab University Students' Aid Society. The university's scholarships page links to the National Scholarship Portal, Central Sector scholarships, Post Matric scholarships and PUAA scholarships.</p>","college_image":null,"official_website":"https://puchd.ac.in","cta_heading":"Applying to Panjab University?","cta_description":"Get help with the Handbook of Information and choosing your course.","faq_1_question":"When was Panjab University established?","faq_1_answer":"<p>In 1882.</p>","faq_2_question":"Where did it place in NIRF 2025?","faq_2_answer":"<p>35th among universities and 3rd among state universities, according to its handbook.</p>","faq_3_question":"How many hostels are there?","faq_3_answer":"21 residence halls, housing nearly 7,600 students.","faq_4_question":"Where are the course fees listed?","faq_4_answer":"<p>In the Handbook of Information.</p>","faq_5_question":"Does it have regional centres?","faq_5_answer":"<p>Yes, including Sri Muktsar Sahib and Ludhiana.</p>","featured_image":{"id":1202,"date":"2026-11-04T07:27:20","date_gmt":"2026-11-04T07:27:20","guid":{"rendered":"https://staging.a3educarehub.in/colleges/panjab-university/panjab-university-campus/"},"modified":"2026-11-04T07:27:20","modified_gmt":"2026-11-04T07:27:20","slug":"panjab-university-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/panjab-university/panjab-university-campus/#main","title":{"rendered":"Panjab University campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1202","attachment","type-atta
