    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:18.869Z","entries":{"college:maulana-azad-medical-college":[{"id":1106,"date":"2026-11-04T06:54:13","date_gmt":"2026-11-04T06:54:13","guid":{"rendered":"https://staging.a3educarehub.in/colleges/maulana-azad-medical-college/"},"modified":"2026-11-04T06:54:13","modified_gmt":"2026-11-04T06:54:13","slug":"maulana-azad-medical-college","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/maulana-azad-medical-college/","title":{"rendered":"Maulana Azad Medical College"},"content":{"rendered":"","protected":false},"featured_media":1191,"template":"","class_list":["post-1106","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Maulana Azad Medical College opened to students on 1 August 1958 and is affiliated to the University of Delhi. It admits 250 MBBS students a year and trains them in a campus of about 122 acres alongside Lok Nayak Hospital and three other institutes.","college_overview":"<p>The college began in 1958, with the former Irwin Hospital, now Lok Nayak Hospital, attached to it, and takes its name from Maulana Abul Kalam Azad. The foundation of its main building was laid in October 1959.</p><p>Clinical training draws on a group of attached institutions: Lok Nayak Hospital, GB Pant Institute of Postgraduate Medical Education and Research, Maulana Azad Institute of Dental Sciences and Guru Nanak Eye Centre. The college states a combined capacity of 2,800 beds and about 7,200 outpatients a day.</p><p>Its courses are affiliated to the University of Delhi, so applicants follow Delhi University's admission norms for most seats alongside the all-India quota.</p>","location":"2 Bahadur Shah Zafar Marg, New Delhi 110002, India","city":"New Delhi","state":"Delhi","established":"1958","affiliation":"University of Delhi","recognition":"<p>The college states that its courses are affiliated to the <strong>University of Delhi</strong> and recognised by the national medical regulator. The National Medical Commission lists it as a government college.</p>","courses_offered":"<ul><li><strong>MBBS:</strong> 250 students a year; 5.5 years including one year of internship</li><li><strong>Postgraduate:</strong> degree courses listed on the college website</li><li><strong>Super-speciality, DNB and fellowship programmes</strong></li></ul>","admission_process":"<p>15% of MBBS seats are filled on an all-India basis and 85% under Delhi University norms. Six seats are for Government of India nominees. New students receive an admission letter from the University of Delhi and pay fees within the dates in that letter. The university's Faculty of Medical Sciences publishes the admission bulletin for each year.</p>","eligibility":"<p>MBBS applicants must qualify in NEET UG and meet the conditions in the University of Delhi Faculty of Medical Sciences bulletin for that year.</p>","entrance_exams":"NEET UG for MBBS","fees_information":"<p><strong>MBBS, college admissions page:</strong></p><ul><li>Annual tuition fee: Rs 240</li><li>Library fee: Rs 100</li><li>Annual laboratory fee: Rs 10</li><li>Refundable security deposit for breakage: Rs 2,000</li><li>University enrolment fee, if not already enrolled at Delhi University: Rs 300</li><li>Other annual charges, including union, development and sports funds, are listed on the same page.</li></ul>","campus_facilities":"<p>The college states that its campus covers about 122 acres, with Lok Nayak Hospital, GB Pant Institute of Postgraduate Medical Education and Research, Maulana Azad Institute of Dental Sciences and Guru Nanak Eye Centre attached. Together they have 2,800 beds, about 7,200 outpatients a day and 47 operation theatres.</p>","hostel_information":"<p><strong>Undergraduate hostels:</strong> Girls Hostel 1, Old Girls Hostel, New Girls Hostel, Women Intern Hostel, Boys Hostel 1, Old Boys Hostel and Boys Intern Hostel.</p><p><strong>Postgraduate hostels:</strong> PG Men's Hostel, New Girls Hostel, Old and New Resident Doctors Hostels, and Lok Nayak Resident Doctors Hostel.</p><p>Students may have to share rooms until a new hostel block is built. Mess charges are paid directly to the mess contractor.</p>","placement_information":"","scholarships":"<p>The newest college scholarship circular found is dated 4 January 2024 and covers first-year MBBS students admitted in 2023-24. Check with the Academic Branch for the current session.</p><ul><li><strong>Maulana Azad Student Scholarship Scheme (MASSS):</strong> 2 scholarships</li><li><strong>Dr. Surendra and Gayatri Garg Medical Student Scholarship Award:</strong> 1 scholarship, by nomination for the IMA</li></ul><p><strong>Conditions in that circular:</strong> annual family income below Rs 2 lakh, with income proof and a current passbook. Students already receiving another scholarship are not eligible.</p><p><strong>Government schemes:</strong> the Academic Branch has posted National Scholarship Portal notices for 2025-26, covering SC and OBC students of Delhi and the ST students' scheme.</p><p>The college also lists merit awards and medals, such as the Dr. Dharamvir Gold Medal for the best medical graduate of the year. These are not financial aid schemes.</p>","college_image":null,"official_website":"https://mamc.delhi.gov.in","cta_heading":"Hoping to study at Maulana Azad Medical College?","cta_description":"Get help with NEET UG planning and Delhi University counselling.","faq_1_question":"How many MBBS seats does the college have?","faq_1_answer":"<p>The college admits 250 MBBS students each year.</p>","faq_2_question":"How are seats divided?","faq_2_answer":"<p>15% on an all-India basis and 85% under Delhi University norms. Six seats are for Government of India nominees.</p>","faq_3_question":"Which university is the college affiliated to?","faq_3_answer":"The University of Delhi.","faq_4_question":"How long is the MBBS course?","faq_4_answer":"<p>5.5 years, including one year of internship.</p>","faq_5_question":"Which hospitals are attached to the college?","faq_5_answer":"<p>Lok Nayak Hospital and GB Pant Institute of Postgraduate Medical Education and Research, along with Guru Nanak Eye Centre and Maulana Azad Institute of Dental Sciences.</p>","featured_image":{"id":1191,"date":"2026-11-04T07:25:48","date_gmt":"2026-11-04T07:25:48","guid":{"rendered":"https://staging.a3educarehub.in/colleges/maulana-azad-medical-college/maulana-azad-medical-college-campus/"},"modified":"2026-11-04T07:25:48","modified_gmt":"2026-11-04T07:25:48","slug":"maulana-azad-medical-college-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/maulana-azad-medical-college/maulana-azad-medical-college-campus/#main","title":{"rendered":"Maulana Azad Medical College campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1191","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/maulana-azad-medical-college.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"260\" height=\"300\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/maulana-azad-medical-college-260x300.jpg\" class=\"attachment-medium size-medium\" alt=\"Maulana Azad Medical College campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/maulana-azad-medical-college-260x300.jpg 260w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/maulana-azad-medical-college-889x1024.jpg 889w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/maulana-azad-medical-college-768x885.jpg 768w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/maulana-azad-medical-college.jpg 1280w\" sizes=\"(max-width: 260px) 100vw, 260px\" /></a></p>\n<p>Source: https://com
