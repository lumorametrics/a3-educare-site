    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:08.963Z","entries":{"college:upes-dehradun":[{"id":1405,"date":"2026-11-14T07:06:57","date_gmt":"2026-11-14T07:06:57","guid":{"rendered":"https://staging.a3educarehub.in/?post_type=colleges&#038;p=1405"},"modified":"2026-11-14T07:06:57","modified_gmt":"2026-11-14T07:06:57","slug":"upes-dehradun","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/upes-dehradun/","title":{"rendered":"UPES, Dehradun"},"content":{"rendered":"","protected":false},"featured_media":1403,"template":"","class_list":["post-1405","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"UPES is a private university in Dehradun, Uttarakhand. Its School of Law offers the five-year integrated BA LL.B. (Hons.) and BBA LL.B. (Hons.), the three-year LL.B. and the LL.M.","college_overview":"<p>UPES was established through the UPES Act, 2003, of the State Legislature of Uttarakhand. It describes itself as a UGC-recognised private university, with campuses at Bidholi and Kandoli in Dehradun.</p><p>Its School of Law offers integrated and postgraduate law programmes. UPES states that all programmes offered by the School of Law are approved by the Bar Council of India, and that it has a memorandum of understanding with The University of Law (ULaw), United Kingdom.</p>","location":"Bidholi Campus, Dehradun, Uttarakhand","city":"Dehradun","state":"Uttarakhand","established":"2003","affiliation":"UPES Act, 2003, State of Uttarakhand; recognised by the University Grants Commission","recognition":"<ul><li><strong>University Grants Commission:</strong> UPES describes itself as a UGC-recognised private university</li><li><strong>Bar Council of India:</strong> UPES states that all programmes offered by its School of Law are approved by the Bar Council of India</li></ul>","courses_offered":"<h4>School of Law</h4><ul><li><strong>BA LL.B. (Hons.):</strong> five-year integrated programme</li><li><strong>BBA LL.B. (Hons.):</strong> five-year integrated programme</li><li><strong>LL.B.:</strong> three-year programme</li><li><strong>LL.M.:</strong> for candidates who have completed an LL.B.</li></ul><p>Programme lists change by session. Confirm the current list on the official School of Law page.</p>","admission_process":"<h4>BA LL.B. (Hons.) and BBA LL.B. (Hons.)</h4><ul><li><strong>Examination pathway:</strong> admission through ULSAT (UPES Legal Studies Aptitude Test)</li><li><strong>Non-examination pathway:</strong> CLAT rank or board merit; up to 20% of seats are filled through the Board Merit / CLAT All India Rank category</li></ul><h4>LL.B.</h4><ul><li>Selection through a personal interview</li></ul><h4>LL.M.</h4><ul><li>Selection through ULSAT-LLM or CLAT-PG</li></ul>","eligibility":"<ul><li><strong>BA LL.B. (Hons.) and BBA LL.B. (Hons.):</strong> minimum 50% marks in Class X and Class XII</li><li><strong>LL.B.:</strong> minimum 50% marks in Class X, Class XII and a graduation degree in any stream</li><li><strong>LL.M.:</strong> minimum 50% marks in Class X, Class XII, graduation and a three-year or five-year LL.B.</li></ul>","entrance_exams":"ULSAT or CLAT for BA LL.B. and BBA LL.B.; ULSAT-LLM or CLAT-PG for LL.M.","fees_information":"","campus_facilities":"","hostel_information":"<p>UPES states that residential blocks are earmarked for limited on-campus accommodation, allotted on a first come, first served basis. Boys and girls are housed separately, on a triple-sharing basis, and students who want a hostel place must pay the hostel fee in advance. The hostel fee is listed on the official fee page.</p>","placement_information":"","scholarships":"","college_image":null,"official_website":"https://www.upes.ac.in/","cta_heading":"Considering the UPES School of Law?","cta_description":"Compare law programmes, eligibility and admission routes with A3 EduCare Hub & Research Academy.","faq_1_question":"Which law programmes does the UPES School of Law offer?","faq_1_answer":"<p>BA LL.B. (Hons.) and BBA LL.B. (Hons.) as five-year integrated programmes, a three-year LL.B. and an LL.M. Check the official School of Law page for the current list.</p>","faq_2_question":"How do I get admission to BA LL.B. or BBA LL.B. at UPES?","faq_2_answer":"<p>Through ULSAT, or through a CLAT rank or board merit. Up to 20% of seats are filled through the Board Merit / CLAT All India Rank category.</p>","faq_3_question":"What marks are needed for the five-year integrated law programmes?","faq_3_answer":"A minimum of 50% marks in Class X and Class XII, according to the UPES programme page.","faq_4_question":"Are UPES law programmes approved by the Bar Council of India?","faq_4_answer":"<p>UPES states that all programmes offered by its School of Law are approved by the Bar Council of India.</p>","faq_5_question":"Where can I check the latest admission details?","faq_5_answer":"<p>On the official UPES School of Law and admissions pages. Fees, dates and seats change each session.</p>","featured_image":{"id":1403,"date":"2026-11-14T07:05:59","date_gmt":"2026-11-14T07:05:59","guid":{"rendered":"https://staging.a3educarehub.in/upes-campus-dehradun/"},"modified":"2026-11-14T07:06:49","modified_gmt":"2026-11-14T07:06:49","slug":"upes-campus-dehradun","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/upes-dehradun/upes-campus-dehradun/#main","title":{"rendered":"UPES campus, Dehradun"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1403","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/upes-dehradun-campus.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"200\" src=\"https://staging.a3educarehub.in/wp-content/uploads/20
