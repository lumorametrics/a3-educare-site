    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:32.401Z","entries":{"college:niper-guwahati":[{"id":1100,"date":"2026-11-04T06:54:05","date_gmt":"2026-11-04T06:54:05","guid":{"rendered":"https://staging.a3educarehub.in/colleges/niper-guwahati/"},"modified":"2026-11-04T06:54:05","modified_gmt":"2026-11-04T06:54:05","slug":"niper-guwahati","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/niper-guwahati/","title":{"rendered":"National Institute of Pharmaceutical Education and Research, Guwahati"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1100","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"NIPER Guwahati was established in September 2008 under the Department of Pharmaceuticals and works from Changsari, Kamrup. It teaches master's and Ph.D. programmes across nine departments, and its placement brochure reports more than 95% of students placed.","college_overview":"<p>NIPER Guwahati dates to September 2008 and comes under the Department of Pharmaceuticals in the Ministry of Chemicals and Fertilizers. It now works from Sila Katamur at Changsari in Kamrup district.</p><p>Its master's teaching covers M.S. (Pharm), M.Pharm and M.Tech, alongside Ph.D. work, across nine departments.</p><p>Hostels are available to registered master's students for up to two years, though hostel residents are not eligible for HRA. The institute's 2024-25 brochure says more than 95% of students are placed in industry and higher education.</p>","location":"Sila Katamur (Halagurisuk), P.O. Changsari, Dist. Kamrup, Assam 781101, India","city":"Guwahati","state":"Assam","established":"2008 (September)","affiliation":"Institute under the NIPER Act; Department of Pharmaceuticals","recognition":"<p>NIPER Guwahati comes under the <strong>Department of Pharmaceuticals, Ministry of Chemicals and Fertilizers</strong>, Government of India.</p>","
