    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:03.448Z","entries":{"college:tomo-riba-institute":[{"id":1149,"date":"2026-11-04T06:55:49","date_gmt":"2026-11-04T06:55:49","guid":{"rendered":"https://staging.a3educarehub.in/colleges/tomo-riba-institute/"},"modified":"2026-11-04T06:55:49","modified_gmt":"2026-11-04T06:55:49","slug":"tomo-riba-institute","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/tomo-riba-institute/","title":{"rendered":"Tomo Riba Institute of Health and Medical Sciences"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1149","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"Tomo Riba Institute of Health and Medical Sciences is a government institution in Naharlagun, Arunachal Pradesh, offering medical programmes.","college_overview":"<p>Tomo Riba Institute of Health and Medical Sciences (TRIHMS), at Naharlagun, is a government medical college of Arunachal Pradesh. Its MBBS course is affiliated to Rajiv Gandhi University, Doimukh, and the prospectus is issued by the state's Directorate of Medical Education, Training and Research.</p><p>The 2026-27 prospectus sets out 100 MBBS seats, split into 15 All India Quota seats and 85 seats for Arunachal Pradesh Scheduled Tribe (APST) candidates. The fee total in the prospectus is Rs 77,100, including deposits and hostel charges, and selected candidates must sign a bond that includes one year of compulsory service in the state.</p><p>The National Medical Commission's seat matrix for 2026-27 also lists 23 postgraduate seats across 11 M.D. and M.S. courses.</p>","location":"Naharlagun, Arunachal Pradesh, India","city":"Naharlagun","state":"Arunachal Pradesh","established":"2017","affiliation":"Rajiv Gandhi University, Doimukh","recognition":"<ul><li><strong>University affiliation:</strong> Rajiv Gandhi University, Doimukh, as stated in the 2026-27 prospectus</li><li><strong>National Medical Commission:</strong> the UG seat matrix for 2026-27, as on 18 September 2026, lists 100 MBBS seats, and the PG seat matrix as on 29 September 2026 lists the institute's M.D. and M.S. courses</li></ul>","courses_offered":"<h4>MBBS, 2026-27</h4><ul><li>100 seats, as shown in the prospectus and the National Medical Commission seat matrix</li></ul><h4>Postgraduate, National Medical Commission seat matrix for 2026-27</h4><ul><li><strong>M.D.:</strong> Anaesthesiology (2), Anatomy (2), Community Medicine (2), General Medicine (2), Microbiology (2), Paediatrics (2), Pharmacology (2), Physiology (2), Radio-Diagnosis (3)</li><li><strong>M.S.:</strong> General Surgery (2), Obstetrics and Gynaecology (2)</li></ul><p>Bracketed figures are seats for 2026-27. The Commission says this matrix may be revised.</p>","admission_process":"<p>For MBBS in 2026-27, selection for the state quota is based on NEET (UG) 2026 marks, followed by online counselling.</p><h4>Seats</h4><ul><li><strong>All India Quota:</strong> 15 seats (15%)</li><li><strong>APST:</strong> 85 seats (85%), including 5% for persons with benchmark disability</li></ul><p>If All India Quota seats are surrendered to the state, they are filled from the rank list under the state's reservation rules.</p><h4>How to apply</h4><ol><li>Download the application form from dmetrap.in.</li><li>Pay the application fee of Rs 500 for APST or Rs 750 for All India Quota candidates.</li><li>Send the form with photocopies of the NEET documents, Class X and XII mark sheets, and domicile and community certificates to the Director of Medical Education, Training and Research, A-Sector, Naharlagun 791110.</li><li>Check rank lists and notices at apdhte.nic.in and dmetrap.in.</li></ol><h4>Bond</h4><p>Selected candidates must execute a bond. It provides for one year of contractual or emergency compulsory service in the state after the course, and the penalty for breaking its conditions on the MBBS course is Rs 10,00,000.</p><p>The prospectus text does not give the last date for applications. Confirm it with the Directorate.</p>","eligibility":"<p>For MBBS in 2026-27, the prospectus requires:</p><ul><li>Indian citizenship</li><li>A minimum age of 17 years on or before 31 December 2026</li><li>A qualifying NEET (UG) 2026 score: at least the 50th percentile for General, the 40th for OBC, SC and ST candidates, and for locomotor disability of the lower limbs, the 45th for UR and the 40th for ST, SC and OBC</li><li>A pass in Physics, Chemistry, Biology or Biotechnology, and English individually in the qualifying examination, with the required marks for the category in Physics, Chemistry and Biology or Biotechnology taken together</li></ul>","entrance_exams":"NEET (UG) 2026 for MBBS","fees_information":"<h4>MBBS, 2026-27 prospectus (All India and state quota seats)</h4><ul><li><strong>Admission (A), Rs 7,100:</strong> admission Rs 500, ID card Rs 100, health check-up Rs 500, immunisation Rs 1,000, student welfare fund Rs 5,000</li><li><strong>Deposits (B), Rs 27,000:</strong> caution money Rs 10,000, laboratory Rs 5,000, library Rs 2,000, hostel and mess security Rs 10,000</li><li><strong>Other charges (C), Rs 43,000:</strong> tuition Rs 20,000, library Rs 1,000, common room Rs 1,000, college magazine Rs 1,000, sports and cultural Rs 5,000, laboratory Rs 2,000, practical manual Rs 3,000, hostel Rs 5,000 a year, utility Rs 5,000 a year</li></ul><p><strong>Total shown:</strong> Rs 77,100. Mess charges are as applicable, and university registration and examination fees are as fixed by the university.</p><p>The application costs Rs 500 for APST and Rs 750 for All India Quota candidates.</p>","campus_facilities":"<h4>Teaching hospital</h4><p>TRIHMS describes itself as the first medical college of the Government of Arunachal Pradesh, with a 500-bedded hospital and modern equipment for investigating and treating patients. The campus is on Lumar Dai Road, B' Sector, Naharlagun.</p><h4>Student facilities in the 2026-27 fee schedule</h4><p>The MBBS prospectus for 2026-27 lists library, laboratory, common room, sports and cultural, college magazine and hostel charges, which shows these facilities are provided. The prospectus does not describe them in detail.</p><p>The institute's facilities page was under maintenance when checked on 13 November 2026.</p>","hostel_information":"<p>The 2026-27 prospectus lists these hostel charges for MBBS students:</p><ul><li>Hostel fee: Rs 5,000 a year</li><li>Utility charges: Rs 5,000 a year</li><li>Hostel and mess security: Rs 10,000</li><li>Mess charges: as applicable</li></ul><p>It does not give the number of hostels, the room types or the capacity. Ask the institute about those.</p>","placement_information":"","scholarships":"","college_image":null,"official_website":"https://trihms.co.in","cta_heading":"Considering TRIHMS Naharlagun?","cta_description":"Get help with NEET (UG) counselling and your MBBS choices in Arunachal Pradesh.","faq_1_question":"Which university is TRIHMS affiliated to?","faq_1_answer":"<p>Rajiv Gandhi University, Doimukh.</p>","faq_2_question":"How many MBBS seats does TRIHMS have?","faq_2_answer":"<p>100 seats for 2026-27: 15 All India Quota and 85 for APST candidates, including 5% for persons with benchmark disability.</p>","faq_3_question":"What is the MBBS fee at TRIHMS?","faq_3_answer":"<p>The 2026-27 prospectus shows a total of Rs 77,100, which includes Rs 20,000 tuition and Rs 27,000 in deposits. Mess, registration and examination fees are additional.</p>","faq_4_question":"Is there a bond for MBBS students?","faq_4_answer":"<p>Yes. It provides for one year of compulsory service in the state after the course, and the MBBS penalty for breaking its conditions is Rs 10,00,000.</p>","faq_5_question":"Does TRIHMS charge for hostels?","faq_5_answer":"<p>Yes. The 2026-27 prospectus lists a hostel fee of Rs 5,000 a year, utility charges of Rs 5,000 a year and a Rs 10,000 hostel and mess
