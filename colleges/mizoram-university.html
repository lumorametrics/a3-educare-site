    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:11.475Z","entries":{"college:mizoram-university":[{"id":1141,"date":"2026-11-04T06:55:40","date_gmt":"2026-11-04T06:55:40","guid":{"rendered":"https://staging.a3educarehub.in/colleges/mizoram-university/"},"modified":"2026-11-04T06:55:40","modified_gmt":"2026-11-04T06:55:40","slug":"mizoram-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/mizoram-university/","title":{"rendered":"Mizoram University"},"content":{"rendered":"","protected":false},"featured_media":1211,"template":"","class_list":["post-1141","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Mizoram University is a centrally funded institution in Aizawl, Mizoram, offering undergraduate, postgraduate and research programmes.","college_overview":"<p>Mizoram University is a central university created by an Act of Parliament in 2000. It became functional on 2 July 2001 and operates from a single campus at Tanhril, Aizawl.</p><p>It teaches at undergraduate, postgraduate and doctoral levels. A UNI report says NAAC accredited it with an A+ grade and a CGPA of 3.30.</p>","location":"Aizawl, Mizoram, India","city":"Aizawl","state":"Mizoram","established":"2001","affiliation":"Central university; awards its own degrees","recognition":"<p>A UNI news report says NAAC accredited the university with an A+ grade and a CGPA of 3.30.</p>","courses_offered":"<ul><li><strong>Undergraduate:</strong> programmes in university departments, including B.Tech</li><li><strong>Postgraduate:</strong> master's programmes, including M.Sc. and M.Tech</li><li><strong>Doctoral:</strong> Ph.D.</li></ul>","admission_process":"<p>Listings say undergraduate places in university departments go through CUET (UG), while postgraduate places go through CUET (PG) or the university's own entrance test, MZUEE.</p>","eligibility":"<p>Requirements differ by programme. Check the university's admission notice for the year.</p>","entrance_exams":"CUET (UG), CUET (PG) and MZUEE","fees_information":"","campus_facilities":"<h4>Central facilities (Tanhril campus)</h4><ul><li>Central Library with a Web OPAC.</li><li>Central Instrument Laboratory, an engineering workshop and ICT facilities.</li><li>Research and innovation units: DBT Advanced State Biotech Hub, DRDO-Industry-Academia Centre of Excellence, MZU BioNEST bio-incubator, MZU Incubation Centre, Technology Enabling Centre and the Natural History Museum &amp; Research Centre.</li><li>Halls of residence for students, a guest house, an auditorium, a multipurpose hall and an academic and seminar complex.</li><li>A Kendriya Vidyalaya school on campus.</li></ul><h4>Health Centre</h4><p>Established in 2001 and now on the Tanhril campus, it provides curative and preventive care for students, staff and dependants. A resident medical officer and a nurse are on duty from 5:00 PM to 9:00 AM, and 24 hours on weekends and national holidays.</p><h4>Sports</h4><p>The Department of Sports (established 2001) runs the university's annual inter-college sports, coaching programmes and university teams for AIU and Khelo India University Games, along with Fit India activities.</p>","hostel_information":"<p>Listings name halls of residence on campus, including Ainawn, Buannel and Senhri hostels.</p>","placement_information":"<h4>Career Counselling and Placement Cell</h4><ul><li>Set up in July 2012 to give students career guidance and to arrange placement opportunities.</li><li>It has three linked units: the Career Counselling Cell, the Placement Cell and the Equal Opportunity Scheme, with school coordinators.</li><li><strong>Contact:</strong> mzucareer@mzu.edu.in (coordinator: Dr. Nirban Laskar, Department of Civil Engineering).</li></ul><p>The university does not publish placement statistics on the cell's page.</p>","scholarships":"<h4>Research fellowships at Mizoram University (rates published by the university)</h4><ul><li><strong>National fellowships (NFST for ST, NFSC for SC, MANF for minority students, NFOBC, NF-DIS for persons with disabilities, Savitribai Jyotirao Phule fellowship for the single girl child) and UGC NET-JRF:</strong> Rs 37,000 a month as JRF and Rs 42,000 as SRF; annual contingency of Rs 20,500 (humanities and social sciences) or Rs 25,000 (science and engineering); HRA at 9% of the fellowship.</li><li><strong>CSIR-UGC, INSPIRE and ICMR JRF:</strong> Rs 37,000 (JRF) and Rs 42,000 (SRF) a month; contingency Rs 20,000 a year; HRA 9%.</li><li><strong>DST-JRF (Science):</strong> Rs 37,000 / Rs 42,000; contingency Rs 30,000; HRA 8%.</li><li><strong>ICSSR Doctoral Fellowship:</strong> Rs 20,000 a month; contingency Rs 20,000.</li><li><strong>MZU-UGC (Non-NET) Fellowship:</strong> Rs 8,000 a month for Ph.D (Rs 5,000 for M.Phil); contingency Rs 8,000 / Rs 10,000.</li><li><strong>Post-doctoral:</strong> SERB N-PDF Rs 80,000 a month; ICSSR Post-Doctoral Rs 31,000; CCRAS Post-Doctoral Rs 60,000; WISE fellowship for Ph.D and post-doctoral scholars.</li></ul><h4>Support for students with disabilities</h4><p>MZU stipend of Rs 2,000 a month for blind students (UG, PG and Ph.D); reader's or writer's allowance of Rs 200 per paper for internal and Rs 500 per paper for external exams; escort allowance of Rs 2,000 a month for orthopedically handicapped and blind students.</p>","college_image":null,"official_website":"https://mzu.edu.in","cta_heading":"Considering Mizoram University?","cta_description":"Get help with CUET, MZUEE and your programme choices.","faq_1_question":"Is Mizoram University a central university?","faq_1_answer":"<p>Yes. It was created by an Act of Parliament in 2000 and began functioning on 2 July 2001.</p>","faq_2_question":"Where is the campus?","faq_2_answer":"<p>At Tanhril, Aizawl.</p>","faq_3_question":"Which entrance tests are used?","faq_3_answer":"<p>Listings name CUET (UG), CUET (PG) and MZUEE.</p>","faq_4_question":"What is its NAAC grade?","faq_4_answer":"<p>A UNI report gives A+ with a CGPA of 3.30, up from A with 3.16.</p>","faq_5_question":"Which levels of study are offered?","faq_5_answer":"<p>Undergraduate, postgraduate and Ph.D.</p>","featured_image":{"id":1211,"date":"2026-11-04T07:27:52","date_gmt":"2026-11-04T07:27:52","guid":{"rendered":"https://staging.a3educarehub.in/colleges/mizoram-university/mizoram-university-campus/"},"modified":"2026-11-04T07:27:52","modified_gmt":"2026-11-04T07:27:52","slug":"mizoram-university-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/mizoram-university/mizoram-university-campus/#main","title":{"rendered":"Mizoram University campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1211","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/mizoram-university.jpg'><img decoding=\"async\" width=\"300\" height=\"143\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/mizoram-university-300x143.jpg\" class=\"attachment-medium size-medium\" alt=\"Mizoram University campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/mizoram-university-300x143.jpg 300w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/mizoram-university-768x365.jpg 768w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/mizoram-university.jpg 983w\" sizes=\"(max-width: 300px) 100vw, 300px\" /></a></p>\n<p>Source: https://commons.wikimedia.org/wiki/File:Mizoram_university_Building.JPG | License: CC BY-SA 3.0 | Author: Tluanga Colney</p>\n"},"caption":{"rendered":"<p>Mizoram University. Photo: Tluanga Colney, CC BY-SA 3.0, via Wikimedia Commons</p>\n"},"alt_text":"Mizoram University campus","media_type":"image","mime_type":"image/jpeg","media_details":{"sizes"
