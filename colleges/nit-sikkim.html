    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:07.499Z","entries":{"college:nit-sikkim":[{"id":1128,"date":"2026-11-04T06:55:02","date_gmt":"2026-11-04T06:55:02","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-sikkim/"},"modified":"2026-11-04T06:55:02","modified_gmt":"2026-11-04T06:55:02","slug":"nit-sikkim","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nit-sikkim/","title":{"rendered":"National Institute of Technology Sikkim"},"content":{"rendered":"","protected":false},"featured_media":1373,"template":"","class_list":["post-1128","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"NIT Sikkim, established in 2010 as an Institute of National Importance, functions from a temporary campus at Ravangla in South Sikkim. Students must live in hostels unless they are local to the Ravangla block, and 2026-30 fees are Rs 71,814 per semester.","college_overview":"<p>NIT Sikkim was established in 2010 and works from a temporary campus at Ravangla in South Sikkim. Its four-year B.Tech covers Computer Science, Electrical and Electronics, Electronics and Communication, Mechanical, and Civil Engineering.</p><p>The institute is residential. Students must take a hostel place, though permanent residents of the Ravangla block may apply for day scholar status. Rooms are shared, and students bring their own bedding.</p><p>Men's hostels are at Ravangla bazaar, about 2 km from the campus, and an institute bus charges Rs 1,920 per semester.</p>","location":"Ravangla, South Sikkim 737139, Sikkim, India","city":"Ravangla","state":"Sikkim","established":"2010","affiliation":"National Institute of Technology; Institute of National Importance","recognition":"<p>NIT Sikkim is an Institute of National Importance.</p>","courses_offered":"<ul><li>B.Tech in Computer Science and Engineering</li><li>B.Tech in Electrical and Electronics Engineering</li><li>B.Tech in Electronics and Communication Engineering</li><li>B.Tech in Mechanical Engineering</li><li>B.Tech in Civil Engineering</li></ul>","admission_process":"<p>B.Tech seats come through JoSAA and CSAB. For 2026, students uploaded documents and paid fees between 13 and 19 August, then paid any remaining institute, hostel, mess and bus fees at physical reporting.</p>","eligibility":"<p>Candidates must meet JEE (Main) and JoSAA or CSAB conditions for the admission year.</p>","entrance_exams":"JEE (Main) for B.Tech","fees_information":"<p><strong>B.Tech, 2026-30 batch, institute fee per semester:</strong></p><ul><li>Full fee payers: Rs 71,814, including Rs 62,500 tuition</li><li>Two-thirds remission (family income Rs 1-5 lakh): Rs 30,148</li><li>Full waiver (SC, ST, PwD, family income below Rs 1 lakh): Rs 9,314</li></ul>","campus_facilities":"<p>The institute functions from a temporary campus at Ravangla.</p>","hostel_information":"<p>All students are required to take a hostel place, apart from approved day scholars from the Ravangla block. The institute provides a cot, almirah, table and chair, and rooms are shared. Men's hostels are about 2 km from the campus.</p>","placement_information":"<h4>Placement record (NIT Sikkim Training and Placement Cell)</h4><ul><li><strong>2022-2026 batch:</strong> 91.20% placed, up from 85.00% for the 2021-2025 batch.</li><li>The page also gives a current placement figure of 75.37% without naming the batch.</li><li>Placements for the 2027 batch and internships for the 2026 batch are in progress.</li></ul><h4>Recent selections reported by the cell</h4><p>Two students at Nvidia (44 LPA), five at Optym (17.86 LPA), one at Cradlepoint (16.6 LPA), two at Infineon (15.9 LPA), two at Platform9 (15 LPA), two at SLB (14 LPA), four at Accenture (12 LPA), one at TA Digital (12 LPA), one at IBM (11 LPA) and ten at Deloitte (7.6 LPA), plus internships at VISA, Cummins India and Infineon.</p><p>Recruiters register through the cell's placement portal (placement.nitsikkim.ac.in).</p>","scholarships":"<p>Tuition is fully exempted for SC, ST and PH students and for family income below Rs 1 lakh, with a two-thirds remission for income of Rs 1-5 lakh.</p>","college_image":null,"official_website":"https://nitsikkim.ac.in","cta_heading":"Thinking about NIT Sikkim?","cta_description":"Get help with JEE (Main) and your JoSAA and CSAB choices.","faq_1_question":"Where does NIT Sikkim work from?","faq_1_answer":"<p>A temporary campus at Ravangla, South Sikkim.</p>","faq_2_question":"Is hostel accommodation compulsory?","faq_2_answer":"<p>Yes, apart from approved day scholars from the Ravangla block.</p>","faq_3_question":"How much is the semester fee?","faq_3_answer":"Rs 71,814 for full fee payers in the 2026-30 batch.","faq_4_question":"Which branches are offered?","faq_4_answer":"<p>Computer Science, Electrical and Electronics, Electronics and Communication, Mechanical, and Civil.</p>","faq_5_question":"How much is the institute bus?","faq_5_answer":"<p>Rs 1,920 per semester, charged separately.</p>","featured_image":{"id":1373,"date":"2026-11-05T11:00:47","date_gmt":"2026-11-05T11:00:47","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-sikkim/national-institute-of-technology-sikkim-campus/"},"modified":"2026-11-05T11:00:47","modified_gmt":"2026-11-05T11:00:47","slug":"national-institute-of-technology-sikkim-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nit-sikkim/national-institute-of-technology-sikkim-campus/#main","title":{"rendered":"National Institute of Technology Sikkim campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1373","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-sikkim.png'><img fetchpriority=\"hig
