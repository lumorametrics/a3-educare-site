    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:12.238Z","entries":{"college:university-of-delhi":[{"id":1103,"date":"2026-11-04T06:54:09","date_gmt":"2026-11-04T06:54:09","guid":{"rendered":"https://staging.a3educarehub.in/colleges/university-of-delhi/"},"modified":"2026-11-04T06:54:09","modified_gmt":"2026-11-04T06:54:09","slug":"university-of-delhi","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/university-of-delhi/","title":{"rendered":"University of Delhi"},"content":{"rendered":"","protected":false},"featured_media":1222,"template":"","class_list":["post-1103","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"The University of Delhi, founded in 1922, is a collegiate central university whose faculties range from arts and science to law, management and medical sciences. It holds a NAAC A++ grade, and undergraduate admission is through CUET (UG).","college_overview":"<p>The University of Delhi was founded in 1922 by an Act of the Central Legislative Assembly and is a collegiate central university. It teaches through its own departments and faculties as well as a large network of colleges across the city.</p><p>Its faculties cover Arts, Science, Social Sciences, Commerce &amp; Business Studies, Law, Management Studies, Mathematical Sciences, Medical Sciences, Technology, Education, Music, Applied Social Sciences and Humanities, and Interdisciplinary &amp; Applied Sciences, along with open learning through the School of Open Learning.</p><p>Because teaching is spread across colleges, the same programme can differ in fees, facilities and available places from one college to another. Applicants should compare colleges carefully when filling in their preferences.</p>","location":"Delhi 110007, India","city":"Delhi","state":"Delhi","established":"1922","affiliation":"Central university established by Act of the Central Legislative Assembly; awards its own degrees","recognition":"<p><strong>NAAC:</strong> A++ grade with a CGPA of 3.55 in Cycle 2 accreditation, as stated by the university.</p>","courses_offered":"<p>The university offers undergraduate, postgraduate and doctoral study through these faculties:</p><ul><li>Arts, Social Sciences, and Applied Social Sciences and Humanities</li><li>Science, Mathematical Sciences, and Interdisciplinary &amp; Applied Sciences</li><li>Commerce &amp; Business Studies, and Management Studies</li><li>Law</li><li>Medical Sciences</li><li>Technology</li><li>Education and Music</li><li>Open Learning</li></ul><p>In 2025-26, undergraduate admission covered 79 courses in 69 colleges, with 71,624 seats, as reported by PTI. The current list is in the UG Bulletin of Information.</p>","admission_process":"<p><strong>Undergraduate, 2026-27:</strong> admission to all programmes runs through the Common Seat Allocation System, CSAS(UG)-2026, based on CUET (UG) 2026.</p><ol><li>Apply to the University of Delhi on the CSAS(UG) portal.</li><li>Fill in preferences for programmes and colleges.</li><li>Take part in allocation-cum-admission rounds.</li></ol><p><strong>Postgraduate, 2026-27:</strong> the university publishes separate notices and a Bulletin of Information.</p>","eligibility":"<p>Undergraduate eligibility depends on the programme and is set out in the UG Bulletin of Information 2026. Applicants need to have taken CUET (UG) 2026 in the subjects their programme requires.</p>","entrance_exams":"CUET (UG) for undergraduate programmes","fees_information":"<p><strong>CSAS(UG)-2026 application fee (one-time, non-refundable):</strong></p><ul><li>UR/OBC-NCL/EWS: Rs 250</li><li>SC/ST/PwBD: Rs 100</li><li>BFA, B.Sc (PE, HE &amp; S) and B.A. (H) Music: an extra Rs 400</li><li>ECA and Sports quotas: an extra Rs 100 per quota</li></ul><p>Course fees are set by each college, so check the website of the college you are considering.</p>","campus_facilities":"<p>The university's own student services include a Central Placement Cell under the Dean Students' Welfare, and university-run hostels. Facilities otherwise vary by college and department.</p>","hostel_information":"<p>University-run residences include the University Hostel for Women, the Undergraduate Hostel for Girls, the Post-Graduate Men's Hostel, Mansarowar Hostel, Aravali Hostel and WUS University Hostel. Check with each hostel for current eligibility and availability.</p>","placement_information":"<p>The university's Central Placement Cell, under the Dean Students' Welfare, connects students with multinational companies, government organisations, NGOs and the private sector. Contact: placement@du.ac.in.</p>","scholarships":"<h4>Financial Support Scheme (FSS) 2026-27</h4><p>The Dean Students' Welfare office runs this fee waiver scheme for full-time students on regular undergraduate and postgraduate degree programmes who pay their fees directly to the university through a department, institute or centre.</p><ul><li><strong>Family income up to Rs 4,00,000 a year:</strong> a waiver of up to 100% of the actual fee, with a maximum of Rs 15,000 in the 2026-27 FAQ. The 2026-27 bonafide certificate format shows a maximum of Rs 12,000, so confirm this limit with the office.</li><li><strong>Family income Rs 4,00,001 to Rs 8,00,000 a year:</strong> a waiver of up to 50% of the actual fee, with a maximum of Rs 10,000.</li><li><strong>Covered:</strong> all fee components except examination and hostel fees.</li></ul><p><strong>Not eligible:</strong> students of colleges, the School of Open Learning and NCWEB; certificate and diploma students; students with an Essential Repeat paper in a previous examination; and students who received a fee waiver at admission, namely B.Tech (Computer Science and Engineering, Electronics and Computer Engineering, Electrical Engineering), five-year integrated law, Orphan Quota and PwBD admissions.</p><p><strong>How it works:</strong> apply online on the Dean Students' Welfare website, then submit attested documents, including the family income certificate, income tax returns, a bonafide certificate from the Head or Director, the last mark sheet, the fee receipt and bank details. The 2026-27 application round was announced on 23 September 2026, and original documents were scheduled for submission from 2 to 5 November 2026. Contact: fss@dsw.du.ac.in.</p>","college_image":null,"official_website":"https://www.du.ac.in","cta_heading":"Applying to the University of Delhi?","cta_description":"Get help choosing CUET subjects, programmes and college preferences for CSAS.","faq_1_question":"How do I get undergraduate admission to Delhi University?","faq_1_answer":"<p>Take CUET (UG), apply through CSAS(UG) on the university's admission portal, fill in your programme and college preferences, and take part in the allocation rounds.</p>","faq_2_question":"What is the CSAS application fee?","faq_2_answer":"<p>For 2026-27 it is Rs 250 for UR/OBC-NCL/EWS and Rs 100 for SC/ST/PwBD, with extras for some programmes and quotas.</p>","faq_3_question":"What is Delhi University's NAAC grade?","faq_3_answer":"The university states it holds an A++ grade with a CGPA of 3.55 in Cycle 2 accreditation.","faq_4_question":"Are fees the same in every college?","faq_4_answer":"<p>No. Course fees are set college by college, so check each college's website before filling in your preferences.</p>","faq_5_question":"Does the university have hostels?","faq_5_answer":"<p>Yes. The university runs several hostels. Check with each hostel for current eligibility and availability.</p>","featured_image":{"id":1222,"date":"2026-11-04T10:01:33","date_gmt":"2026-11-04T10:01:33","guid":{"rendered":"https://staging.a3educarehub.in/colleges/university-of-delhi/arts-faculty-building-university-of-delhi/"},"modified":"2026-11-04T10:01:33","modified_gmt":"2026-11-04T10:01:33","slug":"arts-faculty-building-university-of-delhi","status":"inherit","type":"attachment","link":"https://staging
