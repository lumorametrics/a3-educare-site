    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:30.135Z","entries":{"college:goa-medical-college":[{"id":1112,"date":"2026-11-04T06:54:42","date_gmt":"2026-11-04T06:54:42","guid":{"rendered":"https://staging.a3educarehub.in/colleges/goa-medical-college/"},"modified":"2026-11-04T06:54:42","modified_gmt":"2026-11-04T06:54:42","slug":"goa-medical-college","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/goa-medical-college/","title":{"rendered":"Goa Medical College"},"content":{"rendered":"","protected":false},"featured_media":1194,"template":"","class_list":["post-1112","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Goa Medical College at Bambolim, founded in 1963, is described by Goa's Directorate of Higher Education as the only medical college in the state offering MBBS. It is government-funded and affiliated to Goa University, with admission based on NEET merit.","college_overview":"<p>Goa's Directorate of Higher Education lists Goa Medical College, founded in 1963, as the state's only MBBS college. It is government-funded, affiliated to Goa University and based at Bambolim.</p><p>The college also runs MD, MS and diploma courses, along with master's programmes in allied health sciences under its own prospectuses.</p><p>MBBS places go by NEET merit. On-campus hostel rooms are offered subject to availability and the hostel rules.</p>","location":"Bambolim, Goa 403202, India","city":"Bambolim","state":"Goa","established":"1963","affiliation":"Goa University","recognition":"<p>Goa Medical College is a government-funded medical college affiliated to Goa University.</p>","courses_offered":"<ul><li><strong>Undergraduate:</strong> MBBS</li><li><strong>Postgraduate:</strong> MD, MS and diploma courses</li><li><strong>Allied health:</strong> master's programmes</li></ul>","admission_process":"<p>MBBS admission is based on NEET merit. Postgraduat
