    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:25.176Z","entries":{"college:university-of-kerala":[{"id":1074,"date":"2026-11-04T06:53:07","date_gmt":"2026-11-04T06:53:07","guid":{"rendered":"https://staging.a3educarehub.in/colleges/university-of-kerala/"},"modified":"2026-11-04T06:53:07","modified_gmt":"2026-11-04T06:53:07","slug":"university-of-kerala","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/university-of-kerala/","title":{"rendered":"University of Kerala"},"content":{"rendered":"","protected":false},"featured_media":1167,"template":"","class_list":["post-1074","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"The University of Kerala began in 1937 as the University of Travancore and took its present name under a 1957 Act. It has 43 teaching departments, 188 affiliated colleges and a NAAC A++ grade, with most departments on its 359-acre Kariavattom campus.","college_overview":"<p>A 1937 proclamation by Maharaja Sri Chithira Thirunal Balarama Varma created the University of Travancore, with Sir C. P. Ramaswamy Aiyar as its first Vice-Chancellor. The Kerala University Act of 1957 renamed it the University of Kerala.</p><p>Today it runs 43 departments, reorganised into eleven schools, along with a School of Distance Education. Its 188 affiliated colleges include arts and science, law, management, education and hotel management institutions.</p><p>Administration is at the Senate House Campus in Palayam, while most teaching departments are at the 359-acre Kariavattom campus near Kazhakuttom. The Credit and Semester System covers four-year undergraduate and postgraduate study in the departments.</p>","location":"Senate House Campus, Palayam, Thiruvananthapuram 695034, Kerala, India","city":"Thiruvananthapuram","state":"Kerala","established":"1937 (as University of Travancore)","affiliation":"State university under the Kerala University Act, 1957; teaching and affiliating","recognition":"<ul><li><strong>NAAC:</strong> A++ grade, re-accredited in 2022</li><li><strong>NIRF:</strong> a 2024-25 university prospectus cites 24th place among universities</li></ul>","courses_offered":"<ul><li><strong>Teaching departments:</strong> 43 departments offering postgraduate, M.Phil and Ph.D. programmes</li><li><strong>Four-Year Undergraduate Programme (Credit and Semester System):</strong> sixteen major and fifty-one minor disciplines (2024-25 prospectus)</li><li><strong>Distance education:</strong> about 25 graduate and postgraduate courses</li><li><strong>Affiliated colleges:</strong> 188</li></ul>","admission_process":"<p>The university publishes separate prospectuses for its Credit and Semester System undergraduate and postgraduate programmes, and applications run through its online admissions link. Affiliated colleges and distance education have their own notifications.</p>","eligibility":"<p>Conditions are set for each programme in the current prospectus.</p>","entrance_exams":"As set out in each programme's prospectus","fees_information":"","campus_facilities":"<p>The university has two main campuses: the Senate House Campus at Palayam and the Kariavattom campus of 359 acres near Kazhakuttom, which houses most departments. It also has a Human Resources Development Centre and a Library and Publications Department.</p>","hostel_information":"<p>Women's hostel admission depends partly on distance from home; university minutes record that applicants living within 40 km have been turned down. Check the current hostel notice.</p>","placement_information":"<h4>University Placement Cell</h4><ul><li>Helps students and research scholars find placements in research institutions, academic institutions, industry and other organisations.</li><li>Its role includes making students aware of government, public and private sector jobs, holding orientation programmes, linking employers with job seekers, hosting campus recruitment and coordinating departments' placement activities.</li><li><strong>Orientation topics run by the cell:</strong> teaching careers, NET, civil services, Indian Forest Service, defence officer openings, bank exams, higher studies, CV preparation and interviews.</li></ul><h4>Recruiters</h4><p>Organisations that have recruited through the cell include Infosys, Tata Elxsi, SunTec, Polus Software, Ruby Software, Zoondia and Alamy Images (Technopark, Thiruvananthapuram), Metrohm India, Bridgei2i and Mathrubhumi.</p><p>The cell does not publish placement statistics on its page.</p>","scholarships":"<h4>Scholarships (University of Kerala)</h4><ul><li><strong>University Merit Scholarship (UG and PG):</strong> awarded under rules published on the university website. Applications are invited through the principals of affiliated colleges and heads of departments; a provisional list is circulated for corrections before the final order is issued.</li><li><strong>M.Phil Scholarship:</strong> the same procedure, for university departments and the University College.</li><li><strong>Central Sector Scholarship:</strong> processed only through the National Scholarship Portal.</li></ul><h4>Research fellowships</h4><p>Ph.D scholars with CSIR-UGC JRF, KSCSTE, INSPIRE (DST) or ICSSR fellowships submit their registration order and award letter through the head of department; the university then forwards the papers so the agency can release the fellowship, HRA and contingency grant.</p>","college_image":null,"official_website":"https://www.keralauniversity.ac.in","cta_heading":"Planning to study at the University of Kerala?","cta_description":"Get help choosing a department and following the admission process.","faq_1_question":"When was the University of Kerala founded?","faq_1_answer":"<p>In 1937 as the University of Travancore. It was renamed under the Kerala University Act of 1957.</p>","faq_2_question":"What is its NAAC grade?","faq_2_answer":"<p>A++, re-accredited in 2022.</p>","faq_3_question":"How many affiliated colleges does it have?","faq_3_answer":"188, according to its IQAC page.","faq_4_question":"Where are the departments?","faq_4_answer":"<p>Most are on the 359-acre Kariavattom campus near Kazhakuttom.</p>","faq_5_question":"Does the university offer distance education?","faq_5_answer":"<p>Yes. Its School of Distance Education runs about 25 graduate and postgraduate courses.</p>","featured_image":{"id":1167,"date":"2026-11-04T07:23:30","date_gmt":"2026-11-04T07:23:30","guid":{"rendered":"https://staging.a3educarehub.in/colleges/university-of-kerala/university-of-kerala-campus/"},"modified":"2026-11-04T07:23:30","modified_gmt":"2026-11-04T07:23:30","slug":"university-of-kerala-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/university-of-kerala/university-of-kerala-campus/#main","title":{"rendered":"University of Kerala campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1167","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/university-of-kerala.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"200\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/university-of-kerala-300x200.jpg\" class=\"attachment-medium size-medium\" alt=\"University of Kerala campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/university-of-kerala-300x200.jpg 300w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/university-of-kerala-768x512.jpg 768w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/university-of-kerala.jpg 1024w\" sizes=\"(max-width: 300px) 100vw, 300px\" /></a></p>\n<p>Source: https://commons.wikimedia.org/wiki/File:University_of_Kerala_Senate_House_Campus,_Palayam,_Thiruvanan
