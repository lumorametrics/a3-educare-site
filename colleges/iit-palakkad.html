    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:58.028Z","entries":{"college:iit-palakkad":[{"id":1072,"date":"2026-11-04T06:53:03","date_gmt":"2026-11-04T06:53:03","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iit-palakkad/"},"modified":"2026-11-04T06:53:03","modified_gmt":"2026-11-04T06:53:03","slug":"iit-palakkad","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/iit-palakkad/","title":{"rendered":"Indian Institute of Technology Palakkad"},"content":{"rendered":"","protected":false},"featured_media":1165,"template":"","class_list":["post-1072","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIT Palakkad began in 2015 and works from the Nila Campus at Kanjikkode. It teaches B.Tech in Civil, Computer Science, Electrical and Mechanical Engineering, and its 2024-25 placement report records 153 offers with a highest package of Rs 52 lakh.","college_overview":"<p>IIT Palakkad has run B.Tech programmes since it began in 2015, and its address is the Nila Campus at Kanjikkode in Palakkad district. A 2021-22 admission notice describes Civil, Computer Science, Electrical and Mechanical Engineering branches with a yearly intake of around 170.</p><p>Regulations approved by its Senate in January 2026 also set out an optional B.Tech plus M.Tech dual degree route.</p><p>The Career Development Centre publishes annual and department-wise placement reports. Its 2024-25 report lists 153 offers and a highest package of Rs 52 lakh.</p>","location":"Nila Campus, Near Gramalakshmi Mudralayam, Kanjikkode, Palakkad 678623, Kerala, India","city":"Palakkad","state":"Kerala","established":"2015","affiliation":"Indian Institute of Technology; awards its own degrees","recognition":"<p>IIT Palakkad is one of the Indian Institutes of Technology.</p><p>The institute's history page describes the IITs as Institutes of National Importance, established through a Central Statute, the Institutes of Technology Act, 1961.</p>","courses_offered":"<ul><li><strong>B.Tech:</strong> Civil, Computer Science and Engineering, Electrical, and Mechanical Engineering</li><li><strong>Dual degree option:</strong> B.Tech plus M.Tech, under the 2026 regulations</li><li><strong>Postgraduate:</strong> M.Tech and other programmes in the annual PG admission brochure</li></ul>","admission_process":"<p>B.Tech seats are filled through JEE (Advanced) and JoSAA, with a JoSAA processing fee applying on top of the institute fee. Postgraduate admissions run through the institute's PG admission portal and annual brochure.</p>","eligibility":"<p>B.Tech candidates must meet JEE (Advanced) and JoSAA conditions for the admission year. PG conditions are in the annual information brochure.</p>","entrance_exams":"JEE (Advanced) for B.Tech","fees_information":"<p><strong>B.Tech, August-November 2025-26 fee structure:</strong></p><ul><li><strong>One-time:</strong> Rs 7,800, including refundable institute and library deposits of Rs 1,000 each</li><li><strong>Institute fees per semester:</strong> Rs 1,09,000, including tuition of Rs 1,00,000</li><li><strong>Hostel caution deposit:</strong> Rs 3,500</li><li><strong>Advance dining charges:</strong> Rs 20,000, settled against mess bills</li></ul><p>Tuition is waived for SC, ST and PwD students. The institute's fee page also lists a structure for August-December 2026.</p>","campus_facilities":"<p>The institute is at the Nila Campus in Kanjikkode, Palakkad district.</p>","hostel_information":"<p>The 2025-26 fee structure lists hostel seat rent of Rs 6,500 and electricity, water and sewage charges of Rs 1,500 per semester, along with a Rs 3,500 hostel caution deposit.</p>","placement_information":"<p><strong>2024-25, Career Development Centre report:</strong> 153 offers and a highest package of Rs 52 lakh.</p><p>The Centre also publishes department-wise tables and annual reports on its website.</p>","scholarships":"<h4>B.Tech scholarships and fee remission (IIT Palakkad)</h4><ul><li><strong>Full Fee Remission:</strong> annual family income below Rs 1 lakh; full tuition waiver (Rs 1,00,000 per semester).</li><li><strong>Two Third Fee Remission:</strong> family income Rs 1 lakh to below Rs 5 lakh; two-thirds tuition waiver (Rs 66,667 per semester).</li><li><strong>MCM Scholarship:</strong> family income below Rs 4.5 lakh, for 25% of the sanctioned strength by JEE rank; full tuition waiver plus Rs 1,000 a month pocket money for four months a semester.</li><li><strong>SC/ST Scholarship:</strong> family income below Rs 4.5 lakh; hostel and dining charges waived (about Rs 27,000 per semester) plus Rs 250 a month pocket money for four months a semester.</li><li><strong>PwD Fee Waiver:</strong> with a disability certificate; full tuition waiver.</li><li><strong>Shraman Scholarships:</strong> family income below Rs 5 lakh; up to Rs 35,000 per semester (Rs 70,000 a year), renewed on academic performance, maximum Rs 2,80,000.</li><li><strong>Vidyalakshmi Scholarship Scheme:</strong> family income Rs 1 to 5 lakh, CGPA above 6.5; one-third of the tuition fee, with priority to girl students.</li><li><strong>Foundation For Excellence (FFE):</strong> first-year engineering students with at least 70% in Class X and XII and family income up to Rs 3 lakh; up to Rs 50,000 a year.</li></ul><h4>M.Sc scholarships</h4><ul><li><strong>MCM Scholarship:</strong> family income below Rs 4.5 lakh, 25% of the strength by JAM rank; tuition waiver (Rs 3,000 per semester) plus Rs 1,000 a month pocket money.</li><li><strong>Prof Valsakumar Memorial Merit cum Means Scholarship:</strong> M.Sc Physics student with the highest JAM rank and income up to Rs 4.5 lakh; Rs 35,000 a year.</li><li><strong>Prof Valsakumar Memorial Merit Award:</strong> M.Sc Physics student with the highest CGPA; Rs 5,000 a year.</li><li><strong>SC/ST Scholarship:</strong> as for B.Tech.</li></ul><h4>Education loans</h4><p>The institute points students to the PM-Vidyalaxmi scheme for collateral-free, guarantor-free education loans.</p>","college_image":null,"official_website":"https://iitpkd.ac.in","cta_heading":"Considering IIT Palakkad?","cta_description":"Get help with your JEE (Advanced) preparation and branch choices.","faq_1_question":"Which B.Tech branches are listed?","faq_1_answer":"<p>Civil, Computer Science and Engineering, Electrical, and Mechanical Engineering.</p>","faq_2_question":"What is the tuition fee?","faq_2_answer":"<p>Rs 1,00,000 per semester in the 2025-26 fee structure, waived for SC, ST and PwD students.</p>","faq_3_question":"What were the 2024-25 placements?","faq_3_answer":"The Career Development Centre lists 153 offers and a highest package of Rs 52 lakh.","faq_4_question":"Can I combine B.Tech and M.Tech?","faq_4_answer":"<p>The 2026 regulations include an optional B.Tech plus M.Tech dual degree.</p>","faq_5_question":"Where is the campus?","faq_5_answer":"<p>At Nila Campus, Kanjikkode, Palakkad, Kerala 678623.</p>","featured_image":{"id":1165,"date":"2026-11-04T07:23:22","date_gmt":"2026-11-04T07:23:22","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iit-palakkad/indian-institute-of-technology-palakkad-campus/"},"modified":"2026-11-04T07:23:22","modified_gmt":"2026-11-04T07:23:22","slug":"indian-institute-of-technology-palakkad-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/iit-palakkad/indian-institute-of-technology-palakkad-campus/#main","title":{"rendered":"Indian Institute of Technology Palakkad campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1165","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/iit-palakkad.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300
