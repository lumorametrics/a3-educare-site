    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:31.272Z","entries":{"college:delhi-technological-university":[{"id":1105,"date":"2026-11-04T06:54:12","date_gmt":"2026-11-04T06:54:12","guid":{"rendered":"https://staging.a3educarehub.in/colleges/delhi-technological-university/"},"modified":"2026-11-04T06:54:12","modified_gmt":"2026-11-04T06:54:12","slug":"delhi-technological-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/delhi-technological-university/","title":{"rendered":"Delhi Technological University"},"content":{"rendered":"","protected":false},"featured_media":1190,"template":"","class_list":["post-1105","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Delhi Technological University began in 1941 as Delhi Polytechnic, became Delhi College of Engineering, and took university status under a Delhi Act in 2009. Its 164-acre campus on Bawana Road now offers engineering, design, management and science programmes.","college_overview":"<p>DTU's history starts with the Wood and Abbott Committee of 1938, which led to Delhi Polytechnic opening at Kashmere Gate in 1941. Affiliation with the University of Delhi came in 1952, which brought formal degree programmes, and the college moved to its present site in 1996.</p><p>In July 2009 Delhi College of Engineering became Delhi Technological University under Delhi Act 6 of 2009. Alongside B.Tech, its current admission notices cover design, economics, business and integrated science programmes.</p><p>Placement results differ sharply by branch. In 2024-25 the average package was Rs 19.85 lakh in Computer Engineering and Rs 9.20 lakh in Civil Engineering, so branch choice matters when you fill JAC Delhi preferences.</p>","location":"Shahbad Daulatpur, Main Bawana Road, Delhi 110042, India","city":"Delhi","state":"Delhi","established":"1941 (as Delhi Polytechnic); university since 2009","affiliation":"State university under Delhi Act 6 of 2009","recognition":"<p>DTU's 2026-27 brochure states that it is accredited with an <strong>A+ grade by NAAC (CGPA 3.22 out of 4.0)</strong>. The university also lists ISO 9001:2015 certification.</p>","courses_offered":"<ul><li><strong>Undergraduate:</strong> B.Tech (including lateral entry and continuing education for working professionals), B.Des, BA (Hons) Economics and BBA</li><li><strong>Integrated:</strong> integrated B.Sc and M.Sc programmes</li><li><strong>Postgraduate:</strong> M.Tech (including by research), M.Des, M.Sc, MA Economics and MBA (including Business Analytics, Executive and IEV variants)</li><li><strong>Doctoral:</strong> Ph.D.</li></ul>","admission_process":"<p>B.Tech seats are filled through the Joint Admission Counselling (JAC) Delhi process, which in 2026 also included branch upgradation with fresh choice filling for vacant seats. DTU posts other programme brochures and spot-round notices in the admissions section of its website, including a direct DTU portal for some rounds.</p>","eligibility":"<p>Conditions are set out in the brochure for each programme and admission year on the DTU website.</p>","entrance_exams":"JEE (Main) through JAC Delhi for B.Tech; other programmes as listed in each year's brochure","fees_information":"<p><strong>Annual fees for students admitted in 2026-27 (fee notice dated 22 May 2026):</strong></p><ul><li><strong>B.Tech and B.Des:</strong> Rs 2,69,700 in 2026-27, of which tuition is Rs 1,77,000. The total is Rs 2,86,700 in 2027-28, Rs 3,06,700 in 2028-29 and Rs 3,22,000 in 2029-30.</li><li><strong>B.Tech (Lateral Entry):</strong> Rs 2,69,700 in 2026-27</li><li><strong>B.Tech (Continuing Education):</strong> Rs 1,56,700 in 2026-27</li><li><strong>BBA and BA Economics (Hons):</strong> Rs 1,28,200 in 2026-27</li><li><strong>Integrated B.Sc and M.Sc:</strong> Rs 87,000 in 2026-27</li><li><strong>M.Tech:</strong> Rs 1,28,000 in 2026-27 and Rs 1,30,500 in 2027-28</li><li><strong>M.Tech (Part Time):</strong> Rs 1,28,000 in 2026-27</li><li><strong>M.Tech by Research:</strong> Rs 1,02,000 in 2026-27</li><li><strong>MBA, MBA-IEV and MBA-Business Analytics:</strong> Rs 2,47,700 in 2026-27 and Rs 2,52,500 in 2027-28</li><li><strong>Executive MBA:</strong> Rs 3,07,000 in 2026-27 and Rs 3,13,500 in 2027-28</li><li><strong>M.Sc and MA Economics:</strong> Rs 53,700 in 2026-27 and Rs 54,300 in 2027-28</li></ul><p>Each first-year total includes a one-time Rs 1,000 alumni association fee. Beyond tuition, the totals cover student welfare, facilities and services, an economically weaker section fund, examination fees and medical cover. The same notice also covers M.Des, Ph.D. and the withdrawal policy.</p><p><strong>International students, 2026-27 brochure:</strong> annual UG tuition is US$ 4,000 for developing countries and US$ 8,000 for other countries; PG tuition is US$ 2,500 and US$ 5,000. Other charges are listed separately.</p>","campus_facilities":"<p>DTU's campus covers 164 acres at Bawana Road, adjoining Sector 17, Rohini. It has a Central Library and a Training and Placement department. The university also lists an East Delhi Campus on its website.</p>","hostel_information":"<p>The DTU hostel website lists these hostels and says they accommodate about 2,500 students:</p><ul><li><strong>Boys:</strong> Type-II, Aryabhatt, Bhaskaracharya, Sir C. V. Raman, Sir J.C. Bose, Varahmihir, Sir Vishveshwarya, Homi Jehangir Bhabha, Ramanujan and Dr. APJ Abdul Kalam (AC)</li><li><strong>Girls:</strong> Sister Nivedita, Kalpana Chawla and Virangana Lakshmibai (Blocks 1 and 2, AC)</li></ul><p>The 2026-27 international brochure gives a different count: nine boys' hostels, six girls' hostels and one separate hostel for international students. It describes hostels with recreation and reading rooms, mess, gymnasium and connection to the campus Wi-Fi and LAN.</p><p><strong>Annual charges shown on the hostel website, from a July 2023 office order:</strong></p><ul><li>Single-seater, non-AC: Rs 60,000</li><li>Double-seater, non-AC: Rs 56,000</li><li>Triple-seater and Type-I and Type-II flats, non-AC: Rs 52,000</li><li>Triple-seater, AC: Rs 72,000</li><li>Mess: Rs 34,800 for the academic year, August to May</li></ul><p><strong>Applying, 2026-27:</strong> first-year B.Tech, B.Des, integrated M.Sc, MBA, M.Tech, M.Sc, M.Des and Ph.D. (girls only) students registered on the hostel portal, dtuhostel.in. Allotment follows the 2026-27 hostel rules and depends on availability. The non-refundable hostel and mess fee must be paid within one week of allotment, or the allotment is cancelled.</p>","placement_information":"<p><strong>B.Tech, 2024-25 passing-out batch, average CTC (Training and Placement figures):</strong></p><ul><li>Computer Engineering: Rs 19.85 lakh</li><li>Software Engineering: Rs 18.46 lakh</li><li>Information Technology: Rs 16.62 lakh</li><li>Electronics and Communication: Rs 15.82 lakh</li><li>Mathematics and Computing: Rs 15.22 lakh</li><li>Electrical: Rs 12.89 lakh</li><li>Mechanical: Rs 9.58 lakh</li><li>Civil: Rs 9.20 lakh</li></ul>","scholarships":"<p><strong>DTU fee concession, 2026-27:</strong> undergraduates with family income below Rs 4,50,000 a year may apply online. Students must not have been involved in indiscipline or unfair means in examinations. The portal closes on 9 November 2026 and the hard copy is due by 13 November 2026. DTU's 2025 scheme list describes the benefit as a 100% fee waiver or a 100% or 50% tuition fee waiver.</p><p><strong>Named schemes in DTU notices for 2026-27:</strong></p><ul><li><strong>Dell Aspire Scholars:</strong> first-semester B.Tech students with family income below Rs 5,00,000. It offers partial tuition and accommodation cover, a laptop, mentoring and upskilling sessions.</li><li><strong>Rupa Rahul Bajaj Scholarship for Women in Engineering:</strong> women admitted through competitive examinations in ME, MAM, MAE, EE, EVDT, ECE or PIE, with at least 75% in Class XII.</li><li><strong>Shiv Charan Malik Scholarship:</strong> Rs 1,00,000 for the final-year woman topper in B.Tech Electrical Engineering, by CGPA up to the sixth semester.</li></ul><p><strong>Government schemes:</strong> SC, ST, OBC and minority students apply through the National Scholarship Portal; the 2026-27 deadline stated by DTU was 31 October 2026. DTU's 2025 list also includes:</p><ul><li><strong>AICTE Pragati (girls), Saksham (students with disabilities) and Swanath:</strong> Rs 50,000 a year, family income up to Rs 8 lakh</li><li><strong>Central Sector Scheme for College and University Students:</strong> Rs 12,000 a year at graduation level</li><li><strong>Delhi Higher and Technical Education Support Scheme:</strong> 100% tuition fee for Delhi residents with income up to Rs 3 lakh</li></ul><p>Amounts and income limits from the 2025 list should be checked against the current scheme notice.</p>","college_image":null,"official_website":"https://dtu.ac.in","cta_heading":"Applying through JAC Delhi?","cta_description":"Get help comparing DTU branches and planning your JAC Delhi preferences.","faq_1_question":"How do I get B.Tech admission at DTU?","faq_1_answer":"<p>Seats are filled through JAC Delhi counselling. Check the JAC notice for that year's eligibility and schedule.</p>","faq_2_question":"Was DTU previously Delhi College of Engineering?","faq_2_answer":"<p>Yes. It became Delhi Technological University in July 2009 under Delhi Act 6 of 2009.</p>","faq_3_question":"What is DTU's NAAC grade?","faq_3_answer":"A+, with a CGPA of 3.22 out of 4.0, according to its 2026-27 brochure.","faq_4_question":"What are the placements like?","faq_4_answer":"<p>They vary by branch. In 2024-25 the average CTC was Rs 19.85 lakh in Computer Engineering and Rs 9.20 lakh in Civil Engineering.</p>","faq_5_question":"How large is the campus?","faq_5_answer":"<p>The main campus covers 164 acres at Bawana Road, adjoining Sector 17, Rohini.</p>","featured_image":{"id":1190,"date":"2
