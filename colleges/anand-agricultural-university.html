    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:15.327Z","entries":{"college:anand-agricultural-university":[{"id":1085,"date":"2026-11-04T06:53:22","date_gmt":"2026-11-04T06:53:22","guid":{"rendered":"https://staging.a3educarehub.in/colleges/anand-agricultural-university/"},"modified":"2026-11-04T06:53:22","modified_gmt":"2026-11-04T06:53:22","slug":"anand-agricultural-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/anand-agricultural-university/","title":{"rendered":"Anand Agricultural University"},"content":{"rendered":"","protected":false},"featured_media":1175,"template":"","class_list":["post-1085","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Anand Agricultural University is a residential university with 13 institutions, seven on its main Anand campus and six off campus. It teaches agriculture, horticulture, food technology, agricultural engineering and agri-business, with B.Sc. entry based on GUJCET and Class XII marks.","college_overview":"<p>Anand Agricultural University brings together 13 institutions. The main campus at Anand holds colleges of agriculture, food processing, horticulture and agricultural information technology, an agri-business institute and two polytechnics. Off-campus units are at Vaso, Jabugam, Godhra, Vadodara and Dahod.</p><p>Courses range from diplomas in agriculture and food technology to B.Sc., B.Tech, M.Sc, M.Tech, MBA and Ph.D. programmes.</p><p>The university is residential, and staying in the college hostel is compulsory. Gujarat's agricultural universities share a common online admission, with a merit list that weights GUJCET at 40% and Class XII theory marks at 60%.</p>","location":"Anand, Gujarat, India","city":"Anand","state":"Gujarat","established":"2004 (under Gujarat Act No. 5 of 2004, dated 29 April 2004)","affiliation":"State agricultural university","recognition":"<p>The university's homepage links to its NIRF Rankings 2024 and a NAAC accreditation document.</p>","courses_offered":"<p><strong>Main campus, Anand:</strong></p><ul><li>B. A. College of Agriculture: B.Sc. (Hons.) Agriculture, M.Sc and Ph.D.</li><li>College of Food Processing Technology and Bio Energy: B.Tech, M.Tech and Ph.D.</li><li>College of Horticulture: B.Sc. (Hons.) Horticulture</li><li>College of Agricultural Information Technology: B.Tech and M.Tech</li><li>International Agribusiness Management Institute: MBA and Ph.D.</li><li>Sheth M.C. Polytechnic in Agriculture, and Polytechnic in Food Science and Home Economics: diplomas</li></ul><p><strong>Off campus:</strong></p><ul><li>Colleges of Agriculture at Vaso and Jabugam: B.Sc. (Hons.) Agriculture</li><li>College of Agricultural Engineering and Technology, Godhra: B.Tech, M.Tech and Ph.D.</li><li>Polytechnics at Vaso, Vadodara and Dahod: diplomas</li></ul>","admission_process":"<p>Gujarat's four agricultural universities use a common online admission procedure. For B.Sc. (Hons.) Agriculture, the merit list combines 40% of GUJCET and 60% of Class XII theory marks in Physics, Chemistry and Biology.</p>","eligibility":"<p>B.Sc. (Hons.) Agriculture candidates need Class XII science with Physics, Chemistry and Biology, and must appear for GUJCET.</p>","entrance_exams":"GUJCET for B.Sc. (Hons.) Agriculture","fees_information":"<p>NRI seats are listed at US $3,500 per semester and payment seats at Rs 25,000 per semester. Fees once paid are not refunded.</p>","campus_facilities":"<p>The university has 13 institutions: seven on the Anand campus and six at Vaso, Jabugam, Godhra, Vadodara and Dahod.</p>","hostel_information":"<p>The university is residential, and staying in the college hostel is compulsory.</p>","placement_information":"<h4>College placement cells</h4><p>AAU's constituent colleges run their own placement cells. For example, the College of Agriculture, Vaso cell works to:</p><ul><li>build employability skills and organise on- and off-campus interviews with agro-industrial firms;</li><li>help students prepare for higher studies and competitive exams and encourage entrepreneurship;</li><li>run internships, career development, communication skills, group discussion and mock interview sessions.</li></ul><p>Placement officer (Vaso): Dr. Bindu M. Christian, Department of Extension Education; placementvaso@aau.in.</p><p>The college pages list student outcomes (PG admissions, government and private jobs, JRF) but give no current year-wise statistics, and some placement pages date from 2008 to 2015.</p>","scholarships":"<h4>Merit Scholarship Scheme for economically poor undergraduate students</h4><ul><li><strong>Awards:</strong> four students in each college every year, Rs 500 a month, paid twice a year by the college principal on a progress certificate.</li><li><strong>Income limit:</strong> family income up to Rs 6.00 lakh a year, with a fresh certificate from the Mamlatdar or TDO.</li><li><strong>Merit:</strong> admission merit in the first year; from the second year, the previous year's performance with a CGPA of at least 6.00 out of 10.</li><li>Recipients may not hold any other scholarship or fellowship; the award stops on conduct probation or attendance shortfall.</li><li>A college committee shortlists candidates for the Director of Students' Welfare.</li></ul><p>The scheme document on the university website (Board of Management item 44.9) is undated, so confirm with the Director of Students' Welfare that these terms still apply.</p>","college_image":null,"official_website":"https://www.aau.in","cta_heading":"Interested in agriculture at Anand?","cta_description":"Get help with GUJCET preparation and the common admission process.","faq_1_question":"How is the B.Sc. Agriculture merit list calculated?","faq_1_answer":"<p>It combines 40% of GUJCET and 60% of Class XII theory marks in Physics, Chemistry and Biology.</p>","faq_2_question":"Is the hostel compulsory?","faq_2_answer":"<p>Yes. The university states that staying in the college hostel is compulsory.</p>","faq_3_question":"How many institutions does the university have?","faq_3_answer":"13: seven on the main Anand campus and six off campus.","faq_4_question":"Does it offer an MBA?","faq_4_answer":"<p>Yes. The International Agribusiness Management Institute offers an MBA in Agri-Business Management.</p>","faq_5_question":"Are there diploma courses?","faq_5_answer":"<p>Yes. Polytechnics offer diplomas in agriculture, food technology and nutrition, horticulture and agricultural engineering.</p>","featured_image":{"id":1175,"date":"2026-11-04T07:24:49","date_gmt":"2026-11-04T07:24:49","guid":{"rendered":"https://staging.a3educarehub.in/colleges/anand-agricultural-university/anand-agricultural-university-campus/"},"modified":"2026-11-04T07:24:49","modified_gmt":"2026-11-04T07:24:49","slug":"anand-agricultural-university-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/anand-agricultural-university/anand-agricultural-university-campus/#main","title":{"rendered":"Anand Agricultural University campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1175","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/anand-agricultural-university.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"225\" height=\"300\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/anand-agricultural-university-225x300.jpg\" class=\"attachment-medium size-medium\" alt=\"Anand Agricultural University campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/anand-agricultural-university-225x300.jpg 225w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/anand-agricultural-university-768x1024.jpg 76
