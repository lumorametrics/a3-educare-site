    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:12.007Z","entries":{"college:nit-mizoram":[{"id":1142,"date":"2026-11-04T06:55:41","date_gmt":"2026-11-04T06:55:41","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-mizoram/"},"modified":"2026-11-04T06:55:41","modified_gmt":"2026-11-04T06:55:41","slug":"nit-mizoram","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nit-mizoram/","title":{"rendered":"National Institute of Technology Mizoram"},"content":{"rendered":"","protected":false},"featured_media":1212,"template":"","class_list":["post-1142","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"National Institute of Technology Mizoram is a centrally funded institution in Aizawl, Mizoram, offering engineering and technology programmes.","college_overview":"<p>National Institute of Technology Mizoram dates to 2010. The institute's brochure says it has worked from a temporary campus in Aizawl since 2011, with a permanent campus at Lengpui under preparation.</p><p>It offers B.Tech, M.Tech and Ph.D. programmes. B.Tech places come through JEE (Main) and JoSAA, and M.Tech places through GATE and CCMT.</p>","location":"Aizawl, Mizoram, India","city":"Aizawl","state":"Mizoram","established":"2010","affiliation":"National Institute of Technology under the NIT Act, 2007","recognition":"<p>NIT Mizoram is an Institute of National Importance under the Ministry of Education.</p>","courses_offered":"<ul><li><strong>B.Tech:</strong> Civil, Computer Science, Electrical, Electronics and Communication, and Mechanical Engineering</li><li><strong>Postgraduate:</strong> M.Tech</li><li><strong>Doctoral:</strong> Ph.D.</li></ul>","admission_process":"<p>B.Tech places are filled through JEE (Main) and JoSAA, M.Tech places through GATE and CCMT, and Ph.D. places through a written test and interview.</p>","eligibility":"<p>Candidates must meet the conditions of JEE (Main) and JoSAA, or of GATE and CCMT, for the admission year.</p>","entrance_exams":"JEE (Main) for B.Tech; GATE for M.Tech","fees_information":"<h4>B.Tech, academic fees from July 2023 onwards</h4><p>The institute's fee structure for the undergraduate programme, approved by the 30th Finance Committee and the 36th Board of Governors meeting of 23 June 2023, sets fees by family income. Each total below covers all eight semesters and includes tuition, registration, library, student activity, internet, laboratory, student aid, campus development, examination, medical aid, training and placement, convocation and other charges.</p><ul><li><strong>General and OBC, family income above Rs 5 lakh a year:</strong> Rs 6,07,700 in total, with tuition of Rs 62,500 a semester. Rs 75,200 in the 1st semester, Rs 75,000 for the 2nd to 4th, Rs 76,000 for the 5th to 7th and Rs 79,500 for the 8th</li><li><strong>General and OBC, family income from Rs 1 lakh to Rs 5 lakh a year:</strong> Rs 2,74,364 in total, with tuition of Rs 20,833 a semester. Rs 33,533 in the 1st semester, Rs 33,333 for the 2nd to 4th, Rs 34,333 for the 5th to 7th and Rs 37,833 for the 8th</li><li><strong>General and OBC, family income below Rs 1 lakh a year, and SC, ST and PwD students:</strong> Rs 1,07,700 in total, with no tuition fee. Rs 12,700 in the 1st semester, Rs 12,500 for the 2nd to 4th, Rs 13,500 for the 5th to 7th and Rs 17,000 for the 8th</li></ul><p>The library deposit of Rs 2,000 a semester is refundable. Hostel and mess charges are not part of this table. M.Tech and Ph.D. fees are published separately by the institute. This structure applies from July 2023 onwards; check the institute's current admission brochure for any later revision.</p>","campus_facilities":"<p>The institute works from a temporary campus in Aizawl, and its brochure says a permanent campus at Lengpui is under preparation.</p>","hostel_information":"<p>The institute's brochure says hostels are some distance from the temporary campus.</p>","placement_information":"<h4>Placement record, 2025-26 graduating class (Training and Placement Office)</h4><ul><li><strong>Overall placement rate:</strong> 92.9%</li><li><strong>Companies:</strong> 117 took part (the Director's message on the same page says over 112)</li><li><strong>Highest package:</strong> 24.80 LPA; <strong>average package:</strong> 9.56 LPA</li><li>More than half the students received multiple offers.</li></ul><h4>By branch</h4><ul><li>Computer Science and Engineering: 96.2% placed, average 10.41 LPA</li><li>Electronics and Communication Engineering: 96.0% placed, average 9.86 LPA</li><li>Mechanical Engineering: 93.3%</li><li>Civil Engineering: 83.3%; Electrical and Electronics Engineering: 81.0%</li></ul><h4>Recruiters and internships</h4><p>Recruiters named include Bharat Electronics, Accenture, Vedanta, Tata Power, L&amp;T, TCE, HCL, Schneider Electric, Siemens, Nvidia, Deloitte, HSBC and ICICI Bank. The office reports 15 students in research internships at IIT Madras and 30 at IIT Kanpur and IIT Patna. The Director's message describes a 100% summer internship conversion rate.</p>","scholarships":"<h4>How scholarships work at NIT Mizoram</h4><ul><li>Students apply for schemes listed on the National Scholarships Portal (scholarships.gov.in) and for other schemes such as UGC Ishan Uday (North East Region) and state-government scholarships (Assam, Manipur, Bihar and others), or from ONGC and Samsung.</li><li>After applying on the portal, students must submit their documents for Institute Level Verification, only through the scholarship module of the institute ERP; email or offline submissions are not accepted.</li><li>Applications that miss the Institute Level Verification deadline are treated as defective.</li><li>A student can benefit from only one scholarship at a time from any single source.</li></ul><h4>Schemes with circulars on the institute page</h4><p>Top Class Education scheme for SC and for OBC, EBC and DNT students, National Overseas Scholarship for ST candidates, Foundation for Excellence, Siemens Scholarship Program, Swami Dayanand Education Foundation scholarship and Welfare of Backward Classes scholarships for BC, MBC and DNC students from Tamil Nadu.</p>","college_image":null,"official_website":"https://www.nitmz.ac.in","cta_heading":"Considering NIT Mizoram?","cta_description":"Get help with JEE (Main) and your JoSAA branch choices.","faq_1_question":"Where does NIT Mizoram teach?","faq_1_answer":"<p>From a temporary campus in Aizawl, according to its brochure.</p>","faq_2_question":"Where will the permanent campus be?","faq_2_answer":"<p>At Lengpui, according to the institute's brochure.</p>","faq_3_question":"How do I get a B.Tech seat?","faq_3_answer":"<p>Through a JEE (Main) rank and JoSAA counselling.</p>","faq_4_question":"How do I get an M.Tech seat?","faq_4_answer":"<p>Through GATE and CCMT.</p>","faq_5_question":"Are the hostels on campus?","faq_5_answer":"<p>The brochure says they are some distance from the temporary campus.</p>","featured_image":{"id":1212,"date":"2026-11-04T07:27:55","date_gmt":"2026-11-04T07:27:55","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-mizoram/national-institute-of-technology-mizoram-campus/"},"modified":"2026-11-04T07:27:55","modified_gmt":"2026-11-04T07:27:55","slug":"national-institute-of-technology-mizoram-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nit-mizoram/national-institute-of-technology-mizoram-campus/#main","title":{"rendered":"National Institute of Technology Mizoram campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1212","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-mizoram.jpg'><img fetchpriority=\"high\" d
