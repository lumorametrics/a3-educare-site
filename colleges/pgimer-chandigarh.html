    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:28.269Z","entries":{"college:pgimer-chandigarh":[{"id":1121,"date":"2026-11-04T06:54:53","date_gmt":"2026-11-04T06:54:53","guid":{"rendered":"https://staging.a3educarehub.in/colleges/pgimer-chandigarh/"},"modified":"2026-11-04T06:54:53","modified_gmt":"2026-11-04T06:54:53","slug":"pgimer-chandigarh","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/pgimer-chandigarh/","title":{"rendered":"Postgraduate Institute of Medical Education and Research"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1121","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"PGIMER Chandigarh is a postgraduate medical institute that runs January and July entry sessions for its MD and MS courses through INI-CET. It also teaches nursing and paramedical students, including a four-year B.Sc. in Nursing and an M.Sc. in Nursing.","college_overview":"<p>PGIMER Chandigarh's teaching centres on postgraduate medicine. Admission to MD and MS courses runs in January and July sessions, and recent institute notices show seats being allotted to candidates who qualified through INI-CET.</p><p>An undated institute admissions page lists 610 MD and MS seats, 18 MDS seats, 5 Master of Hospital Administration seats and 257 paramedical B.Sc. seats, with 5% of MD and MS seats reserved for candidates who have worked in rural areas.</p><p>Nursing is taught through a four-year B.Sc. and an M.Sc., with an application form issued for the 2026 M.Sc. session. Paramedical brochures are issued separately.</p>","location":"Chandigarh, India","city":"Chandigarh","state":"Chandigarh","established":"1962","affiliation":"Autonomous Institute of National Importance under an Act of Parliament; the institute's Citizen Charter describes it as a deemed medical university","recognition":"<p>PGIMER Chandigarh takes part in INI-CET for MD and MS admissions.</p>","courses_offered":"<ul><li><strong>MD and MS:</strong> 610 seats on an undated institute page</li><li><strong>MDS:</strong> 18 seats</li><li><strong>Master of Hospital Administration:</strong> 5 seats</li><li><strong>B.Sc. (Paramedical):</strong> 257 seats</li><li><strong>Nursing:</strong> four-year B.Sc. and M.Sc.</li><li><strong>DBT-sponsored M.Sc.</strong></li></ul>","admission_process":"<p>Applications for the January and July sessions are usually advertised in September or October and in March or April. MD and MS allotment runs through INI-CET. Nursing and paramedical courses have their own forms and brochures.</p>","eligibility":"<p>Conditions are in each course's brochure and in the INI-CET notice for the session.</p>","entrance_exams":"INI-CET for MD and MS; institute examinations for other courses","fees_information":"<p><strong>M.Sc. (Medical Biotechnology), prospectus for session 2026-28:</strong></p><ul><li><strong>Semester I:</strong> registration fee Rs 500, tuition Rs 170, laboratory fee Rs 450, amalgamated fund Rs 360 and refundable security Rs 1,000, for a total of Rs 2,480</li><li><strong>Semesters II, III and IV:</strong> tuition Rs 170, laboratory fee Rs 450 and amalgamated fund Rs 360, for a total of Rs 980 each</li></ul><p>Late payment carries a fine of Rs 5 a day for up to 15 days, after which the candidate's name is struck off the rolls. Re-admission costs Rs 500 in addition to the fine. Fees once paid are not refunded, and the institute may revise dues. A candidate who leaves midway pays a penalty of Rs 10,000.</p><p>This is the only current fee schedule found on the institute's pages. Check the prospectus for your session for MD, MS, nursing and paramedical fees.</p>","campus_facilities":"<h4>Dr. Tulsi Das Library</h4><p>Established in 1962, the library holds more than one lakh books, bound journals and theses, and has acquired around 2,000 e-journals and e-books. It subscribes to around 38 databases and to software including Turnitin, Grammarly, EndNote and SPSS on demand. Digital content is available to members at all hours, and residents and members have a separate 24-hour reading room (2026-28 prospectus).</p><h4>Sports and culture</h4><p>The prospectus lists table tennis, badminton, cricket, lawn tennis and football, and a water sports complex near the men's hostel. An Institute Cultural Programmes Committee organises events, and the campus has the Bhargava Auditorium.</p><h4>Hospital facilities</h4><p>The institute's undated Citizen Charter lists:</p><ul><li><strong>Nehru Hospital:</strong> 949 beds</li><li><strong>Advanced Cardiac Centre:</strong> 250 beds</li><li><strong>Emergency Complex:</strong> 110 beds</li><li><strong>Advanced Trauma Centre:</strong> 100 beds</li><li><strong>Advanced Eye Centre:</strong> 100 beds</li></ul><h4>Other services</h4><p>The Citizen Charter also lists a State Bank of India branch with ATMs on campus, a post office and a shopping complex.</p>","hostel_information":"<p>The institute's hostel page, which is undated, says resident doctors and students get semi-furnished accommodation in designated ladies, bachelor and married hostels. The Dean's office allots rooms. The page gives these approximate numbers, for a total of 820 rooms or seats:</p><ul><li><strong>Old Doctors Hostel, Blocks A to D:</strong> 208</li><li><strong>Married Doctors Hostel:</strong> 182</li><li><strong>New Bachelor Doctors Hostels:</strong> 158</li><li><strong>Kairon Block Hostel:</strong> 122</li><li><strong>Sanjeevani Hostels, including S, B (top floor) and E Blocks:</strong> 118</li><li><strong>APC double-seater rooms and four-seater dormitories:</strong> 16</li><li><strong>Four-seater common rooms, only for paramedical and M.Sc. students:</strong> 16</li></ul><p>Three messes run through the Association of Resident Doctors. Photocopying, computer typing, barber and laundry services are also available.</p><p>The 2026-28 M.Sc. (Medical Biotechnology) prospectus offers each student a partially furnished single room, subject to availability. The pages read give no hostel charges.</p>","placement_information":"","scholarships":"","college_image":null,"official_website":"https://pgimer.edu.in","cta_heading":"Preparing for PGIMER Chandigarh?","cta_description":"Get help planning for INI-CET and the institute's nursing and paramedical entrance routes.","faq_1_question":"How do I get an MD or MS seat?","faq_1_answer":"<p>Through INI-CET, for the January or July session.</p>","faq_2_question":"When are applications advertised?","faq_2_answer":"<p>Usually in September or October, and in March or April.</p>","faq_3_question":"Does it offer nursing courses?","faq_3_answer":"Yes. It offers a four-year B.Sc. and an M.Sc. in Nursing.","faq_4_question":"Are paramedical courses available?","faq_4_answer":"<p>Yes. An undated institute page lists 257 B.Sc. paramedical seats.</p>","faq_5_question":"Is any MD or MS quota for rural service?","faq_5_answer":"<p>The institute page reserves 5% of seats for candidates who have worked in rural areas.</p>","featured_image":{"id":1459,"date":"2026-11-14T12:47:14","date_gmt":"2026-11-14T12:47:14","guid":{"rendered":"https://staging.a3educarehub.in/colleges/pgimer-chandigarh/postgraduate-institute-of-medical-education-and-research-featured-image/"},"modified":"2026-11-14T12:47:14","modified_gmt":"2026-11-14T12:47:14","slug":"postgraduate-institute-of-medical-education-and-research-featured-image","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/pgimer-chandigarh/postgraduate-institute-of-medical-education-and-research-featured-image/#main","title":{"rendered":"Postgraduate Institute of Medical Education and Research – Featured Image"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1459","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendere
