s MBBS seat matrix.</p>","courses_offered":"<ul><li><strong>MBBS</strong></li><li><strong>B.Sc. Nursing and allied health courses</strong>, under the territory's undergraduate prospectus</li></ul>","admission_process":"<p>MBBS admission follows the notice, prospectus and policy issued for each session, most recently 2025-26 among those checked. Nursing and allied health courses follow the territory's undergraduate prospectus.</p>","eligibility":"<p>MBBS candidates must qualify in NEET UG and meet the conditions in the admission policy for that year.</p>","entrance_exams":"NEET UG for MBBS","fees_information":"<p><strong>MBBS:</strong> no official MBBS tuition figure was found in the documents that could be read. The 2020-21 prospectus, the latest MBBS one read, requires every candidate to give a surety bond of Rs 5,00,000 at counselling or admission, and charges a penalty of the same amount for a lapsed seat. The rules for later sessions may differ.</p><h4>B.Sc. Nursing, Shri Vinoba Bhave College of Nursing, 2024-25 prospectus</h4><ul><li><strong>Fees by year:</strong> Rs 5,700, Rs 2,200, Rs 2,200 and Rs 3,200, including tuition of Rs 1,000 a year</li><li><strong>Hostel, if chosen:</strong> no rent; Rs 2,000 once on admission, of which Rs 1,000 is refundable security</li><li><strong>Extra:</strong> examination and university fees, as the university sets them, and mess fees</li></ul><h4>BPT, BOT and B.Sc. MRIT, 2024-25 prospectus</h4><ul><li><strong>Domicile of DNH and DD, SC/ST:</strong> tuition Rs 5,000; total Rs 11,700</li><li><strong>Domicile of DNH and DD, General:</strong> tuition Rs 7,500; total Rs 14,200</li><li><strong>Non-domicile:</strong> tuition Rs 20,000; total Rs 26,700</li></ul><p>Each total includes Rs 5,000 refundable security. Examination and university fees are extra.</p><h4>BSS diploma courses, NAMO College of Allied Health Sciences, 2025-26 prospectus</h4><p>Rs 9,000 in the first year and Rs 8,000 in the second, Rs 17,000 in all, including tuition of Rs 5,000 a year. Uniform and ID card fees are extra.</p>","campus_facilities":"<p>Training takes place at Shri Vinoba Bhave Civil Hospital, Silvassa.</p>","hostel_information":"<p>The 2024-25 prospectus for nursing and allied health courses describes hostel accommodation as optional, with the fee depending on the option chosen.</p>","placement_information":"","scholarships":"<p>The documents read do not set out a scholarship scheme for MBBS students.</p><ul><li><strong>Stipend:</strong> the National Medical Commission's 2026 stipend list shows this institute as giving a UG stipend of Rs 15,000. The list does not state the period or who receives it.</li><li><strong>B.Sc. Nursing:</strong> the 2024-25 prospectus says Shri Vinoba Bhave College of Nursing has admitted 8 supernumerary seats under the Pradhan Mantri Special Scholarship Scheme since 2021.</li></ul>","college_image":null,"official_website":"http://vbch.dnh.nic.in","cta_heading":"Considering MBBS at Silvassa?","cta_description":"Get help with NEET UG preparation and the admission notices.","faq_1_question":"What was the institute called before?","faq_1_answer":"<p>Shri Vinoba Bhave Institute of Medical Sciences.</p>","faq_2_question":"Which is its teaching hospital?","faq_2_answer":"<p>Shri Vinoba Bhave Civil Hospital, Silvassa.</p>","faq_3_question":"Where are MBBS notices published?","faq_3_answer":"On the institute and hospital website.","faq_4_question":"Does it run nursing courses?","faq_4_answer":"<p>Yes. A separate undergraduate prospectus covers nursing and allied health.</p>","faq_5_question":"Which entrance test do I need for MBBS?","faq_5_answer":"<p>NEET UG.</p>","featured_image":{"id":1461,"date":"2026-11-14T12:47:36","date_gmt":"2026-11-14T12:47:36","guid":{"rendered":"https://staging.a3educarehub.in/colleges/namo-medical-silvassa/namo-medical-education-and-research-institute-featured-image/"},"modified":"2026-11-14T12:47:36","modified_gmt":"2026-11-14T12:47:36","slug":"namo-medical-educa
