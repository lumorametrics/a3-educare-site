    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:51.408Z","entries":{"college:nit-goa":[{"id":1110,"date":"2026-11-04T06:54:39","date_gmt":"2026-11-04T06:54:39","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-goa/"},"modified":"2026-11-04T06:54:39","modified_gmt":"2026-11-04T06:54:39","slug":"nit-goa","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nit-goa/","title":{"rendered":"National Institute of Technology Goa"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1110","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"NIT Goa, established in 2010, moved from its transit campus to a 114-acre permanent site at Cuncolim in South Goa, inaugurated on 6 February 2024. It admits 258 first-year B.Tech students across five branches through JEE (Main).","college_overview":"<p>NIT Goa was established in 2010 and spent over a decade on a transit campus. Its permanent campus at Cuncolim, South Goa, was inaugurated on 6 February 2024 and spreads over 114 acres.</p><p>The first-year B.Tech intake of 258 is spread across five branches, with 58 seats each in Computer Science, Electrical and Electronics, and Electronics and Communication, and 42 each in Civil and Mechanical.</p><p>Hostels on the new campus can house 825 men and 275 women. Five wardens oversee them under a Chief Warden.</p>","location":"Kottamoll Plateau, Cuncolim, Goa, India","city":"Cuncolim","state":"Goa","established":"2010","affiliation":"National Institute of Technology under the NIT Act, 2007","recognition":"<p>NIT Goa is an Institute of National Importance under the Ministry of Education.</p>","courses_offered":"<ul><li><strong>B.Tech:</strong> Computer Science and Engineering (58), Electrical and Electronics (58), Electronics and Communication (58), Civil (42), Mechanical (42)</li><li><strong>Doctoral:</strong> Ph.D.</li></ul>","admission_process":"<p>B.Tech places are filled on JEE (Main) ranks through JoSAA, and through the Direct Admission of Students Abroad scheme.</p>","eligibility":"<p>Candidates must meet JEE (Main) and JoSAA conditions for the admission year.</p>","entrance_exams":"JEE (Main) for B.Tech","fees_information":"<p><strong>B.Tech first semester, 2026-27 physical reporting instructions:</strong></p><ul><li>General, OBC and EWS: institute fee of Rs 84,000 for the first semester. After the Rs 70,000 already paid to JoSAA or CSAB, Rs 14,000 is due at admission</li><li>SC, ST and PwD: Rs 21,500 for the first semester, with nothing further due at admission after the Rs 30,000 paid to JoSAA or CSAB</li><li>DASA: Rs 21,500 due at admission</li></ul><p><strong>Hostel:</strong> Rs 44,250 for the first semester, including the mess fee, paid at hostel admission.</p><p>Fees are paid online only, and the payment link opens after online reporting and document verification.</p>","campus_facilities":"<p>The 114-acre campus has tutorial, departmental, seminar and administrative buildings, a health centre, an amenity centre, a sports ground and staff quarters.</p>","hostel_information":"<p>Separate hostels hold 825 men and 275 women in individual rooms, with separate mess facilities and Wi-Fi. Security staff are on duty round the clock. Accommodation is provided on payment, subject to availability.</p>","placement_information":"<p><strong>B.Tech, 2025-26 placement report:</strong> 90 of 99 eligible students were placed (90.91%). The highest package was Rs 28 LPA, the average Rs 10.75 LPA and the lowest Rs 5 LPA, and 103 companies visited for the graduating batch.</p><ul><li>Computer Science: 27 of 28 placed; average Rs 13.07 LPA, highest Rs 28 LPA</li><li>Electrical and Electronics: 21 of 22; average Rs 9.67 LPA</li><li>Mechanical: 19 of 20; average Rs 9.11 LPA</li><li>Electronics and Communication: 17 of 19; average Rs 8.91 LPA</li><li>Civil: 6 of 10; average Rs 8.25 LPA</li></ul><p><strong>M.Tech, 2025-26:</strong> 19 of 24 eligible students were placed (79.17%), with an average package of Rs 13.86 LPA and a highest of Rs 24 LPA.</p><p>For comparison, the 2024-25 B.Tech report shows 74 of 90 placed (82.22%) and an average of about Rs 8.10 LPA.</p><p>The Training and Placement Cell can be reached at tpo@nitgoa.ac.in or 0832-2404224.</p>","scholarships":"<p><strong>Tuition fee remission for B.Tech, 2026-27:</strong> under the Ministry of Education guidelines of 24 June 2016, as set out in the institute's notice of 25 June 2026:</p><ul><li>SC, ST and PwD students are exempt from tuition fees, with no income certificate needed</li><li>General, GEN-EWS and OBC-NCL students with family income below Rs 1 lakh a year can claim a refund of the full tuition fee of Rs 62,500</li><li>Those with family income of Rs 1 lakh to Rs 5 lakh can claim a refund of two-thirds, Rs 41,667</li></ul><p>Students pay the full first-semester fee at admission. The waived amount is refunded once the institute receives the fee from JoSAA or CSAB. Applicants upload an income certificate issued on or after 1 April 2026, parents' PAN, Aadhaar and income tax returns, and an undertaking. Continuing students had to apply by 13 July 2026, and first-year students at physical reporting.</p>","college_image":null,"official_website":"https://www.nitgoa.ac.in","cta_heading":"Considering NIT Goa?","cta_description":"Get help with JEE (Main) and your JoSAA branch choices.","faq_1_question":"Where is NIT Goa now?","faq_1_answer":"<p>On its permanent campus at Cuncolim, South Goa.</p>","faq_2_question":"How many B.Tech seats are there?","faq_2_answer":"<p>258 in the first year, across five branches.</p>","faq_3_question":"How are students admitted?","faq_3_answer":"Through JEE (Main) ranks and JoSAA, or the Direct Admission of Students Abroad scheme.","faq_4_question":"How many students can live on campus?","faq_4_answer":"<p>1,100 in total: 825 men and 275 women.</p>","faq_5_question":"How large is the campus?","faq_5_answer":"<p>114 acres.</p>","featured_image":{"id":1456,"date":"2026-11-14T12:46:44","date_gmt":"2026-11-14T12:46:44","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-goa/national-institute-of-technology-goa-featured-image/"},"modified":"2026-11-14T12:46:44","modified_gmt":"2026-11-14T12:46:44","slug":"national-institute-of-technology-goa-featured-image","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nit-goa/national-institute-of-technology-goa-featured-image/#main","title":{"rendered":"National Institute of Technology Goa – Featured Image"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1456","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/national-institute-of-technology-goa-1110-representative.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"227\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/national-institute-of-technology-goa-1110-representative-300x227.jpg\" class=\"attachment-medium size-medium\" alt=\"Representative educational image for National Institute of Technology Goa\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/national-institute-of-technology-goa-1110-representative-300x227.jpg 300w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/national-institute-of-technology-goa-1110-representative-1024x776.jpg 1024w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/national-institute-of-technology-goa-1110-representative-768x582.jpg 768w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/national-institute-of-technology-goa-1110-representative-1536x1164.jpg 1536w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/national-institute-of-technology-goa-111
