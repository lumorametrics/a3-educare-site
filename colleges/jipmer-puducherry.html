    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:22.334Z","entries":{"college:jipmer-puducherry":[{"id":1043,"date":"2026-11-04T06:29:16","date_gmt":"2026-11-04T06:29:16","guid":{"rendered":"https://staging.a3educarehub.in/colleges/jipmer-puducherry/"},"modified":"2026-11-04T06:29:16","modified_gmt":"2026-11-04T06:29:16","slug":"jipmer-puducherry","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/jipmer-puducherry/","title":{"rendered":"Jawaharlal Institute of Postgraduate Medical Education and Research (JIPMER)"},"content":{"rendered":"","protected":false},"featured_media":1052,"template":"","class_list":["post-1043","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"JIPMER is one of India's oldest centres of medical education, tracing its roots to a French medical school founded in Pondicherry in 1823. Today it is an Institution of National Importance offering medical, nursing and allied health programmes from its Puducherry campus, with a second campus at Karaikal.","college_overview":"<p>The Jawaharlal Institute of Postgraduate Medical Education and Research began as the École de Médecine de Pondichéry, set up by the French Government in 1823. After a period as Dhanvantri Medical College it was upgraded to a Regional Postgraduate Centre under the Ministry of Health and Family Welfare and renamed JIPMER. Its hospital and outpatient buildings at Gorimedu were inaugurated in July 1964.</p><p>In July 2008 an Act of Parliament made JIPMER an Institution of National Importance, and it was formally dedicated as one that October. The institute now combines teaching with a large public hospital on a campus of about 192 acres in Puducherry, and also runs a campus at Karaikal.</p><p>For students, JIPMER is of interest for its low government fees and the range of its courses, from MBBS and BSc programmes to postgraduate and super-speciality training.</p>","location":"Dhanvantari Nagar, Gorimedu, Puducherry 605006, India","city":"Puducherry","state":"Puducherry","established":"Founded 1823 (as École de Médecine de Pondichéry); named JIPMER in 1956","affiliation":"Autonomous Institute of National Importance (JIPMER Act, 2008); awards its own degrees","recognition":"<p>JIPMER has been an <strong>Institution of National Importance</strong> by Act of Parliament since July 2008. It functions under the Ministry of Health and Family Welfare, Government of India.</p>","courses_offered":"<ul><li><strong>Undergraduate medicine:</strong> MBBS, at the Puducherry and Karaikal campuses.</li><li><strong>BSc Nursing:</strong> 94 seats listed for 2025-26.</li><li><strong>BSc Allied Health Sciences:</strong> 87 seats listed for 2025-26, including Medical Laboratory Sciences, Anaesthesia Technology and Optometry.</li><li><strong>Nursing and public health (postgraduate):</strong> MSc Nursing specialities, Post Basic Diploma in Nursing (19 seats) and Master of Public Health (34 seats), as listed in the 2025 prospectus.</li><li><strong>Postgraduate and super-speciality medicine:</strong> MD/MS through INI-CET and DM/MCh through INI-SS.</li></ul>","admission_process":"<p>JIPMER does not hold its own MBBS entrance test. Seats are filled from NEET UG results through centralised counselling: the Medical Counselling Committee (MCC) for All India Quota seats and CENTAC for Puducherry state quota seats. Candidates should read the current JIPMER MBBS prospectus for seat distribution and reporting instructions.</p><p>Postgraduate and super-speciality seats are filled through the INI-CET and INI-SS examinations, each with its own JIPMER prospectus for the session.</p>","eligibility":"<p>MBBS applicants must qualify in NEET UG for the year of admission. Academic and age requirements are set out in the JIPMER MBBS prospectus for that year, and requirements for BSc, MSc and diploma courses are published in separate prospectuses.</p>","entrance_exams":"NEET UG (MBBS), INI-CET (MD/MS), INI-SS (DM/MCh)","fees_information":"<p><strong>MBBS, 2025-26 prospectus:</strong></p><ul><li>Total payable at admission: Rs 14,920, which includes a one-time admission fee of Rs 5,000, a caution deposit of Rs 3,000 and annual tuition of Rs 1,200.</li><li>Payable each following year: Rs 6,770.</li></ul><p><strong>Hostel, 2025-26 prospectus:</strong> Rs 20,000 at admission, then Rs 12,000 a year for double or Rs 15,000 a year for single accommodation.</p><p>Fees for other courses are listed in their own prospectuses. Please confirm amounts for the current year with JIPMER.</p>","campus_facilities":"<p>The Puducherry campus covers about 192 acres at Dhanvantari Nagar, Gorimedu, and combines academic departments with a large teaching hospital, so clinical training takes place on site. Specialist units include a Regional Cancer Centre. A second campus operates at Karaikal.</p>","hostel_information":"<p>Hostel accommodation is available in double and single rooms, charged separately from tuition. See the Fees section for 2025-26 hostel charges.</p>","placement_information":"","scholarships":"","college_image":null,"official_website":"https://jipmer.edu.in","cta_heading":"Planning to study medicine at JIPMER?","cta_description":"Get help with NEET UG counselling choices, seat options and your application.","faq_1_question":"How do I get an MBBS seat at JIPMER?","faq_1_answer":"<p>Through NEET UG. Seats are then allotted by counselling: MCC for All India Quota seats and CENTAC for Puducherry state quota seats. JIPMER has no separate MBBS entrance test.</p>","faq_2_question":"What are the MBBS fees at JIPMER?","faq_2_answer":"<p>The 2025-26 prospectus lists Rs 14,920 at admission and Rs 6,770 for each later year, with hostel charged separately.</p>","faq_3_question":"Is JIPMER an Institution of National Importance?","faq_3_answer":"Yes. It received this status by an Act of Parliament in July 2008.","faq_4_question":"Does JIPMER offer courses other than MBBS?","faq_4_answer":"<p>Yes. It offers BSc Nursing, BSc Allied Health Sciences, MSc Nursing, a Master of Public Health, and postgraduate and super-speciality medical courses.</p>","faq_5_question":"Where is JIPMER located?","faq_5_answer":"<p>The main campus is at Dhanvantari Nagar, Gorimedu, Puducherry 605006. There is a second campus at Karaikal.</p>","featured_image":{"id":1052,"date":"2026-11-04T06:33:26","date_gmt":"2026-11-04T06:33:26","guid":{"rendered":"https://staging.a3educarehub.in/colleges/jipmer-puducherry/jipmer-administrative-block-puducherry/"},"modified":"2026-11-04T06:33:26","modified_gmt":"2026-11-04T06:33:26","slug":"jipmer-administrative-block-puducherry","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/jipmer-puducherry/jipmer-administrative-block-puducherry/#main","title":{"rendered":"JIPMER administrative block, Puducherry"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1052","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/jipmer-puducherry.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"225\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/jipmer-puducherry-300x225.jpg\" class=\"attachment-medium size-medium\" alt=\"Administrative block of JIPMER in Puducherry\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/jipmer-puducherry-300x225.jpg 300w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/jipmer-puducherry-1024x768.jpg 1024w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/jipmer-puducherry-768x576.jpg 768w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/jipmer-puducherry.jpg 1280w\" sizes=\"(max-width: 300px) 100vw, 300px\" /></a></p>\n<p>Source: https://
