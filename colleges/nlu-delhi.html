    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:31.440Z","entries":{"college:nlu-delhi":[{"id":1104,"date":"2026-11-04T06:54:11","date_gmt":"2026-11-04T06:54:11","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nlu-delhi/"},"modified":"2026-11-04T06:54:11","modified_gmt":"2026-11-04T06:54:11","slug":"nlu-delhi","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nlu-delhi/","title":{"rendered":"National Law University, Delhi"},"content":{"rendered":"","protected":false},"featured_media":1189,"template":"","class_list":["post-1104","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"National Law University Delhi was established by a Delhi Act in 2008 and is based at Sector 14, Dwarka. It admits students to B.A.LL.B. (Hons.), LL.M. and Ph.D. programmes through its own entrance test, not through CLAT.","college_overview":"<p>National Law University Delhi was set up in 2008 by Act No. 1 of 2008 of Delhi and works from its campus at Sector 14, Dwarka.</p><p>It stands apart in law admissions because it runs its own All India Law Entrance Test, which the university's newer notices also call AIET. Applicants who plan only for CLAT therefore need to prepare for and register for this test separately.</p><p>Hostel places are limited, and the university says it cannot provide them to every new student. Applicants from outside Delhi should plan for that when they budget.</p>","location":"Sector 14, Dwarka, New Delhi 110078, India","city":"New Delhi","state":"Delhi","established":"2008 (Act No. 1 of 2008 of Delhi)","affiliation":"State law university established by Act No. 1 of 2008 of Delhi","recognition":"<p>NLU Delhi was established by legislation of Delhi, Act No. 1 of 2008, and awards its own degrees.</p>","courses_offered":"<ul><li><strong>B.A.LL.B. (Hons.):</strong> 120 seats, made up of 110 category seats and 10 for foreign national and OCI/PIO candidates</li><li><strong>LL.M.:</strong> one year; 70 seats through the entrance test, plus 5 each for foreign nationals and OCI/PIO candidates (2025-26 notice)</li><li><strong>Ph.D. in Law:</strong> 32 + 2 seats (2026-27 notice)</li><li><strong>Ph.D. in Social Sciences:</strong> 4 seats (2026-27 notice)</li></ul>","admission_process":"<p>All candidates other than those in the Foreign Nationals category must appear for the university's entrance test. The next test is on 2 May 2027, and the detailed admission notification is due in January 2027. Results lead to merit-based allotment under the seat matrix. Applications and notices are published on the admission website.</p>","eligibility":"<ul><li><strong>LL.M.:</strong> an LL.B. or equivalent degree with at least 55% marks (50% for reserved categories)</li><li><strong>Ph.D. in Law:</strong> an LL.M. or equivalent law degree with 55% marks (50% for SC, ST, OBC non-creamy layer, differently abled and EWS candidates)</li><li><strong>B.A.LL.B. (Hons.), foreign nationals:</strong> 65% marks in the higher secondary examination</li></ul><p>Other B.A.LL.B. conditions appear in the admission notification for each year.</p>","entrance_exams":"All India Law Entrance Test (AILET, also called AIET in newer notices)","fees_information":"<p><strong>B.A.LL.B. (Hons.), listed on the AILET 2027 admission site:</strong></p><ul><li>Tuition: Rs 1,63,000 per year</li><li>Academic services and facilities: Rs 43,000 per year</li><li>Student welfare fund: Rs 7,000 per year</li><li>Utility services: Rs 20,000 per year</li><li>Halls of residence, for hostel residents: Rs 92,000 per year</li><li>Mess: Rs 50,000 per year</li><li>Admission fee, one time: Rs 10,000</li><li>Refundable estate deposit, one time: Rs 25,000</li></ul>","campus_facilities":"<p>The university works from its campus at Sector 14, Dwarka, which includes separate halls of residence for men and women.</p>","hostel_information":"<p>The campus has separate halls of residence for men and women. Places are limited, and the university says it cannot provide hostel facilities to all newly admitted students. For B.A.LL.B. students, hostel charges are Rs 92,000 and mess charges Rs 50,000 per year.</p>","placement_information":"<p>The university's Career Services page supports B.A.LL.B. students with recruitment.</p>","scholarships":"<p>NLU Delhi publishes a Financial Assistance Policy and a scholarships page on its website. Check them for current eligibility and amounts.</p>","college_image":null,"official_website":"https://nludelhi.ac.in","cta_heading":"Preparing for AILET?","cta_description":"Get help planning your preparation for NLU Delhi's own entrance test.","faq_1_question":"Does NLU Delhi accept CLAT?","faq_1_answer":"<p>No. All candidates other than foreign nationals must appear for the university's own entrance test.</p>","faq_2_question":"How many B.A.LL.B. seats are there?","faq_2_answer":"<p>The seat matrix lists 120: 110 category seats and 10 for foreign national and OCI/PIO candidates.</p>","faq_3_question":"What are the annual B.A.LL.B. fees?","faq_3_answer":"Tuition is Rs 1,63,000 a year. Yearly academic, welfare and utility charges add Rs 70,000, and hostel and mess charges add Rs 1,42,000 for residents.","faq_4_question":"Is hostel accommodation guaranteed?","faq_4_answer":"<p>No. The university says it cannot provide hostel facilities to all newly admitted students.</p>","faq_5_question":"When is the next entrance test?","faq_5_answer":"<p>The admission website lists 2 May 2027, with the detailed notification due in January 2027.</p>","featured_image":{"id":1189,"date":"2026-11-04T07:25:40","date_gmt":"2026-11-04T07:25:40","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nlu-delhi/national-law-university-delhi-campus/"},"modified":"2026-11-04T07:25:40","modified_gmt":"2026-11-04T07:25:40","slug":"national-law-university-delhi-campus","status":"inherit","type":"attachment","link":"https://staging.a3educare
