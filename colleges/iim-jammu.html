    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:09.516Z","entries":{"college:iim-jammu":[{"id":1118,"date":"2026-11-04T06:54:49","date_gmt":"2026-11-04T06:54:49","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iim-jammu/"},"modified":"2026-11-04T06:54:49","modified_gmt":"2026-11-04T06:54:49","slug":"iim-jammu","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/iim-jammu/","title":{"rendered":"Indian Institute of Management Jammu"},"content":{"rendered":"","protected":false},"featured_media":1199,"template":"","class_list":["post-1118","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIM Jammu, based at Jagti, expects an MBA batch of about 300 for 2026-28 and shares its admission process with IIM Bodh Gaya and IIM Sirmaur. Its final placement report for the 2022-24 MBA batch gives an average package of Rs 15.48 lakh.","college_overview":"<p>IIM Jammu's address is Jagti, Jammu 181221, and its 2026-28 admission policy anticipates a batch of about 300 students. Applicants are shortlisted through the Common Admission Process run jointly with IIM Bodh Gaya and IIM Sirmaur, using CAT percentiles.</p><p>Besides the MBA, the institute runs an MBA in Hospital Administration and Healthcare Management, and an Executive MBA with its own fee schedule.</p><p>For the 2022-24 MBA batch of 244, the final report gives an average package of Rs 15.48 lakh and a median of Rs 15 lakh. Its handbook notes that the placement office helps students but does not guarantee a campus placement.</p>","location":"Jagti, Jammu 181221, Jammu and Kashmir, India","city":"Jammu","state":"Jammu and Kashmir","established":"2016","affiliation":"Indian Institute of Management; awards its own degrees","recognition":"<p>IIM Jammu is one of the Indian Institutes of Management.</p>","courses_offered":"<ul><li>MBA</li><li>MBA in Hospital Administration and Healthcare Management</li><li>Executive MBA</li></ul>","admission_process":"<p>For 2026, MBA shortlisting used CAT 2025 percentiles under the Common Admission Process with IIM Bodh Gaya and IIM Sirmaur, followed by the personal interview. Successful candidates pay Rs 50,000 to accept an offer, which is later adjusted against the Term I fee.</p>","eligibility":"<p>Candidates must have a valid CAT score and meet the conditions in the admission policy for that year.</p>","entrance_exams":"CAT","fees_information":"<p><strong>MBA, batch of 2025-27:</strong> first-year tuition of Rs 6,53,550 and a total programme fee of Rs 20,73,960, plus a refundable caution deposit of Rs 20,000. The total includes a category of other charges covering hostel fees, among other items.</p>","campus_facilities":"<p>The institute is based at Jagti, Jammu 181221.</p>","hostel_information":"<p>Hostel fees form part of the 'other academic and non-academic' charges in the MBA fee structure.</p>","placement_information":"<p><strong>MBA, batch of 2022-24 (244 students):</strong> average package of Rs 15.48 lakh, median of Rs 15 lakh and highest of Rs 31.75 lakh.</p><p>The placement office helps second-year students with final placements, without guaranteeing one on campus.</p>","scholarships":"<h4>Need-cum-Merit Scholarship (IIM Jammu MBA Handbook 2024-26)</h4><ul><li><strong>Who:</strong> second-year MBA students who are financially weak and meritorious, with a CGPA of at least 7.00 at the end of the first year and no D or F grade.</li><li><strong>Tuition waiver by gross annual family income (parents, self and spouse):</strong> below Rs 3,00,000 gets 100%; Rs 3,00,001 to Rs 4,00,000 gets 50%; Rs 4,00,001 to Rs 5,00,000 gets 25%; above Rs 5,00,000 gets none.</li><li><strong>Limits:</strong> recipients cannot exceed 10% of the batch strength; students must have no disciplinary case, must not receive other scholarships and must keep meeting the criteria through the second year.</li></ul><h4>Government scholarships</h4><p>IIM Jammu facilitates scholarships from the Ministries of Social Justice and Empowerment, Tribal Affairs and Minority Affairs, which students apply for on the National Scholarship Portal.</p><p>These details are from the 2024-26 batch handbook; check the current handbook for later batches.</p>","college_image":null,"official_website":"https://www.iimj.ac.in","cta_heading":"Targeting IIM Jammu?","cta_description":"Get help with CAT preparation and the Common Admission Process.","faq_1_question":"Which exam do I need for the MBA?","faq_1_answer":"<p>CAT.</p>","faq_2_question":"How much is the MBA?","faq_2_answer":"<p>Rs 20,73,960 in total for the 2025-27 batch, plus a refundable Rs 20,000 deposit.</p>","faq_3_question":"What was the 2022-24 average package?","faq_3_answer":"Rs 15.48 lakh.","faq_4_question":"Which IIMs share its admission process?","faq_4_answer":"<p>IIM Bodh Gaya and IIM Sirmaur, for 2026.</p>","faq_5_question":"How much is the offer acceptance amount?","faq_5_answer":"<p>Rs 50,000, later adjusted against the Term I fee.</p>","featured_image":{"id":1199,"date":"2026-11-04T07:27:10","date_gmt":"2026-11-04T07:27:10","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iim-jammu/indian-institute-of-management-jammu-campus/"},"modified":"2026-11-04T07:27:10","modified_gmt":"2026-11-04T07:27:10","slug":"indian-institute-of-management-jammu-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/iim-jammu/indian-institute-of-management-jammu-campus/#main","title":{"rendered":"Indian Institute of Management Jammu campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1199","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/iim-jammu.jpg'><img fetchpriority=\"high\" decoding=\"async
