    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:25.322Z","entries":{"college:iim-kozhikode":[{"id":1075,"date":"2026-11-04T06:53:08","date_gmt":"2026-11-04T06:53:08","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iim-kozhikode/"},"modified":"2026-11-04T06:53:08","modified_gmt":"2026-11-04T06:53:08","slug":"iim-kozhikode","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/iim-kozhikode/","title":{"rendered":"Indian Institute of Management Kozhikode"},"content":{"rendered":"","protected":false},"featured_media":1168,"template":"","class_list":["post-1075","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIM Kozhikode was set up in 1996 with the Government of India and the Government of Kerala. It runs PGP, PGP-Finance, PGP-LSM and a one-year PGP-BL at its Kozhikode campus, selecting the 2026-28 PGP batch through a three-stage process.","college_overview":"<p>IIM Kozhikode was established in 1996 through a collaboration between the Government of India and the State Government of Kerala. Its address is IIM Kozhikode Campus P.O., Kozhikode.</p><p>Its two-year programmes are the flagship PGP, PGP-Finance and PGP-LSM, each with its own 2026-28 admission policy, and it also runs a one-year PGP in Business Leadership. The institute says its PGP has consistently appeared among the top 70 in the Financial Times Masters in Management rankings.</p><p>PGP selection for 2026-28 begins with minimum eligibility, then builds an index with CAT 2025 at 50% for shortlisting to a written test and interview.</p>","location":"IIM Kozhikode Campus P.O., Kozhikode 673570, Kerala, India","city":"Kozhikode","state":"Kerala","established":"1996","affiliation":"Institute under the Indian Institutes of Management Act, 2017; awards its own degrees","recognition":"<p>The institute states that its flagship PGP has consistently featured among the Top 70 programmes in the Financial Times Masters in Management rankings.</p>","courses_offered":"<ul><li><strong>Two-year MBA programmes:</strong> PGP, PGP-Finance and PGP-LSM</li><li><strong>PGP-BL:</strong> one-year Post Graduate Programme in Business Leadership</li><li><strong>Executive and doctoral programmes</strong>, announced on the institute's admissions pages</li></ul>","admission_process":"<p>The PGP 2026-28 uses three stages:</p><ol><li><strong>Stage 1:</strong> registration by candidates meeting minimum eligibility.</li><li><strong>Stage 2:</strong> shortlisting for a Written Ability Test and Personal Interview, using an aggregate index with CAT 2025 at 50%.</li><li><strong>Stage 3:</strong> final selection after the WAT and interview.</li></ol>","eligibility":"<p>Candidates must meet the minimum percentile and percentage criteria in the institute's PGP admission policy for their category and year.</p>","entrance_exams":"CAT for the PGP programmes","fees_information":"<p><strong>2026-28:</strong> international candidates pay USD 30,000 in total for the PGP, PGP-Finance or PGP-LSM (USD 15,000 a year). The institute publishes the fee structure for Indian candidates on its PGP fee pages.</p><p><strong>PGP-BL:</strong> programme fee listed at Rs 22.5 lakh.</p>","campus_facilities":"<p>The institute's campus has its own post office, IIM Kozhikode Campus P.O., at PIN 673570.</p>","hostel_information":"<h4>Hostels at IIM Kozhikode</h4><ul><li><strong>Capacity:</strong> 20 hostels that accommodate about 1,400 students, per the institute's Hostels page.</li><li><strong>Rooms:</strong> single or sharing basis; every room has LAN and Wi-Fi.</li><li><strong>Amenities:</strong> washing machines, water dispensers and geysers in all hostels; most hostels are air-conditioned.</li><li><strong>Recreation in the hostel premises:</strong> table tennis room, badminton court, two basketball courts, football field, volleyball court and a gymnasium, plus common rooms and a music room.</li><li><strong>Food:</strong> three canteens, which also serve at night, along with restaurants and kiosks on campus.</li></ul><p>Classrooms, the computer centre and the students' canteen are within walking distance of the hostels.</p>","placement_information":"<p><strong>PGP-BL, Class of 2024:</strong> average CTC of Rs 27.11 lakh and median of Rs 24.96 lakh. The institute publishes final placement reports for the PGP by year on its placements page.</p>","scholarships":"<p>The scholarships below are listed by IIM Kozhikode for PGP, PGP-FIN and PGP-LSM students.</p><h4>Offered by the institute</h4><ul><li><strong>IIMK Merit Scholarship:</strong> for first and second-year students on the basis of one year's CGPA, at one scholarship for every 20 students.</li><li><strong>IIMK Need Based Financial Assistance (NBFA):</strong> gross annual family income of Rs 8 lakh or less in the last financial year, and an education loan from a scheduled commercial bank to fund studies at the institute. A Financial Aid Committee ranks applicants by financial score and fixes the amount. Students holding more than one award must refund all but one.</li></ul><h4>Central Government schemes</h4><ul><li>Top Class Education Scheme for SC students: parental income up to Rs 8 lakh; up to 10 awards allotted to IIM Kozhikode.</li><li>National Fellowship and Scholarship for ST students: income up to Rs 6 lakh, with no institute-wise slot ceiling.</li><li>Merit Cum Means Scholarship for minority-community students: at least 50% in the previous exam and income up to Rs 2.5 lakh.</li><li>Top Class Education for students with disabilities (40% or more): family income up to Rs 8 lakh.</li><li>PM's Scholarship Scheme for wards of CAPF, Assam Rifles and state police personnel: at least 60% in the qualifying exam.</li></ul><h4>State Government schemes</h4><ul><li>Rajarshee Shahu Maharaj Merit Scholarship (Maharashtra, Maratha community): family income up to Rs 8 lakh.</li><li>Government of Tamil Nadu scholarship for BC, MBC and DNC students: income up to Rs 2 lakh.</li></ul><h4>Private scholarships</h4><ul><li>IDFC First Bank MBA Scholarship: first-year students, parental income up to Rs 6 lakh; Rs 1 lakh a year.</li><li>Mirae Asset Foundation: first and second-year PGP students with family income below Rs 8 lakh; Rs 5,00,000, after an interview.</li><li>Aditya Birla Group Scholarship: top 20 first-year students, by test and interview; Rs 1,75,000 a year, renewable in year two for the top 25 by CGPA.</li><li>OP Jindal Engineering &amp; Management Scholarship: top 10 students of the first and second year; Rs 1,50,000 a year.</li></ul>","college_image":null,"official_website":"https://www.iimk.ac.in","cta_heading":"Aiming for IIM Kozhikode?","cta_description":"Get help with CAT planning and preparing for the WAT and interview.","faq_1_question":"How does IIM Kozhikode select PGP students?","faq_1_answer":"<p>Through three stages: eligibility registration, shortlisting using an index with CAT at 50%, and a written test and interview.</p>","faq_2_question":"What MBA programmes are offered?","faq_2_answer":"<p>PGP, PGP-Finance, PGP-LSM and the one-year PGP-BL.</p>","faq_3_question":"When was the institute established?","faq_3_answer":"In 1996, with the Government of India and the State Government of Kerala.","faq_4_question":"What do international candidates pay?","faq_4_answer":"<p>USD 30,000 in total for the 2026-28 programmes, split over two years.</p>","faq_5_question":"What is the PGP-BL fee?","faq_5_answer":"<p>The institute lists Rs 22.5 lakh.</p>","featured_image":{"id":1168,"date":"2026-11-04T07:23:32","date_gmt":"2026-11-04T07:23:32","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iim-kozhikode/indian-institute-of-management-kozhikode-campus/"},"modified":"2026-11-04T07:23:32","modified_gmt":"2026-11-04T07:23:32","slug":"indian-institute-of-management-kozhikode-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleg
