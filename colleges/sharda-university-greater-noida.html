    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:32.238Z","entries":{"college:sharda-university-greater-noida":[{"id":250,"date":"2026-09-30T08:12:03","date_gmt":"2026-09-30T08:12:03","guid":{"rendered":"https://staging.a3educarehub.in/colleges/sharda-university/"},"modified":"2026-11-03T10:36:23","modified_gmt":"2026-11-03T10:36:23","slug":"sharda-university-greater-noida","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/sharda-university-greater-noida/","title":{"rendered":"Sharda University"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-250","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"Sharda University, Greater Noida, is a private state university established in 2009 by an Act of the Uttar Pradesh Legislature. It has a 63-acre campus, 19,200+ students and schools spanning engineering, medicine, dental sciences, nursing, pharmacy, law, business, design and agriculture.","college_overview":"<p>Sharda University, the flagship institution of the Sharda Group, was established in 2009 as a privately funded state university under Uttar Pradesh Act 14 of 2009. It is registered with the UGC under Section 2(f) and empowered to award degrees under Section 22 of the UGC Act, 1956. The university states that it holds an A+ accreditation from NAAC.</p><p>Its 63-acre campus has 19,200+ students from 95+ countries, and its schools include computing science and engineering, business studies, law, design, humanities and social sciences, dental sciences, allied health sciences, nursing, pharmacy and agricultural sciences. Students can live on campus in AC, non-AC or apartment-style residences.</p>","location":"Greater Noida, Uttar Pradesh","city":"Greater Noida","state":"Uttar Pradesh","established":"2009","affiliation":"Private state university under Uttar Pradesh Act 14 of 2009; UGC Section 2(f) and Section 22","recognition":"<ul><li><strong>UGC:</strong> registered under Section 2(f) and empowered to award degrees under Section 22 of the UGC Act, 1956</li><li><strong>Status:</strong> a privately funded state university established through Uttar Pradesh Act 14 of 2009, and not a deemed university, as the university states</li><li><strong>NAAC:</strong> the university states that it holds an A+ accreditation</li><li>Member of the Association of Commonwealth Universities</li></ul><p>Programme-specific approvals by statutory bodies are listed on the Government Affiliations page.</p>","courses_offered":"<p>Programmes are offered through these schools, each with its own page on the official website:</p><ul><li>Sharda School of Computing Science and Engineering</li><li>Sharda School of Business Studies</li><li>Sharda School of Law</li><li>Sharda School of Design</li><li>Sharda School of Humanities and Social Sciences</li><li>School of Dental Sciences</li><li>Sharda School of Allied Health Sciences</li><li>Sharda School of Nursing Science and Research</li><li>School of Pharmacy</li><li>Sharda School of Agricultural Sciences</li></ul>","admission_process":"<p>Merit scholarships are linked to performance in the Sharda University Admission Test (SUAT), a personal interview and merit in the qualifying examination, so applicants normally take SUAT and an interview. Programme-wise admission steps and dates are on the official admissions page.</p>","eligibility":"<p>Eligibility is programme-specific. Candidates should review the latest official programme page or admission notification for the applicable academic qualification, subject and entrance requirements.</p>","entrance_exams":"SUAT (Sharda University Admission Test) and personal interview; JEE Main percentile is used for some scholarships","fees_information":"<h4>Hostel fees (annual, as published by the university)</h4><p>Sarojini Girls Hostel:</p><ul><li><strong>Air-conditioned:</strong> 3-seater Rs 1,80,000; 2-seater with attached toilet Rs 2,10,000; 2-seater without attached toilet Rs 2,00,000; single Rs 2,10,000</li><li><strong>Non-air-conditioned:</strong> 3-seater Rs 1,25,000; 2-seater with attached toilet Rs 1,45,000; 2-seater without attached toilet Rs 1,35,000; single Rs 1,40,000</li></ul><p>Tuition fees for each programme are on the official fee pages.</p>","campus_facilities":"<p>The campus covers 63 acres and has 19,200+ students from 95+ countries, 29 states and union territories. The university lists 1,047+ faculty members, laboratories and live projects, and 350+ functional MoUs for semester exchange and free-tuition study-abroad programmes.</p>","hostel_information":"<p>The university offers on-campus residences with AC, non-AC and apartment options. For first-year students, the Hostel Manual 2026 lists Vivekananda and Vardhman hostels for boys and Sarojini and Mandela Girls Hostel for girls, with 3-seater, 2-seater and single rooms. Hostel fees apply per person per year, from 1 August to 31 May; the published rates are listed under Fees.</p>","placement_information":"<p>The university's placement policy covers engineering, management and other programmes. Campus recruitment is for final-year students only, and the policy aims to give the maximum number of students on-campus placement while maintaining the quality of jobs offered. The admissions page states up to 100% placement assistance; year-wise placement statistics were not found on the pages checked.</p>","scholarships":"<ul><li><strong>Merit scholarships:</strong> full to partial tuition-fee waivers based on SUAT, the personal interview and merit in the qualifying examination</li><li><strong>JEE Girls Scholarship:</strong> 100% of first-year tuition for girls above the 90th percentile in JEE Main 2026</li><li><strong>Scholarship for Toppers:</strong> 100% tuition-fee waiver for the first year for top rankers of recognised school boards and institutions</li><li>Scholarships for sports and cultural achievement; all scholarships other than academic ones are for first-year students only</li></ul>","college_image":null,"official_website":"https://www.sharda.ac.in/","cta_heading":"Need Help Choosing the Right College?","cta_description":"Explore courses, admission information and college options with A3 Educare Hub & Research Academy.","faq_1_question":"What courses are offered at Sharda University?","faq_1_answer":"Course availability varies by academic session. Check the official website for the current programme list.","faq_2_question":"How can I apply to Sharda University?","faq_2_answer":"Follow the latest admission instructions published on the institution's official website.","faq_3_question":"What is the fee structure?","faq_3_answer":"Fees depend on the programme and academic session. Verify the current official fee structure before applying.","faq_4_question":"Is hostel accommodation available?","faq_4_answer":"Hostel availability and terms vary. Check the latest official hostel information.","faq_5_question":"Where can I verify the latest admission information?","faq_5_answer":"Use the official website listed on this page and refer to the latest admission notification.","featured_image":{"id":846,"date":"2026-11-03T05:17:43","date_gmt":"2026-11-03T05:17:43","guid":{"rendered":"https://staging.a3educarehub.in/colleges/sharda-university/sharda-university-featured-image/"},"modified":"2026-11-03T05:17:43","modified_gmt":"2026-11-03T05:17:43","slug":"sharda-university-featured-image","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/sharda-university-greater-noida/sharda-university-featured-image/#main","title":{"rendered":"Sharda University &#8211; Featured Image"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-846","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://stag
