    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:40.527Z","entries":{"college:igmcri-puducherry":[{"id":1044,"date":"2026-11-04T06:29:17","date_gmt":"2026-11-04T06:29:17","guid":{"rendered":"https://staging.a3educarehub.in/colleges/igmcri-puducherry/"},"modified":"2026-11-04T06:29:17","modified_gmt":"2026-11-04T06:29:17","slug":"igmcri-puducherry","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/igmcri-puducherry/","title":{"rendered":"Indira Gandhi Medical College and Research Institute"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1044","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"Indira Gandhi Medical College and Research Institute is the only government college among Puducherry's MBBS colleges in the National Medical Commission's 2026-27 matrix, with 180 seats. Admission runs through NEET and the union territory's CENTAC, and tuition was nil in the 2020-21 brochure.","college_overview":"<p>IGMC&amp;RI is a Government of Puducherry medical college at Kathirkamam. The National Medical Commission lists it with 180 MBBS seats for 2026-27, the only government seats among the eight MBBS colleges it lists for the union territory.</p><p>Its seats are filled through the Centralised Admission Committee (CENTAC), which publishes seat matrices and fee documents each year.</p><p>Cost is the main difference from Puducherry's private colleges. The 2020-21 CENTAC brochure listed nil tuition for Puducherry and All India Quota candidates, with a refundable Rs 50,000 caution deposit and modest hostel rents.</p>","location":"Kathirkamam, Puducherry, India","city":"Puducherry","state":"Puducherry","established":"","affiliation":"Government of Puducherry medical college","recognition":"<p>The National Medical Commission lists it as a government college (code PY/002/G/1) with 180 MBBS seats for 2026-27.</p>","courses_offered":"<ul><li><strong>MBBS:</strong> 180 seats (NMC 2026-27)</li><li><strong>Postgraduate medical courses:</strong> allotted through CENTAC, which lists the college in its PG notices</li></ul>","admission_process":"<p>MBBS seats are filled using NEET UG scores through CENTAC counselling, along with an all-India quota. CENTAC publishes the seat matrix, brochure and fee structure for each year on its website.</p>","eligibility":"<p>Candidates must qualify in NEET UG and meet the CENTAC conditions for that year, including Puducherry residence rules for union territory seats.</p>","entrance_exams":"NEET UG for MBBS","fees_information":"<p><strong>CENTAC brochure 2020-21 (most recent read):</strong> nil tuition for Puducherry and All India Quota candidates, with a refundable caution deposit of Rs 50,000 and a yearly academic fee. CENTAC has also published a 2025 fee structure for the college.</p>","campus_facilities":"<h4>Hospital block</h4><ul><li>A hospital building with 750 beds in the initial phase, on five storeys with 5.09 lakh sq ft of built-up area.</li><li>15 operation theatres with ICUs in the initial phase.</li></ul><h4>Out-patient services</h4><ul><li>Routine care is free of charge for patients from in and around Puducherry, across the clinical departments.</li><li><strong>OPD registration:</strong> 8:00 AM to 12:00 PM, Monday to Saturday; 8:00 AM to 11:00 AM on Sundays and public holidays; at the casualty from 12 noon to 8:00 AM.</li></ul><p>These details are from the institute's Hospital Services page, which also describes planned expansion that is not yet in place. Library and student facilities are not described on the institute's website.</p>","hostel_information":"<p><strong>Hostel rent, CENTAC brochure 2020-21:</strong> Rs 30,000 a year for a single room with attached bathroom, Rs 12,500 per head in a double room, plus Rs 10,000 in utility charges.</p>","placement_information":"","scholarships":"<h4>Puducherry government scholarships for first-year students (2026-27)</h4><p>An IGMCRI circular of 3 November 2026 covers first-year MBBS, B.Sc Nursing and Allied Health Science students admitted in 2026-27:</p><ul><li><strong>AD Welfare Department scholarship:</strong> for Puducherry native students from the Scheduled Castes and Scheduled Tribes.</li><li><strong>Fisheries Department scholarship:</strong> for students admitted under the Puducherry EBC (Economically Backward Classes) quota.</li><li><strong>How to apply:</strong> submit the filled-in application with supporting documents to the Academic Section; the deadline in the circular was 16 November 2026.</li></ul><p>Amounts are set by the respective government departments and are not given in the circular.</p>","college_image":null,"official_website":"https://igmcri.edu.in","cta_heading":"Hoping for a government MBBS seat in Puducherry?","cta_description":"Get help with NEET UG planning and CENTAC counselling.","faq_1_question":"How many MBBS seats are there?","faq_1_answer":"<p>The National Medical Commission lists 180 for 2026-27.</p>","faq_2_question":"Who conducts counselling?","faq_2_answer":"<p>The Centralised Admission Committee (CENTAC) of the Government of Puducherry, using NEET UG scores.</p>","faq_3_question":"Is tuition charged?","faq_3_answer":"The 2020-21 CENTAC brochure listed nil tuition for Puducherry and All India Quota candidates. Check CENTAC's current fee document.","faq_4_question":"Is it a government college?","faq_4_answer":"<p>Yes. The National Medical Commission lists it as a government college.</p>","faq_5_question":"What did the hostel cost in 2020-21?","faq_5_answer":"<p>Rs 30,000 a year for a single room with attached bathroom, or Rs 12,500 per head in a double room, plus utilities.</p>","featured_image":{"id":1449,"date":"2026-11-14T12:45:59","date_gmt":"2026-11-14T12:45:59","guid":{"rendered":"https://staging.a3educarehub.in/colleges/igmcri-puducherry/indira-gandhi-medical-college-and-research-institute-featured-image/"},"modified":
