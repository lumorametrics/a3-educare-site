    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:10.582Z","entries":{"college:goa-institute-of-management":[{"id":1113,"date":"2026-11-04T06:54:43","date_gmt":"2026-11-04T06:54:43","guid":{"rendered":"https://staging.a3educarehub.in/colleges/goa-institute-of-management/"},"modified":"2026-11-04T06:54:43","modified_gmt":"2026-11-04T06:54:43","slug":"goa-institute-of-management","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/goa-institute-of-management/","title":{"rendered":"Goa Institute of Management"},"content":{"rendered":"","protected":false},"featured_media":1195,"template":"","class_list":["post-1113","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Goa Institute of Management runs its PGDM programmes from Poriem in Sattari. The 2027-29 full-time academic fee is Rs 22,00,000, with full tuition waivers for a capped share of students whose family income is below Rs 8 lakh.","college_overview":"<p>Goa Institute of Management's full-time programmes are the flagship PGDM and its Healthcare Management, Big Data Analytics, and Banking, Insurance and Financial Services (BIFS) tracks. Its campus address is Poriem, Sattari.</p><p>For the BIFS track, the admission page accepts CAT, XAT or GMAT scores, followed by a written ability test and personal interview for shortlisted candidates.</p><p>The institute's published placement report for the 2023-25 flagship PGDM batch gives a highest package of Rs 32.2 lakh, and an average of Rs 18.49 lakh for the top 100 offers.</p>","location":"Poriem, Sattari, Goa 403505, India","city":"Sanquelim","state":"Goa","established":"1993","affiliation":"Autonomous institute; PGDM approved by AICTE and recognised by AIU as equivalent to an MBA","recognition":"<ul><li><strong>AICTE:</strong> approves the Post Graduate Diploma in Management (PGDM) programme</li><li><strong>AIU:</strong> recognises the PGDM as equivalent to an MBA degree; the institute states this recognition runs until 2029</li><li><strong>AACSB:</strong> accredited in 2025 for a six-year term</li><li><strong>AMBA and BGA:</strong> first accredited in 2022 and reaccredited in 2025 for a further five years</li><li><strong>SAQS:</strong> accredited in 2018 and reaccredited in 2024 for a six-year term</li><li><strong>NBA:</strong> the institute states that all eligible programmes are NBA accredited</li><li><strong>NIRF 2025:</strong> ranked 43rd in the Management category</li></ul><p>GIM is also a member of EFMD, PRME (since 2011) and GBSN (since 2019), according to its accreditations page.</p>","courses_offered":"<ul><li>PGDM</li><li>PGDM in Healthcare Management (HCM)</li><li>PGDM in Big Data Analytics (BDA)</li><li>PGDM in Banking, Insurance and Financial Services (BIFS)</li><li>Fellow Programme in Management (FPM)</li><li>Hybrid PGDM</li></ul>","admission_process":"<p>Applicants apply through the institute's admission portal. For BIFS, the page accepts CAT, XAT or GMAT scores within stated dates, followed by a written ability test and personal interview. Fees start after the acceptance letter.</p>","eligibility":"<p>Candidates need a valid score and must meet the conditions on the admission portal for that batch. The BIFS scholarship additionally needs a completed professional qualification such as CA or CFA.</p>","entrance_exams":"CAT, XAT or GMAT","fees_information":"<p><strong>Full-time PGDM, HCM, BDA and BIFS, batch of 2027-29:</strong> Rs 22,00,000 academic fee, paid in four instalments. The tuition component is Rs 14,16,000.</p><p>A refundable caution deposit of Rs 25,000 applies, with Rs 5,000 of it credited to alumni membership at graduation.</p>","campus_facilities":"<p>The campus is at Poriem, Sattari, in Goa.</p>","hostel_information":"<p>Students are allotted double rooms in the first year and single rooms in the second.</p>","placement_information":"<p><strong>2023-25 batch, institute reports:</strong></p><ul><li>Flagship PGDM: highest package of Rs 32.2 lakh; top 100 offers averaged Rs 18.49 lakh</li><li>BIFS: highest package of Rs 27.3 lakh; average of Rs 14.5 lakh</li></ul>","scholarships":"<ul><li><strong>ACCESS:</strong> Rs 5,00,000 each; 45 for PGDM, 21 for BDA and 7 for BIFS</li><li><strong>GIM-MBBS:</strong> 7 awards of Rs 5,00,000 for MBBS graduates in HCM</li><li><strong>Entrance topper:</strong> Rs 5,00,000 for CAT or XAT at the 95th percentile or above</li><li><strong>Tuition waiver:</strong> family income below Rs 8 lakh, capped at 5% of admitted students</li></ul>","college_image":null,"official_website":"https://www.gim.ac.in","cta_heading":"Planning a PGDM at GIM?","cta_description":"Get help with your entrance test, application and interview.","faq_1_question":"How much is the full-time PGDM?","faq_1_answer":"<p>Rs 22,00,000 in academic fees for the batch of 2027-29.</p>","faq_2_question":"Which tests are accepted?","faq_2_answer":"<p>The BIFS page accepts CAT, XAT or GMAT. Check the portal for your track.</p>","faq_3_question":"What was the highest flagship package in 2023-25?","faq_3_answer":"Rs 32.2 lakh, according to the institute's report.","faq_4_question":"Is there help with fees?","faq_4_answer":"<p>Yes. It offers Rs 5,00,000 scholarships and income-based tuition waivers.</p>","faq_5_question":"Do students share rooms?","faq_5_answer":"<p>In the first year, rooms are double. In the second, they are single.</p>","featured_image":{"id":1195,"date":"2026-11-04T07:26:53","date_gmt":"2026-11-04T07:26:53","guid":{"rendered":"https://staging.a3educarehub.in/colleges/goa-institute-of-management/goa-institute-of-management-campus/"},"modified":"2026-11-04T07:26:53","modified_gmt":"2026-11-04T07:26:53","slug":"goa-institute-of-management-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/goa-institute-of-management/goa-institute-of-management-campus/#main","title":{"rendered":"Goa Institute of Mana
