    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:53.939Z","entries":{"college:aiims-guwahati":[{"id":1096,"date":"2026-11-04T06:53:59","date_gmt":"2026-11-04T06:53:59","guid":{"rendered":"https://staging.a3educarehub.in/colleges/aiims-guwahati/"},"modified":"2026-11-04T06:53:59","modified_gmt":"2026-11-04T06:53:59","slug":"aiims-guwahati","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/aiims-guwahati/","title":{"rendered":"All India Institute of Medical Sciences, Guwahati"},"content":{"rendered":"","protected":false},"featured_media":1185,"template":"","class_list":["post-1096","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"AIIMS Guwahati began its first academic session on 12 January 2021 with 50 MBBS students at Changsari, and its intake has since risen to 100. The institute also runs MD, MS and Ph.D. programmes, with separate hostels for men and women on campus.","college_overview":"<p>The institute's first academic session opened on 12 January 2021 with 50 MBBS students, and its student booklet now gives an intake of 100. It is at Silbharal, Changsari, near Changsari Railway Station.</p><p>The MBBS course runs for four years and six months, followed by a compulsory one-year internship. The institute also admits postgraduate and Ph.D. students under its own prospectuses.</p><p>Students live in separate hostels for men and women, supervised by seven wardens with security and housekeeping staff on duty round the clock.</p>","location":"Silbharal, Changsari, Guwahati 781101, Assam, India","city":"Guwahati","state":"Assam","established":"2021 (first academic session, 12 January)","affiliation":"All India Institute of Medical Sciences under the Ministry of Health and Family Welfare","recognition":"<p>AIIMS Guwahati is one of the All India Institutes of Medical Sciences.</p>","courses_offered":"<ul><li><strong>MBBS:</strong> intake of 100; four years and six months plus one year of internship</li><li><strong>Postgraduate:</strong> MD and MS</li><li><strong>Doctoral:</strong> Ph.D.</li><li><strong>Post-doctoral fellowships</strong></li></ul>","admission_process":"<p>MBBS candidates are selected through NEET UG and counselling, then follow the institute's admission instructions. Postgraduate and Ph.D. admissions follow separate prospectuses, listed on the admissions page.</p>","eligibility":"<p>MBBS candidates must qualify in NEET UG and meet the counselling conditions for that year.</p>","entrance_exams":"NEET UG for MBBS","fees_information":"<p><strong>MD and MS, January 2024 prospectus:</strong> a total of Rs 2,927 payable at admission, excluding caution money. The prospectus also lists a refundable hostel security deposit of Rs 1,000.</p>","campus_facilities":"<p>The institute is at Silbharal, Changsari, with its nearest railway station at Changsari. Its hospital runs enquiries and appointments on 0361-2912011.</p>","hostel_information":"<p>Separate hostels for men and women are on campus, supervised by seven wardens, with security and housekeeping on duty round the clock. Rooms have power backup, washroom geysers and RO water coolers on each floor.</p>","placement_information":"","scholarships":"<p><strong>National Scholarship for Higher Education of ST Students:</strong> AIIMS Guwahati appears, for all full-time courses, on the Ministry of Tribal Affairs list of 265 eligible institutes for 2023-24 onwards. The institute's scholarship page posts the National Scholarship Portal opening letter for 2026-27.</p><p>The scheme guidelines posted by the institute set these terms:</p><ul><li><strong>Family income:</strong> not above Rs 6 lakh a year</li><li><strong>Fees:</strong> full admission fee, tuition fee and other non-refundable charges at government institutes</li><li><strong>Books and stationery:</strong> Rs 5,000 a year</li><li><strong>Stipend:</strong> Rs 3,000 a month</li><li><strong>Computer and accessories:</strong> Rs 45,000, once during the course</li></ul><p><strong>Ph.D., July 2026 advertisement:</strong> seats are offered under Category A, with a fellowship in a funded project, and Category C, for candidates with their own fellowship from agencies such as CSIR, UGC, ICMR, DBT or INSPIRE.</p>","college_image":null,"official_website":"https://aiimsguwahati.ac.in","cta_heading":"Considering AIIMS Guwahati?","cta_description":"Get help planning your NEET UG preparation and counselling choices.","faq_1_question":"How many MBBS seats are there?","faq_1_answer":"<p>The student booklet gives a current intake of 100.</p>","faq_2_question":"When did teaching begin?","faq_2_answer":"<p>On 12 January 2021, with 50 MBBS students.</p>","faq_3_question":"How long is the MBBS course?","faq_3_answer":"Four years and six months, plus one year of compulsory internship.","faq_4_question":"Are there hostels?","faq_4_answer":"<p>Yes. Separate hostels for men and women are on campus.</p>","faq_5_question":"Where is AIIMS Guwahati?","faq_5_answer":"<p>At Silbharal, Changsari, Guwahati 781101.</p>","featured_image":{"id":1185,"date":"2026-11-04T07:25:25","date_gmt":"2026-11-04T07:25:25","guid":{"rendered":"https://staging.a3educarehub.in/colleges/aiims-guwahati/all-india-institute-of-medical-sciences-guwahati-campus/"},"modified":"2026-11-04T07:25:25","modified_gmt":"2026-11-04T07:25:25","slug":"all-india-institute-of-medical-sciences-guwahati-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/aiims-guwahati/all-india-institute-of-medical-sciences-guwahati-campus/#main","title":{"rendered":"All India Institute of Medical Sciences, Guwahati campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1185","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://sta
