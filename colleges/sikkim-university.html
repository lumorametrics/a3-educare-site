    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:27.232Z","entries":{"college:sikkim-university":[{"id":1127,"date":"2026-11-04T06:55:00","date_gmt":"2026-11-04T06:55:00","guid":{"rendered":"https://staging.a3educarehub.in/colleges/sikkim-university/"},"modified":"2026-11-04T06:55:00","modified_gmt":"2026-11-04T06:55:00","slug":"sikkim-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/sikkim-university/","title":{"rendered":"Sikkim University"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1127","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"Sikkim University, a central university created by an Act of Parliament in 2007, works from Gangtok while building a 300-acre permanent campus at Yangang, 56 km away. It lists 13 hostels across its sites, with tuition set semester by semester for each programme.","college_overview":"<p>Parliament established Sikkim University in 2007. Teaching takes place at Gangtok and at Yangang, where the permanent campus is rising on 300 acres in Namchi district, 56 km from Gangtok. The foundation stone was laid on 16 April 2013 and construction began in November 2016.</p><p>Its 2026-27 prospectus covers undergraduate and postgraduate programmes across its departments, with intake and eligibility given for each. Its departments include Anthropology, Bhutia, Botany, Chemistry and Commerce.</p><p>Thirteen hostels serve students across Gangtok and Yangang, with admission for one semester at a time, renewable under the hostel rules.</p>","location":"Gangtok, with permanent campus at Yangang, Sikkim, India","city":"Gangtok","state":"Sikkim","established":"2007","affiliation":"Central University established by an Act of Parliament","recognition":"<p>Sikkim University is accredited by NAAC, and its prospectus says the second accreditation cycle is under way.</p>","courses_offered":"<ul><li><strong>Postgraduate:</strong> MA, M.Sc., M.Com., MCA, MBA and LLM in the listed departments</li><li><strong>Undergraduate:</strong> four-year undergraduate programmes in selected departments</li><li><strong>Doctoral:</strong> Ph.D., under a separate prospectus</li></ul>","admission_process":"<p>Applicants follow the registration and counselling procedure in the UG-PG prospectus for the year. The university publishes spot admission and hostel merit lists on its admission page.</p>","eligibility":"<p>Appendix A of the prospectus gives eligibility and intake for each programme.</p>","entrance_exams":"As listed in the UG-PG prospectus for each programme","fees_information":"<p><strong>Tuition per semester, 2026-27 prospectus:</strong> Rs 756 or Rs 1,260 for most programmes, depending on the programme, and Rs 6,840 for professional programmes such as MCA.</p><p><strong>International students:</strong> one-time admission fee of Rs 10,028, Rs 14,816 or Rs 25,976, depending on the programme.</p>","campus_facilities":"<p>The permanent campus covers 300 acres at Yangang in Namchi district, 56 km from Gangtok.</p>","hostel_information":"<p>There are 13 hostels for men and women across Gangtok and Yangang.</p><p><strong>At hostel admission, 2026-27 prospectus:</strong> Rs 4,780 for one or two-bedded rooms, Rs 4,393 for three-bedded and Rs 4,262 for four or more, each including a refundable Rs 3,000 deposit.</p>","placement_information":"","scholarships":"<h4>Sikkim University Merit-cum-Means Scholarship</h4><ul><li>Awarded on the recommendation of the Awards Committee, as a monthly fellowship, a full free-ship or a half-ship.</li><li>For 2025-26, awards ran from 1 August 2025 (PG first semester) and 2 September 2025 (UG first semester) until 15 June 2026 or the end of the semester.</li><li><strong>How to claim:</strong> awarded students submit the prescribed claim form, PFMS form no. 3 and the even-semester fee payment slip to the Dean of Students' Welfare through their head of department.</li></ul><h4>Fellowships</h4><p>The university issues UGC Non-NET fellowship notifications, including one for the 2026 admission batch.</p>","college_image":null,"official_website":"https://cus.ac.in","cta_heading":"Applying to Sikkim University?","cta_description":"Get help with the prospectus and choosing a programme.","faq_1_question":"When was it established?","faq_1_answer":"<p>In 2007, by an Act of Parliament.</p>","faq_2_question":"Where is the permanent campus?","faq_2_answer":"<p>At Yangang in Namchi district, 56 km from Gangtok.</p>","faq_3_question":"How many hostels are there?","faq_3_answer":"13, across Gangtok and Yangang.","faq_4_question":"How much is a hostel place at admission?","faq_4_answer":"<p>Between Rs 4,262 and Rs 4,780, including a refundable Rs 3,000 deposit.</p>","faq_5_question":"Is it NAAC accredited?","faq_5_answer":"<p>Yes, and its prospectus says the second cycle is under way.</p>","featured_image":{"id":1462,"date":"2026-11-14T12:47:40","date_gmt":"2026-11-14T12:47:40","guid":{"rendered":"https://staging.a3educarehub.in/colleges/sikkim-university/sikkim-university-featured-image/"},"modified":"2026-11-14T12:47:40","modified_gmt":"2026-11-14T12:47:40","slug":"sikkim-university-featured-image","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/sikkim-university/sikkim-university-featured-image/#main","title":{"rendered":"Sikkim University – Featured Image"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1462","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/sikkim-university-1127-representative.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"200\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/sikkim-un
