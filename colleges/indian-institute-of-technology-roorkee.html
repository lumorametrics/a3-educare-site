    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:22.932Z","entries":{"college:indian-institute-of-technology-roorkee":[{"id":1413,"date":"2026-11-14T07:39:48","date_gmt":"2026-11-14T07:39:48","guid":{"rendered":"https://staging.a3educarehub.in/?post_type=colleges&#038;p=1413"},"modified":"2026-11-14T07:39:48","modified_gmt":"2026-11-14T07:39:48","slug":"indian-institute-of-technology-roorkee","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/indian-institute-of-technology-roorkee/","title":{"rendered":"Indian Institute of Technology Roorkee"},"content":{"rendered":"","protected":false},"featured_media":1409,"template":"","class_list":["post-1413","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIT Roorkee is an Institution of National Importance at Roorkee, Uttarakhand. It offers Bachelor's degrees in 10 disciplines of engineering and architecture and postgraduate degrees in 55 disciplines.","college_overview":"<p>Indian Institute of Technology Roorkee describes itself as among the foremost institutes of national importance in higher technological education and in engineering, basic and applied research. The Institute celebrated its sesquicentennial in October 1996 and has now completed more than 175 years. It was converted to an IIT on 21 September 2001 by an Ordinance of the Government of India, as the nation's seventh Indian Institute of Technology.</p><p>It offers Bachelor's degree courses in 10 disciplines of engineering and architecture and postgraduate degrees in 55 disciplines of engineering, applied science, architecture and planning. Doctoral work is possible in all departments and research centres.</p>","location":"Roorkee, Uttarakhand","city":"Roorkee","state":"Uttarakhand","established":"1847","affiliation":"Indian Institute of Technology; Institution of National Importance (converted 21 September 2001)","recognition":"<ul><li><strong>Institution of National Importance:</strong> converted to an Indian Institute of Technology on 21 September 2001 by an Ordinance of the Government of India, as stated on the Institute's About page</li></ul>","courses_offered":"<h4>Undergraduate</h4><ul><li>B.Tech., B.Arch., B.Des., BS-MS and Integrated M.Tech. (listed in the 2026-27 fee structure); Bachelor's courses are offered in 10 disciplines of engineering and architecture</li></ul><h4>Postgraduate</h4><ul><li>M.Tech., M.Arch. and M.U.R.P.; M.Tech. (VLSI) for industry professionals; M.Des. (Industrial Design); M.Sc.; M.B.A.; Executive MBA</li></ul><h4>Doctoral</h4><ul><li>Ph.D. in all departments and research centres</li></ul><p>Programme lists change by session. Confirm them on the official Academic Programmes page.</p>","admission_process":"<ul><li><strong>B.Tech. and B.Arch.:</strong> admission is through the Joint Entrance Examination (JEE), conducted at centres all over India. The 2026 UG admission page also lists B.Des. admission information and preparatory-course lists.</li><li><strong>Postgraduate:</strong> M.Tech./M.Arch./M.U.R.P., M.Sc., M.B.A., M.Des. and the other programmes each have their own admission page, with a tentative schedule for PG admissions 2026.</li></ul><p>Eligibility is not stated on the pages checked. See the official admission pages.</p>","eligibility":"","entrance_exams":"JEE for B.Tech. and B.Arch.; see the official PG admission page for postgraduate programmes","fees_information":"<p>IIT Roorkee publishes separate fee structures for 2026-27 by programme: new UG entrants (B.Tech./B.Arch./BS-MS/Int.M.Tech./B.Des), existing UG students, Ph.D., M.Tech./M.Arch./M.U.R.P./M.Des., M.B.A., M.Sc. and preparatory courses. Amounts are on the official Institute Fees page; they are not copied here.</p>","campus_facilities":"","hostel_information":"<p>The Institute describes its residences as bhawans. Boys' hostels include Azad, Cautley, Ganga, Govind, Jawahar, Rajendra, Radhakrishnan, Rajiv, Ravindra and Malviya Bhawans. Girls' hostels include Himalaya, Indira, Kasturba and Sarojini Bhawans, and there are hostels for married students. All hostels are Wi-Fi connected, each has a student-run cyber cafe, and the bhawans have canteens. The official Hostel Life page has the current list.</p>","placement_information":"","scholarships":"<p>The Senate Committee for Scholarships and Prizes (SCSP) lists institute scholarships and financial assistance, a tuition fee waiver scheme, a free messing scheme, private and offline scholarships, National Scholarship Portal scholarships and convocation awards. Its notices include named tuition fee waivers and a girl fee waiver partial scholarship for 2026-27. Eligibility and amounts are on the SCSP pages.</p>","college_image":null,"official_website":"https://iitr.ac.in/","cta_heading":"Considering IIT Roorkee?","cta_description":"Compare engineering programmes, entrance routes and options with A3 EduCare Hub & Research Academy.","faq_1_question":"How do I get admission to B.Tech. or B.Arch. at IIT Roorkee?","faq_1_answer":"<p>IIT Roorkee states that it admits students to B.Tech. and B.Arch. courses through the Joint Entrance Examination (JEE).</p>","faq_2_question":"When did Roorkee become an IIT?","faq_2_answer":"<p>It was converted to an IIT on 21 September 2001 by an Ordinance of the Government of India, as the seventh IIT.</p>","faq_3_question":"Does IIT Roorkee have hostels?","faq_3_answer":"<p>Yes. It has boys' and girls' hostels, called bhawans, and hostels for married students, all Wi-Fi connected.</p>","faq_4_question":"Where can I find the fee structure?","faq_4_answer":"<p>On the Institute Fees page of the official website, which has a structure for each programme for 2026-27.</p>","faq_5_question":"","faq_5_answer":"","featured_image":{"id":1409,"date":"2026-11-14T07:37:19","date_gmt":"2026-11-14T07:37:19","guid":{"rendered":"https://staging.a3educarehub.in/iit-roorkee-main-administrative-building/"},"m
