    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:18.089Z","entries":{"college:nit-calicut":[{"id":1071,"date":"2026-11-04T06:53:00","date_gmt":"2026-11-04T06:53:00","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-calicut/"},"modified":"2026-11-04T06:53:00","modified_gmt":"2026-11-04T06:53:00","slug":"nit-calicut","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nit-calicut/","title":{"rendered":"National Institute of Technology Calicut"},"content":{"rendered":"","protected":false},"featured_media":1164,"template":"","class_list":["post-1071","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"NIT Calicut, set up in 1961 as Calicut Regional Engineering College, is an Institute of National Importance near Kozhikode. It is known for engineering and architecture, offers MBA and postgraduate programmes, and houses about 6,800 students in 14 hostels on a 285-acre campus.","college_overview":"<p>National Institute of Technology Calicut was established in 1961 and was known as Calicut Regional Engineering College until 2002. It is now one of the National Institutes of Technology governed by the NIT Act passed by Parliament. The campus lies about 22 km north-east of Kozhikode on the Kozhikode–Mukkam Road.</p><p>Undergraduate teaching spans the main engineering branches along with Architecture, Biotechnology, Engineering Physics and a dual degree in Mathematics and Computing. Most B.Tech programmes have been reviewed by the National Board of Accreditation, and several received its six-year accreditation.</p><p>Life at NITC is largely residential, with hostels for around 6,800 students and central facilities including a library resource centre, a health centre and research laboratories.</p>","location":"NIT Campus P.O., Kozhikode 673601, Kerala, India","city":"Kozhikode","state":"Kerala","established":"1961 (as Calicut Regional Engineering College)","affiliation":"Institute of National Importance under the NIT Act; awards its own degrees","recognition":"<p>NIT Calicut is an <strong>Institute of National Importance</strong> governed by the NIT Act.</p><p><strong>National Board of Accreditation (NBA), as reported by the institute:</strong></p><ul><li>6 years (2022-2028): B.Tech Civil, Mechanical, Electrical &amp; Electronics, Electronics &amp; Communication and Computer Science.</li><li>6 years: B.Tech Chemical and Production Engineering (2023) and Engineering Physics (2025).</li><li>3 years: B.Tech Biotechnology (2023).</li></ul>","courses_offered":"<p><strong>Undergraduate:</strong></p><ul><li>B.Arch</li><li>B.Tech: Computer Science, Biotechnology, Chemical, Civil, Electrical &amp; Electronics, Electronics &amp; Communication, Energy, Engineering Physics, Materials Science, Mechanical and Production Engineering</li><li>Dual Degree (B.Tech-M.Tech) in Mathematics and Computing</li><li>4-year Integrated Teacher Education Programme (B.Sc-B.Ed)</li></ul><p><strong>Postgraduate and research:</strong> M.Tech, M.Plan, M.Sc, a two-year MBA with dual specialisation, and PhD programmes.</p>","admission_process":"<p><strong>B.Tech and B.Arch:</strong> Appear for JEE (Main), conducted by the National Testing Agency: Paper 1 for B.Tech and Paper 2 for B.Arch. Seats are then allotted through online counselling run by JoSAA and CSAB. There is no separate application to NIT Calicut.</p><p><strong>Foreign nationals, PIOs, NRIs and OCIs:</strong> up to 145 supernumerary seats are available under the DASA scheme.</p><p><strong>MBA:</strong> selection has been based on a valid CAT score and a personal interview, as described in the 2024-26 admission notice. Check the current notice before applying.</p>","eligibility":"<p><strong>B.Tech/B.Arch:</strong> admission is based on Class 12 (or equivalent) results and JEE (Main) performance, with reservation for SC, ST, OBC, EWS and PwD candidates under Government of India norms.</p><p><strong>MBA (2024-26 notice):</strong> a bachelor's degree with at least 60% marks or CGPA 6.0/10 (55% or 5.5/10 for SC, ST and PwD) and a valid CAT score.</p>","entrance_exams":"JEE (Main) for B.Tech and B.Arch; CAT for MBA","fees_information":"<p><strong>B.Tech, 2025-26 admission batch (institute fee notice):</strong></p><ul><li><strong>Open/EWS/OBC-NCL, family income above Rs 5 lakh, and DASA (CIWG)/MEA:</strong> Rs 1,42,600 in the first semester, then Rs 81,600 (monsoon) and Rs 68,900 (winter).</li><li><strong>Open/EWS/OBC-NCL, family income Rs 1-5 lakh:</strong> Rs 1,00,934 in the first semester, then Rs 39,934 (monsoon) and Rs 27,233 (winter).</li><li><strong>Open/EWS/OBC-NCL, family income below Rs 1 lakh, and all SC/ST/PwD students:</strong> Rs 80,100 in the first semester, then Rs 19,100 (monsoon) and Rs 6,400 (winter).</li></ul><p>First-semester amounts include one-time fees of Rs 61,000, of which Rs 20,000 is a caution deposit. Hostel seat rent is an extra Rs 12,000 per semester, and mess charges are separate. The institute notes that fees may change.</p>","campus_facilities":"<p>The campus covers 285 acres, with about 3.35 lakh sq m of built-up space. Central facilities include the E-Cube Resources Centre (library), a Centre for Materials Characterization, Central Research Facilities, a Centre for Career Development, a Health Centre, a guest house and a campus school, along with sports facilities that include the Major Dhyan Chand Sports Complex.</p>","hostel_information":"<p>NIT Calicut has 14 hostels housing about 6,800 students: 11 for men (about 4,800) and 3 for women (about 2,000), with single, double, triple and quadruple rooms. Hostels share 16 messes, two of them vegetarian only.</p><p>Facilities include common rooms, guest rooms, round-the-clock internet, laundry, and sports and gym facilities.</p>","placement_information":"","scholarships":"<h4>Scholarships and awards listed by NIT Calicut</h4><ul><li>E-Grantz scholarship, with institute verification and renewal for the 2026-27 academic year; E-Grantz fee payments are credited directly to students' accounts.</li><li>SILA (Subramonia Iyer - Lekshmi Ammal) Scholarship, announced for 2022-23, 2024-25 and 2025-26.</li><li>CREC-SJET Scholarship and the CREC-SJET Financially Weak Student Support Scholarship (results published for 2024 and 2025).</li><li>DRCT Scholarship (result 2025).</li><li>Prof. Allesu Kanjirathinkal Memorial Award.</li><li>Aadhaar seeding is required for SC students availing scholarships.</li></ul><p>Eligibility and amounts are in each notice on the institute's Scholarship and Awards page.</p>","college_image":null,"official_website":"https://nitc.ac.in","cta_heading":"Aiming for NIT Calicut?","cta_description":"Get help planning your JEE (Main) strategy and JoSAA choices for NIT Calicut.","faq_1_question":"How do I get admission to B.Tech at NIT Calicut?","faq_1_answer":"<p>Appear for JEE (Main), then take part in JoSAA or CSAB counselling. You do not apply separately to the institute.</p>","faq_2_question":"What is the B.Tech fee at NIT Calicut?","faq_2_answer":"<p>For the 2025-26 batch, first-semester fees range from Rs 80,100 to Rs 1,42,600 depending on category and family income. Hostel rent is an extra Rs 12,000 per semester.</p>","faq_3_question":"Does NIT Calicut offer B.Arch?","faq_3_answer":"Yes. Admission is through JEE (Main) Paper 2 and centralised counselling.","faq_4_question":"How many hostels does NIT Calicut have?","faq_4_answer":"<p>There are 14 hostels for about 6,800 students: 11 for men and 3 for women.</p>","faq_5_question":"Where is NIT Calicut located?","faq_5_answer":"<p>At NIT Campus P.O., Kozhikode 673601, Kerala, about 22 km north-east of Kozhikode city.</p>","featured_image":{"id":1164,"date":"2026-11-04T07:23:18","date_gmt":"2026-11-04T07:23:18","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-calicut/national-institute-of-technology-calicut-campus/"},"modified":"2026-11-04T07:23:18"
