    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:37.262Z","entries":{"college:iim-visakhapatnam":[{"id":1068,"date":"2026-11-04T06:52:33","date_gmt":"2026-11-04T06:52:33","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iim-visakhapatnam/"},"modified":"2026-11-04T06:52:33","modified_gmt":"2026-11-04T06:52:33","slug":"iim-visakhapatnam","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/iim-visakhapatnam/","title":{"rendered":"Indian Institute of Management Visakhapatnam"},"content":{"rendered":"","protected":false},"featured_media":1162,"template":"","class_list":["post-1068","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIM Visakhapatnam runs its two-year residential PGP from a permanent campus at Gambheeram, under the IIM Act of 2017. The 2026-28 batch has 341 students, 48% of them women, and the 2023-25 batch reported a median package of Rs 16 lakh.","college_overview":"<p>IIM Visakhapatnam is established under the IIM Act, 2017, and has its permanent campus at Gambheeram village in Anandapuram mandal. Along with the two-year PGP, it runs doctoral, executive MBA and executive diploma programmes.</p><p>The PGP is full time and residential. Its 2026-28 batch has 341 students, and women make up 48% of the class.</p><p>Admission runs in three phases, using CAT 2025 cut-offs, an interview and a composite score. Candidates shortlisted by IIM Bangalore, Kozhikode, Indore or Lucknow also have their interview score from one of those institutes considered.</p>","location":"Gambheeram Village, Anandapuram Mandal, Visakhapatnam 531163, Andhra Pradesh, India","city":"Visakhapatnam","state":"Andhra Pradesh","established":"2015","affiliation":"Institute established under the IIM Act, 2017; awards its own degrees","recognition":"<p>IIM Visakhapatnam is established under the <strong>Indian Institutes of Management Act, 2017</strong>.</p>","courses_offered":"<ul><li><strong>PGP (MBA):</strong> two years, full time and residential; planned intake of 340 for 2026-28</li><li><strong>Doctoral:</strong> PhD and Executive PhD</li><li><strong>Executive:</strong> Executive MBA, Executive PGDM and PGDM for Executives</li><li><strong>PGPMCI:</strong> for centrally funded technical institutions and institutions of national importance</li><li><strong>Other:</strong> PG Certificate in Entrepreneurship, Post-Doctoral Fellowship and executive education</li></ul>","admission_process":"<p>For the PGP 2026-28 batch:</p><ol><li><strong>Phase 1:</strong> shortlisting on CAT 2025 percentile cut-offs for candidates who chose IIMV in CAT registration.</li><li><strong>Phase 2:</strong> a second shortlist and an interview consent form. Candidates also shortlisted by IIM Bangalore, Kozhikode, Indore or Lucknow must attend the interview at one of those institutes.</li><li><strong>Phase 3:</strong> a composite score from CAT, Class X and XII, bachelor's results, gender diversity, work experience and the interview. Offers follow category-wise merit lists.</li></ol>","eligibility":"<p><strong>PGP 2026-28, Phase 1 CAT 2025 percentile cut-offs (sectional / overall):</strong></p><ul><li>Unreserved: 70 / 82</li><li>EWS and NC-OBC: 63 / 72</li><li>SC: 40 / 50</li><li>ST and PwD: 30 / 40</li></ul><p>These apply only to the Phase 1 shortlist and do not guarantee an offer.</p>","entrance_exams":"CAT for the PGP","fees_information":"<p><strong>PGP 2026-28, annual figures from the program fee page:</strong></p><ul><li>Tuition: Rs 3,79,765 per term</li><li>Student Welfare Fee: Rs 40,000 in the first term of each year</li><li>Stated annual total: Rs 11,79,295</li></ul><p>Also payable: a one-time refundable caution deposit of Rs 40,000, and Rs 25,000 with each term fee as an advance for mess, AC and printing. Mess and printing are charged on actuals. An acceptance fee of Rs 50,000 counts toward the first-term fee.</p>","campus_facilities":"<p>The permanent campus is at Gambheeram village, Anandapuram mandal, in Visakhapatnam.</p>","hostel_information":"<p>The PGP is fully residential. Rooms have a bed and mattress, study table and chair, wardrobe, bookshelf and curtains, and air conditioning follows institute policy. Rooms are allotted by a chit system and are not changed afterwards. Family accommodation is not provided for married students.</p>","placement_information":"<p><strong>PGP 2023-25, final placement report:</strong> highest package Rs 32.50 lakh, average Rs 16.40 lakh, median Rs 16 lakh, top-decile average Rs 27.84 lakh and top-quartile average Rs 22.64 lakh.</p><p>The institute's placement reports page also lists a final report for PGP 2024-26. Finals and summer recruitment run from September to January.</p>","scholarships":"<p>IIM Visakhapatnam publishes financial aid and scholarship information for the PGP on its admissions pages.</p>","college_image":null,"official_website":"https://www.iimv.ac.in","cta_heading":"Aiming for IIM Visakhapatnam?","cta_description":"Get help with CAT planning, your interview and your application profile.","faq_1_question":"How does IIM Visakhapatnam select PGP students?","faq_1_answer":"<p>Through CAT-based shortlisting, an interview, and a composite score that also counts academics, gender diversity and work experience.</p>","faq_2_question":"What is the PGP fee?","faq_2_answer":"<p>The fee page lists Rs 3,79,765 per term and an annual total of Rs 11,79,295, along with a refundable deposit and term advances.</p>","faq_3_question":"What were the 2023-25 placements?","faq_3_answer":"The final report lists an average of Rs 16.40 lakh, a median of Rs 16 lakh and a highest package of Rs 32.50 lakh.","faq_4_question":"Is the PGP residential?","faq_4_answer":"<p>Yes. It is a full-time residential programme, and family accommodation is not provided.</p>","faq_5_question":"How large is the 2026-28 batch?","faq_5_answer":"<p>The institute reports 341 students, with wome
