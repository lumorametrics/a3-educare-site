    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:26.944Z","entries":{"college:dsnlu-visakhapatnam":[{"id":1069,"date":"2026-11-04T06:52:35","date_gmt":"2026-11-04T06:52:35","guid":{"rendered":"https://staging.a3educarehub.in/colleges/dsnlu-visakhapatnam/"},"modified":"2026-11-04T06:52:35","modified_gmt":"2026-11-04T06:52:35","slug":"dsnlu-visakhapatnam","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/dsnlu-visakhapatnam/","title":{"rendered":"Damodaram Sanjivayya National Law University"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1069","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"Damodaram Sanjivayya National Law University was set up by the Andhra Pradesh DSNLU Act of 2008 and sits on 45.5 acres at Sabbavaram, Visakhapatnam. It admits five-year B.A., LL.B. (Hons.) and one-year LL.M. students through CLAT.","college_overview":"<p>The Government of Andhra Pradesh established DSNLU through the DSNLU Act, 2008. The university holds recognition under sections 2(f) and 12B of the UGC Act and from the Bar Council of India.</p><p>Its main degree is the five-year B.A., LL.B. (Hons.), for which students complete 220 credits. It also offers a one-year LL.M. with three specialisations, Ph.D. and LL.D. programmes, and, from 2024-25, a three-year LL.B.</p><p>Half of its seats follow Andhra Pradesh state rules, 40% are allotted on an all-India basis, and 10% go to foreign and NRI-related categories. Applicants should check which pool applies to them, along with the separate CLAT counselling steps.</p>","location":"Nyayaprastha, Sabbavaram, Visakhapatnam 531035, Andhra Pradesh, India","city":"Sabbavaram","state":"Andhra Pradesh","established":"2008 (DSNLU Act 32 of 2008)","affiliation":"State law university established by the DSNLU Act, 2008","recognition":"<p>The university is recognised under <strong>sections 2(f) and 12B of the UGC Act, 1956</strong> and by the <strong>Bar Council of India</strong>.</p>","courses_offered":"<ul><li><strong>B.A., LL.B. (Hons.):</strong> five years; 180 seats plus 18 extra seats (CLAT 2027 brochure)</li><li><strong>LL.M.:</strong> one year, three specialisations; 60 seats plus 6 extra seats</li><li><strong>LL.B.:</strong> three years, offered from 2024-25; 120 seats plus 18 extra seats (2024 brochure)</li><li><strong>Research:</strong> Ph.D. and LL.D.</li></ul>","admission_process":"<p>B.A., LL.B. (Hons.) and LL.M. seats are filled through CLAT counselling, under the university's admission guidelines. Fifty per cent of seats follow Andhra Pradesh rules, 40% are on an all-India basis, and 10% go to foreign and NRI-related categories. The three-year LL.B. has its own admission notification.</p>","eligibility":"<p>The university states that it is governed by the CLAT notification on eligibility for the B.A., LL.B. (Hons.). Check that year's notification for detailed conditions.</p>","entrance_exams":"CLAT for B.A., LL.B. (Hons.) and LL.M.; a separate process for the three-year LL.B.","fees_information":"<p><strong>Academic year 2027-28, CLAT 2027 brochure:</strong></p><ul><li>Stated total: Rs 2,30,000 per year for both UG and PG</li><li>Accommodation fee: Rs 35,000 per year</li><li>Moot court fee, UG: Rs 5,000 per year</li><li>One-time: admission fee Rs 3,000, alumni fee Rs 2,000</li><li>Refundable: library deposit Rs 5,000, canteen security deposit Rs 10,000</li></ul><p>Mess charges are separate and based on actual expenditure. The tuition fee rises by 10% each academic year.</p>","campus_facilities":"<p>The campus covers 45.5 acres next to the hills at Sabbavaram. It has an air-conditioned academic block, Wi-Fi and LAN, a canteen seating 350 students, and a rooftop solar plant of 350 kW. The library gives access to online resources including Westlaw India, Hein Online, SCC Online, Manupatra, JSTOR and Lexis Nexis.</p>","hostel_information":"<p>Men's and women's hostels are on campus. The brochure lists an accommodation fee of Rs 35,000 a year, plus mess charges based on actual expenditure. The university also publishes hostel rules and a girls' hostel manual.</p>","placement_information":"<p>The Recruitment Coordination Committee is the body that facilitates recruitment for the graduating batch. The university also has a faculty-led Internship and Placements Committee, a Placement Officer and an Internship Co-ordination Committee. The academic year includes two months of summer internship break and one month of winter internship break.</p><h4>Five-year B.A., LL.B. (Hons.) (NIRF 2026 data submitted by the university)</h4><ul><li><strong>2024-25:</strong> 118 graduated in the stipulated time, 36 placed, median salary Rs 8,00,000, 4 selected for higher studies</li><li><strong>2023-24:</strong> 120 graduated, 38 placed, median salary Rs 7,50,000, 23 selected for higher studies</li><li><strong>2022-23:</strong> 120 graduated, 30 placed, median salary Rs 6,00,000, 20 selected for higher studies</li></ul><h4>One-year LL.M. (NIRF 2026 data)</h4><ul><li><strong>2024-25:</strong> 49 graduated, 5 placed, median salary Rs 10,00,000, 5 selected for higher studies</li><li><strong>2023-24:</strong> 59 graduated, none placed, 10 selected for higher studies</li><li><strong>2022-23:</strong> 54 graduated, none placed, 4 selected for higher studies</li></ul><p>The university's placement page names no recruiters and gives no highest package. <strong>Contact:</strong> Placement Officer, nareshmadiki@dsnlu.ac.in.</p>","scholarships":"<p>The Directorate of Admissions helps students with fee reimbursement by uploading college details to the e-pass website. The university's website and CLAT 2027 brochure, as read, do not set out a scholarship scheme of its own or any award amounts.</p><h4>Tuition support (NIRF 2026 data)</h4><ul><li><strong>Five-year B.A., LL.B. (Hons.):</strong> 116 of 641 students received full tuition fee reimbursement from the State and Central Governments</li><li><strong>One-year LL.M.:</strong> 6 of 51 students received it from the governments</li><li><strong>Three-year LL.B.:</strong> none of the 80 students received it</li></ul><p>The same data shows no student receiving full tuition fee reimbursement from institution funds or private bodies.</p>","college_image":null,"official_website":"https://dsnlu.ac.in","cta_heading":"Applying to DSNLU through CLAT?","cta_description":"Get help planning your CLAT preparation and NLU preference order.","faq_1_question":"Does DSNLU accept CLAT?","faq_1_answer":"<p>Yes. It admits B.A., LL.B. (Hons.) and LL.M. students through CLAT counselling.</p>","faq_2_question":"How many B.A., LL.B. (Hons.) seats are there?","faq_2_answer":"<p>The CLAT 2027 brochure lists 180 seats plus 18 extra seats.</p>","faq_3_question":"How much does it cost for 2027-28?","faq_3_answer":"The brochure lists a total of Rs 2,30,000 a year. Mess charges and one-time items are additional.","faq_4_question":"Are hostels available?","faq_4_answer":"<p>Yes. Men's and women's hostels are on campus, with an accommodation fee of Rs 35,000 a year.</p>","faq_5_question":"How are seats shared between Andhra Pradesh and other states?","faq_5_answer":"<p>Fifty per cent follow Andhra Pradesh rules, 40% are on an all-India basis, and 10% go to foreign and NRI-related categories.</p>","featured_image":{"id":1453,"date":"2026-11-14T12:46:31","date_gmt":"2026-11-14T12:46:31","guid":{"rendered":"https://staging.a3educarehub.in/colleges/dsnlu-visakhapatnam/damodaram-sanjivayya-national-law-university-featured-image/"},"modified":"2026-11-14T12:46:31","modified_gmt":"2026-11-14T12:46:31","slug":"damodaram-sanjivayya-national-law-university-featured-image","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/dsnlu-visakhapatnam/damodaram-sanjivayya-national-law-university-featured-image/#main","title":{"rendered":"Damodaram Sanjivayya National L
