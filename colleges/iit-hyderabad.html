    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:38.876Z","entries":{"college:iit-hyderabad":[{"id":1058,"date":"2026-11-04T06:52:20","date_gmt":"2026-11-04T06:52:20","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iit-hyderabad/"},"modified":"2026-11-04T06:52:20","modified_gmt":"2026-11-04T06:52:20","slug":"iit-hyderabad","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/iit-hyderabad/","title":{"rendered":"Indian Institute of Technology Hyderabad"},"content":{"rendered":"","protected":false},"featured_media":1153,"template":"","class_list":["post-1058","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIT Hyderabad opened in August 2008 with three departments and 111 B.Tech students. It now runs engineering, science, design, liberal arts and management departments from its permanent campus at Kandi, near Sangareddy, where undergraduates are expected to live in the hostels.","college_overview":"<p>IIT Hyderabad began work on 20 August 2008 from a temporary site at the Ordnance Factory in Medak district, teaching Computer Science, Electrical and Mechanical Engineering. It moved to its permanent campus at Kandi in 2015.</p><p>Its departments now reach well beyond the first three. They include Artificial Intelligence, Biomedical Engineering, Biotechnology, Chemical, Civil, Climate Change, Engineering Science, Heritage Science and Technology, Materials Science and Metallurgical Engineering, and Mechanical and Aerospace Engineering, alongside Chemistry, Physics, Mathematics, Liberal Arts, Design, and Entrepreneurship and Management.</p><p>The institute's 2024 brochure reports more than 5,300 students, over 320 full-time faculty and a campus of about 600 acres. It also reports 12th place overall and 8th in Engineering in that year's NIRF rankings.</p>","location":"Kandi, Sangareddy, Telangana 502285, India","city":"Sangareddy","state":"Telangana","established":"2008","affiliation":"Indian Institute of Technology; awards its own degrees","recognition":"<p>IIT Hyderabad's 2024 brochure reports these rankings:</p><ul><li>NIRF Overall: 12th</li><li>NIRF Engineering: 8th</li><li>NIRF Innovation: 3rd</li><li>QS World University Rankings 2025: 681-690</li></ul>","courses_offered":"<ul><li><strong>Undergraduate:</strong> B.Tech and B.Des</li><li><strong>Postgraduate:</strong> M.Tech, M.Des, M.Sc and MA</li><li><strong>Doctoral:</strong> PhD in all departments</li></ul><p><strong>Departments:</strong> Artificial Intelligence, Biomedical Engineering, Biotechnology, Chemical Engineering, Chemistry, Civil Engineering, Climate Change, Computer Science and Engineering, Design, Electrical Engineering, Engineering Science, Entrepreneurship and Management, Heritage Science and Technology, Liberal Arts, Materials Science and Metallurgical Engineering, Mathematics, Mechanical and Aerospace Engineering, and Physics.</p>","admission_process":"<ul><li><strong>B.Tech:</strong> JEE (Advanced), with the branch allotted during counselling.</li><li><strong>B.Des:</strong> UCEED, with seats allotted through the joint process run by the UCEED office.</li><li><strong>M.Tech:</strong> mainly GATE, with GATE-qualified candidates registering on the Common Offer Acceptance Portal (COAP). Some departments set their own conditions.</li><li><strong>M.Des:</strong> CEED for Visual Design.</li><li><strong>PhD:</strong> department-wise eligibility published for each admission round.</li></ul>","eligibility":"<p>For B.Tech, candidates must first be among the top performers in JEE (Main) Paper I who qualify to sit JEE (Advanced). For M.Des Visual Design, the institute asks for a valid CEED score and at least 55% marks (50% for SC/ST). IIT Hyderabad publishes programme-wise postgraduate and PhD eligibility criteria for each intake.</p>","entrance_exams":"JEE (Advanced), UCEED, GATE, CEED","fees_information":"<p><strong>B.Tech and B.Des, students joining in July 2026 (first semester, institute fee structure):</strong></p><ul><li><strong>General and OBC:</strong> Rs 1,68,993</li><li><strong>SC, ST and PH:</strong> Rs 68,993</li><li><strong>Foreign nationals:</strong> Rs 3,68,993</li></ul><p>These totals include:</p><ul><li>One-time fees of Rs 19,000 (joining fee Rs 7,000, student activity funds Rs 6,000, refundable security deposit Rs 6,000)</li><li>Tuition of Rs 1,00,000 for General and OBC, nil for SC, ST and PH, and Rs 3,00,000 for foreign nationals</li><li>Hostel expenses of Rs 18,000 and mess charges of Rs 14,430 (Rs 130 per day for 111 days)</li><li>Annual medical insurance of Rs 1,888</li></ul>","campus_facilities":"<p>Students use the Knowledge Resource Centre as the campus library. The Sports and Cultural Complex includes an athletic track, courts for several sports, a swimming pool and a gym. A 2023 institute newsletter also describes a campus clinic with doctors available round the clock, an ambulance service and a pharmacy.</p>","hostel_information":"<p>All undergraduate students are expected to stay in hostels. The Dean (Students) office lists 23 hostel blocks, and the campus has two messes. Hostels and dining are managed by the Hostel Coordinating Unit.</p>","placement_information":"<p>The Office of Career Services handles placements. The institute's 2024 brochure reports more than 500 offers in its most recent season at that time, including 43 international offers and 87 pre-placement offers. Programme-wise brochures are published on the placement office's website.</p>","scholarships":"<h4>Institute scholarships (IIT Hyderabad)</h4><ul><li><strong>Merit-cum-Means (MCM):</strong> for GEN, GEN-EWS and OBC students with parental gross income up to Rs 4.5 lakh; limited to 25% of the class strength; SGPA/CGPA of 7.0 or above with no active backlogs; pocket money of Rs 1,000 a month.</li><li><strong>SC/ST Scholarship:</strong> parental gross income up to Rs 4.5 lakh, with no ceiling on the number of awards; SGPA/CGPA of 7.0 or above with no active backlogs; pocket money of Rs 250 a month plus refund of licence fee and dining charges at actuals.</li><li><strong>Income proof for 2026-27:</strong> income-tax returns with acknowledgement for FY 2025-26 of both parents are mandatory, even if income is zero; income certificates are not accepted.</li><li>Students may hold only one scholarship from one source in an academic year.</li></ul><h4>Other support</h4><p>Central and state schemes are available through the National Scholarship Portal, and NSTFDC offers education loans to meritorious ST students.</p>","college_image":null,"official_website":"https://iith.ac.in","cta_heading":"Targeting IIT Hyderabad?","cta_description":"Get help with your JEE (Advanced) preparation and branch choices at IIT Hyderabad.","faq_1_question":"How do I get into B.Tech at IIT Hyderabad?","faq_1_answer":"<p>Qualify in JEE (Main), appear for JEE (Advanced), then take part in counselling for branch allotment.</p>","faq_2_question":"What is the first-semester fee for B.Tech?","faq_2_answer":"<p>For students joining in July 2026 it is Rs 1,68,993 for General and OBC students and Rs 68,993 for SC, ST and PH students, including hostel, mess and insurance.</p>","faq_3_question":"Does IIT Hyderabad offer design programmes?","faq_3_answer":"Yes. It offers B.Des through UCEED and M.Des, with CEED required for Visual Design.","faq_4_question":"Do undergraduates have to live on campus?","faq_4_answer":"<p>The July-December 2026 fee document says all undergraduate students are expected to stay in hostels.</p>","faq_5_question":"Where is the IIT Hyderabad campus?","faq_5_answer":"<p>The permanent campus is at Kandi, near Sangareddy, Telangana 502285.</p>","featured_image":{"id":1153,"date":"2026-11-04T07:22:39","date_gmt":"2026-11-04T07:22:39","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iit-hyderabad/indian-institute-of-technology-hyderabad-campus/"},"modified":"2026-11-04T0
