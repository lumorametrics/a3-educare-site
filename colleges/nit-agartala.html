    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:07.274Z","entries":{"college:nit-agartala":[{"id":1130,"date":"2026-11-04T06:55:25","date_gmt":"2026-11-04T06:55:25","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-agartala/"},"modified":"2026-11-04T06:55:25","modified_gmt":"2026-11-04T06:55:25","slug":"nit-agartala","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nit-agartala/","title":{"rendered":"National Institute of Technology Agartala"},"content":{"rendered":"","protected":false},"featured_media":1435,"template":"","class_list":["post-1130","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"National Institute of Technology Agartala is a centrally funded institution in Agartala, Tripura, offering engineering and technology programmes.","college_overview":"<p>National Institute of Technology Agartala was established in 1965 as Tripura Engineering College. Its campus is at Barjala, Jirania, in West Tripura, and is given as about 365 acres.</p><p>It offers nine four-year B.Tech programmes, along with integrated, postgraduate and doctoral study.</p>","location":"Agartala, Tripura, India","city":"Agartala","state":"Tripura","established":"1965","affiliation":"National Institute of Technology under the NIT Act, 2007","recognition":"<p>NIT Agartala is an Institute of National Importance under the Ministry of Education.</p>","courses_offered":"<ul><li><strong>B.Tech:</strong> Biotechnology and Biochemical, Chemical, Civil, Computer Science, Electrical, Electronics and Communication, Electronics and Instrumentation, Mechanical, and Production Engineering</li><li><strong>Postgraduate:</strong> M.Tech, M.Sc., MCA and MBA</li><li><strong>Doctoral:</strong> Ph.D.</li></ul>","admission_process":"<p>Undergraduate entry is based on JEE (Main) scores. Check the institute's notices and the counselling portal for the current year.</p>","eligibility":"<p>Candidates must meet the conditions of JEE (Main) and counselling for the admission year.</p>","entrance_exams":"JEE (Main) for B.Tech","fees_information":"","campus_facilities":"<p>The campus at Barjala, Jirania, is given as about 365 acres in a Ministry of Education compendium.</p>","hostel_information":"<h4>Hostels at NIT Agartala</h4><p>The Office of the Chief Warden lists these hostels, each with its own warden and supervisor:</p><ul><li><strong>Aryabhatta Hostel:</strong> Blocks A to H.</li><li><strong>RNT Hostel:</strong> separate 1st-year, UG and PG blocks.</li><li><strong>Howrah, Gomati and Dhalai hostels.</strong></li><li><strong>Gargi Hostel:</strong> with a chairman and three wardens.</li></ul><p>Hostels are overseen by a Chief Warden (chiefwardennita@gmail.com). The institute also has a Health Centre with a helpline (+91 6033011116) and a security office. Hostel capacity and fees are not given on the Chief Warden's page.</p>","placement_information":"<h4>Centre for Career Development (CCD)</h4><ul><li>Assists students with career exploration, job search and placement, and gives regular guidance on career goals.</li><li>Provides a single interface for companies to interact with students; the institute aims to attract students towards core engineering sectors.</li><li>Placement is led by a CCD chairman, a Vice-Chairman and Training and Placement Officer, assistant TPOs for four areas (edu-tech and research, consulting and teaching, core, PSU and government organisations, IT and software) and a faculty in-charge of training and internships.</li><li>Student placement and internship coordinators are named each session; the 2026-27 coordinators have been notified.</li></ul><p>Contact: placements@mail.nita.ac.in. The CCD page links the Institute Placement Policy, a placement brochure and the Job Notification Form for recruiters; no placement statistics are shown on the page itself.</p>","scholarships":"<h4>UG and PG scholarships through the National Scholarship Portal (NSP 2.0)</h4><p><strong>Open to students from all states:</strong> Post Matric and Top Class Education scholarships for students with disabilities; Central Sector Scheme of Scholarships for College and University Students; National Fellowship and Scholarship for ST students; PM's Scholarship Scheme for CAPF and Assam Rifles; National Scholarship for Post Graduate Studies; Ishan Uday (North East Region); NEC Merit Scholarship; Top Class Education for SC students (11 slots, 30% reserved for girls); and PM YASASVI Top Class Education for OBC, EBC and DNT students (2025-26 slots: OBC 75, EBC 8, with 30% for girls).</p><p><strong>Tripura domicile students:</strong> Dr. Ambedkar Post Matric Scholarship for EBC, and post-matric scholarships for OBC, SC and ST students.</p><p>The institute also lists state and private portals (Uttar Pradesh, Madhya Pradesh, Jharkhand, Bihar, Odisha, Haryana, Sitaram Jindal Foundation, IIT Madras Vidyalakshmi and others) and education loans, including PM Vidyalaxmi and the Bihar Student Credit Card.</p><h4>M.Tech and dual degree</h4><ul><li>GATE-qualified M.Tech students admitted through CCMT receive the MoE scholarship for two years; non-CCMT admits receive 50% of it for two years.</li><li>Dual degree (BS-MS/BT-MT) students who qualify GATE before the 5th year receive the MoE scholarship for one year.</li></ul><h4>Ph.D fellowships</h4><ul><li>GATE/NET-qualified regular scholars receive MoE fellowship for two years, then SRF for three years on the research committee's recommendation.</li><li>M.Sc/M.A holders without GATE/NET may receive Rs 13,000 a month for up to five years; other eligible non-GATE/NET scholars receive 50% of the MoE fellowship for up to five years.</li><li>The self-financed category is discontinued from the 2026-27 admission batch.</li></ul>","college_image":null,"official_website":"https://www.nita.ac.in","cta_heading":"Considering NIT Agartala?","cta_description":"Get help with JEE (Main) and your branch choices.","faq_1_question":"When was NIT Agartala established?","faq_1_answer":"<p>In 1965, as Tripura Engineering College.</p>","faq_2_question":"Where is the campus?","faq_2_answer":"<p>At Barjala, Jirania, in West Tripura.</p>","faq_3_question":"How many B.Tech programmes are there?","faq_3_answer":"<p>Nine four-year programmes.</p>","faq_4_question":"Which exam is needed for B.Tech?","faq_4_answer":"<p>JEE (Main).</p>","faq_5_question":"Does it offer postgraduate study?","faq_5_answer":"<p>Yes, including M.Tech, M.Sc., MCA, MBA and Ph.D.</p>","featured_image":{"id":1435,"date":"2026-11-14T10:25:59","date_gmt":"2026-11-14T10:25:59","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-agartala/nit-agartala-computer-science-and-engineering-building/"},"modified":"2026-11-14T10:25:59","modified_gmt":"2026-11-14T10:25:59","slug":"nit-agartala-computer-science-and-engineering-building","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nit-agartala/nit-agartala-computer-science-and-engineering-building/#main","title":{"rendered":"NIT Agartala Computer Science and Engineering building"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1435","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-agartala-cse-building.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"225\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-agartala-cse-building-300x225.jpg\" class=\"attachment-medium size-medium\" alt=\"Department of Computer Science and Engineering building at the National Institute of Technology Agartala\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-agartala-cse-building-300x225.jpg 300w, https://staging.a3educarehub.i
