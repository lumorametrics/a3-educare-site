    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:26.851Z","entries":{"college:tripura-university":[{"id":1131,"date":"2026-11-04T06:55:26","date_gmt":"2026-11-04T06:55:26","guid":{"rendered":"https://staging.a3educarehub.in/colleges/tripura-university/"},"modified":"2026-11-04T06:55:26","modified_gmt":"2026-11-04T06:55:26","slug":"tripura-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/tripura-university/","title":{"rendered":"Tripura University"},"content":{"rendered":"","protected":false},"featured_media":1206,"template":"","class_list":["post-1131","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Tripura University is a centrally funded institution in Suryamaninagar, Tripura, offering undergraduate, postgraduate and research programmes.","college_overview":"<p>Tripura University, at Suryamaninagar near Agartala, was established in 1987 as a state university and became a central university in 2007.</p><p>For the 2026-27 session, its admission notification of 6 July 2026 invites applications to undergraduate and Integrated Master's Degree programmes through CUET (UG) 2026. These programmes sit across the Faculties of Science, Literature, Social Sciences, and Commerce, Law, Management and Information Science.</p><p>Its 2023-24 annual report records NAAC Grade B++ with a CGPA of 2.82.</p>","location":"Suryamaninagar, Tripura, India","city":"Suryamaninagar","state":"Tripura","established":"1987","affiliation":"Central university under the Tripura University Act, 2007; awards its own degrees","recognition":"<p>A university document records NAAC Grade B++ with a CGPA of 2.82.</p>","courses_offered":"<h4>Offered through CUET (UG) in 2026-27</h4><ul><li><strong>Faculty of Science:</strong> B.Voc. Rubber Technology; Integrated Master's in Mathematics</li><li><strong>Faculty of Literature:</strong> Integrated Master's in English, Bengali and Hindi</li><li><strong>Faculty of Social Sciences:</strong> Integrated Master's in History, Political Science, Philosophy, Rural Studies and Economics; B.Voc. in Film and Video Production</li><li><strong>Faculty of Commerce, Law, Management and Information Science:</strong> Integrated Master's in Commerce; BBA</li></ul><p>Intake, eligibility and CUET subject requirements for each programme are in the university's e-Prospectus 2026-27. Postgraduate and doctoral programmes are also offered, including M.A. and M.Tech.</p>","admission_process":"<p>For 2026-27, admission is strictly based on CUET (UG) 2026 scores, the eligibility criteria and the university's reservation policy.</p><ol><li><strong>Register online</strong> on the university's CUET-UG portal with your CUET (UG) 2026 application number. The notice set this window as 7 to 22 July 2026.</li><li><strong>Apply for up to three programmes</strong>, with a separate application for each.</li><li><strong>Check the provisional merit list</strong>, published on 23 July 2026.</li><li><strong>Attend counselling and document verification</strong>, held on 27 July 2026 and leading to provisional admission.</li><li><strong>Pay the admission fee</strong> by 5 pm, two days after counselling.</li></ol><p>Classes were due to begin on 28 July 2026. The university may run additional rounds if seats remain vacant, including through a merit list or the Tripura University Entrance Test. Admission stays provisional until original documents are verified.</p><p>These dates are for 2026-27, so check the university's website for later sessions.</p>","eligibility":"<p>Candidates must have appeared in CUET (UG) 2026 in the subjects prescribed for their programme, and meet that programme's eligibility criteria in the e-Prospectus 2026-27.</p><p>Reservation follows Government of India rules as adopted by the university. Candidates claiming a reserved category, such as SC, ST, OBC-NCL, EWS or PwBD, must produce valid certificates from the competent authority.</p>","entrance_exams":"CUET (UG) and CUET (PG)","fees_information":"<p><strong>One-time registration fee, 2026-27:</strong></p><ul><li>SC, ST and EWS: Rs 100</li><li>UR and OBC-NCL: Rs 200</li></ul><p>Programme fees are not given in the admission notification. Check the e-Prospectus 2026-27.</p>","campus_facilities":"<h4>Campus facilities listed by Tripura University</h4><ul><li><strong>Central Library:</strong> OPAC, remote access to e-resources and an institutional repository; it also aims to preserve rare print and online resources of Tripura and the North-East.</li><li><strong>University Health Centre:</strong> full-time doctors and male and female nurses in a separate building with a few beds with saline and oxygen facilities, and an ambulance to transfer patients to a nearby hospital in emergencies.</li><li><strong>Sports Board:</strong> runs an annual sports festival with athletics, badminton, cricket, football, judo, kho-kho, kabaddi, table tennis, volleyball and yoga, and selects university teams for inter-university and national tournaments.</li><li><strong>Other facilities:</strong> hostels, a guest house, a bank, a post office, a cafeteria, an energy park and a University City Centre.</li></ul>","hostel_information":"<p>One listing mentions separate hostel complexes for boys and girls. Confirm availability with the university.</p>","placement_information":"<h4>Placement Cell (Tripura University)</h4><ul><li>The placement assistance cell was merged with the Equal Opportunity Cell in May 2010; both work from the administrative building.</li><li><strong>Placement officer:</strong> Dr. Manish Das, Department of Business Management, Placements Office, Tripura University, Suryamaninagar 799022.</li><li>The cell publishes a placement status report since 2015, departmental placement brochures (including Business Management), a sample CV and success stories.</li></ul><h4>Placement drives notified by the cell</h4><p>Recent notifications cover drives by TCS (2023 batch), Genpact, AdmitKard, BYJU'S and Ujjivan Small Finance Bank (2022 batch), SMC Global Securities, Trilogy Innovations (CodeNation), TCG Lifesciences, ITC (sales trainees), Amazon, Wipro and South Indian Bank. These notices date from 2019 to 2023; check the cell's page for current drives.</p>","scholarships":"","college_image":null,"official_website":"https://www.tripurauniv.ac.in","cta_heading":"Considering Tripura University?","cta_description":"Get help with CUET and your programme choices.","faq_1_question":"Is Tripura University a central university?","faq_1_answer":"<p>Yes, since 2007. It was established in 1987 as a state university.</p>","faq_2_question":"How are undergraduate students admitted?","faq_2_answer":"<p>On CUET (UG) 2026 scores, eligibility and the reservation policy, according to the university's 2026-27 notification.</p>","faq_3_question":"What is its NAAC grade?","faq_3_answer":"<p>A university document records B++ with a CGPA of 2.82.</p>","faq_4_question":"Where is the campus?","faq_4_answer":"<p>At Suryamaninagar, Tripura.</p>","faq_5_question":"How many programmes can I apply for?","faq_5_answer":"<p>Up to three, with a separate application for each.</p>","featured_image":{"id":1206,"date":"2026-11-04T07:27:32","date_gmt":"2026-11-04T07:27:32","guid":{"rendered":"https://staging.a3educarehub.in/colleges/tripura-university/tripura-university-campus/"},"modified":"2026-11-04T07:27:32","modified_gmt":"2026-11-04T07:27:32","slug":"tripura-university-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/tripura-university/tripura-university-campus/#main","title":{"rendered":"Tripura University campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1206","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='htt
