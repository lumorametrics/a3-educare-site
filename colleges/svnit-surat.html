    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:24.009Z","entries":{"college:svnit-surat":[{"id":1079,"date":"2026-11-04T06:53:13","date_gmt":"2026-11-04T06:53:13","guid":{"rendered":"https://staging.a3educarehub.in/colleges/svnit-surat/"},"modified":"2026-11-04T06:53:13","modified_gmt":"2026-11-04T06:53:13","slug":"svnit-surat","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/svnit-surat/","title":{"rendered":"Sardar Vallabhbhai National Institute of Technology Surat"},"content":{"rendered":"","protected":false},"featured_media":1172,"template":"","class_list":["post-1079","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"SVNIT Surat began in 1961 as a Regional College of Engineering and Technology with three branches, and became an Institute of National Importance in 2007. Its residential 250-acre campus at Ichchhanath now has departments across engineering, sciences and management.","college_overview":"<p>Sardar Vallabhbhai National Institute of Technology opened in 1961 as one of India's Regional Engineering Colleges, starting with Civil, Electrical and Mechanical Engineering. It became a deemed university in 2002 and an Institute of National Importance under the NIT Act in August 2007.</p><p>Today its departments also include Artificial Intelligence, Chemical, Computer Science, and Electronics Engineering, alongside the sciences, humanities and Management Studies, which runs a two-year full-time MBA.</p><p>This is a residential institute, and its hostel brochure gives priority to accommodating registered students. B.Tech entrants paid a first-semester institute fee of Rs 1,07,500 or Rs 45,000 in 2026, depending on category.</p>","location":"Ichchhanath, Dumas Road, Surat 395007, Gujarat, India","city":"Surat","state":"Gujarat","established":"1961 (as Regional College of Engineering and Technology)","affiliation":"Institute of National Importance under the NIT Act, 2007; awards its own degrees","recognition":"<p>SVNIT became an <strong>Institute of National Importance</strong> under the NIT Act with effect from 15 August 2007.</p>","courses_offered":"<ul><li><strong>B.Tech</strong> and M.Sc</li><li><strong>M.Tech</strong> and M.Tech (Research)</li><li><strong>MBA:</strong> two years, full time</li><li><strong>Ph.D.</strong></li></ul><p><strong>Departments:</strong> Artificial Intelligence, Chemical, Civil, Computer Science and Engineering, Electrical, Electronics, and Mechanical Engineering; Chemistry; Mathematics; Physics; Humanities and Social Sciences; Management Studies.</p>","admission_process":"<p>B.Tech seats are filled through JoSAA and CSAB, with DASA for eligible international candidates. Allotted candidates pay the balance fee after the amount received through JoSAA or CSAB and report in person. The MBA, M.Tech and Ph.D. each have their own information brochure.</p>","eligibility":"<p>B.Tech candidates must meet JEE (Main), JoSAA and CSAB conditions for the admission year. Other programmes publish conditions in their brochures.</p>","entrance_exams":"JEE (Main) through JoSAA and CSAB for B.Tech","fees_information":"<p><strong>B.Tech, 2026 reporting notice, first-semester institute fee:</strong> Rs 1,07,500 for General, OBC and EWS; Rs 45,000 for SC, ST and PwD. The amount paid through JoSAA or CSAB (Rs 70,000 or Rs 30,000) is adjusted. The institute said a separate notice on tuition remission would follow.</p><p><strong>First-year hostel fee, 2026 DASA notice:</strong> Rs 44,380.</p>","campus_facilities":"<p>The 2021-22 annual report describes a campus of about 250 acres, with separate buildings for each academic department.</p>","hostel_information":"<p>SVNIT is residential. First-year men stay at Gajjar Bhavan and women at Mother Teresa Bhavan, in double or multiple-seated rooms. An MBA brochure mentions nine hostels on campus.</p>","placement_information":"<p>The Career Development
