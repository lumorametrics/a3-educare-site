    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:11.185Z","entries":{"college:goa-university":[{"id":1109,"date":"2026-11-04T06:54:38","date_gmt":"2026-11-04T06:54:38","guid":{"rendered":"https://staging.a3educarehub.in/colleges/goa-university/"},"modified":"2026-11-04T06:54:38","modified_gmt":"2026-11-04T06:54:38","slug":"goa-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/goa-university/","title":{"rendered":"Goa University"},"content":{"rendered":"","protected":false},"featured_media":1193,"template":"","class_list":["post-1109","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Goa University was set up under the Goa University Act of 1984 and began work on 1 June 1985. Its 402-acre campus on the Taleigao Plateau overlooks the Zuari estuary, and it admits postgraduate students through its own GU-ART test.","college_overview":"<p>Goa University began work on 1 June 1985 under an Act passed the year before. It is Goa's state public university, and its 402-acre campus sits on the Taleigao Plateau above the Zuari estuary.</p><p>Notices for 2026-27 list postgraduate and B.Ed. admission through GU-ART, an integrated MBA in Hospitality and Tourism, an integrated M.Sc. in Data Science and a B.Voc. in Electronics.</p><p>On-campus hostels are named after Goan places and are divided by level of study: Miramar and Cavolosim for postgraduates, for instance, and Baga and Palolem for doctoral scholars.</p>","location":"Taleigao Plateau, Goa 403206, India","city":"Taleigao, Panaji","state":"Goa","established":"1985 (began work on 1 June)","affiliation":"State public university under the Goa University Act, 1984","recognition":"<p>Goa University is recognised by the UGC under Section 12-B.</p>","courses_offered":"<ul><li><strong>Postgraduate and B.Ed.:</strong> through GU-ART</li><li><strong>Integrated:</strong> MBA in Hospitality and Tourism, and M.Sc. in Data Science</li><li><strong>Vocational:</strong> B.Voc. in Electronics</li><li><strong>Doctoral:</strong> research programmes</li></ul>","admission_process":"<p>Postgraduate and B.Ed. admissions for 2026-27 run through GU-ART, with round-wise notifications on the university's admission news page. Students joining an affiliated college approach its principal for tuition and hostel details.</p>","eligibility":"<p>Conditions are set out programme by programme in the university's prospectus and admission notices.</p>","entrance_exams":"GU-ART for postgraduate and B.Ed. programmes","fees_information":"<p><strong>Hostel, undated university fee table:</strong> Rs 7,200 for two terms in shared accommodation for master's students, plus a refundable caution deposit of Rs 3,000. Doctoral scholars pay Rs 1,000 a month.</p>","campus_facilities":"<p>The campus covers 402 acres on the Taleigao Plateau, overlooking the Zuari estuary.</p>","hostel_information":"<ul><li><strong>Men:</strong> Miramar for postgraduates (168 places) and Baga for Ph.D. scholars (28)</li><li><strong>Women:</strong> Cavolosim (200) and Arambol (60) for postgraduates, and Palolem for Ph.D. scholars (40)</li></ul><p>Annual fees are paid in one instalment at admission. Mess charges are payable by semester or year.</p>","placement_information":"<p>Placement is handled by the Directorate of Student Placement and Alumni Relations (DSPAR), which invites companies to the campus each year. Its Career Counselling Cell runs guidance sessions, including a UPSC coaching programme with the Public Relations Section.</p><p><strong>Recent campus drives listed by the university:</strong></p><ul><li>2025: Amardeep Pharma, Abbott India, VV Biotech, Molbio Diagnostics, Bodhi Academy and Deccan Fine Chemicals</li><li>2024: Teach for India, Delhi World School, Abbott India, Godrej Agrovet, V.M. Salgaoncar and Unichem Laboratories</li></ul><p>Other recruiters the university names include Bajaj Finance, SBI Life Insurance, Cipla, Syngenta Biosciences and Jubilant Foodworks. The DSPAR page gives no placement counts or salary figures. Contact: +91-8669609005.</p>","scholarships":"<p><strong>University schemes for campus students:</strong></p><ul><li>Merit Scholarship, Free Studentship and Student Aid Fund for eligible undergraduate, postgraduate and PG diploma students; the last date listed for 2026 was 30 September 2026</li><li>Research Studentship for full-time Ph.D. scholars, within available funds</li><li>Earn While You Learn, paid on-campus work for students without another scholarship or fellowship</li><li>Grants for students presenting at international conferences</li></ul><p><strong>Government schemes listed by the university:</strong> Goa government schemes through the CM Scholarship portal, including Gagan Bharari Shiksha Yojana and merit scholarships for SC and ST students (last date 15 November 2026), the Manohar Parrikar Goa Scholars Scheme for postgraduate or doctoral study, and the Goa Financial Assistance (Bursary) Scheme. Post-matric scholarships for SC and ST students and the UGC National Scholarship for PG Studies are applied for through the National Scholarship Portal.</p>","college_image":null,"official_website":"https://www.unigoa.ac.in","cta_heading":"Planning a master's at Goa University?","cta_description":"Get help with GU-ART and choosing your subject.","faq_1_question":"When did Goa University begin?","faq_1_answer":"<p>On 1 June 1985, under the Goa University Act of 1984.</p>","faq_2_question":"What is GU-ART?","faq_2_answer":"<p>The university's admission route for postgraduate and B.Ed. programmes.</p>","faq_3_question":"How large is the campus?","faq_3_answer":"402 acres on the Taleigao Plateau.","faq_4_question":"Are there hostels?","faq_4_answer":"<p>Yes. Separate hostels serve men and women, divided by level of study.</p>","faq_5_question":"How much is a shared hostel place?","faq_5_answer":"<p>Rs 7,200 for two terms for master's students, on an undated fee table. Confirm the amount with the hostel office.</p>","featured_image":{"id":1193,"date":"2026-11-04T07:25:56","date_gmt":"2026-11-04T07:25:56","guid":{"rendered":"https://staging.a3educarehub.in/colleges/goa-university/goa-university-campus/"},"modified":"2026-11-04T07:25:56","modified_gmt":"2026-11-04T07:25:56","slug":"goa-university-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/goa-university/goa-university-campus/#main","title":{"rendered":"Goa University campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1193","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/goa-university.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"226\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/goa-university-300x226.jpg\" class=\"attachment-medium size-medium\" alt=\"Goa University campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/goa-university-300x226.jpg 300w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/goa-university-1024x770.jpg 1024w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/goa-university-768x578.jpg 768w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/goa-university.jpg 1280w\" sizes=\"(max-width: 300px) 100vw, 300px\" /></a></p>\n<p>Source: https://commons.wikimedia.org/wiki/File:Goa_University_library,_Goa,_India.jpg | License: CC BY-SA 3.0 | Author: Fredericknoronha</p>\n"},"caption":{"rendered":"<p>Goa University. Photo: Fredericknoronha, CC BY-SA 3.0, via Wikimedia Commons</p>\n"},"alt_text":"Goa University campus","media_type":"image","mime_type":"image/jpeg","media_details":{"sizes":{"medium":{"file":"goa-university-300x226.jpg","width":300,"height":226,"f
