    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:34.345Z","entries":{"college:nit-durgapur":[{"id":1087,"date":"2026-11-04T06:53:24","date_gmt":"2026-11-04T06:53:24","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-durgapur/"},"modified":"2026-11-04T06:53:24","modified_gmt":"2026-11-04T06:53:24","slug":"nit-durgapur","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nit-durgapur/","title":{"rendered":"National Institute of Technology Durgapur"},"content":{"rendered":"","protected":false},"featured_media":1177,"template":"","class_list":["post-1087","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"NIT Durgapur, formerly the Regional Engineering College, Durgapur, dates to 1960 and sits on Mahatma Gandhi Avenue. It admits B.Tech, dual degree, integrated M.Sc, M.Tech and MBA students, and its placement portal reports a 12.16 lakh average package.","college_overview":"<p>The institute was established in 1960 as the Regional Engineering College, Durgapur, and is now a National Institute of Technology funded by the Government of India.</p><p>Its programmes include B.Tech, dual degree and five-year integrated M.Sc courses, along with two-year M.Sc, MSW, M.Tech and MBA programmes.</p><p>Undergraduate seats come through JoSAA and CSAB. Its fee structure is income-based, and the institute fee is nil for SC, ST and PwD candidates and for lower-income General, EWS and OBC-NCL candidates.</p>","location":"Mahatma Gandhi Avenue, Durgapur, West Bengal, India","city":"Durgapur","state":"West Bengal","established":"1960 (as Regional Engineering College, Durgapur)","affiliation":"National Institute of Technology; awards its own degrees","recognition":"<p>NIT Durgapur is a National Institute of Technology. Its site cites NIRF Engineering ranks of 44th in 2024 and 49th in 2025.</p>","courses_offered":"<ul><li><strong>Undergraduate and integrated:</strong> B.Tech, Dual Degree and 5-year Integrated M.Sc</li><li><strong>Postgraduate:</strong> 2-year M.Sc, MSW, M.Tech and MBA</li><li><strong>Doctoral:</strong> Ph.D.</li></ul>","admission_process":"<p>B.Tech and dual degree candidates arrive through JoSAA or CSAB; DASA, SII and MEA allotments have their own fee instructions. For 2026, the institute fee link opened on 13 August, hostel reporting ran from 17 to 19 August, and classes began on 20 August.</p>","eligibility":"<p>Undergraduate candidates must meet JEE (Main), JoSAA and CSAB conditions for the admission year. Candidates claiming income-based concessions must submit an income certificate issued on or after 1 April of the admission year.</p>","entrance_exams":"JEE (Main) through JoSAA and CSAB for undergraduate programmes","fees_information":"<p>The institute publishes separate 2026-27 fee structures for B.Tech, Dual Degree and Integrated M.Sc, and for M.Sc, MSW, M.Tech and MBA. Under the 2026 notice the institute fee is nil for SC, ST and PwD candidates and for lower-income General, EWS and OBC-NCL candidates. DASA candidates are listed at Rs 48,600.</p>","campus_facilities":"<h4>Central Library</h4><ul><li>Reading rooms on three floors, a reference room, a periodical section and a Centre for Digital Learning (CDL) room.</li><li>Open 8:30 AM to 9:00 PM on weekdays, 9:00 AM to 5:00 PM on weekends and until 10:00 PM during examinations.</li><li>E-resources include One Nation One Subscription, e-Shodh Sindhu, Shodhganga, the National Digital Library of India, NPTEL and remote access through INFED; Grammarly, iThenticate and URKUND are available for writing and plagiarism checks.</li></ul><h4>Sports and physical education</h4><ul><li>Separate gymnasium timings for men and women.</li><li>The 'Lords' football stadium and the central 'Oval' ground; floodlit volleyball, basketball, tennis and badminton courts; a concrete cricket practice pitch; table tennis, chess and yoga.</li><li>Compulsory co-curricular credit courses for first-year students in physical education, games, yoga, martial arts, NCC or NSS; an annual sports meet and inter-NIT and inter-university tournaments.</li><li>An NCC senior division wing for men and women under 10 Bengal BN NCC, Asansol.</li></ul>","hostel_information":"<h4>Halls of residence at NIT Durgapur</h4><p>The institute lists 14 halls of residence:</p><ul><li>Netaji Subhas Chandra Bose Hall (Hall-1), Jagadish Chandra Bose Hall (Hall-2), Rabindra Nath Tagore Hall (Hall-3), C V Raman Hall (Hall-4), Swami Vivekananda Hall (Hall-5), Rishi Aurobindo Hall (Hall-6), Sister Nivedita Hall (Hall-7)</li><li>Preetilata Waddader Hall (Hall-8), Satyendra Nath Bose Hall (Hall-9), Mother Teresa Hall (Hall-10), Meghnad Saha Hall (Hall-11), A.P.J. Abdul Kalam International Hostel (Hall-12), Sarojini Naidu Hall (Hall-13) and Dr B. R. Ambedkar Hall (Hall-14)</li></ul><p>Most halls have volleyball and badminton courts, table tennis and carrom. First-year UG and first-year PG (M.Tech and M.Sc) hostel allotment notices for 2026 are published on the institute website. Hall capacities and hostel fees are not stated on the Hostels page.</p>","placement_information":"<p>The institute's placement portal shows a 77.69% placement rate, an average package of Rs 12.16 lakh, a highest package of Rs 80 lakh and 477 offers.</p>","scholarships":"","college_image":null,"official_website":"https://nitdgp.ac.in","cta_heading":"Considering NIT Durgapur?","cta_description":"Get help with your JEE (Main) strategy and JoSAA choices.","faq_1_question":"How do I get B.Tech admission at NIT Durgapur?","faq_1_answer":"<p>Appear for JEE (Main), then take part in JoSAA or CSAB seat allocation.</p>","faq_2_question":"Was NIT Durgapur previously called something else?","faq_2_answer":"<p>Yes. It was formerly the Regional Engineering College, Durgapur, established in 1960.</p>","faq_3_question":"What programmes are offered besides B.Tech?","faq_3_answer":"Dual degree, integrated M.Sc, M.Sc, MSW, M.Tech, MBA and Ph.D. programmes.","faq_4_question":"Who pays no institute fee?","faq_4_answer":"<p>SC, ST and PwD candidates, and General, EWS and OBC-NCL candidates in the lower income bracket, under the 2026 notice.</p>","faq_5_question":"What placement figures does the institute report?","faq_5_answer":"<p>Its portal shows an average package of Rs 12.16 lakh and a highest package of Rs 80 lakh.</p>","featured_image":{"id":1177,"date":"2026-11-04T07:24:56","date_gmt":"2026-11-04T07:24:56","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-durgapur/national-institute-of-technology-durgapur-campus/"},"modified":"2026-11-04T07:24:56","modified_gmt":"2026-11-04T07:24:56","slug":"national-institute-of-technology-durgapur-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nit-durgapur/national-institute-of-technology-durgapur-campus/#main","title":{"rendered":"National Institute of Technology Durgapur campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1177","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-durgapur.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"205\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-durgapur-300x205.jpg\" class=\"attachment-medium size-medium\" alt=\"National Institute of Technology Durgapur campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-durgapur-300x205.jpg 300w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-durgapur-1024x700.jpg 1024w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-durgapur-768x525.jpg 768w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-durgapur.jpg 1080w\" sizes=\"(max-width: 300px) 100vw,
