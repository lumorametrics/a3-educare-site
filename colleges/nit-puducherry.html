    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:25:01.404Z","entries":{"college:nit-puducherry":[{"id":1050,"date":"2026-11-04T06:29:26","date_gmt":"2026-11-04T06:29:26","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-puducherry/"},"modified":"2026-11-04T06:29:26","modified_gmt":"2026-11-04T06:29:26","slug":"nit-puducherry","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nit-puducherry/","title":{"rendered":"National Institute of Technology Puducherry"},"content":{"rendered":"","protected":false},"featured_media":1054,"template":"","class_list":["post-1050","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"NIT Puducherry began B.Tech teaching in 2010-11 and works from Thiruvettakudy, Karaikal. An Institute of National Importance under the Ministry of Education, it placed 158 of 197 registered B.Tech students in 2023-24, with a top package of Rs 24 lakh.","college_overview":"<p>The institute started in 2010-11 with three B.Tech branches: Electrical and Electronics, Electronics and Communication, and Computer Science. Mechanical Engineering was listed as a fourth branch by 2014-15. It is located at Thiruvettakudy in Karaikal, not in Puducherry town.</p><p>It is an Institute of National Importance under the Ministry of Education, and its B.Tech regulations were revised with effect from 2025-26.</p><p>The Training and Placement office publishes annual reports. In 2023-24, 158 of 197 registered B.Tech students were placed, an 80.2% rate, and in 2024-25 the highest package was Rs 23 lakh.</p>","location":"Thiruvettakudy, Karaikal 609609, Puducherry, India","city":"Karaikal","state":"Puducherry","established":"2010","affiliation":"Institute of National Importance under the Ministry of Education; awards its own degrees","recognition":"<p>NIT Puducherry is an <strong>Institution of National Importance</strong> under the Ministry of Education, Government of India.</p>","courses_offered":"<ul><li><strong>B.Tech:</strong> Computer Science, Electronics and Communication, Electrical and Electronics, and Mechanical Engineering</li></ul>","admission_process":"<p>B.Tech seats are filled through JEE (Main) and central seat allocation under the Ministry of Education's process for NITs.</p>","eligibility":"<p>Candidates must meet JEE (Main) and seat allocation conditions for the admission year.</p>","entrance_exams":"JEE (Main) for B.Tech","fees_information":"","campus_facilities":"<p>The institute is at Thiruvettakudy, Karaikal, and publishes directions on its how-to-reach page.</p>","hostel_information":"<p>The institute issues hostel circulars for B.Tech students by year and semester on its website, including for 2026-27.</p>","placement_information":"<ul><li><strong>2023-24:</strong> 158 B.Tech students placed out of 197 registered (80.2%); highest CTC Rs 24 lakh</li><li><strong>2024-25:</strong> highest CTC Rs 23 lakh; Computer Science 92% and Electronics and Communication 84% placed</li></ul>","scholarships":"<h4>Current scholarship notices (NIT Puducherry)</h4><ul><li>National Scholarship for Higher Education of ST Students (Top Class Scheme): applications invited for 2026-27.</li><li>National Overseas Scholarship for ST students: advertisement for 2026-27.</li><li>Scholarship to BC, MBC and DNC students from Tamil Nadu studying at NIT, IIT, IIM or IIIT (Tamil Nadu Welfare of Backward Classes).</li><li>Post-matric scholarship for OBC and MBC students from the UT of Puducherry.</li><li>Sh. Dorilal Agrawal Meritorious Scholarship for physically challenged students.</li></ul><h4>National Scholarship Portal (NSP 2.0)</h4><p>First-year students are told to apply on NSP. The institute provides a standard operating procedure, a registration guide and procedures for obtaining a bonafide certificate, the institute and hostel fee structures, and institute-level verification.</p><p>Some notices on the page da
