    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:33.480Z","entries":{"college:nujs-kolkata":[{"id":1091,"date":"2026-11-04T06:53:51","date_gmt":"2026-11-04T06:53:51","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nujs-kolkata/"},"modified":"2026-11-04T06:53:51","modified_gmt":"2026-11-04T06:53:51","slug":"nujs-kolkata","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nujs-kolkata/","title":{"rendered":"West Bengal National University of Juridical Sciences"},"content":{"rendered":"","protected":false},"featured_media":1181,"template":"","class_list":["post-1091","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"The West Bengal National University of Juridical Sciences works from a five-acre campus at Salt Lake, Kolkata. It admits its 132 five-year B.A. LL.B. (Hons.) students through CLAT, and first-year fees are listed at Rs 3,06,400.","college_overview":"<p>NUJS occupies a compact campus of about five acres in Salt Lake City, overlooking the Eastern Metropolitan Bypass. Its academic block holds the library, lecture theatres and classrooms, with residential halls, a gym and an auditorium nearby.</p><p>Its five-year B.A. LL.B. (Hons.) seats are divided between All India, West Bengal domicile, NRI and foreign national categories, and admission depends entirely on CLAT performance. The one-year LL.M. also admits through CLAT.</p><p>The library is a strong practical feature: 400 seats, more than 30,000 books and 28 online databases, and it is open 20 hours a day and round the clock around examinations.</p>","location":"Dr. Ambedkar Bhavan, 12, LB Block, Sector III, Salt Lake City, Kolkata 700106, West Bengal, India","city":"Kolkata","state":"West Bengal","established":"1999 (under the WBNUJS Act, 1999)","affiliation":"National Law University of West Bengal","recognition":"<p>NUJS is a participating university in the Consortium of National Law Universities' CLAT.</p>","courses_offered":"<ul><li><strong>B.A. LL.B. (Hons.):</strong> five years; 132 seats, including All India, West Bengal domicile, NRI and foreign national categories</li><li><strong>B.Sc. LL.B.:</strong> listed with its own fee document</li><li><strong>LL.M.:</strong> one year</li></ul>","admission_process":"<p>Admission to the B.A. LL.B. (Hons.) and LL.M. depends on CLAT, conducted by the Consortium of National Law Universities. Foreign national seats are allocated directly by the university, and LL.M. hostel places are subject to availability.</p>","eligibility":"<p>B.A. LL.B. candidates must have passed the 10+2 examination or an equivalent. The CLAT Consortium sets detailed conditions, which may vary by year.</p>","entrance_exams":"CLAT","fees_information":"<p><strong>B.A. LL.B. (Hons.), university admission page, General non-NRI students, first year:</strong> Rs 3,06,400, made up of Rs 2,01,200 in the first semester and Rs 1,05,200 in the winter semester. These include adjustable hostel deposits of Rs 20,000 per semester and a Rs 10,000 refundable deposit. Fees are subject to revision.</p><p><strong>LL.M. (older page):</strong> tuition of Rs 34,000 per semester, plus a composite hostel fee of Rs 30,000.</p>","campus_facilities":"<p>The campus covers about five acres and includes an academic block, residential halls, faculty flats, a guest house, a gym and an auditorium. The library has about 400 seats, more than 30,000 books and 28 online databases. Internet access is 1 Gbps through the National Knowledge Network. A doctor visits three times a week, and counselling support is on campus.</p>","hostel_information":"<p>Separate halls of residence for men and women together accommodate up to 500 students. A student-run mess committee manages dining. Halls have resident wardens, with the Registrar as Chief Warden.</p>","placement_information":"","scholarships":"<h4>Scholarships listed by NUJS</h4><ul><li>NUJS Merit-cum-Means Scholarship</li><li>Swami Vivekananda Merit-cum-Means Scholarship</li><li>Aditya Birla Scholarships</li><li>Scholarships through the National Scholarship Portal</li></ul><p>Eligibility and amounts are published by the university; check the NUJS Scholarships page before applying.</p>","college_image":null,"official_website":"https://www.nujs.edu","cta_heading":"Preparing for CLAT with NUJS in mind?","cta_description":"Get help planning your CLAT preparation and NLU preference order.","faq_1_question":"How do I get into NUJS?","faq_1_answer":"<p>Admission is based solely on CLAT performance, except for foreign national seats allocated directly by the university.</p>","faq_2_question":"How many B.A. LL.B. seats are there?","faq_2_answer":"<p>The admission page lists 132.</p>","faq_3_question":"What is the first-year fee?","faq_3_answer":"Rs 3,06,400 for General non-NRI students, including hostel and refundable deposits.","faq_4_question":"How many students can the halls accommodate?","faq_4_answer":"<p>Up to 500 students, in separate halls for men and women.</p>","faq_5_question":"Is there an LL.M.?","faq_5_answer":"<p>Yes. The one-year LL.M. also admits through CLAT, and hostels are subject to availability.</p>","featured_image":{"id":1181,"date":"2026-11-04T07:25:11","date_gmt":"2026-11-04T07:25:11","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nujs-kolkata/west-bengal-national-university-of-juridical-sciences-campus/"},"modified":"2026-11-04T07:25:11","modified_gmt":"2026-11-04T07:25:11","slug":"west-bengal-national-university-of-juridical-sciences-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nujs-kolkata/west-bengal-national-university-of-juridical-sciences-campus/#main","title":{"rendered":"West Bengal National University of Juridical Sciences campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1181","attac
