    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:05.205Z","entries":{"college:central-agricultural-university-imphal":[{"id":1140,"date":"2026-11-04T06:55:38","date_gmt":"2026-11-04T06:55:38","guid":{"rendered":"https://staging.a3educarehub.in/colleges/central-agricultural-university-imphal/"},"modified":"2026-11-04T06:55:38","modified_gmt":"2026-11-04T06:55:38","slug":"central-agricultural-university-imphal","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/central-agricultural-university-imphal/","title":{"rendered":"Central Agricultural University"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1140","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"Central Agricultural University is a centrally funded institution in Imphal, Manipur, offering agriculture programmes.","college_overview":"<p>Central Agricultural University was established on 26 January 1993 under the Central Agricultural University Act, 1992. Its 2025 profile lists 13 colleges, including the College of Agriculture at Iroisemba, Imphal.</p><p>The profile lists B.Sc. (Hons.) Agriculture among its undergraduate programmes, and the university publishes admission notices on its website.</p>","location":"Imphal, Manipur, India","city":"Imphal","state":"Manipur","established":"1993","affiliation":"Central university under the Central Agricultural University Act, 1992; awards its own degrees","recognition":"<p>The university was established by the Central Agricultural University Act, 1992.</p>","courses_offered":"<ul><li><strong>Undergraduate:</strong> B.Sc. (Hons.) Agriculture and other programmes across its colleges</li></ul>","admission_process":"<p>Listings describe entry through the university's entrance test, ICAR's all-India exam, state nomination and self-financed seats. Routes differ between years and listings, so follow the university's notice for the current cycle.</p>","eligibility":"<p>Requirements differ by programme and are set out in the university's admission notice for each year.</p>","entrance_exams":"University entrance test and ICAR all-India exam, according to listings","fees_information":"","campus_facilities":"<h4>University infrastructure (CAU Profile 2025)</h4><p>CAU describes itself as a fully residential university with constituent colleges across the North-East hill states. Its 2025 profile lists:</p><ul><li>Smart classrooms, well-equipped laboratories, computer laboratories with high-speed internet and six language laboratories.</li><li>Digitally interlinked 24x7 library facilities.</li><li>Six incubation centres, research fields and experimental farms.</li><li>A medical unit, canteens, indoor stadiums, a gymnasium and student hostels.</li><li>Solar-powered campuses that are disabled-friendly.</li></ul><h4>College of Agriculture, Imphal</h4><p>Hostel facility for all students in four separate hostels (UG boys, UG girls, PG boys and PG girls), with security guards, Wi-Fi, 24-hour power, purified drinking water, CCTV and indoor games such as table tennis and carrom.</p><p>Facilities differ between CAU's constituent colleges; check the page of the specific college.</p>","hostel_information":"<p>CAU is a residential university with constituent colleges in several states, and each college runs its own hostels. Verified details for two colleges:</p><h4>College of Agriculture, Imphal</h4><ul><li>Hostel facility for all students of the college, in four separate hostels: UG Boys' Hostel, UG Girls' Hostel, PG Boys' Hostel and PG Girls' Hostel.</li><li>Each hostel is looked after by its own warden.</li><li><strong>Amenities:</strong> security guard, Wi-Fi, 24-hour power supply, purified drinking water, CCTV surveillance, furniture for keeping belongings, and games such as table tennis, carrom, volleyball and a treadmill.</li></ul><h4>College of Fisheries, Lembucherra</h4><ul><li>The campus is residential and all students are accommodated on campus, with separate hostels for boys and girls.</li><li><strong>Boys:</strong> UG Boys' Hostel with 42 rooms; a PG Boys' Hostel (PG and Ph.D students) with 16 rooms; and one scholar house with 4 rooms.</li><li><strong>Girls:</strong> the girls' hostel, near the college entrance, has 39 rooms (including 1 store room) with 2 persons per room, plus four single-occupancy rooms; a scholar house with 4 rooms (two girls per room); and an extra room for 2 near the hall.</li><li>UG and PG students share a common kitchen and dining hall. The girls' hostel is managed by a warden, an assistant warden, a secretary and assistant secretaries, with 24-hour women's security.</li></ul><p>Hostel fees are not stated on these pages; check with the college concerned before admission.</p>","placement_information":"","scholarships":"","college_image":null,"official_website":"https://cau.ac.in","cta_heading":"Considering Central Agricultural University?","cta_description":"Get help choosing a college and following the admission route.","faq_1_question":"When was the university established?","faq_1_answer":"<p>On 26 January 1993, under the Central Agricultural University Act, 1992.</p>","faq_2_question":"How many colleges does it have?","faq_2_answer":"<p>Its 2025 profile lists 13.</p>","faq_3_question":"Where is the College of Agriculture?","faq_3_answer":"<p>At Iroisemba, Imphal.</p>","faq_4_question":"Does it offer B.Sc. Agriculture?","faq_4_answer":"<p>Yes, B.Sc. (Hons.) Agriculture.</p>","faq_5_question":"Where are admission notices published?","faq_5_answer":"<p>On the university's website.</p>","featured_image":{"id":1467,"date":"2026-11-14T12:48:16","date_gmt":"2026-11-14T12:48:16","guid":{"rendered":"https://staging.a3educarehub.in/colleges/central-agricultural-university-imphal/central-agricultural-university-featured-image/"},"modified":"2026-11-14T12:48:16","modified_gmt":"2026-11-14T12:48:16","slug":"central-agricultural-universi
