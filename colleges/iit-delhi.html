    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:32.044Z","entries":{"college:iit-delhi":[{"id":1102,"date":"2026-11-04T06:54:08","date_gmt":"2026-11-04T06:54:08","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iit-delhi/"},"modified":"2026-11-04T06:54:08","modified_gmt":"2026-11-04T06:54:08","slug":"iit-delhi","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/iit-delhi/","title":{"rendered":"Indian Institute of Technology Delhi"},"content":{"rendered":"","protected":false},"featured_media":1188,"template":"","class_list":["post-1102","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIT Delhi began as the College of Engineering in 1961 and was declared an Institution of National Importance in 1963. It teaches on a 320-acre campus at Hauz Khas, holds Institute of Eminence status, and placed 1,359 students in 2024-25.","college_overview":"<p>The institute started in 1961 as the College of Engineering and became the Indian Institute of Technology Delhi under the Institutes of Technology (Amendment) Act, 1963. The Government of India declared it an Institute of Eminence in 2018.</p><p>It has also grown beyond Hauz Khas, with a 50-acre extension campus at Sonepat in Haryana and an international campus opened in Abu Dhabi in 2023. By its own count, close to 66,000 students have graduated since its founding.</p><p>Hostel space is a practical point for applicants. The institute says its 17 hostels can house only a little over half of enrolled students, and rooms are available only to full-time students, subject to availability.</p>","location":"Hauz Khas, New Delhi 110016, India","city":"New Delhi","state":"Delhi","established":"1961 (as College of Engineering)","affiliation":"Institution of National Importance under the Institutes of Technology Act; awards its own degrees","recognition":"<ul><li><strong>Institution of National Importance</strong> under the Institutes of Technology (Amendment) Act, 1963</li><li><strong>Institute of Eminence:</strong> declared by the Government of India in 2018</li><li><strong>NIRF:</strong> the institute's 2024-25 annual report states second place in Engineering</li></ul>","courses_offered":"<ul><li><strong>Undergraduate:</strong> 15 B.Tech programmes, 3 dual degree programmes, a B.S. in Chemistry and a design programme</li><li><strong>Postgraduate:</strong> M.Tech, M.Sc, MBA and other master's programmes listed in the 2026-27 prospectus</li><li><strong>Doctoral:</strong> PhD</li></ul>","admission_process":"<p>Undergraduate seats are filled through JEE (Advanced) and JoSAA counselling. Admitted students pay the balance fee after the amount paid to JoSAA is adjusted (Rs 25,000 for General, OBC and EWS candidates, and Rs 10,000 for SC, ST and PwD candidates).</p><p>The institute's 2026-27 prospectus sets out postgraduate and doctoral admission routes programme by programme.</p>","eligibility":"<p>Undergraduate candidates must qualify under JEE (Advanced) and JoSAA rules for the admission year. Postgraduate eligibility is listed by programme in the prospectus.</p>","entrance_exams":"JEE (Advanced) for undergraduate programmes; other tests by programme, as listed in the prospectus","fees_information":"<p><strong>B.Tech, Dual Degree, B.S. and Design, new entrants 2026-27, total first-semester fees:</strong></p><ul><li><strong>General, OBC and EWS, family income above Rs 5 lakh:</strong> Rs 1,31,000 for hostel residents; Rs 1,22,400 for day scholars</li><li><strong>Same categories, family income Rs 1-5 lakh:</strong> Rs 64,333; Rs 55,733</li><li><strong>Same categories, family income below Rs 1 lakh:</strong> Rs 31,000; Rs 22,400</li><li><strong>SC, ST and PwD:</strong> Rs 31,000; Rs 22,400</li></ul><p>Tuition is Rs 1,00,000 in the top band, Rs 33,333 in the Rs 1-5 lakh band and nil in the others. The fee circular shows a hostel difference of Rs 8,600. Mess dues are paid separately.</p>","campus_facilities":"<p>The Hauz Khas campus covers 320 acres. IIT Delhi also has an extension campus of 50 acres at Sonepat, Haryana, and an international campus in Abu Dhabi, established in 2023.</p>","hostel_information":"<p>IIT Delhi lists 17 hostels:</p><ul><li><strong>For men:</strong> Aravali, Girnar, Jwalamukhi, Karakoram, Kumaon, Nilgiri, Shivalik, Satpura, Udaigiri, Vindhyachal, Zanskar, Dronagiri (postgraduate) and Saptagiri (postgraduate)</li><li><strong>For women:</strong> Kailash, Himadri, Sahyadri (postgraduate), Saptagiri (postgraduate) and Nalanda (generally transit accommodation)</li></ul><p>The institute says hostels can accommodate only a little over half of enrolled students, and rooms are available only to full-time students, subject to availability.</p>","placement_information":"<p><strong>2024-25, institute annual report:</strong> 534 job profiles, 378 companies recruited, 1,481 job offers and 1,359 students placed.</p><p><strong>Exit survey of 2,656 students who graduated in August 2024:</strong> 1,411 received job offers and 359 opted for higher studies. Another 224 were self-employed and 66 chose entrepreneurship. Five per cent reported they were still looking for career opportunities.</p>","scholarships":"<p>The 2026-27 prospectus and the institute's financial assistance page list the following.</p><h4>Undergraduate</h4><ul><li><strong>Merit-cum-Means (MCM):</strong> for about 25% of students with annual family income up to Rs 8 lakh. It pays Rs 4,000 per month to General, OBC and EWS students and exempts them from tuition fees. Renewal needs a minimum CGPA and SGPA of 6.0, and income proof is uploaded each year on ERP.</li><li><strong>Merit prizes:</strong> Rs 2,500 per semester and a certificate for the top 7% of each 4-year B.Tech and 5-year Dual Degree programme.</li><li><strong>Free Studentship:</strong> a tuition fee waiver for 10% of students on means alone, if more than 25% are eligible for MCM.</li><li><strong>SC, ST and PwD students:</strong> tuition fee exemption whatever the family income.</li><li><strong>Free messing and pocket allowance:</strong> for SC and ST students with annual family income below Rs 8 lakh, covering basic menu charges plus Rs 1,000 per month, for a fixed period that depends on the programme.</li><li><strong>Donor scholarships:</strong> funded by alumni, individuals, trusts and organisations, and based on family income, programme, gender, branch, JEE rank and academic performance. Most are processed automatically.</li></ul><h4>Postgraduate and doctoral</h4><ul><li><strong>M.A., M.Sc. and M.P.P.:</strong> MCM on the same terms as undergraduates.</li><li><strong>M.Tech, M.S. (Research) and M.Des:</strong> financial assistance under Government of India guidelines, in return for teaching or research support, along with other fellowships from industry, alumni and individuals.</li><li><strong>Ph.D.:</strong> full-time students are offered a Teaching or Research Assistantship under Government of India guidelines if they hold no equivalent external fellowship.</li></ul><p><strong>Numbers awarded, 2024-25 annual report:</strong> for B.Tech and Dual Degree students, 650 scholarships, 287 cash prizes and 238 free mess awards. Across the institute, 84 donor awards went to 111 students.</p>","college_image":null,"official_website":"https://home.iitd.ac.in","cta_heading":"Targeting IIT Delhi?","cta_description":"Get help with your JEE (Advanced) preparation and JoSAA choices.","faq_1_question":"How do I get admission to B.Tech at IIT Delhi?","faq_1_answer":"<p>Qualify in JEE (Advanced), then take part in JoSAA counselling.</p>","faq_2_question":"What is the first-semester fee for 2026-27?","faq_2_answer":"<p>For General, OBC and EWS students with family income above Rs 5 lakh, it is Rs 1,31,000 for hostel residents and Rs 1,22,400 for day scholars. It is lower for other income bands and categories.</p>","faq_3_question":"How many students were placed in 2024-25?","faq_3_answer":"The institute's annual report lists 1,359 students placed, with 378 companies recruiting.","faq_4_question":"Is a hostel room guaranteed?","faq_4_answer":"<p>No. The institute says its hostels can house only a little over half of enrolled students, and rooms depend on availability.</p>","faq_5_question":"Does IIT Delhi have other campuses?","faq_5_answer":"<p>Yes. It has an extension campus at Sonepat, Haryana, and an international campus in Abu Dhabi.</p>","featured_image":{"id":1188,"date":"2026-11-04T07:25:36","date_gmt":"2026-11-04T07:25:36","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iit-delhi/indian-institute-of-technology-delhi-campus/"},"modified":"2026-11-04T07:25:36","modified_gmt":"2026-11-04T07:25:36","slug":"indian-institute-of-technology-delhi-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/iit-delhi/indian-institute-of-technology-delhi-campus/#main","title":{"rendered":"Indian Institute of Technology Delhi campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1188","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/iit-delhi.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"225\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/iit-delhi-300x225.jpg\" class=\"attachment-medium size-medium\" alt=\"Indian Institute of Technology Delhi campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/iit-delhi-300x225.jpg 300w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/iit-delhi-1024x768.jpg 1024w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/iit-delhi-768x576.jpg 768w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/iit-delhi.jpg 1280w\" sizes=\"(max-
