    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:16.568Z","entries":{"college:iit-jammu":[{"id":1117,"date":"2026-11-04T06:54:48","date_gmt":"2026-11-04T06:54:48","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iit-jammu/"},"modified":"2026-11-04T06:54:48","modified_gmt":"2026-11-04T06:54:48","slug":"iit-jammu","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/iit-jammu/","title":{"rendered":"Indian Institute of Technology Jammu"},"content":{"rendered":"","protected":false},"featured_media":1198,"template":"","class_list":["post-1117","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIT Jammu's campus at Jagti is about 20 minutes from Jammu's airport and railway station. Its 2025-26 placement report, dated 3 June 2026, records more than 210 registered companies and more than 345 offers across B.Tech, M.Tech and science programmes.","college_overview":"<p>IIT Jammu is on NH-44 at Jagti, around 20 minutes from Jammu's airport and railway station. Its degrees span seven B.Tech branches, M.Tech specialisations, and M.Sc. and MS (Research) programmes.</p><p>Students live in twin-sharing rooms in separate hostels for men and women, with reading rooms, a gym and space for indoor and outdoor games.</p><p>Career and Development Services reported more than 210 registered companies and 345 offers in 2025-26, with a highest industrial stipend of Rs 2.5 lakh per month.</p>","location":"Jagti, P.O. Nagrota, NH-44, Jammu, Jammu and Kashmir, India","city":"Jagti, Nagrota","state":"Jammu and Kashmir","established":"2016","affiliation":"Indian Institute of Technology; awards its own degrees","recognition":"<p>IIT Jammu is one of the Indian Institutes of Technology.</p><p>The institute describes the IITs as Institutes of National Importance and IIT Jammu as one of the newest members of that group, established in 2016.</p>","courses_offered":"<ul><li><strong>B.Tech:</strong> Civil, Chemical, Computer Science, Electrical, Materials, Mathematics and Computing, and Mechanical Engineering</li><li><strong>M.Tech:</strong> Computer Science, Signal Processing and Communication, Structural, Sustainable Energy, Thermal, Tunnel Engineering and VLSI Design</li><li><strong>Science:</strong> M.Sc. and MS (Research), including Physics and Chemistry</li></ul>","admission_process":"<p>B.Tech seats come through JEE (Advanced) and JoSAA. For the 2026 batch, registration closed on 27 July, after which the academic office verified documents and issued a challan for institute and mess charges.</p>","eligibility":"<p>B.Tech candidates must meet JEE (Advanced) and JoSAA conditions for the admission year.</p>","entrance_exams":"JEE (Advanced) for B.Tech","fees_information":"<p>The institute's fee page lists the B.Tech 2026 batch fee structure. After document verification, the academic office issues a challan for institute and mess charges.</p>","campus_facilities":"<p>The campus is at Jagti on NH-44, around 20 minutes from Jammu's airport and railway station.</p>","hostel_information":"<p>Men and women have separate hostels. Each student gets a twin-sharing room with basic furniture and an internet connection, and hostels have reading rooms, a gym, and indoor and outdoor games.</p>","placement_information":"<p><strong>2025-26, as of 3 June 2026:</strong> more than 210 companies registered; more than 345 offers; highest industrial stipend of Rs 2.5 lakh per month.</p>","scholarships":"<p>SC and ST students are exempt from tuition. An institute scholarship policy also describes remission for General, OBC-NCL and EWS students with family income of Rs 1-4.5 lakh, capped at 10% of students. Check the current policy before relying on it.</p>","college_image":null,"official_website":"https://www.iitjammu.ac.in","cta_heading":"Aiming for IIT Jammu?","cta_description":"Get help with JEE (Advanced) and your JoSAA branch choices.","faq_1_ques
