    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:56.774Z","entries":{"college:iim-ahmedabad":[{"id":1081,"date":"2026-11-04T06:53:16","date_gmt":"2026-11-04T06:53:16","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iim-ahmedabad/"},"modified":"2026-11-04T06:53:16","modified_gmt":"2026-11-04T06:53:16","slug":"iim-ahmedabad","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/iim-ahmedabad/","title":{"rendered":"Indian Institute of Management Ahmedabad"},"content":{"rendered":"","protected":false},"featured_media":1173,"template":"","class_list":["post-1081","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIM Ahmedabad, established in 1961, is a public business school at Vastrapur, Ahmedabad. Its flagship two-year PGP has run for more than fifty years and leads to an MBA, with teaching built around the case method, field projects and leadership development.","college_overview":"<p>The Indian Institute of Management Ahmedabad was established on 11 December 1961, after a group of industrialists and educators persuaded the Planning Commission to back a new kind of school for training professional managers. Its campus at Vastrapur now has a heritage section and a newer section, each with its own academic blocks.</p><p>The flagship Post Graduate Programme (PGP) brings together fresh graduates and experienced professionals. The first year builds a foundation across management functions through compulsory courses. In the second year, students combine electives into a general management profile or a specialisation such as finance, marketing or operations. A one-term exchange is available with more than eighty management schools worldwide.</p><p>Beyond the PGP, IIMA runs a Food and Agri-Business MBA (MBA-FABM), a one-year MBA for experienced professionals (MBA-PGPX), blended programmes and a PhD. Its alumni number more than 40,000.</p>","location":"Vastrapur, Ahmedabad 380015, Gujarat, India","city":"Ahmedabad","state":"Gujarat","established":"1961","affiliation":"Autonomous institute; awards its own MBA and PhD degrees","recognition":"<p>IIM Ahmedabad is a public, autonomous business school that awards its own degrees. The PGP leads to a Master's degree in Business Administration. Its placement results are audited and published under the Indian Placement Reporting Standards (IPRS).</p>","courses_offered":"<ul><li><strong>MBA (PGP):</strong> two-year flagship programme, with a one-term exchange and dual-degree options with select partner schools.</li><li><strong>MBA-FABM:</strong> specialised MBA in food and agri-business.</li><li><strong>MBA-PGPX:</strong> one-year MBA for experienced professionals.</li><li><strong>Blended MBA (BPGP), including Business Analytics &amp; AI:</strong> for working professionals.</li><li><strong>ePGD-ABA:</strong> online postgraduate diploma in advanced business analytics.</li><li><strong>PhD:</strong> doctoral programme.</li></ul>","admission_process":"<p><strong>PGP 2027-29, domestic candidates:</strong> applicants who took CAT 2026 and chose IIMA's two-year PGP are shortlisted on a composite score. This combines an application rating (Class 10, Class 12 and undergraduate marks, gender and full-time work experience) with CAT results.</p><p>Shortlisted candidates then take an Analytical Writing Test and a Personal Interview. Separate policies apply to the Overseas Indian Category and the Supernumerary Quota; overseas applicants use GMAT.</p>","eligibility":"<p><strong>PGP 2027-29, domestic:</strong></p><ul><li>A bachelor's degree with at least 50% marks or equivalent CGPA (45% for SC, ST and PwD), after at least three years of study following 10+2.</li><li>Final-year students may apply, but must complete all degree requirements by 30 June 2027.</li><li>Applicants must be Indian nationals aged 19 or older by 30 June 2027 and must have taken CAT 2026.</li></ul>","entrance_exams":"CAT (domestic); GMAT (overseas applicants)","fees_information":"<p><strong>PGP 2026-28, overseas and international admissions:</strong> IIMA's policy lists a programme fee of US$ 50,000, inclusive of tuition. It excludes personal expenses such as a laptop, travel and stationery.</p><p>The official fee for domestic PGP candidates could not be confirmed from an IIMA document at the time of writing. Please confirm it with the IIMA Admissions Office.</p>","campus_facilities":"<p>The Vastrapur campus has heritage and newer sections, academic blocks and the R.J. Matthai Auditorium. On-campus services include a dispensary, a pharmacy, a post office and a bank branch with ATM.</p>","hostel_information":"<p>IIMA describes student housing of 27 dormitories for 740 students, along with 120 flats for married students.</p>","placement_information":"<p><strong>PGP Class of 2026 (IIMA release, 27 March 2026):</strong> final placements concluded with all students placed, across 26 cohorts.</p><ul><li><strong>Consulting:</strong> Boston Consulting Group (33 offers), McKinsey &amp; Company (21), Bain &amp; Company (20).</li><li><strong>Investment banking:</strong> Goldman Sachs (6), Citibank (4).</li><li><strong>Conglomerates:</strong> Essar Group (8), Tata Administrative Services (5), Aditya Birla Group (4), Godrej Industries Group (4), Mahindra (4).</li><li><strong>Lateral process:</strong> FinIQ Consulting (15), NTT Data (14).</li></ul><p>Summer placements for the 2025-27 batch recorded 410 accepted offers, according to IIMA's audited report. Salary figures should be taken from the audited IPRS reports.</p>","scholarships":"<p>IIMA's published rules (2023) describe financial assistance for students, including alumni-funded awards such as the P H Shah merit-cum-means scholarship, which considers annual family income and first-year CGPA. Please confirm current schemes and amounts with the institute.</p>","college_image":null,"official_website":"https://www.iima.ac.in","cta_heading":"Preparing for IIM Ahmedabad?","cta_description":"Get guidance on CAT, your application profile and the WAT and interview stages.","faq_1_question":"What is the minimum eligibility for the IIMA PGP?","faq_1_answer":"<p>For the 2027-29 batch: a bachelor's degree with at least 50% marks (45% for SC, ST and PwD), and a CAT 2026 score for domestic applicants.</p>","faq_2_question":"How does IIMA select PGP students?","faq_2_answer":"<p>Shortlisting uses a composite score based on academics, work experience and CAT. Shortlisted candidates then take an Analytical Writing Test and a Personal Interview.</p>","faq_3_question":"Which degree does the PGP lead to?","faq_3_answer":"The two-year PGP leads to a Master's degree in Business Administration.","faq_4_question":"Who recruited most from the PGP Class of 2026?","faq_4_answer":"<p>IIMA reports Boston Consulting Group as the largest recruiter with 33 offers, followed by McKinsey &amp; Company (21) and Bain &amp; Company (20).</p>","faq_5_question":"How can I contact IIMA admissions?","faq_5_answer":"<p>The Admissions Office can be reached at admission@iima.ac.in or +91 79 7152 4631.</p>","featured_image":{"id":1173,"date":"2026-11-04T07:24:44","date_gmt":"2026-11-04T07:24:44","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iim-ahmedabad/indian-institute-of-management-ahmedabad-campus/"},"modified":"2026-11-04T07:24:44","modified_gmt":"2026-11-04T07:24:44","slug":"indian-institute-of-management-ahmedabad-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/iim-ahmedabad/indian-institute-of-management-ahmedabad-campus/#main","title":{"rendered":"Indian Institute of Management Ahmedabad campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1173","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href
