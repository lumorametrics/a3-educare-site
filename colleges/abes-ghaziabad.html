    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:48.106Z","entries":{"college:abes-ghaziabad":[{"id":211,"date":"2026-09-30T08:11:56","date_gmt":"2026-09-30T08:11:56","guid":{"rendered":"https://staging.a3educarehub.in/colleges/abes-engineering-college/"},"modified":"2026-11-03T10:35:41","modified_gmt":"2026-11-03T10:35:41","slug":"abes-ghaziabad","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/abes-ghaziabad/","title":{"rendered":"ABES Engineering College"},"content":{"rendered":"","protected":false},"featured_media":806,"template":"","class_list":["post-211","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"ABES Engineering College, Ghaziabad, is a private engineering college affiliated to AKTU, Lucknow. It offers B.Tech (including lateral entry and working-professional routes), M.Tech, MCA and BCA, and three of its B.Tech programmes hold NBA accreditation.","college_overview":"<p>ABES Engineering College (ABESEC) is a private engineering college on NH-09 in Ghaziabad, Uttar Pradesh, affiliated to Dr. A.P.J. Abdul Kalam Technical University (AKTU). Most B.Tech seats are filled through AKTU counselling based on JEE Main, and the rest through direct admission under AICTE and AKTU guidelines.</p><p>The college states that it has been accredited by NAAC since May 2022, and its B.Tech programmes in Computer Science and Engineering, Electronics and Communication Engineering and Mechanical Engineering are accredited by the NBA. For session 2025-26 it reports 1,289 campus offers from 489 companies.</p>","location":"Ghaziabad, Uttar Pradesh","city":"Ghaziabad","state":"Uttar Pradesh","established":"2000","affiliation":"Dr. A.P.J. Abdul Kalam Technical University (AKTU)","recognition":"<ul><li><strong>Affiliation:</strong> Dr. A.P.J. Abdul Kalam Technical University (AKTU), Lucknow</li><li><strong>NAAC:</strong> accredited since May 2022, as the college states (the grade was not given on the page checked)</li><li><strong>NBA:</strong> B.Tech Computer Science and Engineering, accredited up to December 2028; B.Tech Electronics and Communication Engineering and B.Tech Mechanical Engineering, accredited up to June 2028</li></ul><p>AICTE approval letters and the AKTU affiliation letter are published on the official website.</p>","courses_offered":"<p><strong>B.Tech (4 years):</strong> Computer Science and Engineering; CSE (Artificial Intelligence and Machine Learning); CSE (Data Science); Electronics and Communication Engineering; Electrical and Computer Engineering; Mechanical Engineering.</p><p><strong>B.Tech for working professionals:</strong> Computer Science and Engineering; Electronics and Communication Engineering.</p><p><strong>B.Tech lateral entry (into the second year):</strong> for diploma and B.Sc. holders.</p><p><strong>M.Tech (2 years):</strong> Computer Science and Engineering; Electronics and Communication Engineering.</p><p><strong>Computer applications:</strong> MCA (2 years) and BCA (3 years).</p>","admission_process":"<p><strong>Through counselling (85% of approved B.Tech intake):</strong> seats are filled through AKTU counselling based on JEE Main 2026 and the eligibility notified by AICTE and AKTU for 2026-27. Candidates follow the counselling schedule on www.aktu.ac.in, receive an allotment letter, and then report to the allotted college with the required fees and documents.</p><p><strong>Direct admission (15% of seats):</strong> candidates apply online through the college website. The college shortlists them on their qualifying-exam aggregate and JEE score or rank, then calls them for an interview, and offers seats based on the test and interview.</p><p><strong>Other programmes:</strong> lateral entry is through CUET (UG) and then merit in the qualifying exam; M.Tech is through GATE, GPAT or CEED, then CUET (PG), then the institution's own exam or merit; MCA is through CUET (PG), then merit in the qualifying exam. Each of these also follows any directive of the UP Government or the university.</p>","eligibility":"<p>As listed by the college for 2026-27, based on the UPTAC brochure published by AKTU, which may change with later AKTU notifications:</p><ul><li><strong>B.Tech (first year):</strong> 10+2 with subjects from the AKTU list, which includes Physics, Mathematics, Chemistry, Computer Science, Electronics, IT and Biology, with at least 45% (40% for reserved categories) in those subjects taken together; or D.Voc. in the same or an allied sector</li><li><strong>B.Tech lateral entry:</strong> a 3-year or 2-year diploma in any branch of engineering and technology (except agricultural engineering, pharmacy and architecture) with at least 45% (40% for SC/ST); or a B.Sc. with at least 45% (40% for SC/ST) and Mathematics in 10+2, for seats that remain after diploma holders are allotted; or D.Voc. in the same or an allied sector</li><li><strong>M.Tech:</strong> a bachelor's degree or equivalent with at least 50% (45% for reserved categories)</li><li><strong>MCA:</strong> BCA, B.Sc. (CS or IT), B.E. or B.Tech (CSE or IT), or any graduation with Mathematics at 10+2 or graduation level, with at least 50% (45% for SC/ST)</li><li><strong>BCA:</strong> 10+2 in any stream</li></ul>","entrance_exams":"JEE Main (B.Tech through AKTU counselling); CUET (UG) for lateral entry; GATE, GPAT, CEED or CUET (PG) for M.Tech; CUET (PG) for MCA","fees_information":"<h4>Academic fees, 2026-27 (as published by the college)</h4><ul><li><strong>B.Tech, B.Tech lateral entry, M.Tech and MCA:</strong> Rs 1,81,200. This includes tuition of Rs 1,10,000, examination fees of Rs 9,600 and a refundable one-time security deposit of Rs 5,000.</li><li><strong>BCA:</strong> Rs 1,66,200, including tuition of Rs 95,000.</li><li><strong>B.Tech for working professionals:</strong> Rs 1,19,880, payable monthly at Rs 9,990, plus a one-time admission fee of Rs 3,100, a refundable security deposit of Rs 5,000 and examination fees of Rs 9,600.</li></ul><p>Students allotted a seat through counselling who have already paid the Rs 20,000 or Rs 12,000 counselling fee pay only the balance. A mandatory uniform costs Rs 9,900.</p><h4>Hostel fees, 2026-27 (per year, including the Rs 5,000 refundable security)</h4><ul><li><strong>Boys:</strong> four-seater Rs 1,36,500 (non-AC) or Rs 1,48,000 (AC); triple Rs 1,43,000 or Rs 1,64,000; double Rs 1,54,500 or Rs 1,77,500</li><li><strong>Girls (AC rooms):</strong> four-seater Rs 1,48,000; triple Rs 1,64,000; double Rs 1,77,500</li></ul><p>Hostel totals include a registration fee of Rs 500 and laundry charges of Rs 3,500.</p>","campus_facilities":"<p>The institution provides campus and academic facilities relevant to its programmes. For the current list of facilities, laboratories, libraries, sports and student services, refer to the official website.</p>","hostel_information":"<p>Separate hostels are available for boys and girls, in four-seater, triple and double rooms. Boys can choose non-AC or AC rooms, while girls' rooms are listed as AC. Rooms are allotted on a first-come, first-served basis, and AC rooms are allotted only when the room is fully occupied. AC can be used from 5 pm to 8 am on working days and all day on holidays, subject to power supply.</p><p>Desert coolers are not permitted in the girls' hostel. A limited number of rooms with attached bathrooms cost an extra Rs 10,000, shared among the roommates. If a student leaves the hostel, the security deposit and the mess and laundry charges for unused months are refunded pro rata. Fees are listed under Fees.</p>","placement_information":"<p>The college's placement cell reports these figures for session 2025-26: 1,289 campus offers from 489 companies, with a highest package of 45 LPA. Recruiters shown on the placement page include Microsoft, Amazon, Google, Goldman Sachs, Walmart, Atlassian, Autodesk, Morgan Stanley, Samsung R&amp;D, Cisco, Adobe, Accenture, Capgemini, Cognizant, Infosys, TCS and KPMG. The page also lists internship recruiters separately.</p><p>These are the college's own published figures and have not been independently audited.</p>","scholarships":"<p>The college publishes the eligibility rules for government scholarships (from its state and central scholarship document):</p><ul><li><strong>UP Government scholarship and fee reimbursement:</strong> for UP domicile students, with annual parental income up to Rs 2 lakh (General, OBC and minority) or Rs 2.5 lakh (SC/ST). The B.Tech student must have been admitted through counselling with at least 60% in the intermediate exam; for MCA, MBA and M.Tech, it requires counselling admission with at least 55% in graduation. Only NBA-accredited courses qualify. Students admitted through management or vacant-seat quota, fee waiver, Kashmiri migrant or PMSSS seats, or those receiving another scholarship, are not eligible. Applications are made at scholarship.up.gov.in.</li><li><strong>Merit-cum-Means (National Scholarship Portal):</strong> for students from minority communities (Jain, Muslim, Sikh, Christian, Buddhist and Parsi) in technical or professional courses, with at least 50% in the previous exam and parental income up to Rs 2.5 lakh. Applications are made at scholarships.gov.in.</li><li><strong>Central Sector Scheme of Scholarship:</strong> B.Tech first-year students only, with no gap after the intermediate exam, at least 80% in the intermediate exam and family income below Rs 8 lakh.</li></ul><p><strong>M.Tech financial assistance:</strong> GATE-qualified students can receive the AICTE/MHRD PG scholarship. Non-GATE students admitted directly may receive a stipend of Rs 7,000 in the first year and Rs 8,000 in the second year, under college policy and selection.</p>","college_image":null,"official_website":"https://www.abes.ac.in/","cta_heading":"Need Help Choosing the Right College?","cta_description":"Explore courses, admission information and college options with A3 Educare Hub & Research Academy.","faq_1_question":"What courses are offered at ABES Engineering College?","faq_1_answer":"B.Tech in CSE (including AI and ML, and Data Science), ECE, Electrical and Computer Engineering and Mechanical Engineering, plus B.Tech for working professionals, B.Tech lateral entry, M.Tech (CSE and ECE), MCA and BCA.","faq_2_question":"How can I apply to ABES Engineering College?","faq_2_answer":"85% of B.Tech seats are filled through AKTU counselling based on JEE Main. The remaining 15% are offered through direct admission, applying online on the college website, then shortlisting and an interview.","faq_3_question":"What is the fee structure?","faq_3_answer":"For 2026-27, the college lists Rs 1,81,200 for B.Tech, lateral entry, M.Tech and MCA (including a Rs 5,000 refundable deposit) and Rs 1,66,200 for BCA. Check the official fee page before paying.","faq_4_question":"Is hostel accommodation available?","faq_4_answer":"Yes. Boys' and girls' hostels have four-seater, triple and double rooms. Annual fees for 2026-27 range from Rs 1,36,500 to Rs 1,77,500, including the refundable security.","faq_5_question":"Where can I verify the latest admission information?","faq_5_answer":"Use the official website listed on this page and refer to the latest admission notification.","featured_image":{"id":806,"date":"2026-11-03T05:10:19","date_gmt":"2026-11-03T05:10:19","guid":{"rendered":"https://staging.a3educarehub.in/colleges/abes-engineering-college/abes-engineering-college-featured-image/"},"modified":"2026-11-03T05:10:19","modified_gmt":"2026-11-03T05:10:19","slug":"abes-engineering-college-featured-image","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/abes-ghaziabad/abes-engineering-college-featured-image/#main","title":{"rendered":"ABES Engineering College &#8211; Featured Image"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class
