    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:37.413Z","entries":{"college:andhra-university":[{"id":1067,"date":"2026-11-04T06:52:32","date_gmt":"2026-11-04T06:52:32","guid":{"rendered":"https://staging.a3educarehub.in/colleges/andhra-university/"},"modified":"2026-11-04T06:52:32","modified_gmt":"2026-11-04T06:52:32","slug":"andhra-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/andhra-university/","title":{"rendered":"Andhra University"},"content":{"rendered":"","protected":false},"featured_media":1161,"template":"","class_list":["post-1067","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Andhra University in Visakhapatnam was founded in 1926 under the Madras Act of that year, with Sir C.R. Reddy as its founder Vice-Chancellor. It is a residential, teaching-cum-affiliating university that reports an A++ NAAC grade and 313 courses.","college_overview":"<p>Andhra University was created in 1926 under the Madras Act, with Sir C.R. Reddy as founder Vice-Chancellor. Its University College of Arts was inaugurated on 1 July 1931, and the engineering college followed in 1946.</p><p>The university describes itself as residential, teaching-cum-affiliating, with 313 courses across arts, commerce, management, science and technology, engineering, law, pharmacy and education.</p><p>Its 2023 NAAC assessment gave it A++ with a score of 3.74 out of 4. Its homepage reports NIRF 2025 ranks of 23rd among universities and 41st overall, along with 4th among state public universities.</p>","location":"Waltair Junction, Visakhapatnam 530003, Andhra Pradesh, India","city":"Visakhapatnam","state":"Andhra Pradesh","established":"1926","affiliation":"State university established under the Madras Act of 1926; teaching-cum-affiliating","recognition":"<ul><li><strong>NAAC:</strong> A++ with a score of 3.74 out of 4 (2023); A in 2016 (3.60) and 2008 (3.64)</li><li><strong>NIRF 2025, as listed on the university homepage:</strong> 23rd among universities, 41st overall, 4th among state public universities, 88th in Engineering, 31st in Pharmacy and 16th in Law</li></ul>","courses_offered":"<p>The university's profile lists 313 courses in arts, commerce, management, science and technology, engineering, law, pharmacy and education.</p><ul><li><strong>Engineering college:</strong> 17 undergraduate and 35 postgraduate programmes, plus research</li><li><strong>Other colleges:</strong> Arts and Commerce, Law, and Pharmaceutical Sciences, among others</li><li><strong>Distance education:</strong> School of Distance Education and online programmes</li></ul>","admission_process":"<p>Admission routes differ by course and are listed in the university's admissions section. For engineering, the university conducts AUEET; the AUEET 2026 registration fee was Rs 1,200, or Rs 1,000 for SC, ST and PwD candidates.</p>","eligibility":"<p>Conditions are set for each course in the university's admission notifications and brochures.</p>","entrance_exams":"AUEET for engineering; other courses as stated in university notifications","fees_information":"<p><strong>AUEET 2026 registration and processing fee:</strong> Rs 1,200, or Rs 1,000 for SC, ST and PwD candidates. Course tuition appears in each year's admission notification.</p>","campus_facilities":"<p>The College of Arts and Commerce, College of Engineering, College of Law and College of Pharmaceutical Sciences are among the university's teaching units. It is based at Waltair Junction, Visakhapatnam.</p>","hostel_information":"<p>The university's profile lists 23 hostels for men, with space for more than 3,200 students, and 10 hostels for women, with more than 2,000 places. Places are limited, and outside students apply to the Chief Warden.</p>","placement_information":"<p>The university runs a Placement Cell under its administration wing.</p>","scholarships":"<p>Andhra University's Office of Student Welfare, under the Dean, Student Welfare, oversees financial assistance schemes. Its page says the office gives guidance on state scholarship applications, merit-cum-means assistance and university student aid funds.</p><p>The page does not give scheme amounts or eligibility conditions, so ask the office for the rules that apply to your course.</p>","college_image":null,"official_website":"https://www.andhrauniversity.edu.in","cta_heading":"Planning to apply to Andhra University?","cta_description":"Get help choosing a course and following the right admission route.","faq_1_question":"When was Andhra University founded?","faq_1_answer":"<p>In 1926, under the Madras Act of that year.</p>","faq_2_question":"What is its NAAC grade?","faq_2_answer":"<p>A++, with a score of 3.74 out of 4, awarded in 2023.</p>","faq_3_question":"What is its NIRF 2025 rank?","faq_3_answer":"The university's homepage lists 23rd among universities and 41st overall.","faq_4_question":"How many hostels are there?","faq_4_answer":"<p>23 for men and 10 for women, according to the university's profile.</p>","faq_5_question":"Which entrance exam covers engineering?","faq_5_answer":"<p>The university conducts AUEET. Check its brochure for the current year's other routes.</p>","featured_image":{"id":1161,"date":"2026-11-04T07:23:07","date_gmt":"2026-11-04T07:23:07","guid":{"rendered":"https://staging.a3educarehub.in/colleges/andhra-university/andhra-university-campus/"},"modified":"2026-11-04T07:23:07","modified_gmt":"2026-11-04T07:23:07","slug":"andhra-university-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/andhra-university/andhra-university-campus/#main","title":{"rendered":"Andhra University campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1161","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendere
