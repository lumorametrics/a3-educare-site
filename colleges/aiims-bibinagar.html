    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:25:00.953Z","entries":{"college:aiims-bibinagar":[{"id":1057,"date":"2026-11-04T06:52:19","date_gmt":"2026-11-04T06:52:19","guid":{"rendered":"https://staging.a3educarehub.in/colleges/aiims-bibinagar/"},"modified":"2026-11-04T06:52:19","modified_gmt":"2026-11-04T06:52:19","slug":"aiims-bibinagar","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/aiims-bibinagar/","title":{"rendered":"All India Institute of Medical Sciences, Bibinagar"},"content":{"rendered":"","protected":false},"featured_media":1152,"template":"","class_list":["post-1057","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"AIIMS Bibinagar took in its first 50 MBBS students in August 2019 and now also teaches nursing, allied health and super-speciality courses on a 200-acre site on the Hyderabad-Warangal highway. The 2024 MBBS batch paid Rs 5,856 at admission, and MBBS students must live in the hostel.","college_overview":"<p>This institute came out of Phase VII of the Pradhan Mantri Swasthya Suraksha Yojana, the central scheme meant to even out access to tertiary healthcare and medical education across India. As a new AIIMS it is an Institute of National Importance and works as an autonomous body under the Ministry of Health and Family Welfare.</p><p>Teaching started on 27 August 2019 with 50 MBBS students, under the mentorship of AIIMS Bhopal until December 2019. The campus sits in Yadadri Bhuvanagiri district, on NH-163 in the Hyderabad Metropolitan Region.</p><p>The academic offering has since grown beyond MBBS into B.Sc (Hons) and M.Sc Nursing, allied health sciences and DM Neurology. Hostel life is part of the MBBS course here, so plan on living on campus.</p>","location":"Bibinagar, Yadadri Bhuvanagiri district, Telangana 508126, India","city":"Bibinagar","state":"Telangana","established":"2019 (first MBBS batch, 27 August 2019)","affiliation":"Institute of National Importance under the AIIMS Act, under the Ministry of Health and Family Welfare","recognition":"<p>AIIMS Bibinagar is an <strong>Institute of National Importance</strong> set up under the Pradhan Mantri Swasthya Suraksha Yojana. It is listed in the National Medical Commission's MBBS seat matrix as a government institute.</p>","courses_offered":"<ul><li><strong>MBBS:</strong> 5.5 years. 100 seats in the National Medical Commission matrix dated 16 October 2025.</li><li><strong>B.Sc (Hons) Nursing:</strong> 60 seats in the 2024 prospectus.</li><li><strong>M.Sc Nursing</strong></li><li><strong>Allied health sciences:</strong> Operation Theatre Technology, Medical Laboratory Sciences and Medical Radiation Imaging, 10 seats each in the 2024 prospectus.</li><li><strong>DM Neurology:</strong> 2 seats.</li></ul>","admission_process":"<p>MBBS seats are filled through NEET UG and Medical Counselling Committee (MCC) counselling. Allotted candidates then report to the institute with their documents and pay the admission fee by demand draft in favour of the Director, AIIMS Bibinagar.</p><p>Nursing and allied health admissions follow the institute's own prospectus for each session, so check the current notice on the official website.</p>","eligibility":"<p>MBBS applicants must qualify in NEET UG and meet the eligibility conditions in that year's NEET UG and MCC notices. Requirements for nursing, allied health and DM courses are set out in each course's prospectus.</p>","entrance_exams":"NEET UG for MBBS; other courses as stated in the institute's prospectus for that session","fees_information":"<p><strong>MBBS, 2024 batch handbook:</strong> Rs 5,856 payable at admission.</p><ul><li><strong>Academic and other fees, Rs 1,628:</strong> registration Rs 25, tuition Rs 1,350, laboratory Rs 90, student union Rs 63, caution money Rs 100.</li><li><strong>Hostel and other fees, Rs 4,228:</strong> hostel rent Rs 990, gymkhana Rs 220, pot fund Rs 1,320, electricity Rs 198, refundable mess security Rs 500, refundable hostel security Rs 1,000.</li><li><strong>Examination fee:</strong> Rs 50 per paper for each professional examination.</li></ul><p>Mess charges are separate. Confirm the current figures in the latest handbook.</p>","campus_facilities":"<p>The institute occupies a 200-acre site on the Hyderabad-Warangal Highway (NH-163). It runs its own hospital, with a helpline on 08685-293300.</p>","hostel_information":"<p>Hostel stay is compulsory for MBBS students. The institute's hostel records describe three wings for men and two for women, and a Hostel Committee works with the Executive Director and Dean (Academics).</p>","placement_information":"","scholarships":"","college_image":null,"official_website":"https://aiimsbibinagar.edu.in","cta_heading":"Preparing for an AIIMS seat at Bibinagar?","cta_description":"Get help planning your NEET UG preparation and MCC counselling choices.","faq_1_question":"How do I get an MBBS seat at AIIMS Bibinagar?","faq_1_answer":"<p>Qualify in NEET UG, then take part in MCC counselling. Allotted candidates report to the institute with their documents.</p>","faq_2_question":"How much does MBBS cost at AIIMS Bibinagar?","faq_2_answer":"<p>The 2024 batch handbook lists Rs 5,856 at admission, including hostel charges and refundable deposits. Mess charges are separate.</p>","faq_3_question":"Do MBBS students have to live in the hostel?","faq_3_answer":"Yes. The MBBS handbook states that hostel stay is compulsory.","faq_4_question":"Does the institute offer courses other than MBBS?","faq_4_answer":"<p>Yes. It offers B.Sc (Hons) and M.Sc Nursing, allied health courses in Operation Theatre Technology, Medical Laboratory Sciences and Medical Radiation Imaging, and DM Neurology.</p>","faq_5_question":"Where is AIIMS Bibinagar located?","faq_5_answer":"<p>It is at Bibinagar in Yadadri Bhuvanagiri district, Telangana 508126, on the Hyderabad-Warangal Highway (NH-163).</p>","featured_image
