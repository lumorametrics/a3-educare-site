    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:19.327Z","entries":{"college:indian-school-of-business":[{"id":1063,"date":"2026-11-04T06:52:27","date_gmt":"2026-11-04T06:52:27","guid":{"rendered":"https://staging.a3educarehub.in/colleges/indian-school-of-business/"},"modified":"2026-11-04T06:52:27","modified_gmt":"2026-11-04T06:52:27","slug":"indian-school-of-business","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/indian-school-of-business/","title":{"rendered":"Indian School of Business"},"content":{"rendered":"","protected":false},"featured_media":1157,"template":"","class_list":["post-1063","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"The Indian School of Business is a private business school with campuses at Gachibowli in Hyderabad and Knowledge City in Mohali. Its flagship one-year PGP asks for at least two years of work experience, and the school reports AACSB, AMBA and EQUIS accreditation.","college_overview":"<p>ISB's board was formed in 1996, the foundation stone of the Hyderabad campus was laid in December 1999, and Prime Minister Atal Bihari Vajpayee inaugurated the school in 2001. It later added a second campus at Mohali in Punjab.</p><p>It is aimed mainly at people who have already started working. The 12-month residential Post Graduate Programme in Management (PGP) admits about 820 students a year across both campuses through one unified process. Other programmes serve younger applicants, working professionals, senior executives and family-business owners.</p><p>The PGP costs Rs 34.48 lakh plus GST for 2027-28, so the school's waiver and loan options matter to many applicants. ISB says about a quarter of PGP students receive financial support.</p>","location":"Gachibowli, Hyderabad 500111, Telangana, India (second campus: Knowledge City, Sector 81, SAS Nagar, Mohali, Punjab)","city":"Hyderabad","state":"Telangana","established":"2001 (inaugurated; board formed in 1996)","affiliation":"Independent business school","recognition":"<p>ISB lists these on its PGP page:</p><ul><li><strong>Accreditation:</strong> AACSB, AMBA and EQUIS</li><li><strong>FT Global MBA Ranking 2026:</strong> 12th worldwide and 1st in India</li><li><strong>LinkedIn Top MBA 2026:</strong> 5th worldwide</li></ul>","courses_offered":"<ul><li><strong>PGP:</strong> Post Graduate Programme in Management, 12 months, residential and full time</li><li><strong>PGP YL:</strong> for candidates with 0-2 years of experience, 20 months</li><li><strong>PGP PRO:</strong> for working professionals</li><li><strong>PGP MAX:</strong> for senior executives</li><li><strong>PGP MFAB:</strong> for family business owners and successors</li><li><strong>Advanced Management Programmes:</strong> Business Analytics and AI, Healthcare, Infrastructure, Operations and Supply Chain, Public Policy</li><li><strong>Doctoral:</strong> Fellow Programme in Management and Executive Fellow Programme</li><li><strong>Executive Education</strong></li></ul>","admission_process":"<p>PGP applicants use one application for both campuses, with several deadlines in each intake. ISB states that competition is the same across rounds. Selection follows a multi-level process. For the Class of 2028, the Round 2 deadline is 6 December 2026.</p>","eligibility":"<p>For the PGP you need:</p><ul><li>A bachelor's degree in any discipline</li><li>A valid GMAT or GRE score from a test centre</li><li>At least 24 months of work experience by 31 March of the joining year</li><li>TOEFL or IELTS if your earlier study was not in English</li></ul>","entrance_exams":"GMAT or GRE (test-centre scores) for the PGP","fees_information":"<p><strong>Academic year 2027-28:</strong></p><ul><li><strong>PGP:</strong> Rs 34,48,000 plus GST for shared accommodation and single-instalment payment, plus a refundable Rs 20,000 security deposit</li><li><strong>PGP YL (2027-29):</strong> Rs 25,60,000 plus GST</li><li><strong>PGP PRO:</strong> Rs 33,69,559 plus GST</li><li><strong>PGP MAX:</strong> Rs 43,03,508 plus GST</li><li><strong>PGP MFAB:</strong> Rs 44,72,881 plus GST</li></ul><p>ISB describes its fees as indicative and subject to change.</p>","campus_facilities":"<p><strong>Hyderabad:</strong> a 260-acre campus with an academic centre of lecture halls and classrooms, a learning resource centre, a 400-seat auditorium, a lake and amphitheatre, an indoor sports area, a gym, dining areas, and a day care centre.</p><p><strong>Mohali:</strong> Knowledge City, Sector 81, SAS Nagar.</p>","hostel_information":"<p>The PGP is residential. The published 2027-28 fee is for shared accommodation.</p>","placement_information":"<h4>PGP Class of 2026 (Placement Report 2025-26)</h4><ul><li><strong>Companies:</strong> 282 took part; <strong>offers:</strong> 1,177.</li><li><strong>Highest salary:</strong> 163.66 LPA; <strong>average salary:</strong> 37.12 LPA.</li><li><strong>Top industries by offers:</strong> consulting, FMCG/retail, technology and finance.</li><li><strong>Class profile:</strong> 811 students, average 4 years of work experience, average age 27, average GMAT 682.</li><li>ISB follows a two-offer policy in placements.</li></ul><p>KPMG reviewed the placement records in the report as of 10 October 2026; its review did not cover the class-profile figures.</p><h4>Career Advancement Services (CAS)</h4><p>CAS handles career counselling, recruiter engagement and pre-placement talks for PGP students, using a placements portal and CRM.</p>","scholarships":"<p>Each applicant can receive only one tuition waiver. Options listed for the PGP include:</p><ul><li><strong>ISB Merit Waiver and Merit by Diversity Waiver:</strong> 25%-100%; all applicants are considered automatically</li><li><strong>Need-based Waiver:</strong> 100% for family income up to Rs 8 lakh, 75% for above Rs 8 lakh and up to Rs 20 lakh</li><li><strong>Armed Forces Scholarship:</strong> 50%</li><li><strong>Prof. Manasa Mandava Memorial Scholarship:</strong> 50%, for a woman applicant high on merit</li><li><strong>Taparia Family and J.C. Flowers ARC Scholarships:</strong> 100%, five candidates each year</li></ul><p>ISB also lists education-loan partners on its fees page.</p>","college_image":null,"official_website":"https://www.isb.edu","cta_heading":"Thinking about the ISB PGP?","cta_description":"Get help planning your GMAT or GRE, work-experience timing and application round.","faq_1_question":"How much work experience does the ISB PGP require?","faq_1_answer":"<p>At least 24 months by 31 March of the joining year. PGP YL is available for candidates with 0-2 years of experience.</p>","faq_2_question":"What does the PGP cost?","faq_2_answer":"<p>For 2027-28 it is Rs 34,48,000 plus GST for shared accommodation, plus a refundable Rs 20,000 deposit.</p>","faq_3_question":"Do I apply separately to Hyderabad and Mohali?","faq_3_answer":"No. ISB runs unified admissions for both campuses.","faq_4_question":"Does a later round reduce my chances?","faq_4_answer":"<p>ISB states that competition is the same across rounds.</p>","faq_5_question":"Are scholarships available?","faq_5_answer":"<p>Yes. ISB lists merit, diversity, need-based and donor awards. Each applicant can receive one tuition waiver.</p>","featured_image":{"id":1157,"date":"2026-11-04T07:22:53","date_gmt":"2026-11-04T07:22:53","guid":{"rendered":"https://staging.a3educarehub.in/colleges/indian-school-of-business/indian-school-of-business-campus/"},"modified":"2026-11-04T07:22:53","modified_gmt":"2026-11-04T07:22:53","slug":"indian-school-of-business-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/indian-school-of-business/indian-school-of-business-campus/#main","title":{"rendered":"Indian School of Business campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1157","
