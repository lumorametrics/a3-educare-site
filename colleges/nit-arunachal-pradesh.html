    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:45.161Z","entries":{"college:nit-arunachal-pradesh":[{"id":1147,"date":"2026-11-04T06:55:47","date_gmt":"2026-11-04T06:55:47","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-arunachal-pradesh/"},"modified":"2026-11-04T06:55:47","modified_gmt":"2026-11-04T06:55:47","slug":"nit-arunachal-pradesh","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nit-arunachal-pradesh/","title":{"rendered":"National Institute of Technology Arunachal Pradesh"},"content":{"rendered":"","protected":false},"featured_media":1215,"template":"","class_list":["post-1147","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"National Institute of Technology Arunachal Pradesh is a centrally funded institution in Jote, Arunachal Pradesh, offering engineering and technology programmes.","college_overview":"<p>National Institute of Technology Arunachal Pradesh was set up by the Government of India in 2010 and inaugurated on 18 August 2010. It first worked from a temporary campus at Yupia under the mentorship of NIT Durgapur, and later moved to its permanent residential campus at Jote in Papum Pare district, about 30 km from Itanagar.</p><p>The institute offers B.Tech, M.Tech, M.Sc. and Ph.D. programmes. In its NIRF 2026 data it reported 760 undergraduate students (604 male and 156 female), of whom 212 were from within the state, along with 22 postgraduate students and 197 Ph.D. scholars (79 full-time and 118 part-time).</p><p>For students, the main points are a B.Tech first-semester total of Rs 85,600 for General and OBC students from the July-December 2026 batch, tuition waivers set by family income and category, and a median package of Rs 9 lakh for placed B.Tech graduates of 2024-25 as reported to NIRF.</p>","location":"Jote, Arunachal Pradesh, India","city":"Jote","state":"Arunachal Pradesh","established":"2010","affiliation":"National Institute of Technology under the NIT Act, 2007","recognition":"<p>NIT Arunachal Pradesh describes itself as an Institute of National Importance under the Ministry of Education, Government of India.</p><p>The institute submits data to the National Institutional Ranking Framework (NIRF) and publishes its NIRF 2026 submissions for the Overall, Engineering, Management and Innovation categories on its website.</p>","courses_offered":"<h4>B.Tech</h4><p>College listings show Civil, Computer Science and Engineering, Electrical, Electronics and Communication, and Mechanical Engineering. BYJU'S summary also lists Biotechnology and Chemical Engineering. Check the current JoSAA seat matrix for the branches open in your admission year. The sanctioned undergraduate intake reported to NIRF was 160 for 2024-25.</p><h4>M.Tech (2026 advertisement)</h4><ul><li>Structural Engineering</li><li>Computer Science and Engineering</li><li>Microelectronics and Intelligent System</li><li>Power Electronics and Sustainable Energy</li><li>Digital Manufacturing in Energy Systems</li><li>Innovation and Entrepreneurship</li></ul><h4>M.Sc.</h4><ul><li>Data Science</li></ul><h4>Ph.D. (January-June 2027 advertisement)</h4><p>Full-time and part-time, in Basic and Applied Science, Biotechnology, Chemical Engineering, Civil Engineering, Computer Science and Engineering, Electronics and Communication Engineering, Electrical Engineering, Mechanical Engineering, and Management and Humanities.</p>","admission_process":"<ul><li><strong>B.Tech:</strong> seats are filled on JEE (Main) ranks through JoSAA counselling. For 2026, the institute also pointed candidates to the CSAB Special Rounds and DASA (UG) counselling, with online registration from 28 July to 3 August 2026.</li><li><strong>M.Tech and M.Sc., 2026-27:</strong> admission runs through CCMT and CCMN. Seats left vacant then go to an institute round, based on a written test and personal interview, with preference for GATE (M.Tech) and JAM (M.Sc.) qualified candidates. The application fee for this round is Rs 300, or Rs 150 for SC, ST and PwD candidates.</li><li><strong>Ph.D., January-June 2027:</strong> the application deadline is 12 December 2026 at 5 p.m., with the written test and interview from 22 to 31 December 2026. The fee is Rs 500, or Rs 250 for ST, SC and PwD candidates. Selection is by written test and/or personal interview in each department.</li></ul>","eligibility":"<ul><li><strong>B.Tech:</strong> candidates must meet the JEE (Main) and JoSAA conditions for the admission year.</li><li><strong>M.Tech, institute round 2026:</strong> B.E. or B.Tech in the relevant discipline, or in any discipline for Innovation and Entrepreneurship.</li><li><strong>M.Sc. Data Science, institute round 2026:</strong> B.Sc. in the relevant discipline.</li><li><strong>Minimum marks for both:</strong> 6.5 CGPA or 60% for General, EWS and OBC candidates, and 6.0 CGPA or 55% for SC, ST and PwD candidates.</li><li><strong>Ph.D. in engineering departments, January-June 2027:</strong> first class with 60% or 6.5 CGPA at both UG and PG for General, EWS and OBC-NCL candidates, and 55% or 6.0 CGPA for SC, ST and PwD candidates. Preference goes to valid UGC, CSIR, NET or GATE qualified candidates.</li></ul><p>Other Ph.D. qualifications differ by department and are listed in the advertisement.</p>","entrance_exams":"JEE (Main) for B.Tech; GATE for M.Tech and JAM for M.Sc.; UGC, CSIR, NET or GATE preferred for Ph.D.","fees_information":"<h4>B.Tech, July-December 2026 batch onwards</h4><ul><li><strong>General and OBC:</strong> Rs 85,600 in the first semester, then Rs 75,000 each semester from the 2nd to the 8th</li><li><strong>SC, ST, PwD, and General or OBC with parental income below Rs 1 lakh:</strong> Rs 23,100 in the first semester, then Rs 12,500 each semester</li><li><strong>Parental income from Rs 1 lakh to Rs 5 lakh:</strong> Rs 43,933 in the first semester, then Rs 33,333 each semester</li></ul><p>Tuition within these totals is Rs 62,500, nil or Rs 20,833 a semester, and the institute notes it may vary as per the Ministry of Education. The first-semester totals include Rs 10,600 of one-time payments, among them refundable institute caution money of Rs 5,000 and hostel caution money of Rs 3,000.</p><h4>M.Tech, July-December 2026 batch onwards</h4><ul><li><strong>General and OBC:</strong> Rs 58,100 in the first semester, then Rs 47,500 each semester</li><li><strong>SC and ST:</strong> Rs 23,100 in the first semester, then Rs 12,500 each semester</li></ul><h4>M.Sc., July-December 2026 batch onwards</h4><ul><li><strong>General and OBC:</strong> Rs 30,600 in the first semester, then Rs 20,000 each semester</li><li><strong>SC and ST:</strong> Rs 23,100 in the first semester, then Rs 12,500 each semester</li></ul><h4>Ph.D., July-December 2026 batch onwards</h4><ul><li><strong>General and OBC:</strong> Rs 30,600 in the first semester, then Rs 20,000 each semester</li><li><strong>SC and ST:</strong> Rs 23,100 in the first semester, then Rs 12,500 each semester</li><li>A one-time Rs 20,000 is due at the pre-submission seminar</li></ul><p>Hostel mess fees are charged separately. The income-based B.Tech rates need a valid income certificate from the competent authority.</p>","campus_facilities":"<p>The permanent campus at Jote is a residential one, about 30 km from Itanagar. The institute lists these facilities:</p><ul><li><strong>Academic:</strong> laboratories, smart classrooms, a central library with digital resources, a computer centre, research centres and seminar halls</li><li><strong>Student life:</strong> separate hostels for boys and girls, a health centre, playgrounds and indoor games, a cafeteria, and spaces for cultural and technical activities</li><li><strong>Services:</strong> high-speed internet and transport services</li></ul><p>The hostel instructions for 2026-27 advise students to carry a BSNL or Airtel SIM card, as these are the only mobile networks available on campus.</p>","hostel_information":"<p>The institute's instructions for new students in 2026-27 name these hostels:</p><ul><li><strong>Lohit-I:</strong> girls, under the B.Tech heading</li><li><strong>Lohit-II:</strong> boys, under the B.Tech heading. The Hostel Management Committee (HMC) Office is also here</li><li><strong>Subansiri Hostel:</strong> Ph.D.</li><li><strong>Papum Hostel:</strong> M.Tech and M.Sc.</li></ul><h4>Allotment, 2026-27</h4><ol><li>Confirm admission with the Dean (Academics) or the Head of Department.</li><li>Report to the HMC Office and complete the allotment form, signed by a parent or guardian, and the undertaking for hostel items.</li><li>Pay the mess fee and submit the receipt to the HMC Office.</li><li>Submit the undertaking to the hostel caretaker and sign the hostel register.</li></ol><h4>What is provided</h4><p>The hostel gives each student a cot, table and chair. Students bring their own mattress, pillow, bed sheet, blanket, bucket and mosquito net.</p><h4>Fees</h4><p>The 2026 fee structures show a one-time hostel admission fee of Rs 1,000, refundable hostel caution money of Rs 3,000 and a hostel establishment fee of Rs 4,000 a semester. The 2026-27 instructions ask students to pay the mess fee for the entire semester, while the fee structures mention three months in advance, so confirm the amount with the HMC Office.</p>","placement_information":"<p>From the data the institute submitted to NIRF 2026:</p><h4>B.Tech</h4><ul><li><strong>2024-25:</strong> 319 graduated in the normal time, 253 placed, median package Rs 9,00,000, 16 went on to higher studies</li><li><strong>2023-24:</strong> 157 graduated, 126 placed, median Rs 8,10,000, 12 to higher studies</li><li><strong>2022-23:</strong> 152 graduated, 110 placed, median Rs 8,75,000, 7 to higher studies</li></ul><h4>Two-year PG</h4><ul><li><strong>2024-25:</strong> 7 graduated, 4 placed, median Rs 8,50,000, 3 to higher studies</li><li><strong>2023-24:</strong> 9 graduated, 4 placed, median Rs 7,50,000, 3 to higher studies</li><li><strong>2022-23:</strong> 27 graduated, 20 placed, median Rs 7,00,000, 4 to higher studies</li></ul><p>The institute's homepage names Deloitte, Accenture, Infosys, UKG, NexTurn and L&amp;T among its recruiting partners, and links to a Training and Placement section.</p>","scholarships":"<h4>Tuition waivers, B.Tech from the 2026 batch</h4><ul><li><strong>SC, ST and PwD students, and General or OBC students with parental income below Rs 1 lakh:</strong> no tuition fee</li><li><strong>Parental income from Rs 1 lakh to Rs 5 lakh:</strong> Rs 20,833 tuition a semester instead of Rs 62,500</li></ul><p>A valid income certificate from the competent authority is required. M.Tech, M.Sc. and Ph.D. fee structures also show no tuition for SC and ST students.</p><h4>Government scholarships</h4><p>The institute's website links to the National Scholarship Portal at scholarships.gov.in. It also appears in the Ministry of Tribal Affairs list of institutes eligible under the top class scholarship scheme for ST students, 2023-24 onwards, for all engineering courses.</p><h4>Ph.D. support</h4><ul><li><strong>Full-time:</strong> fellowship as per Government and Institute norms</li><li><strong>Part-time:</strong> no institute fellowship</li><li><strong>Visvesvaraya Ph.D. Scheme:</strong> the institute issued a 2026-27 admission notice under this MeitY-sponsored scheme</li></ul>","college_image":null,"official_website":"https://www.nitap.ac.in","cta_heading":"Considering NIT Arunachal Pradesh?","cta_description":"Get help with JEE (Main) and your JoSAA branch choices.","faq_1_question":"Where is NIT Arunachal Pradesh?","faq_1_answer":"<p>At Jote in Papum Pare district, Arunachal Pradesh 791113, about 30 km from Itanagar.</p>","faq_2_question":"What is the B.Tech fee for the 2026 batch?","faq_2_answer":"<p>General and OBC students pay Rs 85,600 in the first semester and Rs 75,000 in each later semester. Lower amounts apply to SC, ST and PwD students and by family income.</p>","faq_3_question":"How do I get a B.Tech seat?","faq_3_answer":"<p>Through a JEE (Main) rank and JoSAA counselling. In 2026 the institute also pointed to the CSAB Special Rounds.</p>","faq_4_question":"What was the median B.Tech placement package?","faq_4_answer":"<p>Rs 9,00,000 for 2024-25, with 253 of 319 graduates placed, according to the institute's NIRF 2026 data.</p>","faq_5_question":"Which hostels do students use?","faq_5_answer":"<p>The 2026-27 instructions name Lohit-I for girls and Lohit-II for boys under the B.Tech heading, Subansiri for Ph.D. and Papum for M.Tech and M.Sc.</p>","featured_image":{"id":1215,"date":"2026-11-04T07:28:06","date_gmt":"2026-11-04T07:28:06","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-arunachal-pradesh/national-institute-of-technology-arunachal-pradesh-campus/"},"modified":"2026-11-04T07:28:06","modified_gmt":"2026-11-04T07:28:06","slug":"national-institute-of-technology-arunachal-pradesh-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nit-arunachal-pradesh/national-institute-of-technology-arunachal-pradesh-campus/#main","title":{"rendered":"National Institute of Technology Arunachal Pradesh campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1215","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-arunachal-pradesh.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"169\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-arunachal-pradesh-300x169.jpg\" class=\"attachment-medium size-medium\" alt=\"National Institute of Technology Arunachal Pradesh campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-arunachal-pradesh-300
