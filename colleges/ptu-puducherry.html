    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:29.791Z","entries":{"college:ptu-puducherry":[{"id":1049,"date":"2026-11-04T06:29:25","date_gmt":"2026-11-04T06:29:25","guid":{"rendered":"https://staging.a3educarehub.in/colleges/ptu-puducherry/"},"modified":"2026-11-04T06:29:25","modified_gmt":"2026-11-04T06:29:25","slug":"ptu-puducherry","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/ptu-puducherry/","title":{"rendered":"Puducherry Technological University"},"content":{"rendered":"","protected":false},"featured_media":1053,"template":"","class_list":["post-1049","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Puducherry Technological University began in 1984 as Pondicherry Engineering College and was upgraded to university status in September 2020. Government-funded, at Pillaichavady, it fills B.Tech seats through CENTAC and JoSAA, with lower fees for Puducherry candidates.","college_overview":"<p>The university started in 1984 as Pondicherry Engineering College. With UGC approval, it became Puducherry Technological University with effect from 5 September 2020, and it remains government-funded.</p><p>B.Tech seats come through two channels: the Centralised Admission Committee (CENTAC) of the Puducherry government, and JoSAA. That split affects cost, with the 2026-27 notice listing Rs 32,101 for Puducherry CENTAC candidates and Rs 92,401 for JoSAA or CSAB general candidates after the deposit already paid.</p><p>It also admits postgraduate candidates through a government admission committee, and doctoral candidates under its own 2026-27 prospectus.</p>","location":"Pillaichavady, Puducherry 605014, India","city":"Puducherry","state":"Puducherry","established":"Pondicherry Engineering College founded 1984; became Puducherry Technological University in 2020","affiliation":"State technological university, upgraded from Pondicherry Engineering College in 2020","recognition":"<p>The university received UGC approval for university status with effect from 5 September 2020.</p>","courses_offered":"<ul><li><strong>Undergraduate:</strong> B.Tech, including lateral entry</li><li><strong>Postgraduate:</strong> programmes admitted through the PG admission committee</li><li><strong>Doctoral:</strong> Ph.D. (2026-27 prospectus)</li><li><strong>NRI admission:</strong> by separate notification</li></ul>","admission_process":"<p>First-year and lateral-entry B.Tech seats are filled through CENTAC and JoSAA. Postgraduate admissions run through the PG admission committee's information brochure, and Ph.D. admissions through the university's prospectus.</p>","eligibility":"<p>Conditions are set in the CENTAC, JoSAA and university notices for that year.</p>","entrance_exams":"JEE (Main) through JoSAA for B.Tech; CENTAC for Puducherry seats","fees_information":"<p><strong>B.Tech, 2026-27 notice:</strong></p><ul><li>Puducherry CENTAC candidates: Rs 32,101</li><li>JoSAA or CSAB general: Rs 92,401 after the transferable deposit</li><li>JoSAA or CSAB SC and ST: Rs 57,401 after the transferable deposit</li><li>Hostel: Rs 75,000, including caution deposit</li></ul>","campus_facilities":"<p>The campus is at Pillaichavady, Puducherry, with hostels listed on the university's campus life pages.</p>","hostel_information":"<p>The 2026-27 notice lists a hostel fee of Rs 75,000, including caution deposit. A university page covers room rent, establishment charges, mess advance and deposits.</p>","placement_information":"<h4>Placements reported in PTU's NIRF 2025 submission</h4><p><strong>UG (4-year B.Tech), by graduating year:</strong></p><ul><li>2023-24: 649 graduated, 576 placed, median salary Rs 6,00,000, 70 went on to higher studies.</li><li>2022-23: 577 graduated, 503 placed, median Rs 6,00,000, 67 to higher studies.</li><li>2021-22: 568 graduated, 395 placed, median Rs 5,70,000, 60 to higher studies.</li></ul><p><strong>PG (2-year), by graduating year:</strong></p><ul><li>2023-24: 168 graduated, 98 placed, median Rs 6,00,000, 33 to higher studies.</li><li>2022-23: 126 graduated, 23 placed, median Rs 5,00,000, 27 to higher studies.</li><li>2021-22: 147 graduated, 29 placed, median Rs 5,00,000, 24 to higher studies.</li></ul><p>Placements are handled by PTU's Training and Placement Centre (tnp.ptuniv.edu.in).</p>","scholarships":"","college_image":null,"official_website":"https://ptuniv.edu.in","cta_heading":"Considering Puducherry Technological University?","cta_description":"Get help comparing CENTAC and JoSAA routes and fees.","faq_1_question":"How are B.Tech seats filled?","faq_1_answer":"<p>Through CENTAC and JoSAA.</p>","faq_2_question":"Was this previously Pondicherry Engineering College?","faq_2_answer":"<p>Yes. It became a university with effect from 5 September 2020.</p>","faq_3_question":"What is the fee for Puducherry candidates?","faq_3_answer":"The 2026-27 notice lists Rs 32,101 for CENTAC candidates from Puducherry.","faq_4_question":"How much is the hostel?","faq_4_answer":"<p>Rs 75,000, including caution deposit, in the 2026-27 notice.</p>","faq_5_question":"Where is the campus?","faq_5_answer":"<p>At Pillaichavady, Puducherry 605014.</p>","featured_image":{"id":1053,"date":"2026-11-04T06:33:30","date_gmt":"2026-11-04T06:33:30","guid":{"rendered":"https://staging.a3educarehub.in/colleges/ptu-puducherry/auditorium-puducherry-technological-university/"},"modified":"2026-11-04T06:33:30","modified_gmt":"2026-11-04T06:33:30","slug":"auditorium-puducherry-technological-university","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/ptu-puducherry/auditorium-puducherry-technological-university/#main","title":{"rendered":"Auditorium, Puducherry Technological University"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1053","attachment","type-attachment","stat
