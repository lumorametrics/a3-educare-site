 MBBS and BDS","fees_information":"","campus_facilities":"<h4>Library (RIMS, Imphal)</h4><ul><li><strong>Hours:</strong> 9:00 AM to 9:00 PM in summer and 9:00 AM to 8:00 PM in winter (Monday to Friday and Sunday); 9:00 AM to 5:00 PM on Saturday. The personal book reading room is open 24x7.</li><li><strong>Collection (2025-26):</strong> 38,921 books, 2,787 theses, 8,152 bound journal volumes and 1,184 CD-ROMs; 116 journals for 2024 (11 foreign online, 72 foreign print, 33 Indian print) plus 220 complimentary journals.</li><li><strong>E-resources:</strong> member of the ERMED-India consortium (more than 221 e-journals, BMJ e-Resources, ClinicalKey, MedOne, AccessMedicine) and of One Nation One Subscription; subscribed to UpToDate and Grammarly for 2025-26.</li><li>Library management and OPAC run on NIC's e-Granthalaya 4.0.</li></ul><p>Other campus facilities are not described on the institute's library page.</p>","hostel_information":"<h4>Hostels at RIMS, Imphal (as given in the RIMS Prospectus 2023)</h4><ul><li><strong>Undergraduate:</strong> 4 boys' hostels with a total capacity of 448, and 4 girls' hostels with a capacity of 260.</li><li><strong>Postgraduate:</strong> 6 gents' hostels for 205 and 2 ladies' hostels for 186.</li><li><strong>Interns:</strong> one interns' hostel for 44 boys.</li><li><strong>Allotment:</strong> hostel accommodation is provided to students through the wardens.</li></ul><p>These figures are from the 2023 prospectus; check current availability and hostel fees with the institute.</p>","placement_information":"","scholarships":"","college_image":null,"official_website":"https://rims.edu.in","cta_heading":"Considering RIMS Imphal?","cta_description":"Get help with NEET (UG) counselling and your state's RIMS seats.","faq_1_question":"How many MBBS seats does RIMS have?","faq_1_answer":"<p>College listings give 125 a year.</p>","faq_2_question":"Does RIMS offer BDS?","faq_2_answer":"<p>Yes, listings give 50 BDS seats a year.</p>","faq_3_questi
