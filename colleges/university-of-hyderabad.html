    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:20.367Z","entries":{"college:university-of-hyderabad":[{"id":1059,"date":"2026-11-04T06:52:21","date_gmt":"2026-11-04T06:52:21","guid":{"rendered":"https://staging.a3educarehub.in/colleges/university-of-hyderabad/"},"modified":"2026-11-04T06:52:21","modified_gmt":"2026-11-04T06:52:21","slug":"university-of-hyderabad","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/university-of-hyderabad/","title":{"rendered":"University of Hyderabad"},"content":{"rendered":"","protected":false},"featured_media":1154,"template":"","class_list":["post-1059","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"The University of Hyderabad is a central university created by Act of Parliament in 1974. It offers integrated, master's and doctoral programmes through twelve schools at Gachibowli, holds Institution of Eminence status, and has 23 hostels.","college_overview":"<p>Parliament established the University of Hyderabad as a Central University through Act No. 39 of 1974, and it came into being on 2 October that year. The Government of India gave it Institution of Eminence status in September 2019.</p><p>Teaching is organised in twelve schools that cover the sciences, humanities, social sciences, economics, management, medical sciences, engineering, and the arts through the Sarojini Naidu School of Arts and Communication. The University also holds a city campus, The Golden Threshold, the former home of Sarojini Naidu.</p><p>Its programmes centre on integrated, master's and doctoral study. Applicants to many of these courses come through CUET, and first-semester fees in the 2025-26 prospectus start at Rs 7,760 for M.A. programmes.</p>","location":"Prof. C.R. Rao Road, Gachibowli, Hyderabad 500046, Telangana, India","city":"Hyderabad","state":"Telangana","established":"1974 (2 October, by Act of Parliament)","affiliation":"Central University established by Act of Parliament (Act No. 39 of 1974)","recognition":"<ul><li><strong>Institution of Eminence:</strong> status accorded by the Government of India in September 2019.</li><li><strong>NAAC:</strong> CGPA 3.28 on a 4.0 scale, grade A+, valid for five years up to January 2028.</li><li><strong>NIRF 2024:</strong> 17th among universities and 25th overall, as stated in the 2025-26 prospectus.</li></ul>","courses_offered":"<ul><li><strong>Integrated programmes:</strong> 17 programmes through CUET-UG 2026, including 5-year integrated M.A. and M.Sc options and a 6-year integrated M.Sc (M.Optometry) listed in the 2025-26 prospectus.</li><li><strong>Postgraduate:</strong> 42 programmes through CUET-PG 2026, plus the MBA (2026-28 prospectus).</li><li><strong>Doctoral:</strong> PhD, with admission notices issued for each intake.</li></ul><p><strong>Schools:</strong> Mathematics and Statistics; Computer and Information Sciences; Physics; Chemistry; Life Sciences; Humanities; Social Sciences; Economics; Sarojini Naidu School of Arts and Communication; Management Studies; Medical Sciences; Engineering Sciences and Technology.</p>","admission_process":"<p>Candidates for integrated programmes apply using CUET-UG scores, and candidates for most master's programmes use CUET-PG scores. The University publishes its programme list, seats and dates in each year's admission notice, and the MBA has its own prospectus. PhD admissions are announced separately for each intake.</p>","eligibility":"<p>Eligibility is set course by course in the University's prospectus and admission notices. Check the entry for the exact programme before applying.</p>","entrance_exams":"CUET-UG and CUET-PG; MBA and PhD as per the University's own notices","fees_information":"<p><strong>First-semester fees, 2025-26 prospectus, including refundable deposits:</strong></p><ul><li>M.A. programmes: Rs 7,760</li><li>M.Sc Mathematics, Statistics and Physics: Rs 9,450</li><li>M.Sc Chemistry and several life and earth science programmes, and 5-year integrated M.Sc: Rs 10,925</li><li>6-year Integrated M.Sc (M.Optometry): Rs 32,215</li></ul><p><strong>2026 application fee:</strong> Rs 300 General; Rs 200 EWS and OBC-NCL; Rs 125 SC, ST and PwD.</p>","campus_facilities":"<p>The main Gachibowli campus is described on the University's homepage as around 2,300 acres of greenery. All schools, departments and centres are located there.</p><p>The Indira Gandhi Memorial Library holds more than 3 lakh books and back volumes and is open until midnight on working days. The University Health Centre provides outpatient care and a few beds for emergency inpatient treatment.</p>","hostel_information":"<p>The University states that it has 23 hostels accommodating over 5,000 male and female students. Some hostels also provide dining. Hostel facilities apply only for the prescribed maximum duration of the course.</p>","placement_information":"<p>The University has a Placement Guidance and Advisory Board that helps students with internships. The School of Management Studies publishes its own placement brochure for each MBA batch.</p>","scholarships":"<h4>Fellowships and scholarships handled by the Fellowships &amp; Scholarships Section</h4><ul><li>UGC Non-NET fellowships, with a revised submission, processing and payment procedure effective 1 April 2026.</li><li>5th Year Financial Assistance.</li><li>University of Hyderabad Student Assistance (UoH-SA), with applications invited for 2025-26.</li><li>Telangana Social Welfare Scholarship (fresh and renewal) for 2025-26, with physical verification of documents.</li><li>Postdoctoral fellowship guidelines and the National Scholarship Portal.</li></ul><p>The section publishes notices, circulars and application links; check the University of Hyderabad Scholarships &amp; Fellowships page for the current schemes and deadlines.</p>","college_image":null,"official_website":"https://uohyd.ac.in","cta_heading":"Planning to apply to the University of Hyderabad?","cta_description":"Get help choosing a programme and preparing your CUET application.","faq_1_question":"How do I get admission to the University of Hyderabad?","faq_1_answer":"<p>Use CUET-UG for integrated programmes and CUET-PG for most master's programmes. The MBA and PhD have their own notices.</p>","faq_2_question":"Is the University of Hyderabad a central university?","faq_2_answer":"<p>Yes. It was established by Act of Parliament in 1974 and holds Institution of Eminence status.</p>","faq_3_question":"What is its NAAC grade?","faq_3_answer":"A+, with a CGPA of 3.28 on a 4.0 scale, valid up to January 2028.","faq_4_question":"How much are first-semester fees?","faq_4_answer":"<p>In the 2025-26 prospectus they range from Rs 7,760 for M.A. programmes to Rs 32,215 for the 6-year Integrated M.Sc (M.Optometry), including refundable deposits.</p>","faq_5_question":"How many hostels does the University have?","faq_5_answer":"<p>The University's hostel page lists 23 hostels housing over 5,000 students.</p>","featured_image":{"id":1154,"date":"2026-11-04T07:22:43","date_gmt":"2026-11-04T07:22:43","guid":{"rendered":"https://staging.a3educarehub.in/colleges/university-of-hyderabad/university-of-hyderabad-campus/"},"modified":"2026-11-04T07:22:43","modified_gmt":"2026-11-04T07:22:43","slug":"university-of-hyderabad-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/university-of-hyderabad/university-of-hyderabad-campus/#main","title":{"rendered":"University of Hyderabad campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1154","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/university-of-hyderabad.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\"
