    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:29.382Z","entries":{"college:pondicherry-university":[{"id":1051,"date":"2026-11-04T06:29:27","date_gmt":"2026-11-04T06:29:27","guid":{"rendered":"https://staging.a3educarehub.in/colleges/pondicherry-university/"},"modified":"2026-11-04T06:29:27","modified_gmt":"2026-11-04T06:29:27","slug":"pondicherry-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/pondicherry-university/","title":{"rendered":"Pondicherry University"},"content":{"rendered":"","protected":false},"featured_media":1055,"template":"","class_list":["post-1051","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Pondicherry University is a central university created by Act No. 53 of 1985, on an 800-acre campus at Kalapet about 10 km from Puducherry town. It admits undergraduates through CUET (UG), runs 23 main-campus hostels, and reports a NAAC A+ grade.","college_overview":"<p>Parliament established Pondicherry University through Act No. 53 of 1985. Its main campus covers 800 acres at Kalapet, about 10 km from Puducherry town, and it also has campuses at Karaikal and Port Blair.</p><p>The university publishes separate admission brochures for undergraduate, integrated teacher education, postgraduate and doctoral programmes, and CUET (UG) is compulsory for most undergraduate quotas.</p><p>The main campus has 23 hostels with separate halls for postgraduate students and research scholars, and rooms set aside for foreign students. The university's news page reports NAAC A+ re-accreditation in its fifth cycle.</p>","location":"Kalapet, Puducherry, India","city":"Puducherry","state":"Puducherry","established":"1985 (Act No. 53 of 1985)","affiliation":"Central University established by Act of Parliament No. 53 of 1985","recognition":"<ul><li><strong>Status:</strong> Central University by Act of Parliament</li><li><strong>NAAC:</strong> A+ in the fifth cycle, as reported on the university's site</li></ul>","courses_offered":"<ul><li><strong>Undergraduate:</strong> NEP UG (Hons.) and B.Tech programmes</li><li><strong>Integrated teacher education:</strong> 4-year B.A. B.Ed and B.Sc. B.Ed</li><li><strong>Postgraduate</strong> and integrated programmes</li><li><strong>Doctoral:</strong> Ph.D. (2026-27 brochure)</li><li><strong>Distance education</strong></li></ul>","admission_process":"<p>CUET (UG) is compulsory for undergraduate quotas, except the top sports quota category. The university publishes an information brochure for each admission stream on its admissions portal.</p>","eligibility":"<p>Conditions are listed in the information brochure for each programme and year.</p>","entrance_exams":"CUET (UG) for undergraduate programmes; others as in each brochure","fees_information":"<p><strong>Ph.D. 2026-27 application fee:</strong> Rs 1,500 for general and Rs 750 for SC and ST candidates. Programme fees are in each brochure, and self-financing admissions cost double the regular amount. Hostel fees are issued by circular each year.</p>","campus_facilities":"<p>The main campus covers 800 acres at Kalapet, with five mess halls. The university also has campuses at Karaikal and Port Blair.</p>","hostel_information":"<p>The main campus has 23 hostels: 14 for men and 9 for women, serving postgraduate students and research scholars. C.V. Raman Hostel (40 rooms) and Madame Curie Hostel (49 rooms) serve foreign students. Stay is limited to 2 years for PG, 4 for Ph.D. and UG (NEP), and 5 for integrated students. Karaikal and Port Blair each have two hostels.</p>","placement_information":"<h4>Placement Cell (Pondicherry University)</h4><ul><li>Links students with employers and runs campus recruitment drives, industry-academia sessions, career counselling, skill development workshops and internships, including online and hybrid drives.</li><li><strong>Placement coordinator:</strong> Dr. S. Riasudeen; associate coordinator Dr. S. Kavin Mary. Contact: placement.officer@pondiuni.ac.in, 0413-2654514.</li></ul><h4>Recent notices</h4><ul><li>5 November 2026: students selected by Velammal Bodhi Academy for 2026-27, after a campus drive for the Velammal Group of Schools on 29 October 2026.</li><li>9 October 2026: caution against phishing emails offering placements and internships.</li><li>5 March 2026: applications for Tata Steel's Aspiring Engineer Programme, 2026 batch.</li><li>5 May 2026: launch of a restructured placement website.</li></ul><p>Placement statistics and recruiter lists are kept on the cell's placement website.</p>","scholarships":"<h4>Scholarships and fellowships at Pondicherry University</h4><ul><li><strong>Ph.D.:</strong> full-time scholars admitted to Ph.D. in university departments are eligible for a monthly fellowship of Rs 8,000 with contingency.</li><li><strong>Merit Scholarship (PG):</strong> the top three scorers in the PG admission entrance examination receive Rs 2,000, Rs 1,500 and Rs 1,000 a month for the first semester; in later semesters it goes to the top three by previous-semester SGPA.</li><li><strong>Merit-cum-Means (MCM):</strong> 20% of students in each PG programme are eligible; parental income must not exceed Rs 2,50,000; Rs 750 a month, with at least 70% monthly attendance and a pass in all papers.</li><li><strong>M.Sc Marine Biology and Disaster Management (Port Blair):</strong> all selected candidates receive Rs 1,000 a month.</li><li><strong>M.Tech Computational Biology:</strong> all selected candidates receive Rs 12,500 a month.</li><li><strong>Persons with disabilities:</strong> fully free education for differently abled students.</li><li><strong>UGC/CSIR NET JRFs:</strong> fellowship of Rs 25,000 a month for two years, which may rise to Rs 28,000, as laid down by the UGC/CSIR.</li></ul>","college_image":null,"official_website":"https://www.pondiuni.edu.in","cta_heading":"Planning to apply to Pondicherry University?","cta_description":"Get help preparing for CUET and choosing a programme.","faq_1_question":"Is Pondicherry University a central university?","faq_1_answer":"<p>Yes. It was established by Act of Parliament No. 53 of 1985.</p>","faq_2_question":"Is CUET compulsory?","faq_2_answer":"<p>The university says CUET (UG) is compulsory for undergraduate quotas, except the top sports quota category.</p>","faq_3_question":"How many hostels are there?","faq_3_answer":"23 on the main campus: 14 for men and 9 for women.","faq_4_question":"Are there other campuses?","faq_4_answer":"<p>Yes, at Karaikal and Port Blair.</p>","faq_5_question":"How large is the main campus?","faq_5_answer":"<p>800 acres at Kalapet, about 10 km from Puducherry town.</p>","featured_image":{"id":1055,"date":"2026-11-04T06:33:38","date_gmt":"2026-11-04T06:33:38","guid":{"rendered":"https://staging.a3educarehub.in/colleges/pondicherry-university/pondicherry-university-campus/"},"modified":"2026-11-04T06:33:38","modified_gmt":"2026-11-04T06:33:38","slug":"pondicherry-university-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/pondicherry-university/pondicherry-university-campus/#main","title":{"rendered":"Pondicherry University campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1055","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/pondicherry-university.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"225\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/pondicherry-university-300x225.jpg\" class=\"attachment-medium size-medium\" alt=\"Pondicherry University campus at Kalapet\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/pondicherry-university-300x225.jpg 300w, https://stagi
