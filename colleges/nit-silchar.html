    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:20.414Z","entries":{"college:nit-silchar":[{"id":1095,"date":"2026-11-04T06:53:57","date_gmt":"2026-11-04T06:53:57","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-silchar/"},"modified":"2026-11-04T06:53:57","modified_gmt":"2026-11-04T06:53:57","slug":"nit-silchar","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nit-silchar/","title":{"rendered":"National Institute of Technology Silchar"},"content":{"rendered":"","protected":false},"featured_media":1184,"template":"","class_list":["post-1095","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"NIT Silchar began in 1967 as a Regional Engineering College and became a National Institute of Technology in 2002. Its campus of almost 700 acres in Assam houses more than 5,000 students across B.Tech, M.Tech, M.Sc, MBA and Ph.D. programmes.","college_overview":"<p>The institute opened as a Regional Engineering College in 1967 and was upgraded to a National Institute of Technology in 2002. It is one of India's 31 NITs.</p><p>An institute brochure describes a campus of almost 700 acres, with more than 5,000 students across undergraduate, postgraduate and doctoral courses in engineering, sciences and management.</p><p>First-semester undergraduate seats are allotted through JoSAA from the JEE (Main) list, and the institute posts fee and hostel notices for each entry batch.</p>","location":"NIT Silchar, Silchar 788010, Assam, India","city":"Silchar","state":"Assam","established":"1967 (as Regional Engineering College)","affiliation":"National Institute of Technology; awards its own degrees","recognition":"<p>NIT Silchar is one of the 31 National Institutes of Technology, upgraded to that status in 2002.</p>","courses_offered":"<ul><li><strong>Undergraduate:</strong> B.Tech</li><li><strong>Postgraduate:</strong> M.Tech, M.Sc and MBA</li><li><strong>Doctoral:</strong> Ph.D.</li></ul>","admission_process":"<p>First-semester undergraduate seats are made on the basis of seats allocated by JoSAA from the JEE (Main) list. The institute publishes admission notices for each round, including balance fee payment and hostel fee notices.</p>","eligibility":"<p>Candidates must meet JEE (Main) and JoSAA conditions for the admission year.</p>","entrance_exams":"JEE (Main) for B.Tech","fees_information":"<p>The institute publishes a B.Tech first-semester fee structure for each entry batch, including the 2026 batch, on its fee structure page.</p>","campus_facilities":"<p>The campus covers almost 700 acres, according to an institute brochure.</p>","hostel_information":"<p>The institute issues hostel admission fee notices for first-semester undergraduate and postgraduate students.</p>","placement_information":"<p>A Training and Placement Cell supports campus recruitment.</p>","scholarships":"<h4>Tuition fee waiver</h4><p>The undergraduate course registration form has claim options for income below Rs 1 lakh a year, income from Rs 1 lakh to Rs 5 lakh a year, and SC, ST and PwD students. For the B.Tech 2026 entry batch, a claim needs a Family or Parental Annual Income Certificate in the institute's format, issued by the competent authority on or after 1 April 2026.</p><h4>Scholarship notices, 2026-27</h4><p>The institute's website lists these for 2026-27:</p><ul><li>National Scholarship for Higher Education of ST Students. The attached Ministry of Tribal Affairs list of eligible institutes, for 2023-24 onwards, names NIT Silchar for all engineering courses</li><li>Shraman Equal Opportunity Scholarship Program</li><li>Bharti Airtel Scholarship, for first-year undergraduate students</li><li>A general notice on the scholarship application process</li></ul><h4>Other schemes listed</h4><p>The institute's Scholarship Details page also carries earlier notices, some now dated. They include the Bharti Infratel Scholarship Program for students with disabilities at Institutes of National Importance in North-East India, the Swami Dayanand merit-cum-means scholarships, and revised Ph.D. scholarship rates. Check whether a scheme is still open before applying.</p>","college_image":null,"official_website":"https://www.nits.ac.in","cta_heading":"Considering NIT Silchar?","cta_description":"Get help with your JEE (Main) strategy and JoSAA choices.","faq_1_question":"How do I get B.Tech admission?","faq_1_answer":"<p>Through JEE (Main) and JoSAA seat allocation.</p>","faq_2_question":"When was NIT Silchar founded?","faq_2_answer":"<p>In 1967, as a Regional Engineering College. It became an NIT in 2002.</p>","faq_3_question":"How large is the campus?","faq_3_answer":"An institute brochure gives almost 700 acres.","faq_4_question":"Does it offer an MBA?","faq_4_answer":"<p>Yes. MBA is listed among its programmes.</p>","faq_5_question":"Where are fee details published?","faq_5_answer":"<p>On the institute's fee structure page, by entry batch.</p>","featured_image":{"id":1184,"date":"2026-11-04T07:25:21","date_gmt":"2026-11-04T07:25:21","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-silchar/national-institute-of-technology-silchar-campus/"},"modified":"2026-11-04T07:25:21","modified_gmt":"2026-11-04T07:25:21","slug":"national-institute-of-technology-silchar-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nit-silchar/national-institute-of-technology-silchar-campus/#main","title":{"rendered":"National Institute of Technology Silchar campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1184","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-silchar.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\"
