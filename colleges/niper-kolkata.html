    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:21.237Z","entries":{"college:niper-kolkata":[{"id":1092,"date":"2026-11-04T06:53:53","date_gmt":"2026-11-04T06:53:53","guid":{"rendered":"https://staging.a3educarehub.in/colleges/niper-kolkata/"},"modified":"2026-11-04T06:53:53","modified_gmt":"2026-11-04T06:53:53","slug":"niper-kolkata","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/niper-kolkata/","title":{"rendered":"National Institute of Pharmaceutical Education and Research, Kolkata"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1092","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"NIPER Kolkata began its M.S. (Pharm) programme in 2007 in medicinal chemistry, natural products and pharmacoinformatics, then added pharmacology and pharmaceutics. It admits students through GPAT and the NIPER Joint Entrance Examination at Maniktala, Kolkata.","college_overview":"<p>NIPER Kolkata is one of six institutes set up after the NIPER Act was amended in 2007. It works from Chunilal Bhawan on Maniktala Main Road, under the Department of Pharmaceuticals.</p><p>Its M.S. (Pharm) programme started in 2007 with Medicinal Chemistry, Natural Products and Pharmacoinformatics. Pharmacology and Toxicology joined in 2018 and Pharmaceutics in 2020. Doctoral teaching began in 2016.</p><p>Applicants need GPAT followed by the NIPER Joint Entrance Examination. A Department of Pharmaceuticals overview lists monthly fellowships for M.S. and PhD students.</p>","location":"Chunilal Bhawan, 168, Maniktala Main Road, Kolkata 700054, West Bengal, India","city":"Kolkata","state":"West Bengal","established":"2007","affiliation":"Institute of national importance under the NIPER Act; Department of Pharmaceuticals","recognition":"<p>NIPER Kolkata is set up under the <strong>NIPER Act</strong> and comes under the Department of Pharmaceuticals, Government of India.</p>","courses_offered":"<ul><li><strong>M.S. (Pharm):</strong> Medicinal Chemistry, Natural Products, Pharmacoinformatics, Pharmacology and Toxicology, Pharmaceutics</li><li><strong>Ph.D.:</strong> started in 2016 in the first three areas, with the others added later</li></ul><p><strong>Departments listed:</strong> Medicinal Chemistry, Natural Products, Pharmacology and Toxicology, Pharmacoinformatics, Pharmaceutics, Medical Device, Pharmaceutical Analysis and Biotechnology.</p>","admission_process":"<p>Admission is based on GPAT followed by the NIPER Joint Entrance Examination, conducted each year. Successful candidates are placed through counselling. Admissions run through the NIPER admissions portal.</p>","eligibility":"<p>Candidates must meet the GPAT and NIPER JEE conditions for the admission year.</p>","entrance_exams":"GPAT and NIPER Joint Entrance Examination","fees_information":"","campus_facilities":"<p>The institute works from Chunilal Bhawan, 168 Maniktala Main Road, Kolkata, with departments across pharmaceutical sciences.</p>","hostel_information":"<h4>NIPER Kolkata hostel</h4><ul><li><strong>Location:</strong> NIPER Hostel, IC Block, Sector III, Bidhannagar (Salt Lake), Kolkata 700106, separate from the institute at Maniktala.</li><li><strong>Transport:</strong> a to-and-fro bus service between the hostel and the institute.</li><li><strong>Management:</strong> each hostel is supervised by a Hostel Supervisor, a regular employee of the institute, and a hostel committee nominated by the Director.</li><li><strong>Mess:</strong> run by the hostellers; every resident is a compulsory member, with two or three mess prefects taking charge each month by rotation and setting the menu a week in advance.</li><li><strong>Rules:</strong> rooms cannot be changed without the Hostel Supervisor's written permission; silence after 8:30 PM; alcohol, drugs and smoking are prohibited; anti-ragging rules apply.</li></ul><p>The hostel page does not state capacity or hostel fees.</p>","placement_information":"<h4>Placements reported in NIPER Kolkata's NIRF 2024 submission (2-year PG programmes)</h4><ul><li><strong>Graduating year 2022-23:</strong> 75 graduated, 55 placed, median salary Rs 4,70,000, 19 went on to higher studies.</li><li><strong>2021-22:</strong> 49 graduated, 32 placed, median Rs 3,80,000, 15 to higher studies.</li><li><strong>2020-21:</strong> 31 graduated, 21 placed, median Rs 3,69,665, 7 to higher studies.</li></ul><p>This is the latest placement data found on the institute's website; it covers years up to 2022-23. The institute's Career page lists staff recruitment, not student placements.</p>","scholarships":"<p>A Department of Pharmaceuticals overview lists monthly fellowships of about Rs 12,400 for M.S. (Pharm) students and Rs 37,000 to Rs 42,000 for PhD students. The document is undated.</p>","college_image":null,"official_website":"https://www.niperkolkata.edu.in","cta_heading":"Considering NIPER Kolkata?","cta_description":"Get help preparing for GPAT and NIPER JEE.","faq_1_question":"How do I get admission?","faq_1_answer":"<p>Qualify in GPAT, then appear for the NIPER Joint Entrance Examination and counselling.</p>","faq_2_question":"What specialisations are offered?","faq_2_answer":"<p>Medicinal Chemistry, Natural Products, Pharmacoinformatics, Pharmacology and Toxicology, and Pharmaceutics.</p>","faq_3_question":"When did the institute begin teaching?","faq_3_answer":"Its M.S. (Pharm) programme started in 2007.","faq_4_question":"Is there a PhD programme?","faq_4_answer":"<p>Yes. It began in 2016.</p>","faq_5_question":"Where is the institute?","faq_5_answer":"<p>At Chunilal Bhawan, 168 Maniktala Main Road, Kolkata 700054.</p>","featured_image":{"id":1448,"date":"2026-11-14T12:10:23","date_gmt":"2026-11-14T12:10:23","guid":{"rendered":"https://staging.a3educarehub.in/colleges/niper-kolkata/national-institute-of-pharmaceutical-education-and-research-kolkata-featured-image/"},"modified":"20
