    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:42.206Z","entries":{"college:bhilai-institute-of-technology-durg":[{"id":1431,"date":"2026-11-14T09:23:37","date_gmt":"2026-11-14T09:23:37","guid":{"rendered":"https://staging.a3educarehub.in/?post_type=colleges&#038;p=1431"},"modified":"2026-11-14T09:23:37","modified_gmt":"2026-11-14T09:23:37","slug":"bhilai-institute-of-technology-durg","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/bhilai-institute-of-technology-durg/","title":{"rendered":"Bhilai Institute of Technology, Durg"},"content":{"rendered":"","protected":false},"featured_media":1433,"template":"","class_list":["post-1431","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Bhilai Institute of Technology, Durg, was established in 1986. It offers B.Tech, M.Tech, MCA and MBA, is accredited by NAAC with an A grade, and admits through Chhattisgarh's central online counselling.","college_overview":"<p>Bhilai Institute of Technology (BIT), Durg, was established in 1986 and is located at Bhilai House, Durg, Chhattisgarh. Its motto is \"Aspire To Excel\". The institute states that it is accredited by NAAC with an A grade and provisionally accredited by NBA for five undergraduate programmes.</p><p>It offers B.Tech, M.Tech, MCA and MBA programmes. Its training and placement cell links students with industry, and AICTE has given it the Margdarshan project to mentor other institutions.</p>","location":"Bhilai House, Durg, Chhattisgarh","city":"Durg","state":"Chhattisgarh","established":"1986","affiliation":"","recognition":"<ul><li><strong>NAAC:</strong> accredited with A grade, as the institute states</li><li><strong>NBA:</strong> provisionally accredited for five undergraduate programmes, as the institute states</li><li><strong>AICTE:</strong> assigned the Margdarshan project to mentor institutions</li></ul>","courses_offered":"<p><strong>B.Tech</strong> programmes include Electrical and Electronics Engineering, Computer Science and Engineering (Data Science), Computer Science and Engineering (Artificial Intelligence), Electronics and Computer Science, and Computer Science and Technology.</p><p><strong>Postgraduate:</strong> M.Tech (including Electrical Power and Energy System, Electric Vehicle Technology, Structural Engineering, Data Sciences and Environmental Science and Engineering), MCA and MBA.</p><p>See the official undergraduate and postgraduate programme pages for the current list and intake.</p>","admission_process":"<p>Admission to all courses is through central online counselling run by the Directorate of Technical Education, Government of Chhattisgarh, whose dates are announced in local newspapers and on www.cgdteraipur.ac.in. Seats under the sponsored category, part-time courses and the management quota are filled at the institute level.</p><p>For B.Tech, 75% of the approved intake is the Chhattisgarh state quota, 15% is the management quota and 10% is for candidates from outside Chhattisgarh, though the split can change each year. An additional 5% of seats under the tuition fee waiver scheme are admitted over and above the approved intake, as per state government guidelines.</p>","eligibility":"","entrance_exams":"Central online counselling by the Directorate of Technical Education, Chhattisgarh; GATE or sponsored for M.Tech","fees_information":"","campus_facilities":"","hostel_information":"","placement_information":"<p>The institute has a training and placement cell that provides students a platform to interact with the corporate world and to improve their all-round personality. Year-wise placement figures were not found on the pages read.</p>","scholarships":"","college_image":null,"official_website":"https://bitdurg.ac.in/","cta_heading":"Considering BIT Durg?","cta_description":"Compare engineering and management programmes and admission routes with A3 EduCare Hub & Research Academy
