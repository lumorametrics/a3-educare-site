    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:57.178Z","entries":{"college:kerala-agricultural-university":[{"id":1077,"date":"2026-11-04T06:53:11","date_gmt":"2026-11-04T06:53:11","guid":{"rendered":"https://staging.a3educarehub.in/colleges/kerala-agricultural-university/"},"modified":"2026-11-04T06:53:11","modified_gmt":"2026-11-04T06:53:11","slug":"kerala-agricultural-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/kerala-agricultural-university/","title":{"rendered":"Kerala Agricultural University"},"content":{"rendered":"","protected":false},"featured_media":1170,"template":"","class_list":["post-1077","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Kerala Agricultural University came into existence on 24 February 1971 under a state Act, with its main campus at Vellanikkara, Thrissur. Its eight colleges cover agriculture, agricultural engineering, forestry, co-operation and banking, and climate change sciences.","college_overview":"<p>Kerala Agricultural University is deemed to have come into existence on 24 February 1971, under the Agricultural University Act of the Kerala legislature. Its headquarters are on the KAU Main Campus at Vellanikkara, Thrissur.</p><p>The university now has eight colleges: four of agriculture, and one each of agricultural engineering, forestry, co-operation, banking and management, and climate change and environmental science.</p><p>The College of Agriculture at Vellanikkara began in 1972 at the Mannuthy veterinary campus and moved to the main campus in 1977. Its B.Sc. (Ag.) intake grew in stages over the years, to 75 and then 90.</p>","location":"KAU Main Campus, KAU P.O., Vellanikkara, Thrissur 680656, Kerala, India","city":"Thrissur","state":"Kerala","established":"1971 (24 February)","affiliation":"State agricultural university under the Agricultural University Act, 1971","recognition":"<p>Kerala Agricultural University is a state agricultural university established by Kerala legislation.</p>","courses_offered":"<ul><li><strong>Undergraduate:</strong> B.Sc. (Ag.) and other degrees through its colleges</li><li><strong>Postgraduate and doctoral:</strong> master's and Ph.D. programmes listed in the university's PG prospectus</li></ul><p><strong>Colleges:</strong> four of agriculture, one of agricultural engineering, one of forestry, one of co-operation, banking and management, and one of climate change and environmental sciences.</p>","admission_process":"<p>The Directorate of Education handles admission queries, and the university runs an online admissions portal. Its PG prospectus sets out application fees, distribution of seats and fees for master's and Ph.D. courses.</p>","eligibility":"<p>Conditions are set in the prospectus for each programme and year.</p>","entrance_exams":"As stated in each year's prospectus","fees_information":"","campus_facilities":"<p>The main campus at Vellanikkara hosts university headquarters and the College of Agriculture. The College of Co-operation, Banking and Management is also at Vellanikkara.</p>","hostel_information":"<h4>Hostel availability</h4><ul><li><strong>Postgraduate students:</strong> the KAU PG Prospectus 2024-25 states that hostel facilities are provided depending on availability; hostel norms are decided by the university from time to time.</li><li><strong>Who arranges it:</strong> the Directorate of Students' Welfare (Vellanikkara) arranges student accommodation according to the rooms available in the hostels of the university's colleges.</li></ul><p>KAU has colleges on several campuses, and neither source lists hostel capacity or fees; check with the specific college or the Directorate of Students' Welfare (dsw@kau.in) before admission.</p>","placement_information":"<h4>Placement support at KAU</h4><ul><li>The Directorate of Students' Welfare is responsible for arranging employment and placement programmes for the university's graduates.</li><li>An Employment Information and Guidance Bureau under the Directorate publishes employment bulletins on job opportunities in India and abroad.</li><li>KAU's colleges run their own student placement cells with a faculty placement officer, holding campus interviews and training on personality development and career guidance.</li></ul><p>KAU does not publish year-wise placement statistics on the pages checked.</p>","scholarships":"<h4>Vice Chancellor's Merit-cum-Means Scholarship (VCMMS)</h4><p>Instituted by a university order of 14 September 2025 for financially disadvantaged undergraduate students without a fee concession; the selection rules were modified on 17 November 2025.</p><ul><li><strong>Eligibility:</strong> annual family income below Rs 5 lakh.</li><li><strong>When to apply:</strong> within 5 days after admissions to the UG programmes close for that academic year.</li><li><strong>Selection:</strong> eligible students are ranked by their admission rank-list position, and the top-ranked students up to each course's limit are chosen in the first year. A committee headed by the Vice-Chancellor decides, within 7 working days of the scholarship portal closing.</li><li><strong>Fees while pending:</strong> applicants with valid income certificates pay only the pre-revised fee provisionally, and pay the balance if they are not selected.</li><li>Results are communicated electronically within three working days of the list being approved.</li></ul><p>Amounts and course-wise limits are in Annexure 1 of the September 2025 order.</p>","college_image":null,"official_website":"https://kau.in","cta_heading":"Interested in Kerala Agricultural University?","cta_description":"Get help choosing a programme and following the admission process.","faq_1_question":"When was the university established?","faq_1_answer":"<p>It is deemed to have come into existence on 24 February 1971.</p>","faq_2_question":"How many colleges does it have?","faq_2_answer":"<p>Eight, according to the university.</p>","faq_3_question":"Where is the main campus?","faq_3_answer":"At Vellanikkara, Thrissur, Kerala 680656.","faq_4_question":"Who handles admission queries?","faq_4_answer":"<p>The Directorate of Education, on 0487-2438139 or eduhelp@kau.in.</p>","faq_5_question":"Does the university teach forestry?","faq_5_answer":"<p>Yes. One of its eight colleges is a College of Forestry.</p>","featured_image":{"id":1170,"date":"2026-11-04T07:23:44","date_gmt":"2026-11-04T07:23:44","guid":{"rendered":"https://staging.a3educarehub.in/colleges/kerala-agricultural-university/kerala-agricultural-university-campus/"},"modified":"2026-11-04T07:23:44","modified_gmt":"2026-11-04T07:23:44","slug":"kerala-agricultural-university-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/kerala-agricultural-university/kerala-agricultural-university-campus/#main","title":{"rendered":"Kerala Agricultural University campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1170","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/kerala-agricultural-university.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"225\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/kerala-agricultural-university-300x225.jpg\" class=\"attachment-medium size-medium\" alt=\"Kerala Agricultural University campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/kerala-agricultural-university-300x225.jpg 300w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/kerala-agricultural-university-1024x768.jpg 1024w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/kerala-agricultural-university-768x576.jpg 768w, https://staging.a3e
