onary Medicine</li><li><strong>Nursing and technical courses</strong> for allied health professionals</li></ul>","admission_process":"<p>Selected candidates pay fees on the spot by card, wallet or internet banking. If the full fee is not paid by the stated time, the offer lapses and the seat goes to the next candidate on the merit list.</p>","eligibility":"<p>MBBS candidates must qualify in NEET UG and meet the conditions in the college's joint prospectus for the year.</p>","entrance_exams":"NEET UG for MBBS","fees_information":"<p><strong>MBBS, 2026 handbook:</strong></p><ul><li>First year: admission and tuition fee of Rs 24,979, plus other charges as applicable</li><li>Tuition afterwards: Rs 12,000 in year 2, Rs 12,600 in year 3, and Rs 14,400 in years 4 and 5</li><li>Amalgamated fund: Rs 10,000 a year</li></ul><p><strong>NRI seats:</strong> US$1,10,000 plus US$1,210 registration and Rs 50,000 security.</p>","campus_facilities":"<p>The college is attached to a 1,179-bed tertiary care hospital in Sector 32, with a trauma centre functional since 8 August 2025.</p>","hostel_information":"<p><strong>MBBS, 2026 handbook:</strong> single-room rent of Rs 7,200, amalgamated fund of Rs 4,500 and refundable security of Rs 2,000, for a total of Rs 13,700. Fees may be revised by the hospital administration.</p>","placement_information":"","scholarships":"","college_image":null,"official_website":"https://gmch.gov.in","cta_heading":"Aiming for GMCH Chandigarh?","cta_description":"Get help with NEET UG preparation and the UT counselling process.","faq_1_question":"How many MBBS seats does it have?","faq_1_answer":"<p>150, according to the 2026 handbook.</p>","faq_2_question":"When did it start?","faq_2_answer":"<p>In 1991, with 50 students.</p>","faq_3_question":"How many beds are in the hospital?","faq_3_answer":"1,179, according to the 2026 handbook.","faq_4_question":"What is the first-year fee?","faq_4_answer":"<p>Rs 24,979 for admission and tuition, plus other charges as a
