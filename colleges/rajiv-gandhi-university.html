    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:23.829Z","entries":{"college:rajiv-gandhi-university":[{"id":1148,"date":"2026-11-04T06:55:48","date_gmt":"2026-11-04T06:55:48","guid":{"rendered":"https://staging.a3educarehub.in/colleges/rajiv-gandhi-university/"},"modified":"2026-11-04T06:55:48","modified_gmt":"2026-11-04T06:55:48","slug":"rajiv-gandhi-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/rajiv-gandhi-university/","title":{"rendered":"Rajiv Gandhi University"},"content":{"rendered":"","protected":false},"featured_media":1216,"template":"","class_list":["post-1148","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Rajiv Gandhi University is a centrally funded institution in Itanagar, Arunachal Pradesh, offering undergraduate, postgraduate and research programmes.","college_overview":"<p>Rajiv Gandhi University, formerly Arunachal University, is the central university of Arunachal Pradesh, at Rono Hills, Doimukh. It received UGC recognition under Section 2(f) on 28 March 1985, began functioning on 1 April 1985, and gained Section 12-B recognition on 25 March 1994. It became a central university under the Rajiv Gandhi University Act, with effect from 9 April 2007.</p><p>The university's 2026-27 Admission Bulletin covers Ph.D., postgraduate, PG diploma, certificate and four-year undergraduate programmes, along with B.Ed., Special B.Ed., B.P.Ed., LL.B. and the four-year integrated teacher education programme. Its curriculum follows the NEP-2020 based NHEQF and NCrF frameworks.</p><p>Beyond its own departments, the university has affiliated colleges across Arunachal Pradesh, including Jawaharlal Nehru College at Pasighat and Dera Natung Government College at Itanagar.</p>","location":"Itanagar, Arunachal Pradesh, India","city":"Itanagar","state":"Arunachal Pradesh","established":"1984","affiliation":"Central university; awards its own degrees","recognition":"<ul><li><strong>UGC:</strong> Section 2(f) recognition on 28 March 1985, and Section 12-B recognition on 25 March 1994</li><li><strong>Central university status:</strong> by Act of Parliament, with effect from 9 April 2007</li><li><strong>NAAC:</strong> the university's website shows an A grade</li></ul>","courses_offered":"<h4>Undergraduate</h4><ul><li><strong>Four-year undergraduate programmes (FYUP):</strong> including four-year B.A. programmes, entered through CUET (UG)</li><li><strong>Four-Year Integrated Teacher Education Programme:</strong> B.A.-B.Ed.</li><li><strong>After a bachelor's degree:</strong> B.Ed., Special B.Ed., B.P.Ed. and LL.B.</li></ul><h4>Postgraduate (intake shown in the 2026-27 bulletin)</h4><ul><li><strong>M.A.:</strong> Anthropology (42), Economics (72), Education (62), English (60), Geography (59), Hindi (62), History (84), Political Science (76), Social Work (43), Sociology (67), Tribal Studies (25)</li><li><strong>M.Sc.:</strong> Applied Geology (24), Botany (30), Chemistry (33), Zoology (32), Statistics (12), and agriculture and horticulture specialisations</li><li><strong>M.Tech:</strong> Computer Science (22), Electronics and Communication (22), Agricultural Engineering (12)</li><li><strong>Professional:</strong> MBA (53), M.Com. (65), MCA (55), LL.M., M.Ed. and M.P.A.</li></ul><h4>PG Diploma</h4><ul><li>Programmes including Functional Hindi, Geo-Informatics, Tourism, Yoga Therapy and Disaster Management</li></ul><h4>Doctoral</h4><ul><li>Ph.D. programmes across departments</li></ul><p>Bracketed figures are the main intake in the 2026-27 bulletin. Check the bulletin for reserved seats and the full list.</p>","admission_process":"<p>The 2026-27 bulletin sets out a test-based system:</p><ul><li><strong>Undergraduate programmes (10+2 entry):</strong> CUET (UG) marks</li><li><strong>Postgraduate and diploma programmes:</strong> CUET (PG) marks</li><li><strong>Ph.D.:</strong> UGC or CSIR NET marks</li><li><strong>Integrated teacher education:</strong> NCET marks</li><li><strong>Certificate programmes:</strong> marks in the qualifying examination</li></ul><p>Candidates apply through the university's Samarth portal after the test results are declared. Any vacant seats are filled on merit under the existing guidelines. Students must submit an original College Leaving or Migration Certificate to their department.</p><p>The university's timeline for 2026-27 aimed to complete UG, PG, PG diploma and certificate admissions by 31 July 2026. Dates are notified separately each year at admissions.rgu.ac.in.</p>","eligibility":"<ul><li><strong>Four-year undergraduate programmes:</strong> a pass in Class XII or an equivalent 10+2 examination recognised by the Association of Indian Universities</li><li><strong>M.A. and M.Sc.:</strong> a bachelor's degree under the 10+2+3 pattern, with subject requirements that differ by programme</li><li><strong>MBA:</strong> a bachelor's degree from a UGC-recognised university with at least 50% marks in aggregate, with relaxation as the bulletin sets out</li></ul><p>Programme-specific conditions are listed in the Admission Bulletin 2026-27.</p>","entrance_exams":"CUET (UG), CUET (PG), UGC NET or CSIR NET for Ph.D., and NCET for the integrated teacher education programme","fees_information":"<p><strong>Ph.D., from the Admission Bulletin 2026-27:</strong></p><ul><li>Lab-oriented: Rs 14,850 at admission, then Rs 3,900 each continuing semester</li><li>Non-lab: Rs 12,850 at admission, then Rs 3,400 each continuing semester</li><li>The admission amount includes a refundable Rs 1,100</li></ul><p>Other fees differ by programme. The bulletin's fee section gives the amounts for postgraduate, PG diploma, undergraduate and certificate programmes. Hostel boarding fees and caution money are notified separately.</p>","campus_facilities":"<h4>Central Library</h4><p>The library offers books, journals, e-resources and digital databases, with 24x7 access to online resources, research assistance, and plagiarism detection through Turnitin (iThenticate). Services include book lending, reference support and digital archives. Its website lists a collection of 75,500 and hours of 9 am to 7 pm on working days.</p><h4>Health Centre</h4><p>A primary health centre at the centre of the campus serves students, staff and visitors, with free services. It has two medical officers and four beds.</p><h4>Other facilities</h4><p>The university's website also lists a Computer Centre, EDUSAT, a Women Technology Park, a Biotech Hub, a guest house, a bank and post office, a canteen, a day care centre, transport, and facilities for differently-abled students.</p><h4>Student environment</h4><p>The bulletin describes the campus as ragging free, with active anti-ragging committees, and as green and eco-friendly.</p>","hostel_information":"<p>The university's website says it maintains 12 halls of residence, 6 for men and 6 for women, with common rooms, TV and indoor games. The 2026-27 bulletin says hostels support nearly forty percent of learners.</p><ul><li><strong>Types:</strong> Regular and HEFA hostels, with different monthly fees</li><li><strong>Admission:</strong> limited and based on merit, and subject to admission to a programme</li><li><strong>How to apply:</strong> online during programme admission, and the head of department allots the seat</li><li><strong>Payment:</strong> selected students pay the boarding fee and caution money. Caution money is refunded only after the course is completed, or if a student fails or leaves it.</li></ul>","placement_information":"<p>The university has a Placement Cell, created on 19 February 2019. It signed a tripartite memorandum with NERIST Nirjuli and NIT Arunachal Pradesh on 13 August 2019.</p><p>The cell's page records internships and trainee placements for the 2020-2022 batches, but it publishes no overall placement rate or average package.</p>","scholarships":"<h4>Support for reserved categories (RGU SC/ST Cell)</h4><ul><li>The SC/ST Cell oversees UGC, central and state scholarship and stipend schemes for reserved categories; guidelines are displayed on department notice boards and included in the university prospectus.</li><li><strong>Fee exemption for SC students:</strong> no fee is charged to SC students whose parents' income from all sources is up to Rs 2.50 lakh a year, on producing caste and income certificates at admission. A refundable security deposit of Rs 1,000 is still charged. The state government extends this to SC students in distance education.</li><li>UGC sanctions PG scholarships to SC students, including for professional courses.</li></ul>","college_image":null,"official_website":"https://www.rgu.ac.in","cta_heading":"Considering Rajiv Gandhi University?","cta_description":"Get help with CUET and your programme choices at RGU, Arunachal Pradesh.","faq_1_question":"Is Rajiv Gandhi University a central university?","faq_1_answer":"<p>Yes. It became a central university in 2007, having started as Arunachal University in 1984.</p>","faq_2_question":"Where is the campus?","faq_2_answer":"<p>At Rono Hills, Doimukh, on the outskirts of Itanagar.</p>","faq_3_question":"Which entrance tests does RGU use?","faq_3_answer":"<p>CUET for undergraduate and postgraduate programmes, and RGUPET for Ph.D.</p>","faq_4_question":"What is RGU's NAAC grade?","faq_4_answer":"<p>The university's website shows an A grade.</p>","faq_5_question":"Where can I check programme details?","faq_5_answer":"<p>In the Admission Bulletin, published each year on the university's website. The latest is for 2026-27.</p>","featured_image":{"id":1216,"date":"2026-11-04T07:28:10","date_gmt":"2026-11-04T07:28:10","guid":{"rendered":"https://staging.a3educarehub.in/colleges/rajiv-gandhi-university/rajiv-gandhi-university-campus/"},"modified":"2026-11-04T07:28:10","modified_gmt":"2026-11-04T07:28:10","slug":"rajiv-gandhi-university-campus","status":"inherit","type":"attachment","link":"ht
