    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:58.364Z","entries":{"college:angrau":[{"id":1070,"date":"2026-11-04T06:52:36","date_gmt":"2026-11-04T06:52:36","guid":{"rendered":"https://staging.a3educarehub.in/colleges/angrau/"},"modified":"2026-11-04T06:52:36","modified_gmt":"2026-11-04T06:52:36","slug":"angrau","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/angrau/","title":{"rendered":"Acharya N. G. Ranga Agricultural University"},"content":{"rendered":"","protected":false},"featured_media":1163,"template":"","class_list":["post-1070","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Acharya N.G. Ranga Agricultural University has its administrative office at Lam, Guntur. Its constituent and affiliated colleges across Andhra Pradesh teach B.Sc. (Hons) Agriculture, B.Tech (Food Technology) and related programmes, with 40% of B.Sc. seats reserved for farmers' families.","college_overview":"<p>ANGRAU teaches agriculture and related subjects through a network of colleges rather than a single campus. Its constituent agricultural colleges include Bapatla, Naira, Rajahmahendravaram, Tirupati, Mahanandi, Udayagiri and Pulivendula, alongside food technology colleges at Bapatla and Pulivendula.</p><p>For 2025-26, its brochure listed 980 B.Sc. (Hons) Agriculture seats in constituent colleges and 504 in affiliated colleges. Selection uses AP EAPCET, while diploma holders use AGRICET.</p><p>The university's admission rules have features applicants should check early. Forty per cent of seats are reserved for candidates from farming families, and there are upper age limits.</p>","location":"Administrative Office, Lam, Guntur 522034, Andhra Pradesh, India","city":"Guntur","state":"Andhra Pradesh","established":"1964 (as Andhra Pradesh Agricultural University)","affiliation":"State agricultural university","recognition":"<p>ANGRAU lists ICAR accreditation for its B.Sc. (Hons) Community Science programme, and 20% of constituent B.Sc. (Hons) Agriculture seats include ICAR seats.</p>","courses_offered":"<ul><li><strong>B.Sc. (Hons) Agriculture:</strong> 980 seats in constituent colleges and 504 in affiliated colleges (2025-26)</li><li><strong>B.Tech (Food Technology):</strong> 73 seats in constituent colleges (2025-26)</li><li><strong>B.Sc. (Hons) Community Science:</strong> four years, College of Community Science, Lam</li><li><strong>Postgraduate programmes</strong>, under the university's regulations</li><li><strong>Diploma programmes</strong>, through AGRI POLYCET</li></ul><p>A further 10% supernumerary seats are allocated under the EWS category.</p>","admission_process":"<p>B.Sc. (Hons) Agriculture and B.Tech (Food Technology) seats are filled using AP EAPCET and AP AGRICET ranks, with counselling schedules on the university's homepage. For 2026-27, diploma holders applied through AGRICET-2026 online between 1 and 27 July 2026, and classes begin on 26 October 2026.</p>","eligibility":"<ul><li><strong>Qualifying exam:</strong> a pass in the two-year Intermediate with Bi.P.C. or M.Bi.P.C., or an equivalent</li><li><strong>Age:</strong> minimum 17; upper limit 22 for General, 25 for SC and ST, and 27 for physically challenged candidates</li><li><strong>Farmers' quota:</strong> 40% of seats; candidates must meet the study and land-record conditions in the brochure</li></ul>","entrance_exams":"AP EAPCET; AP AGRICET for diploma holders; AGRI POLYCET for diploma programmes","fees_information":"<p><strong>B.Sc. (Hons) Agriculture, constituent colleges, 2025-26:</strong> Rs 51,069 in total, including refundable deposits, hostel charges and mess advance.</p><p><strong>AGRICET-2026 application fee:</strong> Rs 1,500, or Rs 750 for SC, ST and PH candidates.</p>","campus_facilities":"<p>The university teaches through constituent colleges at Bapatla, Naira, Rajahmahendravaram, Tirupati, Mahanandi, Udayagiri and Pulivendula, with food technology colleges at Bapatla and Pulivendula and a College of Community Science at Lam.</p>","hostel_information":"<p>Hostel places are provided subject to the availability of accommodation. Hostel charges and the mess advance are included in the 2025-26 fee table for constituent colleges.</p>","placement_information":"<p>The university's Placement Cell identifies industries that match students' academic backgrounds, invites them to recruit on campus and schedules the recruitment process. It also offers career counselling and interview preparation. The Student Affairs section conducts campus placement drives with companies and organisations.</p><h4>Four-year undergraduate programmes (NIRF 2026 data submitted by the university)</h4><ul><li><strong>2024-25:</strong> 1,033 graduated in the stipulated time, 214 placed, median salary Rs 5,15,000, 379 selected for higher studies</li><li><strong>2023-24:</strong> 482 graduated, 35 placed, median salary Rs 5,00,000, 242 selected for higher studies</li><li><strong>2022-23:</strong> 972 graduated, 174 placed, median salary Rs 4,50,500, 349 selected for higher studies</li></ul><h4>Two-year postgraduate programmes (NIRF 2026 data)</h4><ul><li><strong>2024-25:</strong> 232 graduated, 85 placed, median salary Rs 6,60,000, 74 selected for higher studies</li><li><strong>2023-24:</strong> 226 graduated, 61 placed, median salary Rs 6,50,000, 61 selected for higher studies</li><li><strong>2022-23:</strong> 160 graduated, 45 placed, median salary Rs 6,09,500, 68 selected for higher studies</li></ul><p>The latest college-wise figures read are in the Annual Report 2020-21, which records 97 placements through the Students' Counselling and Placement Cells, including 36 from Agricultural College, Bapatla and 18 from S V Agricultural College, Tirupati.</p><p><strong>Contact:</strong> Dean of Student Affairs, dsa@angrau.ac.in.</p>","scholarships":"<p>The Student Affairs section handles fellowships and scholarships. The university's scholarships page carries no session date, so check current rates with the section at dsa@angrau.ac.in.</p><h4>Andhra Pradesh Government schemes</h4><ul><li><strong>Post Matric Scholarship (Reimbursement of Tuition Fee):</strong> for SC, ST, backward class, minority, Kapu, economically backward and differently abled students with annual family income below Rs 2.5 lakh. It is credited to the college account in four instalments a year.</li><li><strong>Post Matric Scholarship (Maintenance Fee):</strong> for hostel and mess charges of BPL students, Rs 20,000 in two instalments in an academic year.</li><li><strong>Postgraduate stipend:</strong> Rs 10,000 a month for Ph.D. and Rs 7,000 a month for M.Sc. students.</li></ul><h4>ICAR schemes</h4><ul><li><strong>National Talent Scholarship:</strong> merit-based, for students admitted through the ICAR All India Entrance Examination to an agricultural university outside their home state. Rs 3,000 a month for undergraduates and Rs 5,000 a month for postgraduates.</li><li><strong>Merit-cum-Means Scholarship:</strong> Rs 1,000 a month for undergraduates in Agriculture, Agricultural Engineering and Home Science.</li><li><strong>Student READY:</strong> a stipend of Rs 3,000 a month during the programme.</li><li><strong>Junior Research Fellowship:</strong> for M.Sc. students selected through AIEEA (PG), Rs 12,640 a month and a Rs 6,000 annual contingency.</li><li><strong>Senior Research Fellowship:</strong> for Ph.D. students selected through AIEEA (PG), Rs 31,000 a month in the first and second years, Rs 35,000 a month in the third year, and a Rs 10,000 annual contingency.</li></ul><h4>Other research fellowships listed</h4><p>The page also lists the Rajiv Gandhi National Fellowship for SC and ST students, the National Fellowship for OBC candidates, the Maulana Azad National Fellowship for minority students, the UGC Junior Research Fellowship and CSIR fellowships.</p><h4>How many students receive tuition support (NIRF 2026 data)</h4><p>Of 5,462 undergraduate students, 3,821 received full tuition fee reimbursement from the State and Central Governments and 6 from private bodies. Of 506 postgraduate students, 231 received it from the governments, 22 from institution funds and 1 from private bodies.</p>","college_image":null,"official_website":"https://angrau.ac.in","cta_heading":"Interested in studying agriculture at ANGRAU?","cta_description":"Get help with AP EAPCET planning and checking your farmers' quota eligibility.","faq_1_question":"How do I get admission to B.Sc. (Hons) Agriculture?","faq_1_answer":"<p>Seats are filled using AP EAPCET ranks, while diploma holders apply through AGRICET.</p>","faq_2_question":"Is there a farmers' quota?","faq_2_answer":"<p>Yes. Forty per cent of seats are reserved for candidates from farming families who meet the conditions in the brochure.</p>","faq_3_question":"Is there an age limit?","faq_3_answer":"Yes. The minimum is 17, and the upper limit is 22 for General, 25 for SC and ST, and 27 for physically challenged candidates.","faq_4_question":"How much was the fee in 2025-26?","faq_4_answer":"<p>For B.Sc. (Hons) Agriculture at constituent colleges, Rs 51,069 in total, including refundable deposits, hostel charges and mess advance.</p>","faq_5_question":"Where are the colleges?","faq_5_answer":"<p>Constituent agricultural colleges are at Bapatla, Naira, Rajahmahendravaram, Tirupati, Mahanandi, Udayagiri and Pulivendula.</p>","featured_image":{"id":1163,"date":"2026-11-04T07:23:15","date_gmt":"2026-11-04T07:23:15","guid":{"rendered":"https://staging.a3educarehub.in/colleges/angrau/acharya-n-g-ranga-agricultural-university-campus/"},"modified":"2026-11-04T07:23:15","modified_gmt":"2026-11-04T07:23:15","slug":"acharya-n-g-ranga-agricultural-university-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/angrau/acharya-n-g-ranga-agricultural-university-campus/#main","title":{"rendered":"Acharya N. G. Ranga Agricult
