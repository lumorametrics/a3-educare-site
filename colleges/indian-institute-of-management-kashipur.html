    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:07.560Z","entries":{"college:indian-institute-of-management-kashipur":[{"id":1415,"date":"2026-11-14T07:39:50","date_gmt":"2026-11-14T07:39:50","guid":{"rendered":"https://staging.a3educarehub.in/?post_type=colleges&#038;p=1415"},"modified":"2026-11-14T07:39:50","modified_gmt":"2026-11-14T07:39:50","slug":"indian-institute-of-management-kashipur","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/indian-institute-of-management-kashipur/","title":{"rendered":"Indian Institute of Management Kashipur"},"content":{"rendered":"","protected":false},"featured_media":1411,"template":"","class_list":["post-1415","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIM Kashipur is an Indian Institute of Management at Kundeshwari, Kashipur, Uttarakhand, established in 2011. Its flagship programmes are the two-year full-time MBA and MBA (Analytics).","college_overview":"<p>Established in 2011 by the Government of India, the Indian Institute of Management Kashipur describes itself as a premier educational institution of national importance. Its 200-acre, fully residential campus is at Kundeshwari, Kashipur, in the foothills of the Himalayas, about 25 kilometres from Jim Corbett National Park, in a district with more than 180 manufacturing and service enterprises nearby.</p><p>The MBA and MBA (Analytics) are its two-year full-time residential flagship programmes. The institute also offers executive MBA programmes, a Ph.D., Executive development programmes and online certificate programmes.</p>","location":"Kundeshwari, Kashipur, Uttarakhand","city":"Kashipur","state":"Uttarakhand","established":"2011","affiliation":"Indian Institute of Management, established by the Government of India","recognition":"<ul><li><strong>Established 2011:</strong> by the Government of India, as stated on the About Us page, which calls the institute one of national importance</li></ul>","courses_offered":"<h4>Programmes listed on the institute website</h4><ul><li><strong>MBA:</strong> full-time, two-year residential flagship programme</li><li><strong>MBA (Analytics):</strong> full-time, two-year residential flagship programme</li><li><strong>Executive MBA</strong> and <strong>Executive MBA (Analytics)</strong></li><li><strong>Ph.D.</strong> and <strong>Exec-PhD</strong></li><li><strong>EPGDBM</strong></li><li>Executive development programmes and online certificate programmes</li></ul>","admission_process":"<p>Admission to the MBA is through the Common Admission Test (CAT), and the eligibility criteria are the same as those for CAT. Candidates are selected for the personal interview using minimum CAT percentile cut-offs for each category.</p><h4>Minimum CAT-2024 percentiles used to select candidates for the interview (as published by the institute)</h4><ul><li><strong>General:</strong> 75 each in Quantitative Aptitude, Data Interpretation and Logical Reasoning, and Verbal and Reading Comprehension; 95 total</li><li><strong>EWS:</strong> 55 each; 81 total</li><li><strong>NC-OBC:</strong> 52 each; 81 total</li><li><strong>SC:</strong> 45 each; 66 total</li><li><strong>ST and DAP:</strong> 30, 25 and 25; 42 total</li></ul><p>The institute says the cut-offs for the 2026-28 batch will be updated. Admission policies for 2026-28 are on the official MBA admission page.</p>","eligibility":"","entrance_exams":"CAT for the MBA; see the official page for other programmes","fees_information":"<h4>MBA 2026-28, as published by the institute</h4><ul><li><strong>Admission:</strong> Rs 25,000</li><li><strong>Course fee:</strong> Rs 10,86,000 in the first year and Rs 9,60,000 in the second year, Rs 20,46,000 in total</li><li><strong>Caution deposit:</strong> Rs 9,000</li><li><strong>Grand total:</strong> Rs 20,80,000, of which Rs 11,20,000 is due in the first year and Rs 9,60,000 in the second</li></ul><p>Fees are paid in instalments over six terms. Check the official page for the current structure.</p>","campus_facilities":"<p>The 200-acre campus is fully residential. The institute has a library with an OPAC and a National Digital Library link, and a wellness facility listing medical equipment, an in-patient room and an ambulance.</p>","hostel_information":"<p>The institute describes its campus as fully residential. Hostel room types, capacity and charges are not stated on the pages checked.</p>","placement_information":"<p>The placement office runs two calendars for the two-year programmes: summer internships and final placements. Pre-placement presentations by companies run from August to September and the on-campus process from September to February. For the 2025-27 batch the summer internship process starts in September 2026.</p><p>The institute publishes a placement brochure and student profiles for the 2024-26 batch (final placements), and audited summer placement reports by batch. The outcome statistics are in those documents and are not copied here.</p>","scholarships":"<p>The institute lists these Government of India scholarships for MBA participants: the National Fellowship and Scholarship for Higher Education of ST Students, the Central Sector Scholarship of Top Class Education for SC Students, PM YASASVI for OBC, EBC and DNT students, and the Scholarship for Top Class Education for Students with Disabilities.</p><p>It also states that 10% of MBA participants receive a full yearly tuition waiver under need-based, merit-based or need-cum-merit scholarships, and that an education loan facility is available.</p>","college_image":null,"official_website":"https://www.iimkashipur.ac.in/","cta_heading":"Considering IIM Kashipur?","cta_description":"Compare management programmes, CAT cut-offs and admission routes with A3 EduCare Hub & Research Academy.","faq_1_question":"How do I get admission to the IIM Kashipur MBA?","faq_1_answer":"<p>Through the Common Admission Test (CAT). The institute says the eligibility criteria are the same as those for CAT.</p>","faq_2_question":"What is the total MBA fee for 2026-28?","faq_2_answer":"<p>The institute publishes a grand total of Rs 20,80,000 for the MBA 2026-28, including admission fee, course fee and caution deposit.</p>","faq_3_question":"Are scholarships available?","faq_3_answer":"<p>Yes. Government of India scholarships are listed for eligible categories, and the institute states that 10% of MBA participants receive a full yearly tuition waiver.</p>","faq_4_question":"Where is IIM Kashipur?","faq_4_answer":"<p>At Kundeshwari, Kashipur, in Udham Singh Nagar district, Uttarakhand, on a 200-acre fully residential campus.</p>","faq_5_question":"","faq_5_answer":"","featured_image":{"id":1411,"date":"2026-11-14T07:37:33","date_gmt":"2026-11-14T07:37:33","guid":{"rendered":"https://staging.a3educarehub.in/iim-kashipur-campus-at-kundeshwari/"},"modified":"2026-11-14T07:39:35","modified_gmt":"2026-11-14T07:39:35","slug":"iim-kashipur-campus-at-kundeshwari","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/indian-institute-of-management-kashipur/iim-kashipur-campus-at-kundeshwari/#main","title":{"rendered":"IIM Kashipur campus at Kundeshwari"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1411","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/iim-kashipur-campus.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"259\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/iim-kashipur-campus-300x259.jpg\" class=\"attachment-medium size-medium\" alt=\"Red brick academic buildings of the IIM Kashipur campus at Kundeshwari, Kashipur, Uttarakhand\" srcset=\"https://staging.a3educarehub.in/wp-conte
