    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:29.487Z","entries":{"college:university-of-kashmir":[{"id":1116,"date":"2026-11-04T06:54:47","date_gmt":"2026-11-04T06:54:47","guid":{"rendered":"https://staging.a3educarehub.in/colleges/university-of-kashmir/"},"modified":"2026-11-04T06:54:47","modified_gmt":"2026-11-04T06:54:47","slug":"university-of-kashmir","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/university-of-kashmir/","title":{"rendered":"University of Kashmir"},"content":{"rendered":"","protected":false},"featured_media":1197,"template":"","class_list":["post-1116","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"The University of Kashmir's 247-acre main campus at Hazratbal lies between Dal and Nigeen lakes. Its 2026 prospectus reports a NAAC A++ grade and covers faculties from Arts to Medicine, with its own entrance test for most postgraduate programmes.","college_overview":"<p>The university's main campus spreads over 247 acres at Hazratbal in Srinagar, with Dal Lake to the east and Nigeen Lake to the west. Its faculties include Arts, Business and Management Studies, Education, Law, Medicine, Dentistry, Engineering, and Music and Fine Arts.</p><p>Most programmes admit through a university entrance test, while MBA admission uses CMAT, M.Tech uses GATE and B.Tech uses JEE (Main).</p><p>Its Centre for Career-Counselling, Coaching and Placement, set up in 2004, supports students with careers and competitive examinations.</p>","location":"Hazratbal, Srinagar 190006, Jammu and Kashmir, India","city":"Srinagar","state":"Jammu and Kashmir","established":"1948","affiliation":"State university; teaching and affiliating","recognition":"<p><strong>NAAC:</strong> Grade A++, as stated in the 2026 prospectus.</p>","courses_offered":"<ul><li><strong>Postgraduate:</strong> M.A., M.Sc., M.Com, MBA, MCA, M.Ed., LL.M. and others</li><li><strong>Undergraduate and integrated:</strong> four-year UG programmes, B.Tech, B.Pharm and LLB; integrated programmes in Data Science and AI, and in Electronics</li><li><strong>Doctoral:</strong> Ph.D.</li><li><strong>Short courses:</strong> certificate courses</li></ul>","admission_process":"<p>Most programmes admit through a university entrance test with a common question paper. MBA uses CMAT, M.Tech uses GATE and B.Tech uses JEE (Main). The 2026 undergraduate test took place on 12-16 May, and postgraduate applications opened on 1 June.</p>","eligibility":"<p>Conditions are given programme by programme in the university's admission prospectus for the year.</p>","entrance_exams":"University entrance test; CMAT for MBA; GATE for M.Tech; JEE (Main) for B.Tech","fees_information":"<p>The 2026 prospectus sets out fees by programme in its Fee Structure section, in three parts (A, B and C), with a separate schedule for self-financing programmes and international students.</p>","campus_facilities":"<p>The 247-acre main campus at Hazratbal lies between Dal Lake and Nigeen Lake.</p>","hostel_information":"<p>The prospectus has a section on its girls' and boys' hostels.</p>","placement_information":"<p>The Centre for Career-Counselling, Coaching and Placement, set up in 2004, handles placement support.</p>","scholarships":"<h4>Scholarships and student aid (University of Kashmir)</h4><ul><li><strong>Merit scholarships (PG):</strong> two scholarships of Rs 1,000 a month awarded every year in each postgraduate class, one on merit and one on merit-cum-means, separately for semesters 1-2 and 3-4 (or under the annual pattern). The rate dates from a university council decision of 10 April 2018.</li><li><strong>Research scholarships:</strong> four scholarships in each department or research centre for Ph.D/M.Phil research, plus an annual contingency grant.</li><li><strong>Student Aid Fund:</strong> financial help for students, particularly meritorious ones from low-income groups.</li><li
