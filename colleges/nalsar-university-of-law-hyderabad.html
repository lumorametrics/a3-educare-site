    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:25:01.008Z","entries":{"college:nalsar-university-of-law-hyderabad":[{"id":1056,"date":"2026-11-04T06:49:39","date_gmt":"2026-11-04T06:49:39","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nalsar-university-of-law-hyderabad/"},"modified":"2026-11-04T06:49:39","modified_gmt":"2026-11-04T06:49:39","slug":"nalsar-university-of-law-hyderabad","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nalsar-university-of-law-hyderabad/","title":{"rendered":"NALSAR University of Law"},"content":{"rendered":"","protected":false},"featured_media":1151,"template":"","class_list":["post-1056","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"NALSAR University of Law is a fully residential National Law University on a 50-acre campus at Shamirpet, Hyderabad. Established in 1998, it holds a NAAC A++ grade and admits B.A., LL.B. (Hons.) students through CLAT.","college_overview":"<p>NALSAR was founded under Andhra Pradesh Act 34 of 1998, which took effect on 15 June 1998, with Professor Ranbir Singh as founding Director. It began at Barkatpura in Hyderabad, was allotted 50 acres at Shamirpet in 1999, and moved there in July 2000 with its first three batches of students.</p><p>The university's mandate covers legal education, research on contemporary issues and legal awareness in the community. Its flagship five-year B.A., LL.B. (Hons.) sits alongside postgraduate law, management and doctoral programmes.</p><p>NALSAR has been ranked third in the Law category of the NIRF rankings in several recent years, and its graduates work in litigation, the judiciary, teaching, research, social advocacy, international organisations and transactional practice.</p>","location":"Justice City, Shamirpet, Hyderabad 500101, Telangana, India","city":"Hyderabad","state":"Telangana","established":"1998","affiliation":"National Law University established by Act 34 of 1998; awards its own degrees","recognition":"<ul><li><strong>UGC:</strong> recognised under Sections 2(f) and 12(B) of the UGC Act, 1956, and graded a Category-I University under the UGC's graded autonomy regulations.</li><li><strong>NAAC:</strong> A++ grade with 3.52 out of 4 in Cycle II.</li><li><strong>NIRF (Law):</strong> ranked 3rd in 2018-2021, 2023 and 2024 according to the university; 2025 press reports also place it 3rd.</li></ul>","courses_offered":"<ul><li><strong>B.A., LL.B. (Hons.):</strong> five years, 200 credits. 132 seats for 2026-31 (99 All India, 33 Telangana residents), plus 26 separate seats for foreign nationals.</li><li><strong>LL.M.:</strong> postgraduate law, including International Business Law and a programme in Insolvency &amp; Bankruptcy Laws.</li><li><strong>MBA:</strong> two-year full-time programme from the Department of Management Studies.</li><li><strong>Undergraduate study in management</strong></li><li><strong>PhD:</strong> Law and Social Sciences, and Management.</li></ul>","admission_process":"<p><strong>B.A., LL.B. (Hons.):</strong> Indian nationals must qualify through CLAT, and seats are allotted by merit through CLAT counselling. Foreign nationals are admitted through a separate process and are exempt from CLAT.</p><p><strong>MBA (2026-28):</strong> selection weights the entrance test (CAT, XAT, GMAT or NMET) at 50%, Statement of Purpose at 10%, Group Discussion at 20% and Personal Interview at 20%.</p>","eligibility":"<p><strong>B.A., LL.B. (Hons.), 2026 cycle:</strong> 10+2 or equivalent with at least 45% marks (40% for SC, ST and PwD). There is no upper age limit for CLAT 2026. Foreign nationals need 65% in 10+2 equivalent and must be no more than 25 years old on 1 July 2026.</p><p><strong>MBA:</strong> graduation in any discipline with at least 50% marks and a valid CAT, XAT, GMAT or NMET score.</p>","entrance_exams":"CLAT (B.A., LL.B.); CAT, XAT, GMAT or NMET (MBA)","fees_information":"<p><strong>B.A., LL.B. (Hons.), first year, 2026-27:</strong> total Rs 3,17,000 (Rs 3,11,000 for SC/ST candidates).</p><ul><li>Tuition: Rs 1,65,000</li><li>Other academic charges: Rs 15,000</li><li>User charges, including room rent: Rs 67,000</li><li>One-time payments: Rs 10,000</li><li>Mess advance: Rs 40,000</li><li>Refundable deposits: Rs 20,000 (Rs 14,000 for SC/ST)</li></ul><p>Counselling and confirmation fees already paid are adjusted at admission.</p><p><strong>MBA, 2026-27:</strong> Rs 4,47,000, including tuition of Rs 2,20,000, other academic fees of Rs 1,00,000 and room rent of Rs 24,000.</p>","campus_facilities":"<p>The 50-acre campus at Justice City, Shamirpet, has a library with remote access to electronic resources, an Internet Centre, a Moot Court Hall, an auditorium, a stadium, a football field, tennis courts, Wi-Fi classrooms and a health centre with counselling services.</p>","hostel_information":"<p>The B.A., LL.B. (Hons.) is fully residential. Students live in halls of residence and share a common dining hall. Hostels have a gym, indoor games, badminton courts and TV rooms, with 24-hour generator backup.</p>","placement_information":"<p>The figures below are for the MBA programme of NALSAR's Department of Management Studies (DoMS). NALSAR does not publish placement statistics for its law programmes on the pages checked.</p><h4>MBA final placements, 2023-25 batch (report released 30 June 2025)</h4><ul><li><strong>Recruiters:</strong> 27, including Deloitte USI, ADP, ICICI Prudential, Wells Fargo, Quest Global and Euromonitor International.</li><li><strong>CTC:</strong> average Rs 8.3 LPA, median Rs 8 LPA, highest Rs 15 LPA.</li><li><strong>Domains:</strong> finance 69.2%, marketing 15.4%, HR 10.3%, operations and general management 2.6% each.</li><li>78.4% of the batch were freshers.</li></ul><h4>MBA summer internships, 2025-27 batch (report released 30 April 2026)</h4><p>More than 45 recruiters, including Deloitte, Reserve Bank of India, State Bank of India and Infosys. Stipend: average Rs 35,285, median Rs 30,000, highest Rs 70,000.</p><h4>Contact</h4><p>Training and Placement Advisory Cell, DoMS (placement officer: Mr. Priyanandan Pandey). Email placements@nalsar.ac.in; phone 040 23498438.</p>","scholarships":"<h4>NALSAR Scholarship Regulations, 2021 (from academic year 2021-22)</h4><ul><li><strong>Eligibility:</strong> parents' annual income up to Rs 8,00,000, plus a minimum academic record: 45% in Class 12 for B.A. LL.B. (40% for SC/ST); 50% in LL.B. for LL.M. (45% for SC/ST); 50% in graduation for MBA; 60% in Class 12 for IPM (50% for SC/ST). Continuing students need at least the passing CGPA, and renewals need a CGPA of 6.0 on 10.</li><li><strong>Means-based scholarship (Schedule I):</strong> a share of the tuition fee by annual family income: up to Rs 3 lakh 100%; Rs 3-4 lakh 85%; Rs 4-5 lakh 60%; Rs 5-6 lakh 45%; Rs 6-7 lakh 30%; Rs 7-8 lakh 20%.</li><li>If applications exceed the scholarship budget, a means-cum-merit formula applies (75% means, 25% merit), and amounts may be reduced proportionately.</li><li>Scholarships are adjusted against fees and never paid in cash. External scholarships can be combined, with the university covering the tuition they leave unpaid.</li><li><strong>Fee remission:</strong> the Vice-Chancellor may grant full or partial remission, including user charges, in severe financial hardship such as loss of family income, serious illness or the death of an earning member. The University Scholarship Committee can recommend waivers beyond the schedule.</li><li>Fees may be paid in instalments in exceptional cases, on request to the Vice-Chancellor.</li></ul><p>The CLAT 2026 brochure confirms that scholarships are sanctioned on a merit-cum-means basis. It also notes that about 48 students have received the Aditya Birla scholarship since 2012-13.</p>","college_image":null,"official_website":"https://www.nalsar.ac.in","cta_heading":"Preparing for NALSAR through CLAT?","cta_description":"Get guidance on CLAT, NLU preferences and counselling for NALSAR.","faq_1_question":"How do I get admission to the B.A., LL.B. at NALSAR?","faq_1_answer":"<p>Indian nationals are admitted through CLAT and its counselling process. Foreign nationals apply through a separate process.</p>","faq_2_question":"How many B.A., LL.B. seats does NALSAR have?","faq_2_answer":"<p>For 2026-31 there are 132 seats: 99 All India and 33 for Telangana residents, plus 26 separate seats for foreign nationals.</p>","faq_3_question":"What is the first-year B.A., LL.B. fee?","faq_3_answer":"For 2026-27 the total is Rs 3,17,000 (Rs 3,11,000 for SC/ST candidates), including hostel charges, mess advance and refundable deposits.","faq_4_question":"Is NALSAR residential?","faq_4_answer":"<p>Yes. The B.A., LL.B. (Hons.) is fully residential, on the 50-acre Shamirpet campus.</p>","faq_5_question":"Is NALSAR accredited by NAAC?","faq_5_answer":"<p>Yes. NALSAR holds an A++ grade with 3.52 out of 4 in NAAC Cycle II.</p>","featured_image":{"id":1151,"date":"2026-11-04T07:22:31","date_gmt":"2026-11-04T07:22:31","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nalsar-university-of-law-hyderabad/nalsar-university-of-law-campus/"},"modified":"2026-11-04T07:22:31","modified_gmt":"2026-11-04T07:22:31","slug":"nalsar-university-of-law-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nalsar-university-of-law-hyderabad/nalsar-university-of-law-campus/#main","title":{"rendered":"NALSAR University of Law campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1151","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/nalsar-university-of-law-hyderabad.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" hei
