    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:18.115Z","entries":{"college:jamia-hamdard":[{"id":1107,"date":"2026-11-04T06:54:14","date_gmt":"2026-11-04T06:54:14","guid":{"rendered":"https://staging.a3educarehub.in/colleges/jamia-hamdard/"},"modified":"2026-11-04T06:54:14","modified_gmt":"2026-11-04T06:54:14","slug":"jamia-hamdard","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/jamia-hamdard/","title":{"rendered":"Jamia Hamdard"},"content":{"rendered":"","protected":false},"featured_media":1444,"template":"","class_list":["post-1107","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Jamia Hamdard is a government-aided deemed to be university at Hamdard Nagar in New Delhi, recognised in 1989. It teaches pharmacy, Unani medicine, nursing, allied health, management, engineering and law through its schools, and reports an A+ NAAC grade.","college_overview":"<p>On 10 May 1989 the Government of India declared Jamia Hamdard a deemed to be university, bringing together institutions already working at Hamdard Nagar in Tughlakabad. Rajiv Gandhi inaugurated it on 1 August that year.</p><p>Its pharmacy school has a strong ranking record: the university's prospectus reports first place in the NIRF Pharmacy category in 2019 to 2022 and again in 2024. Its schools also cover Unani medicine, nursing, allied health sciences, management, engineering, humanities and legal studies.</p><p>Its NAAC record began with accreditation in 2003, and the university reports an A+ grade with a CGPA of 3.41 in the fourth cycle. Fees differ considerably between the General and Self-Financing (SFS) streams, so check which stream applies to you.</p>","location":"Hamdard Nagar, New Delhi 110062, India","city":"New Delhi","state":"Delhi","established":"1989 (as Deemed to be University)","affiliation":"Government-aided Deemed to be University","recognition":"<ul><li><strong>NAAC:</strong> A+ grade with a CGPA of 3.41 in the fourth cycle</li><li><strong>NIRF Pharmacy:</strong> first place in 2019 to 2022 and in 2024, as stated in the university's prospectus</li></ul>","courses_offered":"<p><strong>Schools:</strong></p><ul><li>School of Pharmaceutical Education and Research</li><li>School of Allied Health Sciences and Research</li><li>School of Management and Business Studies</li><li>School of Chemical and Life Sciences</li><li>School of Humanities and Social Sciences</li><li>School of Unani Medical Education and Research</li><li>School of Engineering Sciences and Technology</li><li>Hamdard Institute of Legal Sciences and Research</li><li>School of Nursing Education and Research</li><li>School of Interdisciplinary Sciences and Technology</li><li>School of Skills and Vocational Studies</li><li>Centre for Media and Mass Communication Studies</li></ul><p><strong>Programmes include:</strong> B.Pharm, BUMS, B.Sc Nursing, M.Sc Nursing, MBA, MCA and PhD. MBBS and postgraduate medical courses run under Hamdard Institute of Medical Sciences and Research.</p>","admission_process":"<p>Jamia Hamdard publishes its prospectus and admission notices on its website, and applications run through its admission portal. Selection differs by programme, and selection lists are published programme by programme.</p>","eligibility":"<p>Eligibility is listed programme by programme in the prospectus. For example, the MBA accepts a range of bachelor's degrees including B.Pharm, MBBS, BDS, BPT, B.Sc, BBA and B.Com, subject to the conditions stated there.</p>","entrance_exams":"As listed for each programme in the prospectus","fees_information":"<p><strong>Annual fees, Indian students, 2025-26 fee structure:</strong></p><ul><li><strong>B.Pharm:</strong> Rs 1,60,000 General; Rs 2,40,000 SFS</li><li><strong>BUMS:</strong> Rs 1,50,000 General and Rs 3,00,000 SFS for years 1-4; half that in year 5</li><li><strong>MBA:</strong> Rs 2,60,000</li></ul><p>One-time charges include a Rs 5,000 admission fee and a Rs 5,000 refundable library deposit. No fee concession or scholarship is available for MBBS.</p>","campus_facilities":"<p>The university's schools and hostels are based around its Hamdard Nagar campus in South Delhi.</p>","hostel_information":"<p><strong>Annual hostel fee, 2025-26:</strong> Ibn-e-Battuta Hostel lists non-AC four-seater dormitories at Rs 60,000 and AC double or triple rooms at Rs 1,30,000. The university also lists Razia Sultan Hostel and Jawahar Lal Nehru International Hostel. Seats are allotted subject to availability.</p>","placement_information":"<p>Placements run through the Directorate of Training, Placement and Alumni Affairs (DTPAA), which offers career counselling, soft-skills training, mock interviews, group discussions, aptitude tests and alumni mentoring. Students apply for jobs through a central portal.</p><p><strong>Figures reported by the university, batch not stated:</strong></p><ul><li><strong>2026-27 prospectus:</strong> highest package Rs 15 lakh a year, median Rs 5 lakh, average Rs 5 lakh</li><li><strong>Placement Brochure 2026:</strong> packages from Rs 3.5 lakh to Rs 31 lakh a year across schools</li></ul><p>The two documents give different highest figures, so ask the DTPAA for batch-wise data.</p><p>The brochure also reports 100% placement in Nursing and Allied Health programmes and names TCS, Wipro, HCL, Fiserv and Ericsson as placement partners for the School of Engineering Sciences and Technology. The prospectus uses the phrase \"100% placement assistance\", which describes support and not a placement rate.</p>","scholarships":"<p><strong>Fee concession, 2026-27 prospectus:</strong> the listed conditions are:</p><ul><li>75% class attendance in the year for which concession is sought</li><li>85% aggregate or above in the previous year's examinations, passing all subjects at the first attempt</li><li>Parental income from all sources of no more than Rs 4.5 lakh a year</li><li>A certificate of good performance verified by the HOD and endorsed by the Dean of the School</li></ul><p>The competent authority may also grant concession in exceptional cases, such as loss in a natural calamity or the death of a parent or the single earning family member. One-time fees are excluded from any concession or waiver.</p><p><strong>University scholarships:</strong> the prospectus reports more than 35 scholarship schemes, in addition to Government of India and Delhi Government schemes. They include:</p><ul><li><strong>All schools:</strong> Hamdard National Foundation (HNF) Doctoral Fellowship, Khawaja Moinuddin Chishti Ajmeri (Gharib Nawaz) merit-cum-means scholarship, Sayeeda Memorial Scholarship for Humanities and Social Sciences, and Rabia STEM Scholarship</li><li><strong>Pharmacy:</strong> Hakim S.A. Jamil Qadri Memorial Scholarship for first-year B.Pharm students on need and eligibility</li><li><strong>Unani medicine:</strong> Hkm Abdul Hameed Fellowship for M.D. (Unani) students, and Fatima Zamir Scholarship for female BUMS students</li><li><strong>Nursing and allied health:</strong> Jamboonathan Means-cum-Merit Scholarship for the second-year B.Sc (Nursing) student with the highest first-year marks, and Musharraf Hussain Jafri Scholarship for third-year BMLT students on merit-cum-need</li><li><strong>Management:</strong> Late Haji Mohammad Ilyas Memorial Initiative (M-MILES) for Muslim students in the second year of the MBA</li><li><strong>Engineering:</strong> Prof. S. M. Yahya merit-cum-means Scholarship for a Muslim student in the second year of the MCA</li></ul><p>There are also school-specific awards for M.Sc students in the School of Chemical and Life Sciences and for M.A. Islamic Studies students.</p><p><strong>Education loans:</strong> the prospectus describes the PM Vidyalaxmi scheme, with collateral-free and guarantor-free loans. Students with family income up to Rs 8 lakh can get a 3% interest subvention on loans up to Rs 10 lakh. Those with income up to Rs 4.5 lakh get full interest subvention during the moratorium period.</p>","college_image":null,"official_website":"https://www.jamiahamdard.ac.in","cta_heading":"Considering Jamia Hamdard?","cta_description":"Get help choosing a programme and comparing General and SFS fee streams.","faq_1_question":"Is Jamia Hamdard a deemed university?","faq_1_answer":"<p>Yes. It is a government-aided deemed to be university, declared by the Government of India on 10 May 1989.</p>","faq_2_question":"What is its NAAC grade?","faq_2_answer":"<p>A+, with a CGPA of 3.41 in the fourth cycle.</p>","faq_3_question":"How much is the B.Pharm fee?","faq_3_answer":"The 2025-26 fee structure lists Rs 1,60,000 a year in the General stream and Rs 2,40,000 a year in SFS.","faq_4_question":"Does Jamia Hamdard teach Unani medicine?","faq_4_answer":"<p>Yes. BUMS is offered through the School of Unani Medical Education and Research.</p>","faq_5_question":"How much is hostel accommodation?","faq_5_answer":"<p>The 2025-26 fee guide lists Rs 60,000 a year for non-AC dormitories and Rs 1,30,000 for AC double or triple rooms at Ibn-e-Battuta Hostel.</p>","featured_image":{"id":1444,"date":"2026-11-14T12:06:25","date_gmt":"2026-11-14T12:06:25","guid":{"rendered":"https://staging.a3educarehub.in/colleges/jamia-hamdard/jamia-hamdard-hahc-hospital-operation-theatre/"},"modified":"2026-11-14T12:06:25","modified_gmt":"2026-11-14T12:06:25","slug":"jamia-hamdard-hahc-hospital-operation-theatre","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/jamia-hamdard/jamia-hamdard-hahc-hospital-operation-theatre/#main","title":{"rendered":"Jamia Hamdard HAHC Hospital operation theatre"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1444","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehu
