    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:19.209Z","entries":{"college:aiims-delhi":[{"id":1101,"date":"2026-11-04T06:54:07","date_gmt":"2026-11-04T06:54:07","guid":{"rendered":"https://staging.a3educarehub.in/colleges/aiims-delhi/"},"modified":"2026-11-04T06:54:07","modified_gmt":"2026-11-04T06:54:07","slug":"aiims-delhi","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/aiims-delhi/","title":{"rendered":"All India Institute of Medical Sciences, Delhi"},"content":{"rendered":"","protected":false},"featured_media":1187,"template":"","class_list":["post-1101","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"AIIMS New Delhi was established by an Act of Parliament in 1956 and is run as an autonomous institution of national importance. It admits 132 MBBS students a year through NEET UG and also teaches nursing, paramedical and advanced medical courses at Ansari Nagar.","college_overview":"<p>Parliament set up the All India Institute of Medical Sciences in 1956 and defined its objectives in the same Act. It works as an autonomous institution of national importance, financed by the central government under the Ministry of Health and Family Welfare.</p><p>Its teaching covers far more than MBBS. The institute runs B.Sc (Hons) Nursing and post-basic nursing, paramedical B.Sc courses, M.Sc programmes, postgraduate medical degrees through INI-CET, and super-speciality courses through INI-SS.</p><p>Under the institute's academic rules, the MBBS course costs Rs 5,856 in total, including hostel charges and refundable deposits. The 132 seats are filled through NEET UG.</p>","location":"Ansari Nagar, New Delhi 110029, India","city":"New Delhi","state":"Delhi","established":"1956 (by Act of Parliament)","affiliation":"Institute of national importance under the AIIMS Act; Ministry of Health and Family Welfare","recognition":"<p>AIIMS New Delhi is an autonomous <strong>institution of national importance</strong>, established by an Act of Parliament in 1956 and financed by the central government.</p>","courses_offered":"<ul><li><strong>MBBS:</strong> 132 seats a year, including 7 for foreign nationals</li><li><strong>Nursing:</strong> B.Sc (Hons) Nursing, for female candidates; B.Sc Nursing (Post-Basic); M.Sc Nursing</li><li><strong>Paramedical:</strong> B.Sc courses listed in the annual prospectus</li><li><strong>Postgraduate medical:</strong> MD, MS and MDS through INI-CET</li><li><strong>Super-speciality:</strong> DM and M.Ch through INI-SS</li><li><strong>Other:</strong> M.Sc programmes and PhD</li></ul>","admission_process":"<ul><li><strong>MBBS:</strong> NEET UG, conducted by the National Testing Agency, followed by counselling. Foreign nationals apply through the reserved seats and also need NEET UG.</li><li><strong>B.Sc Nursing and paramedical:</strong> AIIMS entrance examinations and counselling, as set out in the annual prospectus.</li><li><strong>Postgraduate and super-speciality:</strong> INI-CET and INI-SS sessions, with notices on the AIIMS examinations website.</li></ul>","eligibility":"<p>MBBS candidates must meet the nationality, age and qualifying-examination conditions in the academic rules and in that year's NEET UG notice. Nursing, paramedical and postgraduate conditions are set out course by course in each prospectus.</p>","entrance_exams":"NEET UG for MBBS; INI-CET for postgraduate medical courses; INI-SS for DM and M.Ch; AIIMS entrance tests for B.Sc courses","fees_information":"<p><strong>MBBS, AIIMS Academic Rules (March 2022), for the duration of the course:</strong></p><ul><li><strong>Academic charges, Rs 1,628:</strong> registration Rs 25, caution money Rs 100, tuition Rs 1,350, laboratory Rs 90, students' union Rs 63</li><li><strong>Hostel charges, Rs 4,228:</strong> rent Rs 990, gymkhana Rs 220, pot fund Rs 1,320, electricity Rs 198, refundable mess security Rs 500, refundable hostel security Rs 1,000</li></ul><p>The rules state that these charges may change from time to time.</p>","campus_facilities":"<p>The main Ansari Nagar (East) campus holds the institute, its hospitals, residential quarters and most of the hostels.</p>","hostel_information":"<p>The institute's hostel pages place thirteen hostels on the Ansari Nagar (East) campus, for undergraduates other than women nursing students, and for single postgraduates and resident doctors. Hostel residence is compulsory for women admitted to B.Sc (Hons) Nursing. Other B.Sc students are given rooms subject to availability.</p>","placement_information":"","scholarships":"<p>The AIIMS Academic Rules (March 2022) set out these awards. The rules are the latest official statement read, so confirm the amounts with the Academic Section.</p><ul><li><strong>MBBS merit scholarships:</strong> students placed first, second and third in the Professional MBBS examinations receive Rs 7,500, Rs 5,000 and Rs 3,000 per month. They run for 1.5 years after the 1st Professional, 2 years after the 2nd and 1 year after the 3rd.</li><li><strong>Book prizes:</strong> Rs 20,000 for the highest marks in each of Anatomy, Physiology and Biochemistry, and in each of Pathology, Microbiology, Pharmacology and Forensic Medicine and Toxicology, for buying the next Professional's books.</li><li><strong>MBBS summer fellowships:</strong> 30 fellowships of Rs 3,000 per month, from 16 May to 15 August, paid after the project is completed in the department concerned.</li><li><strong>MBBS internship stipend:</strong> Rs 23,500 per month or more, as ordered by the Government of India from time to time.</li><li><strong>Ph.D. merit fellowships:</strong> 40 AIIMS Fellowships each year, 20 in each session, awarded on the entrance examination merit list. Candidates need at least 50% in each of the three stages.</li></ul><p>The Academic Section's notices page also carries circulars on government schemes, including minority Post-Matric and Merit-cum-Means scholarships and National Scholarship Portal applications. The ones listed date from 2019-20 to 2022-23.</p>","college_image":null,"official_website":"https://www.aiims.edu","cta_heading":"Aiming for AIIMS New Delhi?","cta_description":"Get help planning your NEET UG preparation and counselling choices.","faq_1_question":"How many MBBS seats does AIIMS New Delhi have?","faq_1_answer":"<p>The academic rules list 132 seats a year, including 7 for foreign nationals.</p>","faq_2_question":"Which entrance exam is used for MBBS?","faq_2_answer":"<p>NEET UG, conducted by the National Testing Agency.</p>","faq_3_question":"How much is the MBBS fee?","faq_3_answer":"The March 2022 academic rules list Rs 5,856 for the course: Rs 1,628 in academic charges and Rs 4,228 in hostel charges, including refundable deposits.","faq_4_question":"Does AIIMS teach nursing?","faq_4_answer":"<p>Yes. It offers B.Sc (Hons) Nursing for female candidates, B.Sc Nursing (Post-Basic) and M.Sc Nursing.</p>","faq_5_question":"How do I get admission to a postgraduate medical course?","faq_5_answer":"<p>MD, MS and MDS seats are filled through INI-CET. DM and M.Ch seats are filled through INI-SS.</p>","featured_image":{"id":1187,"date":"2026-11-04T07:25:32","date_gmt":"2026-11-04T07:25:32","guid":{"rendered":"https://staging.a3educarehub.in/colleges/aiims-delhi/all-india-institute-of-medical-sciences-delhi-campus/"},"modified":"2026-11-04T07:25:32","modified_gmt":"2026-11-04T07:25:32","slug":"all-india-institute-of-medical-sciences-delhi-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/aiims-delhi/all-india-institute-of-medical-sciences-delhi-campus/#main","title":{"rendered":"All India Institute of Medical Sciences, Delhi campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1187","attachment","type-attachment","status-inherit","hentry"],"acf":[],"d
