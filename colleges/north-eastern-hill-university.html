G) for postgraduate courses, and GATE, UGC NET or the university's research entrance test for Ph.D. Some courses use the university's own test.</p>","eligibility":"<p>Requirements differ by programme. Check the university's admission notice for the year.</p>","entrance_exams":"JEE (Main), CUET (UG), CUET (PG), GATE, UGC NET and NEHU RET, according to listings","fees_information":"","campus_facilities":"<h4>Central Library (Shillong)</h4><ul><li>Open 9:00 AM to 8:00 PM, Monday to Friday; closed on Sundays and local holidays.</li><li>Students may borrow 4 books for 7 days; research scholars 6 books for 15 days.</li><li>Web OPAC, plus remote access to e-resources through MyLOFT, One Nation One Subscription, the National Digital Library of India, Shodhganga and the NEHU Digital Library.</li></ul><h4>Sports</h4><ul><li>Football ground, basketball courts, an indoor stadium and a university gymnasium.</li><li>The Department of Sports runs events at the Shillong and Tura campuses, including cricket, football, hockey, boxing, judo, weightlifting, athletics, table tennis, badminton, chess, basketball and volleyball.</li></ul><p>The university also lists a Health Center, hostels and a Student Counselling Centre among its student services.</p>","hostel_information":"<p>Listings report separate men's and women's hostels at Shillong, with about 22 in total.</p>","placement_information":"<h4>Career and Counselling Cell (NEHU)</h4><ul><li>Handles placement and career counselling for the university's departments, posts job openings and keeps placement records on its page.</li><li><strong>Coordinator:</strong> Prof. Rupaban Subadar, Department of Electronics and Communication Engineering. Contact: placement@nehu.ac.in, +91 364 2723604.</li><li>For 2025-26, faculty representatives from each department, from engineering, sciences and social sciences to law and languages, serve on the cell.</li><li>The university also runs a CDC portal (cdc.nehu.ac.in).</li></ul><p>Placement statistics
