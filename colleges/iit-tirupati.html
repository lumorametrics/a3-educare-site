    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:37.983Z","entries":{"college:iit-tirupati":[{"id":1064,"date":"2026-11-04T06:52:28","date_gmt":"2026-11-04T06:52:28","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iit-tirupati/"},"modified":"2026-11-04T06:52:28","modified_gmt":"2026-11-04T06:52:28","slug":"iit-tirupati","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/iit-tirupati/","title":{"rendered":"Indian Institute of Technology Tirupati"},"content":{"rendered":"","protected":false},"featured_media":1158,"template":"","class_list":["post-1064","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIT Tirupati began teaching in 2015 with mentoring from IIT Madras, and moved all campus activity to Yerpedu in August 2022. Its permanent campus at Merlapaka lies on the Yerpedu-Venkatagiri Road, with B.Tech admission through JEE (Advanced).","college_overview":"<p>IIT Tirupati belongs to the third phase of Indian Institutes of Technology announced in 2014. Its foundation stone was laid in March 2015, and it began functioning in the 2015-16 academic year with IIT Madras as its mentor.</p><p>The institute first worked from a temporary site on Renigunta Road. All campus activities moved to Yerpedu on 1 August 2022, into a transit campus that is being integrated with the permanent campus at Merlapaka village.</p><p>Undergraduates are admitted through JEE (Advanced), and a B.Tech in Engineering Physics was introduced in 2024-25. Tuition varies by family income, so applicants should check which band applies to them.</p>","location":"Merlapaka Village, Yerpedu-Venkatagiri Road, Yerpedu, Andhra Pradesh 517619, India","city":"Tirupati","state":"Andhra Pradesh","established":"2015","affiliation":"Indian Institute of Technology; awards its own degrees","recognition":"<p>IIT Tirupati is one of the Indian Institutes of Technology, in the third phase of institutes announced in 2014.</p>","courses_offered":"<ul><li><strong>Undergraduate:</strong> B.Tech, including Electrical Engineering and Engineering Physics (introduced in 2024-25). Departments include Computer Science and Engineering, and Civil and Environmental Engineering.</li><li><strong>Postgraduate:</strong> M.Tech</li><li><strong>Research:</strong> M.S. (Research) and Ph.D.</li></ul>","admission_process":"<p>Under the institute's B.Tech ordinance, admission is based on the JEE (Advanced) merit list, with the branch allocated by the Joint Admission Board. New students then follow the institute's induction schedule; the 2026 programme began on 27 July.</p>","eligibility":"<p>B.Tech candidates must qualify under JEE (Advanced) and the joint admission rules for that year. Conditions for research programmes are set out in each admission brochure.</p>","entrance_exams":"JEE (Advanced) for B.Tech","fees_information":"<p><strong>B.Tech, semester figures in 2025 institute documents:</strong></p><ul><li><strong>Tuition:</strong> Rs 1,00,000 for family income above Rs 5 lakh; Rs 33,334 for Rs 1-5 lakh; nil below Rs 1 lakh</li><li><strong>Student affairs, hostel and mess, January-June 2025:</strong> Rs 36,260, including seat rent of Rs 7,000 and advance dining charges of Rs 19,250</li></ul><p>The institute publishes the current fee structure each semester on its fee page.</p>","campus_facilities":"<p>The Yerpedu campus includes multi-storey hostels, dining facilities, classrooms and laboratories, a health centre and a multi-sport indoor complex. The master plan for the permanent campus at Merlapaka is designed for 12,000 students.</p>","hostel_information":"<p>The institute's pages describe six multi-storey hostels with space for more than 1,400 students. The Hostel and Mess Establishment can be reached at home@iittp.ac.in or 0877-250-3898.</p>","placement_information":"<p>The Career Development Centre manages placements and publishes statistics on its website. Contact: placement@iittp.ac.in, 0877-250-3672.</p>","scholarships":"<p>The B.Tech Ordinance, updated up to the 36th Senate resolutions, provides for Merit-cum-Means scholarships for 25% of the students admitted or 25% of the sanctioned strength, whichever is less, at rates approved by the Government of India. A further 10% on the same basis are exempted from tuition fees. Benefits for SC and ST candidates follow Government of India rules. The institute's scholarship pages carry no session date.</p><h4>B.Tech</h4><ul><li><strong>Merit-cum-Means Scholarship:</strong> for 25% of students admitted, with parents' annual income not exceeding Rs 4.50 lakh. Rs 1,000 a month plus exemption from tuition fees.</li><li><strong>Institute Free Studentship:</strong> for 10% of students admitted, with the same income limit. Exemption from tuition fees.</li><li><strong>Institute SC/ST Scholarship:</strong> with the same income limit. A Rs 8,000 rebate on mess charges, exemption from hostel seat rent and a pocket allowance of Rs 250 a month.</li></ul><p>Renewal of these three awards each semester requires a minimum GPA of 5.0 in the previous semester.</p><h4>M.Sc. and MPP</h4><ul><li><strong>Merit-cum-Means Scholarship:</strong> awarded on performance at the end of the first semester to 25% of students admitted or of the sanctioned strength, whichever is less. Rs 1,000 a month and exemption from tuition fees.</li><li><strong>Free Studentship:</strong> for a further 10% on the same basis. Exemption from tuition fees.</li><li><strong>50% Free Studentship:</strong> for remaining students with at least 6.5 CGPA and parental income below Rs 4.5 lakh a year. Exemption from 50% of tuition fees.</li></ul><p>Merit-cum-Means and Free Studentship awards run for the first two semesters, and renewal for the third and fourth semesters depends on performance in the second and third semesters. Applications are made through the institute's online scholarship portal.</p>","college_image":null,"official_website":"https://www.iittp.ac.in","cta_heading":"Considering IIT Tirupati?","cta_description":"Get help with your JEE (Advanced) preparation and branch choices.","faq_1_question":"How do I get B.Tech admission at IIT Tirupati?","faq_1_answer":"<p>Admission is based on the JEE (Advanced) merit list, with the branch allocated by the Joint Admission Board.</p>","faq_2_question":"When was IIT Tirupati started?","faq_2_answer":"<p>Its foundation stone was laid in March 2015, and it began functioning in 2015-16 with IIT Madras as mentor.</p>","faq_3_question":"How does tuition vary by income?","faq_3_answer":"2025 institute figures show Rs 1,00,000 a semester above Rs 5 lakh, Rs 33,334 for Rs 1-5 lakh, and nil below Rs 1 lakh.","faq_4_question":"Where is the campus?","faq_4_answer":"<p>The permanent campus is at Merlapaka village on the Yerpedu-Venkatagiri Road. All campus activities moved to Yerpedu in August 2022.</p>","faq_5_question":"How many students can the hostels house?","faq_5_answer":"<p>The institute describes six multi-storey hostels with space for more than 1,400 students.</p>","featured_image":{"id":1158,"date":"2026-11-04T07:22:56","date_gmt":"2026-11-04T07:22:56","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iit-tirupati/indian-institute-of-technology-tirupati-campus/"},"modified":"2026-11-04T07:22:56","modified_gmt":"2026-11-04T07:22:56","slug":"indian-institute-of-technology-tirupati-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/iit-tirupati/indian-institute-of-technology-tirupati-campus/#main","title":{"rendered":"Indian Institute of Technology Tirupati campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1158","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/202
