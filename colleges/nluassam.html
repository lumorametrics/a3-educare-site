    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:20.117Z","entries":{"college:nluassam":[{"id":1098,"date":"2026-11-04T06:54:02","date_gmt":"2026-11-04T06:54:02","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nluassam/"},"modified":"2026-11-04T06:54:02","modified_gmt":"2026-11-04T06:54:02","slug":"nluassam","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nluassam/","title":{"rendered":"National Law University and Judicial Academy, Assam"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1098","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"National Law University and Judicial Academy, Assam, on Hajo Road at Amingaon, admits its five-year B.A., LL.B. (Hons.) and one-year LL.M. students through CLAT. Its 2026-27 B.A., LL.B. first-year fee is listed at Rs 2,53,600.","college_overview":"<p>NLUJA works from Hajo Road at Amingaon. Its degrees are the five-year B.A., LL.B. (Hons.) and a one-year LL.M. of forty seats, with admission based on CLAT.</p><p>Fees for 2026-27 are published in its CLAT brochure, and hostel and mess costs are shown separately for students opting for them.</p><p>It holds vacant-seat rounds, and publishes these notices with the fee due, depending on whether a candidate takes a hostel place.</p>","location":"Hajo Road, Amingaon, Assam, India","city":"Guwahati","state":"Assam","established":"2009","affiliation":"State law university of Assam","recognition":"<p>NLUJA is a participating university in the Consortium of National Law Universities' CLAT.</p>","courses_offered":"<ul><li><strong>B.A., LL.B. (Hons.):</strong> five-year integrated</li><li><strong>LL.M.:</strong> one year; 40 seats</li></ul>","admission_process":"<p>LL.M. admission is based solely on CLAT, and B.A., LL.B. admission also runs through CLAT. The university holds vacant-seat rounds, with notices listing merit candidates and the fee to deposit.</p>","eligibility":"<p><strong>LL.M.:</strong> an LL.B. recognised by the UGC and the university, with 55% marks (50% for SC, ST and persons with disabilities).</p>","entrance_exams":"CLAT","fees_information":"<p><strong>2026-27, CLAT brochure:</strong> B.A., LL.B. (Hons.) total of Rs 2,53,600, including refundable deposits. Hostel rent and amenities are listed at Rs 33,600 a year and mess at Rs 40,000.</p><p><strong>LL.M. vacant-seat round, 2026-27:</strong> Rs 2,18,600 with hostel and mess, or Rs 1,25,000 without.</p>","campus_facilities":"<p>The university is on Hajo Road at Amingaon, with two hostels on its campus.</p>","hostel_information":"<p>There are two hostels, one for men and one for women. The CLAT brochure lists rent and amenities at Rs 33,600 a year, mess at Rs 40,000, and a refundable hostel deposit of Rs 10,000.</p>","placement_information":"<p>Campus recruitment is coordinated by the university's Recruitment Coordination Committee (RCC). Its Batch of 2026 brochure sets out the process: the RCC invites recruiters, who may hold pre-placement talks and pre-interview screening, followed by final interviews. Results are announced together through the RCC at the end of the recruitment drive.</p><p>The university's placement page lists students and their organisations by year from 2018-19 to 2022-23. Organisations listed for 2022-23 include Lakshmikumaran &amp; Sridharan, HSA Advocates, Chandhiok and Mahajan, and the Data Security Council of India.</p><ul><li><strong>RCC:</strong> rcc@nluassam.ac.in</li><li><strong>Training and Placement Facilitator:</strong> Dr. Md. Ataur Safi Rahaman Laskar, ataur@nluassam.ac.in, 0361-2738891</li></ul>","scholarships":"<p>The university's <strong>Merit Cum Means Scholarship Scheme</strong> is for B.A., LL.B. (Hons.) students in the second to fifth years with family income below Rs 8,00,000. It goes towards the annual admission fee, covering it fully or partly depending on funds and the number of applicants. The rules on the scholarship page carry no session date.</p><ul><li><strong>Category I, boys:</strong> 30% of the scheme's funds for the financial year</li><li><strong>Category II, girls:</strong> 40%</li><li><strong>Category III, students affected by natural disaster, accident or financial hardship:</strong> 30%, with a minimum CGPA of 6.5 and no more than one backlog paper</li></ul><p>Categories I and II require no backlog papers and a minimum CGPA of 7.5 or 7.0, depending on the category. All applicants need 75% attendance (Category III may be exempted on genuine grounds), a conduct certificate and a family income certificate. Students from SC, ST and OBC categories and persons with disabilities receive a 5% relaxation in the CGPA cut-off.</p><p>Awards last one academic year, and applications open only when the university announces them, subject to available funds. The scholarship page also links to the PM-Vidyalaxmi Scheme.</p>","college_image":null,"official_website":"https://www.nluassam.ac.in","cta_heading":"Preparing for CLAT with NLUJA in mind?","cta_description":"Get help planning your CLAT preparation and NLU preference order.","faq_1_question":"How do I get admission?","faq_1_answer":"<p>Through CLAT, for both the B.A., LL.B. (Hons.) and the LL.M.</p>","faq_2_question":"How many LL.M. seats are there?","faq_2_answer":"<p>Forty.</p>","faq_3_question":"What is the B.A., LL.B. fee for 2026-27?","faq_3_answer":"The CLAT brochure lists Rs 2,53,600, including refundable deposits.","faq_4_question":"Are there hostels?","faq_4_answer":"<p>Yes. There are two, one for men and one for women.</p>","faq_5_question":"What marks do I need for the LL.M.?","faq_5_answer":"<p>55% in an LL.B., or 50% for SC, ST and persons with disabilities.</p>","featured_image":{"id":1455,"date":"2026-11-14T12:46:40","date_gmt":"2026-11-14T12:46:40","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nluassam/national-law-university-and-judicial-academy-assam-fe
