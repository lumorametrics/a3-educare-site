    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:57.392Z","entries":{"college:nuals-kochi":[{"id":1076,"date":"2026-11-04T06:53:10","date_gmt":"2026-11-04T06:53:10","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nuals-kochi/"},"modified":"2026-11-04T06:53:10","modified_gmt":"2026-11-04T06:53:10","slug":"nuals-kochi","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nuals-kochi/","title":{"rendered":"National University of Advanced Legal Studies"},"content":{"rendered":"","protected":false},"featured_media":1169,"template":"","class_list":["post-1076","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"The National University of Advanced Legal Studies was established by Act 27 of 2005 and works from Kalamassery, Kochi. Its five-year B.A. LL.B. (Hons.) has an intake of 60 for 2027-28 through CLAT, and its one-year LL.M. offers three streams.","college_overview":"<p>NUALS was established by Act 27 of 2005, drawing in a law college set up by the Bar Council of Kerala in 2002. Its campus at Kalamassery in Kochi includes an academic block with a moot court hall, an amenities centre, faculty apartments and hostels for men and women.</p><p>This is a small university by intake: 60 B.A. LL.B. (Hons.) seats for 2027-28, with supernumerary seats for economically weaker sections and other groups, and 60 LL.M. seats across three streams.</p><p>Research runs through a set of centres, including the Centre for Intellectual Property Rights and the M. K. Damodaran International Centre of Excellence in Law.</p>","location":"Kalamassery, Kochi 683503, Kerala, India","city":"Kochi","state":"Kerala","established":"2005 (Act 27 of 2005)","affiliation":"State law university established by Act 27 of 2005","recognition":"<p>The university's CLAT brochure states that it has been granted 12(B) recognition under the UGC Act.</p>","courses_offered":"<ul><li><strong>B.A. LL.B. (Hons.):</strong> five years; intake of 60 for 2027-28, plus supernumerary seats</li><li><strong>LL.M.:</strong> one year; Constitutional and Administrative Law, International Trade Law, and Public Health Law; 60 seats in total</li></ul>","admission_process":"<p>Admission to the B.A. LL.B. (Hons.) runs through CLAT, with allotment under the university's seat matrix. The homepage publishes provisional admission lists, fee deadlines and hostel allotments for each cycle.</p>","eligibility":"<p>Candidates must meet CLAT conditions for the admission year. Five per cent of the intake is horizontally reserved for specially abled candidates.</p>","entrance_exams":"CLAT","fees_information":"<p><strong>B.A. LL.B. (Hons.), university fee page:</strong></p><ul><li>Admission fee: Rs 5,000</li><li>Annual tuition: Rs 1,65,600</li><li>Campus development: Rs 18,500</li><li>Library: Rs 8,000</li><li>Information systems: Rs 7,500 per year</li><li>Hostel rent: Rs 22,000 per year; refundable deposit Rs 6,000; amenities Rs 8,000 per year</li></ul><p>NRI-sponsored candidates pay USD 6,500 a year, as stated in the brochure. Fees are subject to revision.</p>","campus_facilities":"<p>The Kalamassery campus has an Academic Block with a Moot Court Hall, an Amenities Centre, Faculty Apartments, hostels and a computer lab.</p>","hostel_information":"<p>Hostels for men and women are on campus. The fee page lists hostel rent of Rs 22,000 a year, a Rs 6,000 refundable deposit and amenities charges of Rs 8,000 a year. First-year allotment lists are posted on the homepage.</p>","placement_information":"","scholarships":"<h4>PM YASASVI: Top Class Education for OBC, EBC and DNT students (2026-27)</h4><p>NUALS notified on 7 July 2026 that the National Scholarship Portal is open for fresh and renewal applications for 2026-27 under PM YASASVI (formerly the Top Class Education scheme), for OBC, EBC and DNT students.</p><ul><li>Student registration on NSP: 1 June to 31 August 2026.</li><li>Institute verification: by 15 September 2026.</li><li>Ministry verification closes: 30 November 2026.</li><li>Renewal applications had to reach the NUALS Academic Section by 9 July 2026.</li></ul><p>Eligibility and amounts are set in the scheme guidelines on the National Scholarship Portal.</p>","college_image":null,"official_website":"https://www.nuals.ac.in","cta_heading":"Preparing for CLAT with NUALS in mind?","cta_description":"Get help planning your CLAT preparation and NLU preference order.","faq_1_question":"How many B.A. LL.B. seats does NUALS have?","faq_1_answer":"<p>An intake of 60 for 2027-28, plus supernumerary seats.</p>","faq_2_question":"Does NUALS accept CLAT?","faq_2_answer":"<p>Yes. Admission to the B.A. LL.B. (Hons.) runs through CLAT.</p>","faq_3_question":"Which LL.M. streams are offered?","faq_3_answer":"Constitutional and Administrative Law, International Trade Law, and Public Health Law.","faq_4_question":"What is the annual tuition?","faq_4_answer":"<p>The fee page lists Rs 1,65,600 for the B.A. LL.B. (Hons.).</p>","faq_5_question":"Are there hostels?","faq_5_answer":"<p>Yes. Hostels for men and women are on campus.</p>","featured_image":{"id":1169,"date":"2026-11-04T07:23:37","date_gmt":"2026-11-04T07:23:37","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nuals-kochi/national-university-of-advanced-legal-studies-campus/"},"modified":"2026-11-04T07:23:37","modified_gmt":"2026-11-04T07:23:37","slug":"national-university-of-advanced-legal-studies-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nuals-kochi/national-university-of-advanced-legal-studies-campus/#main","title":{"rendered":"National University of Advanced Legal Studies campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1169","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p cla
