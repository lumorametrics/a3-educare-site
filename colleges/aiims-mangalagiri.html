    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:37.808Z","entries":{"college:aiims-mangalagiri":[{"id":1066,"date":"2026-11-04T06:52:31","date_gmt":"2026-11-04T06:52:31","guid":{"rendered":"https://staging.a3educarehub.in/colleges/aiims-mangalagiri/"},"modified":"2026-11-04T06:52:31","modified_gmt":"2026-11-04T06:52:31","slug":"aiims-mangalagiri","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/aiims-mangalagiri/","title":{"rendered":"All India Institute of Medical Sciences, Mangalagiri"},"content":{"rendered":"","protected":false},"featured_media":1160,"template":"","class_list":["post-1066","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"AIIMS Mangalagiri started MBBS admissions in 2018 from a temporary campus at Vijayawada and has worked fully from its Guntur district campus since 2020. It admits 125 Indian MBBS students a year and also teaches nursing, medical technology and postgraduate courses.","college_overview":"<p>AIIMS Mangalagiri began in 2018 at Siddhartha Medical College in Vijayawada, where its first two MBBS batches were trained. Outpatient services opened at the permanent Mangalagiri campus in March 2019.</p><p>From 2020 all academic and administrative work moved to the permanent campus, starting with a 125-student MBBS batch. The institute now teaches medicine, nursing and allied health sciences.</p><p>Undergraduate courses include MBBS, B.Sc Nursing and B.Sc in Medical Technology. Its postgraduate programmes include MD, MS, M.Ch, DM, PDCC and M.Sc Nursing.</p>","location":"AIIMS MG Campus, Mangalagiri, Guntur District, Andhra Pradesh 522503, India","city":"Mangalagiri","state":"Andhra Pradesh","established":"2018","affiliation":"All India Institute of Medical Sciences under the Ministry of Health and Family Welfare","recognition":"<p>AIIMS Mangalagiri is one of the \"Phase IV\" AIIMS institutes established by the Ministry of Health and Family Welfare.</p>","courses_offered":"<ul><li><strong>MBBS:</strong> 125 seats for Indian nationals; four and a half years plus one year of compulsory rotatory internship</li><li><strong>Other undergraduate:</strong> B.Sc Nursing and B.Sc in Medical Technology</li><li><strong>Postgraduate:</strong> MD and MS</li><li><strong>Super-speciality:</strong> M.Ch, DM and PDCC</li><li><strong>Nursing postgraduate:</strong> M.Sc Nursing</li></ul>","admission_process":"<p>MBBS candidates are selected through NEET and Medical Counselling Committee (MCC) counselling. They then follow the institute's instructions for document verification, fee payment and hostel application. Postgraduate seats are filled through INI-CET and INI-SS sessions.</p>","eligibility":"<p>MBBS candidates, including eligible OCI cardholders, must be eligible under NEET and MCC rules for that year. The 2026 prospectus sets out the reservation criteria and document requirements.</p>","entrance_exams":"NEET for MBBS; INI-CET and INI-SS for postgraduate and super-speciality courses","fees_information":"<p><strong>MBBS, institute prospectus published in 2024:</strong></p><ul><li>Academic charges: Rs 1,628, including tuition of Rs 1,350</li><li>Hostel and other charges: Rs 4,228</li></ul><p>Check the 2026 prospectus for the amounts that apply to the current session.</p>","campus_facilities":"<p>Since 2020 the institute's academic and administrative work has run from the permanent campus at Mangalagiri in Guntur district, where outpatient services opened in March 2019.</p>","hostel_information":"<p>Students who want hostel accommodation submit a hostel form and an undertaking after reading the hostel rules. The form is part of the MBBS admission documents.</p>","placement_information":"","scholarships":"","college_image":null,"official_website":"https://aiimsmangalagiri.edu.in","cta_heading":"Hoping for a seat at AIIMS Mangalagiri?","cta_description":"Get help planning your NEET preparation an
