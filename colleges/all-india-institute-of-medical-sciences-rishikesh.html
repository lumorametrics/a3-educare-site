    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:44.043Z","entries":{"college:all-india-institute-of-medical-sciences-rishikesh":[{"id":1414,"date":"2026-11-14T07:39:49","date_gmt":"2026-11-14T07:39:49","guid":{"rendered":"https://staging.a3educarehub.in/?post_type=colleges&#038;p=1414"},"modified":"2026-11-14T07:39:49","modified_gmt":"2026-11-14T07:39:49","slug":"all-india-institute-of-medical-sciences-rishikesh","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/all-india-institute-of-medical-sciences-rishikesh/","title":{"rendered":"All India Institute of Medical Sciences, Rishikesh"},"content":{"rendered":"","protected":false},"featured_media":1410,"template":"","class_list":["post-1414","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"AIIMS Rishikesh is an institute of national importance on Virbhadra Road, Rishikesh, Uttarakhand. It runs MBBS, B.Sc. Nursing, M.Sc. Nursing, MD/MS/MDS, super-specialty and doctoral programmes.","college_overview":"<p>All India Institute of Medical Sciences, Rishikesh is set on the bank of the Ganges in Rishikesh. It was established under the first phase of the Pradhan Mantri Swasthya Suraksha Yojana and made an autonomous body by the All India Institute of Medical Sciences (Amendment) Bill, 2012. Its first batch of 50 MBBS and B.Sc. Nursing students enrolled in 2012, and outpatient and inpatient services started in mid-2013.</p><p>The institute states that it has more than 200 faculty members, uses newer learning methods even at undergraduate level, and has virtual dissection and skill laboratories. It also fosters AYUSH alongside allopathy.</p>","location":"Virbhadra Road, Rishikesh, Uttarakhand","city":"Rishikesh","state":"Uttarakhand","established":"2012","affiliation":"Autonomous institute of national importance under the All India Institute of Medical Sciences (Amendment) Bill, 2012","recognition":"<ul><li><strong>Institute of national importance:</strong> as stated on the AIIMS Rishikesh website</li><li><strong>NIRF 2025:</strong> the home page states that AIIMS Rishikesh secured 13th rank in the Medical category of NIRF Ranking 2025 (checked 14 November 2026)</li></ul>","courses_offered":"<h4>Programmes named on the institute website</h4><ul><li><strong>MBBS</strong></li><li><strong>B.Sc. Nursing</strong> and <strong>M.Sc. Nursing</strong></li><li><strong>MD, MS and MDS</strong></li><li><strong>M.Ch.</strong> (6 years), <strong>DM and M.Ch.</strong> super-specialty courses</li><li>Post-Doctoral Certificate Courses and Post-Doctoral Fellowships</li><li><strong>MPH</strong> and <strong>Medical M.Sc.</strong></li><li><strong>Ph.D.</strong></li></ul><p>The Courses page on the official website has the current list.</p>","admission_process":"<p>The institute publishes admission notices on its website. At the time of checking these included an MPH admission notice for January 2027 and the Round-1 and Round-2 reporting guidelines for MBBS admission for session 2026.</p><p>AIIMS publishes B.Sc. (Hons.) Nursing counselling results on its examination portal, and AIIMS Rishikesh appears among the allotted institutes in the 2023 and 2025 round lists. The entrance examination and eligibility for each programme are not stated on the pages checked; see the official admission notices.</p>","eligibility":"","entrance_exams":"","fees_information":"","campus_facilities":"<p>The institute lists contemporary learning facilities such as virtual dissection and skill laboratories. The campus has tennis, badminton, basketball and volleyball courts near the residential and hostel areas, indoor games at the hostels and a well-equipped common facility. A guest house provides furnished accommodation to visiting experts and trainees on a first come, first served basis.</p>","hostel_information":"<p>The institute states that students get furnished accommodation in hostels and good-quality nutritious food in the student mess. The number of hostels and room types are not stated on the pages checked.</p>","placement_information":"","scholarships":"","college_image":null,"official_website":"https://aiimsrishikesh.edu.in/","cta_heading":"Considering AIIMS Rishikesh?","cta_description":"Compare medical and nursing programmes and admission routes with A3 EduCare Hub & Research Academy.","faq_1_question":"Which courses does AIIMS Rishikesh run?","faq_1_answer":"<p>MBBS, B.Sc. Nursing, M.Sc. Nursing, MD/MS/MDS, M.Ch., DM, MPH, Medical M.Sc., post-doctoral courses and Ph.D., according to the institute website.</p>","faq_2_question":"When did AIIMS Rishikesh start?","faq_2_answer":"<p>Its first batch of MBBS and B.Sc. Nursing students enrolled in 2012, and patient services started in mid-2013.</p>","faq_3_question":"Is hostel accommodation provided?","faq_3_answer":"<p>Yes. The institute states that students get furnished hostel accommodation and food in the student mess.</p>","faq_4_question":"","faq_4_answer":"","faq_5_question":"","faq_5_answer":"","featured_image":{"id":1410,"date":"2026-11-14T07:37:26","date_gmt":"2026-11-14T07:37:26","guid":{"rendered":"https://staging.a3educarehub.in/aiims-rishikesh-medical-college-building/"},"modified":"2026-11-14T07:39:14","modified_gmt":"2026-11-14T07:39:14","slug":"aiims-rishikesh-medical-college-building","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/all-india-institute-of-medical-sciences-rishikesh/aiims-rishikesh-medical-college-building/#main","title":{"rendered":"AIIMS Rishikesh medical college building"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1410","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/aiims-rishikesh-medical-college.jpg'><i
