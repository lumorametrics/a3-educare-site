    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:53.550Z","entries":{"college:gauhati-university":[{"id":1097,"date":"2026-11-04T06:54:00","date_gmt":"2026-11-04T06:54:00","guid":{"rendered":"https://staging.a3educarehub.in/colleges/gauhati-university/"},"modified":"2026-11-04T06:54:00","modified_gmt":"2026-11-04T06:54:00","slug":"gauhati-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/gauhati-university/","title":{"rendered":"Gauhati University"},"content":{"rendered":"","protected":false},"featured_media":1186,"template":"","class_list":["post-1097","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Gauhati University, founded in 1948, describes itself as the oldest university in Northeast India. From its Jalukbari campus it runs 45 departments across six faculties, reports a NAAC A+ grade, and cites 9th place among state universities in NIRF 2025.","college_overview":"<p>The university dates to 1948 and first worked from Cotton College premises, moving to Jalukbari in 1954. Its campus now carries the address Gopinath Bardoloi Nagar.</p><p>Its 45 departments sit across six faculties, and its admission portal also handles four-year undergraduate programmes at affiliated colleges.</p><p>The Placement Cell handles campus recruitment and internships. Its figures are published by department, so applicants should look at their own department's record.</p>","location":"Gopinath Bardoloi Nagar, Jalukbari, Guwahati 781014, Assam, India","city":"Guwahati","state":"Assam","established":"1948","affiliation":"State university; teaching and affiliating","recognition":"<ul><li><strong>NAAC:</strong> A+ grade, as stated on the university's homepage</li><li><strong>NIRF 2025:</strong> 9th among state universities, as stated on its homepage</li></ul>","courses_offered":"<p>The university has 45 departments across six faculties.</p><ul><li><strong>Undergraduate:</strong> programmes on the Jalukbari campus and FYUGP at affiliated colleges</li><li><strong>Postgraduate:</strong> programmes through its departments</li><li><strong>Law:</strong> University Law College</li></ul>","admission_process":"<p>Undergraduate admissions run through the university's admission portal, which covers Jalukbari programmes and FYUGP programmes at affiliated colleges. Hostel selection notices for each session are posted there too.</p>","eligibility":"<p>Conditions are listed in each programme's admission notice.</p>","entrance_exams":"As stated in each programme's admission notice","fees_information":"<p><strong>Hostel, 2024 notice for postgraduate women:</strong> Rs 3,590 admission fee for two or three-seater rooms. Programme fees are set out in each admission notice.</p>","campus_facilities":"<p>The main campus is at Gopinath Bardoloi Nagar, Jalukbari, where the university moved in 1954.</p>","hostel_information":"<p>Hostel seats are allotted through university notices. The University Law College hostel has its own application notice for 2026-27.</p>","placement_information":"<p>The Placement Cell handles recruitment, internships and career development, and publishes figures by department. Contact: placement@gauhati.ac.in.</p>","scholarships":"<p>The university's Scholarships page lists support for undergraduate, postgraduate and doctoral students.</p><h4>For Indian students</h4><ul><li><strong>National Scholarship Portal:</strong> a single window for central and state schemes, including SC, ST, OBC, EWS, minority and post-matric scholarships</li><li><strong>Ishan Uday Special Scholarship Scheme:</strong> for first-year undergraduates domiciled in the North Eastern Region, with family income below Rs 4.5 lakh a year. It pays Rs 8,000 a month for 10 months, and applications go through the National Scholarship Portal</li><li><strong>Research fellowships:</strong> UGC-NET JRF and others such as CSIR-NET, for Ph.D. scholars</li><li><strong>University awards:</strong> merit, merit-cum-means and University or donor-endowed awards, where applicable</li></ul><h4>Assam government schemes, 2026-27</h4><p>A notification of 21 August 2026 from the Secretary, University Classes, covers two schemes for students of the university's departments:</p><ul><li><strong>Mukhya Mantrir Nijut Moina Aasoni:</strong> for eligible girl students domiciled in Assam, irrespective of economic status. Married girls are not eligible, except those in PG and B.Ed. programmes</li><li><strong>Mukhya Mantrir Nijut Babu Aasoni:</strong> for male students domiciled in Assam with annual family income below Rs 4 lakh, admitted under the Fee Waiver category, in UG or PG first and second years at a government or provincialised institution</li></ul><p>For 2026-27, students submitted a form verified by the Head of Department to Room No. 14, Office of the Secretary, University Classes, then applied online on the Samarth portal. The online window ran until 5 September 2026.</p><h4>For international students</h4><p>Foreign nationals may apply for Indian Council for Cultural Relations scholarships through the ICCR A2A portal.</p><p><strong>Contact:</strong> Office of the Secretary, University Classes; secyuc@gauhati.ac.in.</p>","college_image":null,"official_website":"https://gauhati.ac.in","cta_heading":"Planning to study at Gauhati University?","cta_description":"Get help choosing a programme and following the admission portal.","faq_1_question":"When was Gauhati University founded?","faq_1_answer":"<p>In 1948. It moved to Jalukbari in 1954.</p>","faq_2_question":"What is its NAAC grade?","faq_2_answer":"<p>A+, according to its homepage.</p>","faq_3_question":"How many departments does it have?","faq_3_answer":"45 departments across six faculties.","faq_4_question":"Where do I apply?","faq_4_answer":"<p>On the university's admission portal.</p>","faq_5_question":"Is there a placement cell?","faq_5_answer":"<p>Yes. It handles campus rec
