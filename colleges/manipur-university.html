    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:46.849Z","entries":{"college:manipur-university":[{"id":1138,"date":"2026-11-04T06:55:36","date_gmt":"2026-11-04T06:55:36","guid":{"rendered":"https://staging.a3educarehub.in/colleges/manipur-university/"},"modified":"2026-11-04T06:55:36","modified_gmt":"2026-11-04T06:55:36","slug":"manipur-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/manipur-university/","title":{"rendered":"Manipur University"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1138","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"Manipur University is a centrally funded institution in Imphal, Manipur, offering undergraduate, postgraduate and research programmes.","college_overview":"<p>Manipur University was set up as a state university on 5 June 1980 under the Manipur University Act, 1980, and later became a central university. Its campus is on Indo-Myanmar Road at Canchipur, Imphal.</p><p>The university's admission portal cites a NAAC B+ grade from the 2023 assessment. Its own hostel page lists nine men's and eleven ladies' hostels on campus.</p>","location":"Imphal, Manipur, India","city":"Imphal","state":"Manipur","established":"1980","affiliation":"Central university; awards its own degrees","recognition":"<p>The university's admission portal cites a NAAC B+ grade from the 2023 assessment.</p>","courses_offered":"<ul><li><strong>Undergraduate and postgraduate:</strong> programmes listed on the university's admission portal</li></ul>","admission_process":"<p>Postgraduate applications run through the university's CUET admission portal. Listings differ on the undergraduate route, so check the official portal for the current year's rules.</p>","eligibility":"<p>Requirements differ by programme. Check the university's admission portal for the year.</p>","entrance_exams":"CUET (PG) through the university's admission portal; check the portal for undergraduate entry","fees_information":"","campus_facilities":"<h4>University Health Centre</h4><ul><li>Serves students, staff, scholars, campus residents and out-patients from the surrounding area.</li><li>Staffed by a Chief Medical Officer, a resident medical officer, a dental surgeon, five staff nurses, a pharmacist, a physiotherapist and two ambulance drivers; physiotherapy is available.</li><li>Specialist eye, ENT and skin services from RIMS, Imphal two days a month, and an ENT OPD with Shija Hospitals every second Thursday.</li><li>Medical cover during university events, sports meets and NSS camps, plus immunisation and blood donation camps.</li></ul><h4>Other facilities</h4><ul><li>Play grounds, a central library and Wi-Fi registration for students.</li><li>Employment Information and Guidance Bureau (MUEIGC) for placement information and career guidance.</li><li>An Indian Knowledge System Centre, inaugurated on 26 March 2026 in the Department of Ancient History and Archaeology.</li><li>Facilities for differently abled students.</li></ul>","hostel_information":"<p>The university's hostel page lists nine men's hostels and eleven ladies' hostels on campus.</p>","placement_information":"<h4>Training &amp; Placement Cell</h4><p>Manipur University's placement cell builds links with industry and arranges campus selection by companies, corporate houses and government departments.</p><h4>Recent drives reported by the cell</h4><ul><li><strong>8 July 2024:</strong> a campus interview for jobs in Japan for B.Voc/M.Voc Tourism and Hospitality Management students, organised with NSDC International. Of 37 students who took part, 23 were selected (another update on the same page says 24).</li><li><strong>25 January 2023:</strong> a placement drive at MIMS for more than 50 final-year students.</li><li><strong>10 February 2022:</strong> a campus recruitment drive by Everest Masala Foods.</li></ul><p>Other recruiters pictured include [24]7.AI, Nestlé, Apollo and YES Bank. The cell does not publish overall placement statistics.</p>","scholarships":"<h4>Fellowships and scholarships (Manipur University)</h4><ul><li><strong>University Ph.D Fellowship:</strong> Rs 8,000 a month for Ph.D students admitted through the admission test. An office order of 7 October 2026 released it for three months from July 2026, subject to satisfactory attendance and progress reports through supervisors.</li><li><strong>Non-JRF UGC fellowships</strong> for deserving M.Phil and Ph.D students of the university's five schools of studies.</li><li><strong>Free studentships and financial assistance:</strong> a limited number for needy and deserving postgraduate students.</li><li><strong>Gold medals and cash awards</strong> for students who secure first class first in their programmes, as listed on the university's Awards and Scholarships page.</li></ul>","college_image":null,"official_website":"https://www.manipuruniv.ac.in","cta_heading":"Considering Manipur University?","cta_description":"Get help with CUET and your programme choices at Canchipur.","faq_1_question":"When was Manipur University set up?","faq_1_answer":"<p>On 5 June 1980, as a state university. It later became a central university.</p>","faq_2_question":"Where is the campus?","faq_2_answer":"<p>Indo-Myanmar Road, Canchipur, Imphal.</p>","faq_3_question":"What is its NAAC grade?","faq_3_answer":"<p>B+ from the 2023 assessment, according to its admission portal.</p>","faq_4_question":"How many hostels are there?","faq_4_answer":"<p>Nine men's and eleven ladies' hostels, according to the university's hostel page.</p>","faq_5_question":"Where do I apply?","faq_5_answer":"<p>Through the university's admission portal.</p>","featured_image":{"id":1465,"date":"2026-11-14T12:48:07","date_gmt":"2026-11-14T12:48:07","guid":{"rendered":"https://staging.a3educarehub.in/colleges/manipur-university/manipur-university-featured-image/"},"modified":"2026-
