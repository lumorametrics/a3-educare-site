    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:37.878Z","entries":{"college:nit-andhra-pradesh":[{"id":1065,"date":"2026-11-04T06:52:30","date_gmt":"2026-11-04T06:52:30","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-andhra-pradesh/"},"modified":"2026-11-04T06:52:30","modified_gmt":"2026-11-04T06:52:30","slug":"nit-andhra-pradesh","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nit-andhra-pradesh/","title":{"rendered":"National Institute of Technology Andhra Pradesh"},"content":{"rendered":"","protected":false},"featured_media":1159,"template":"","class_list":["post-1065","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"NIT Andhra Pradesh, set up in 2015 at Tadepalligudem, is the 31st institute in the chain of National Institutes of Technology. It works from a 174-acre permanent campus at Kadakatla, teaching B.Tech and Ph.D. programmes, with B.Tech entry through JEE (Main).","college_overview":"<p>The institute was established in 2015 at Tadepalligudem and describes itself as the 31st in the Government of India's chain of NITs. It now works from a 174-acre permanent campus at Kadakatla in West Godavari district.</p><p>Its academic offer is built around B.Tech and Ph.D. programmes. Departments include Biotechnology, Chemical, Civil, and Computer Science and Engineering.</p><p>B.Tech seats follow JEE (Main) under Ministry of Education guidelines. The first-year hostel circular for 2025-26 shows separate charges for accommodation, services, mess advance and refundable deposits, which should be budgeted alongside tuition.</p>","location":"Kadakatla, Tadepalligudem, West Godavari District, Andhra Pradesh 534101, India","city":"Tadepalligudem","state":"Andhra Pradesh","established":"2015","affiliation":"National Institute of Technology; awards its own degrees","recognition":"<p>NIT Andhra Pradesh is the 31st institution in the chain of National Institutes of Technology started by the Government of India.</p>","courses_offered":"<ul><li><strong>B.Tech:</strong> the institute's brochure describes 8 engineering branches, including Biotechnology, Chemical, Civil, and Computer Science and Engineering</li><li><strong>Ph.D.</strong></li></ul>","admission_process":"<p>B.Tech admission is based on JEE (Main) under Ministry of Education guidelines. NIT Andhra Pradesh is a participating institute in JoSAA seat allocation.</p>","eligibility":"<p>B.Tech candidates must meet the JEE (Main) and JoSAA conditions for the admission year.</p>","entrance_exams":"JEE (Main) for B.Tech","fees_information":"<p><strong>First-year B.Tech hostel circular, 2025-26 odd semester:</strong> Rs 33,600 in total, including accommodation Rs 4,000, service charges Rs 5,000, refundable security deposit Rs 4,000 and mess advance Rs 14,600.</p><p>Tuition is published separately on the JoSAA fee details page for participating institutes.</p>","campus_facilities":"<p>The institute's permanent campus covers 174 acres at Kadakatla, Tadepalligudem.</p>","hostel_information":"<p>The hostel office issues separate fee circulars for first-year students. The 2025-26 circular lists accommodation, services, a refundable deposit and a mess advance. Contact: hosteloffice@nitandhra.ac.in.</p>","placement_information":"<p>The Training and Placement Cell publishes a UG placement brochure and batch-wise statistics on the institute's website.</p>","scholarships":"<h4>National Scholarship Portal, 2026-27</h4><p>The institute's notice of 1 September 2026 invites fresh and renewal applications online at scholarships.gov.in. It covers merit scholarships open to all categories and category scholarships such as OBC, PwD, SC and ST top class.</p><ul><li><strong>SC students:</strong> 13 slots, based on JEE Main CRL rank</li><li><strong>ST students:</strong> all eligible students with annual family income up to Rs 6 lakh can apply</li><li><strong>OBC, EBC and DNT students:</strong> PM YASASVI scheme, for annual family income up to Rs 2.5 lakh, with 62 slots based on JEE Main CRL rank</li></ul><p>A student may take a benefit from only one source or scheme. Students submit one set of document copies to the scholarship section.</p><h4>Institute tuition fee remission</h4><p>The institute has issued fee remission notices for 2026-27. Its 2024 FAQ sets out these terms for B.Tech students:</p><ul><li><strong>Who qualifies:</strong> unreserved and OBC students by annual family income</li><li><strong>Below Rs 1 lakh:</strong> full tuition fee remitted</li><li><strong>Rs 1 lakh to below Rs 5 lakh:</strong> two-thirds of the tuition fee remitted</li><li><strong>SC, ST and PwD students:</strong> tuition is waived, so they do not apply for remission</li></ul><p>All unreserved and OBC students pay full tuition at odd-semester registration, and eligible students then pay the reduced amount at even-semester registration. A fresh family income certificate is needed each academic year.</p><h4>Other schemes</h4><p>The institute's Scholarships page also lists a 2026-27 Tamil Nadu scholarship notice and the National Overseas Scholarship advertisement. For 2025-26 it lists Andhra Pradesh Jnanabhumi applications and Reliance Foundation Undergraduate Scholarships.</p><p><strong>Contact:</strong> scholarship section, Room 010, Ground Floor, SVP Central Vista; scholarship@nitandhra.ac.in.</p>","college_image":null,"official_website":"https://nitandhra.ac.in","cta_heading":"Considering NIT Andhra Pradesh?","cta_description":"Get help with your JEE (Main) strategy and JoSAA choices.","faq_1_question":"How do I get B.Tech admission at NIT Andhra Pradesh?","faq_1_answer":"<p>Appear for JEE (Main), then take part in JoSAA seat allocation.</p>","faq_2_question":"When was the institute established?","faq_2_answer":"<p>It was established in 2015 at Tadepalligudem.</p>","faq_3_question":"How large is the campus?","faq_3_answer":"The permanent campus covers 174 acres at Kadakatla, Tadepalligudem.","faq_4_question":"What did first-year hostel charges come to in 2025-26?","faq_4_answer":"<p>The odd-semester circular lists Rs 33,600 in total, including a mess advance of Rs 14,600 and a refundable deposit of Rs 4,000.</p>","faq_5_question":"What programmes does the institute offer?","faq_5_answer":"<p>It offers B.Tech and Ph.D. programmes.</p>","featured_image":{"id":1159,"date":"2026-11-04T07:22:59","date_gmt":"2026-11-04T07:22:59","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-andhra-pradesh/national-institute-of-technology-andhra-pradesh-campus/"},"modified":"2026-11-04T07:22:59","modified_gmt":"2026-11-04T07:22:59","slug":"national-institute-of-technology-andhra-pradesh-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nit-andhra-pradesh/national-institute-of-technology-andhra-pradesh-campus/#main","title":{"rendered":"National Institute of Technology Andhra Pradesh campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1159","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-andhra-pradesh.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"225\" height=\"300\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-andhra-pradesh-225x300.jpg\" class=\"attachment-medium size-medium\" alt=\"National Institute of Technology Andhra Pradesh campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-andhra-pradesh-225x300.jpg 225w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-andhra-pradesh-768x1024.jpg 768w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/nit-andhra-pradesh.jpg 960w\" sizes=\"(max-width: 225px) 100vw, 225px\" /></a></p>\n<p>Source:
