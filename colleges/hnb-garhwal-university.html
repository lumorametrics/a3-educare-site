    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:44.402Z","entries":{"college:hnb-garhwal-university":[{"id":1406,"date":"2026-11-14T07:07:40","date_gmt":"2026-11-14T07:07:40","guid":{"rendered":"https://staging.a3educarehub.in/?post_type=colleges&#038;p=1406"},"modified":"2026-11-14T07:07:40","modified_gmt":"2026-11-14T07:07:40","slug":"hnb-garhwal-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/hnb-garhwal-university/","title":{"rendered":"Hemvati Nandan Bahuguna Garhwal University"},"content":{"rendered":"","protected":false},"featured_media":1404,"template":"","class_list":["post-1406","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Hemvati Nandan Bahuguna Garhwal University is a central university in Uttarakhand with its headquarters at Srinagar (Garhwal). Its School of Law offers the three-year LL.B. and the LL.M.","college_overview":"<p>Hemvati Nandan Bahuguna Garhwal University was founded on 1 December 1973 as Garhwal University, was renamed in 1989, and became a central university in 2009 under the Central Universities Act. Its 2025-26 prospectus says it is accredited with an A grade by NAAC.</p><p>The university has its headquarters in Srinagar (Garhwal) and campuses at Birla Campus (Srinagar), BGR Campus (Pauri) and SRT Campus (Badshahi Thaul, Tehri). In the 2025-26 prospectus, the School of Law has one department, the Department of Law, and its LL.B. and LL.M. intake is listed under the SRT Campus, Tehri and the BGR Campus, Pauri.</p>","location":"Srinagar (Garhwal), Uttarakhand","city":"Srinagar (Garhwal)","state":"Uttarakhand","established":"1973","affiliation":"Central university under the Central Universities Act (since 2009); NAAC A grade","recognition":"<ul><li><strong>Central university:</strong> elevated to a central university in 2009 under the Central Universities Act, as stated in the 2025-26 admission prospectus</li><li><strong>NAAC:</strong> accredited with an A grade, as stated in the same prospectus</li><li><strong>Bar Council of India:</strong> the prospectus says admission to the School of Law programmes follows the rules of the Bar Council of India</li></ul>","courses_offered":"<h4>School of Law, 2025-26 prospectus</h4><ul><li><strong>LL.B.:</strong> three years (six semesters), regular programme</li><li><strong>LL.M.:</strong> four semesters, self-finance programme</li></ul><p>The prospectus table lists the LL.B. intake under the SRT Campus (Tehri) and BGR Campus (Pauri), and the LL.M. intake under the same two campuses. Confirm the campus for the current session with the university.</p>","admission_process":"<ul><li><strong>LL.B.:</strong> the merit list is prepared on the CUET score</li><li><strong>LL.M.:</strong> admission is through the university entrance test score</li><li>Admission to B.A. LL.B., LL.B. and LL.M. follows the latest guidelines of the Bar Council of India</li></ul><p>Applications are made online through the university admission portal, and a candidate can apply for up to three programmes.</p>","eligibility":"<ul><li><strong>LL.B.:</strong> a graduation degree in any discipline, as per the Bar Council of India Rules of Legal Education, 2008. The minimum marks in graduation are 45% for General, 42% for OBC, and 40% for SC and ST candidates.</li><li><strong>LL.M.:</strong> 50% in a three-year LL.B. or a law integrated course, for all categories.</li></ul>","entrance_exams":"CUET score for LL.B.; university entrance test score for LL.M.","fees_information":"","campus_facilities":"","hostel_information":"","placement_information":"","scholarships":"","college_image":null,"official_website":"https://www.hnbgu.ac.in/","cta_heading":"Considering the HNB Garhwal University School of Law?","cta_description":"Compare law programmes, eligibility and admission routes with A3 EduCare Hub & Research Academy.","faq_1_question":"Which law programmes d
