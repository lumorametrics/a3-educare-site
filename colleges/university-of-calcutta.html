    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:15.018Z","entries":{"college:university-of-calcutta":[{"id":1089,"date":"2026-11-04T06:53:27","date_gmt":"2026-11-04T06:53:27","guid":{"rendered":"https://staging.a3educarehub.in/colleges/university-of-calcutta/"},"modified":"2026-11-04T06:53:27","modified_gmt":"2026-11-04T06:53:27","slug":"university-of-calcutta","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/university-of-calcutta/","title":{"rendered":"University of Calcutta"},"content":{"rendered":"","protected":false},"featured_media":1179,"template":"","class_list":["post-1089","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"The University of Calcutta was founded on 24 January 1857 under Act No. II of that year. It teaches across campuses in College Street, Rajabazar, Ballygunge, Alipore, Hazra and B.T. Road, with admission rules set course by course in annual brochures.","college_overview":"<p>The University of Calcutta came into being on 24 January 1857 through Act No. II of 1857 of the Legislative Council. Its main address remains 87/1 College Street, with heritage buildings across its campuses.</p><p>Teaching is spread between several sites, including the Rajabazar Science College, Ballygunge Science College, the Alipore campus, the Law campus on Hazra Road and the Home Science and Technology units.</p><p>Admission is merit-based and online, with each department setting conditions in its brochure. The university's NIRF 2025 submission reports a NAAC score of 3.2 for accreditation that ran from January 2017 to December 2022.</p>","location":"87/1, College Street, Kolkata 700073, West Bengal, India","city":"Kolkata","state":"West Bengal","established":"1857 (24 January)","affiliation":"State university established under Act No. II of 1857; affiliating and teaching","recognition":"<ul><li><strong>NAAC:</strong> grade A in the university's disclosures; its NIRF 2025 submission lists a score of 3.2 valid from 23 January 2017 to 31 December 2022, and answers yes to valid accreditation</li><li><strong>NIRF:</strong> the university publishes its submissions and certificates on its rankings page</li></ul>","courses_offered":"<p>The university runs undergraduate, postgraduate and doctoral programmes through its faculties, including arts, science, technology, law and home science.</p><ul><li><strong>Examples:</strong> B.Tech and M.Sc programmes at its science and technology campuses, B.A. LL.B. at the Faculty of Law, M.A., M.Sc and M.Com at its postgraduate departments</li></ul>","admission_process":"<p>Admission is online and merit-based, with each course's rules in that year's brochure. Applicants to hostels apply separately to the Board of Residence after admission, with a distance certificate, an income certificate and two recommendations.</p>","eligibility":"<p>Conditions vary by department and are published in each year's admission brochure.</p>","entrance_exams":"As set out in each course's brochure","fees_information":"","campus_facilities":"<p>Campuses include College Street, Law College, Home Science, Technology, Rajabazar Science College, Ballygunge Science College, Alipore and B.T. Road. Several buildings are listed on the university's heritage page.</p>","hostel_information":"<p>Limited hostels are available separately for men and women, outside the campus and subject to availability. Applications go through the Board of Residence after admission.</p>","placement_information":"<p>The university runs a placement cell and publishes placement notices and a postgraduate brochure on its website.</p>","scholarships":"<h4>Scholarships handled by the University of Calcutta</h4><ul><li><strong>Undergraduate (West Bengal schemes):</strong> Kanyashree (K2), Swami Vivekananda Merit-cum-Means Scholarship (SVMCM) and Aikyashree.</li><li><strong>Postgraduate:</strong> National Scholarship Portal schemes; the PG GATE scholarship for M.Tech; and Kanyashree (K3), SVMCM, Aikyashree and OASIS.</li><li><strong>M.Phil/Ph.D:</strong> UGC NET-JRF, the Savitribai Jyotirao Phule fellowship for the single girl child (SJSGC), NFOBC, NFSC, NFST, NFPwD, CSIR and AICTE fellowships, and SVMCM (Non-NET) from the state; the university also has a University Research Fellowship.</li><li><strong>Other:</strong> endowment scholarships (the university published the list of awards for 1 April 2019 to 31 March 2024) and the West Bengal Student Credit Card Scheme.</li></ul><p>Each scheme has its own online portal and guideline, linked from the university's Scholarship pages.</p>","college_image":null,"official_website":"https://www.caluniv.ac.in","cta_heading":"Planning to study at the University of Calcutta?","cta_description":"Get help choosing a course and reading the admission brochure.","faq_1_question":"When was the University of Calcutta founded?","faq_1_answer":"<p>On 24 January 1857, under Act No. II of that year.</p>","faq_2_question":"How does admission work?","faq_2_answer":"<p>It is online and merit-based, under rules published in each course's brochure.</p>","faq_3_question":"Where are the campuses?","faq_3_answer":"At College Street, Rajabazar, Ballygunge, Alipore, Hazra Road and B.T. Road, among others.","faq_4_question":"Are hostels guaranteed?","faq_4_answer":"<p>No. Hostels are limited and subject to room availability.</p>","faq_5_question":"Does the university teach law?","faq_5_answer":"<p>Yes. The Faculty of Law is at 51/1 Hazra Road, Kolkata 700019.</p>","featured_image":{"id":1179,"date":"2026-11-04T07:25:03","date_gmt":"2026-11-04T07:25:03","guid":{"rendered":"https://staging.a3educarehub.in/colleges/university-of-calcutta/university-of-calcutta-campus/"},"modified":"2026-11-04T07:25:03","modified_gmt":"2026-11-04T07:25:03","slug":"university-of-calcutta-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/university-of-ca
