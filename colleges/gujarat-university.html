    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:56.182Z","entries":{"college:gujarat-university":[{"id":1083,"date":"2026-11-04T06:53:18","date_gmt":"2026-11-04T06:53:18","guid":{"rendered":"https://staging.a3educarehub.in/colleges/gujarat-university/"},"modified":"2026-11-04T06:53:18","modified_gmt":"2026-11-04T06:53:18","slug":"gujarat-university","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/gujarat-university/","title":{"rendered":"Gujarat University"},"content":{"rendered":"","protected":false},"featured_media":1218,"template":"","class_list":["post-1083","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Gujarat University was incorporated in 1949 under a state Act as a teaching and affiliating university at Navrangpura, Ahmedabad. Its history page describes more than four lakh students across 286 colleges, and its admission booklets report a NAAC A+ grade.","college_overview":"<p>Gujarat University was incorporated under the Gujarat University Act of 1949 as a teaching and affiliating university. Its history page calls it the largest and oldest university in the state, serving more than four lakh students through 286 colleges, 22 recognised institutions and 24 approved institutions.</p><p>Its disciplines include commerce, humanities, management, law, education, sciences, medical and paramedical studies.</p><p>Admissions run through the Gujarat University Admission Committee, which publishes separate information booklets each year for postgraduate and integrated courses.</p>","location":"Navrangpura, Ahmedabad 380009, Gujarat, India","city":"Ahmedabad","state":"Gujarat","established":"1949","affiliation":"State university under the Gujarat University Act, 1949; teaching and affiliating","recognition":"<p>The university's admission booklet lists <strong>NAAC grade A+ (CGPA 3.3)</strong> and NIRF ranks of 94 overall and 76 among universities.</p>","courses_offered":"<p>Gujarat University teaches and affiliates courses in commerce, humanities, management, law, education, sciences, medical and paramedical fields.</p><ul><li><strong>Examples in its admission booklets:</strong> M.Sc programmes, integrated courses and B.Com</li></ul>","admission_process":"<p>Admissions are run through the Gujarat University Admission Committee (GUAC), which publishes online admission booklets for each year, including seat matrices.</p>","eligibility":"<p>Conditions are listed in the information booklet for each course and admission year.</p>","entrance_exams":"As stated in each course's information booklet","fees_information":"<p><strong>Per-semester fees, M.Sc. Admission Information Booklet 2026-27 (admission through GCAS):</strong></p><ul><li><strong>Grant-in-aid M.Sc. courses, other than those at M.G. Science Institute:</strong> Rs 3,690 to Rs 5,190 for male students and Rs 2,190 for female students. For example, Chemistry, Physics and Botany are Rs 3,690 (male), and Biochemistry and Electronics are Rs 5,190 (male).</li><li><strong>Higher Payment Programme (HPP) M.Sc. examples:</strong> Computer Science Rs 20,000, Biotechnology Rs 30,000, Clinical Research Rs 36,000, Data Science Rs 37,600, Cyber Security and Forensics Rs 45,000, and Clinical Embryology and Assisted Reproductive Technology Rs 45,500</li><li><strong>PG Diploma in Computer Science and Application (grant-in-aid):</strong> Rs 2,250 (male) and Rs 1,500 (female)</li></ul><p>The booklet states that fees may change as per Gujarat University norms. Children of martyrs of the armed forces admitted on supernumerary seats pay no tuition fees, once only. Refunds follow UGC rules. Fees for other courses are given in each course booklet.</p>","campus_facilities":"<p>The main campus at Navrangpura includes the university library and an information centre.</p>","hostel_information":"<p>The Gujarat University Hostel was set up in 1964 with separate facilities for men and women.</p><ul><li><strong>Boys hostel:</strong> capacity of 550 students in six blocks (A to F), with single and double rooms</li><li><strong>Girls hostel:</strong> capacity of 196 students in two blocks (A and B), with single and double rooms</li><li><strong>Who can apply:</strong> Ph.D., M.Phil., postgraduate and integrated K.S. School of Business Management students living more than 40 km from the campus, on a merit list drawn up by the hostel</li></ul><p>The campus also has two Samras Chhatralay Society hostels, set up by the Government of Gujarat in 2016 under the Social Justice and Empowerment Department, for SC, ST, OBC and EBC students, with quotas for students with disabilities, children of widows and orphans. The university describes their charges as minimal but publishes no amounts.</p><p>Hostel applicants must submit an anti-ragging affidavit with the hostel application, according to the 2026-27 M.Sc. booklet.</p>","placement_information":"<p>The university has a Placement Cell led by a Placement Officer, Dr Kinjal Amin Desai, reachable at placement@gujaratuniversity.ac.in.</p><p>The campus also houses the University Employment Information and Guidance Bureau, set up in 1964 under the Gujarat Directorate of Employment and Training. It registers graduates and postgraduates from Ahmedabad and Gandhinagar districts and passes lists of suitable candidates to employers.</p><p>The university publishes no placement rate or salary figures on these pages.</p>","scholarships":"<ul><li><strong>SHODH (Scheme of Developing High-Quality Research):</strong> a Government of Gujarat scheme for full-time research scholars, paying Rs 15,000 a month plus Rs 20,000 a year for contingency expenses. The university states more than 1,000 scholars received it over the last five years.</li><li><strong>Mukhyamantri Yuva Swavalamban Yojana:</strong> a Government of Gujarat scheme for higher education support</li><li><strong>Scholarships for SC, ST and backward class students</strong></li></ul><p>The university states it covers more than 30 Government of Gujarat scholarship schemes. The 2026-27 M.Sc. booklet notes that the freeship card is valid for all courses.</p>","college_image":null,"official_website":"https://www.gujaratuniversity.ac.in","cta_heading":"Planning to apply to Gujarat University?","cta_description":"Get help reading the admission booklet and following the GUAC process.","faq_1_question":"When was Gujarat University founded?","faq_1_answer":"<p>It was incorporated in 1949 under the Gujarat University Act.</p>","faq_2_question":"Who runs admissions?","faq_2_answer":"<p>The Gujarat University Admission Committee (GUAC).</p>","faq_3_question":"What is its NAAC grade?","faq_3_answer":"A+ with a CGPA of 3.3, according to its admission booklet.","faq_4_question":"How many colleges are linked to it?","faq_4_answer":"<p>Its history page lists 286 colleges, 22 recognised institutions and 24 approved institutions.</p>","faq_5_question":"Where is the university?","faq_5_answer":"<p>At Navrangpura, Ahmedabad 380009.</p>","featured_image":{"id":1218,"date":"2026-11-04T08:12:12","date_gmt":"2026-11-04T08:12:12","guid":{"rendered":"https://staging.a3educarehub.in/colleges/gujarat-university/gujarat-university-campus/"},"modified":"2026-11-04T08:12:12","modified_gmt":"2026-11-04T08:12:12","slug":"gujarat-university-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/gujarat-university/gujarat-university-campus/#main","title":{"rendered":"Gujarat University campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1218","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/gujarat-university.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"200\"
