 the first of the IITs.</p>","faq_2_question":"How do I get undergraduate admission?","faq_2_answer":"<p>Through JEE (Advanced).</p>","faq_3_question":"How large is the campus?","faq_3_answer":"About 2,100 acres, with a self-contained township of more than 15,000 people.","faq_4_question":"How many halls of residence are there?","faq_4_answer":"<p>The institute's 2024-25 PhD brochure lists 22.</p>","faq_5_question":"Are scholarships available?","faq_5_answer":"<p>Yes. The merit-cum-means scholarship covers 25% of each batch, and a further 10% receive a tuition exemption.</p>","featured_image":{"id":1176,"date":"2026-11-04T07:24:53","date_gmt":"2026-11-04T07:24:53","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iit-kharagpur/indian-institute-of-technology-kharagpur-campus/"},"modified":"2026-11-04T07:24:53","modified_gmt":"2026-11-04T07:24:53","slug":"indian-institute-of-technology-kharagpur-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/iit-kharagpur/indian-institute-of-technology-kharagpur-campus/#main","title":{"rendered":"Indian Institute of Technology Kharagpur campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1176","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/iit-kharagpur.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"225\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/iit-kharagpur-300x225.jpg\" class=\"attachment-medium size-medium\" alt=\"Indian Institute of Technology Kharagpur campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/iit-kharagpur-300x225.jpg 300w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/iit-kharagpur-1024x768.jpg 1024w, https://staging.a3educarehub.in/wp-c
