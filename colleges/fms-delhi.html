    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:11.675Z","entries":{"college:fms-delhi":[{"id":1108,"date":"2026-11-04T06:54:16","date_gmt":"2026-11-04T06:54:16","guid":{"rendered":"https://staging.a3educarehub.in/colleges/fms-delhi/"},"modified":"2026-11-04T06:54:16","modified_gmt":"2026-11-04T06:54:16","slug":"fms-delhi","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/fms-delhi/","title":{"rendered":"Faculty of Management Studies, University of Delhi"},"content":{"rendered":"","protected":false},"featured_media":1192,"template":"","class_list":["post-1108","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"The Faculty of Management Studies, University of Delhi, has taught management since 1954. Its two-year MBA has 251 sanctioned seats filled through CAT, charges about Rs 60,818 a semester, and reports an average package of Rs 32.27 lakh for the 2024-26 batch.","college_overview":"<p>FMS was established in 1954 under the aegis of the University of Delhi. Today it runs a full-time MBA, evening executive MBAs, a doctoral programme and courses for defence officers.</p><p>The MBA costs about Rs 60,818 a semester according to the 2026-28 bulletin. Of the 304 students in the 2024-26 batch who sat for placements, 287 were placed.</p><p>Admission depends on CAT, but not on the overall percentile alone. FMS weights the verbal section at 40% and the other two sections at 30% each, adds 5 marks for women candidates, and then counts Class X and XII marks and an interview stage.</p>","location":"Malkaganj Marg, Kamla Nagar, Delhi 110007, India","city":"Delhi","state":"Delhi","established":"1954","affiliation":"University of Delhi","recognition":"<p>FMS is a faculty of the <strong>University of Delhi</strong>, which awards its degrees.</p>","courses_offered":"<ul><li><strong>MBA Full-Time:</strong> two years, 251 sanctioned seats plus supernumerary seats (2026-28)</li><li><strong>MBA-Executive:</strong> evening programme</li><li><strong>MBA-Executive (Health Care Administration):</strong> evening programme</li><li><strong>Doctoral Programme</strong></li><li><strong>General Management Programme for Defence Officers</strong></li><li><strong>Management Development programmes</strong></li></ul>","admission_process":"<p>Candidates apply online on the FMS website after taking CAT. Those shortlisted through a weighted CAT score attend an interview stage. Final selection for 2026-28 used:</p><ul><li>Weighted CAT 2025 score: 50%</li><li>Class X marks: 10%</li><li>Class XII marks: 10%</li><li>Discussion on Statement of Purpose: 10%</li><li>Extempore: 5%</li><li>Personal interview: 15%</li></ul><p>Women candidates receive an additional 5 marks on the weighted score.</p>","eligibility":"<p>A bachelor's degree after twelve years of formal schooling, with at least 50% marks for unreserved candidates, 45% for OBC non-creamy layer, EWS, PwD and CW candidates, and passing marks for SC and ST candidates. Final-year students may also apply.</p><p>A valid CAT score is required; the 2026-28 bulletin set a minimum of the 60th percentile.</p>","entrance_exams":"CAT","fees_information":"<p><strong>MBA Full-Time, 2026-28 bulletin:</strong> about Rs 60,818 per semester. FMS notes that fees can be revised at any time.</p><p><strong>Application fee:</strong> Rs 1,000, or Rs 350 for SC, ST and PwD candidates.</p>","campus_facilities":"<p>FMS is located at Malkaganj Marg, Kamla Nagar, Delhi 110007.</p>","hostel_information":"<p>FMS does not list a hostel of its own. According to the 2026-28 bulletin, non-Delhi students of its full-time programmes can apply for these University of Delhi hostels, all on North Campus:</p><ul><li><strong>Men:</strong> V.K.R.V. Rao Hostel, D.S. Kothari Hostel, Gwyer Hall, International Students' House, Mansarovar Hostel, Post-Graduate Men's Hostel and Jubilee Hall</li><li><strong>Women:</strong> University Hostel for Women, International Hostel for Women, North East Council Hostel for Women and Meghdoot Hostel</li></ul>","placement_information":"<p><strong>Batch of 2024-26, final placement report:</strong></p><ul><li>Students in the batch: 307; appearing for placements: 304; placed: 287</li><li>Average CTC: Rs 32.27 lakh</li><li>Median CTC: Rs 29.59 lakh</li><li>Top 100 average: Rs 45.196 lakh</li><li>Companies participating: 119</li></ul>","scholarships":"<p><strong>Shri G.L. Mehta Memorial Scholarship:</strong> the University of Delhi's 2025-26 scholarship list includes this award for the FMS MBA. Its rules describe a merit-cum-means award for a first-year full-time MBA student whose income, with parents' income, does not exceed the income tax threshold. It has since been converted into a one-time book grant, with its value set by the income of the endowment fund. Applications go through the Dean of FMS by the date the university notifies.</p><p><strong>Orphaned students:</strong> the 2026-28 bulletin provides two supernumerary seats in each programme, one male and one female. The cost of admission and study, including hostel expenditure, is met from the University Welfare Fund.</p>","college_image":null,"official_website":"https://fms.edu","cta_heading":"Preparing for CAT and aiming for FMS Delhi?","cta_description":"Get help planning your CAT sections around FMS's weighted scoring.","faq_1_question":"Which exam does FMS Delhi accept?","faq_1_answer":"<p>CAT. Applicants who did not take that year's CAT are not considered for admission.</p>","faq_2_question":"What is the fee for the MBA?","faq_2_answer":"<p>About Rs 60,818 per semester, according to the 2026-28 bulletin. FMS notes that fees can be revised.</p>","faq_3_question":"How many seats are there?","faq_3_answer":"The 2026-28 bulletin lists 251 sanctioned seats, plus supernumerary seats.","faq_4_question":"How does FMS weight the CAT sections?","faq_4_answer":"<p>The weighted score gives 40% to VARC and 30% each to the other two sections. Women candidates receive an additional 5 marks.</p>","faq_5_question":"What were the 2024-26 placements?","faq_5_answer":"<p>287 of the 304 students who appeared were placed. The average CTC was Rs 32.27 lakh and the median Rs 29.59 lakh.</p>","featured_image":{"id":1192,"date":"2026-11-04T07:25:52","date_gmt":"2026-11-04T07:25:52","guid":{"rendered":"https://staging.a3educarehub.in/colleges/fms-delhi/faculty-of-management-studies-university-of-delhi-campus/"},"modified":"2026-11-04T07:25:52","modified_gmt":"2026-11-04T07:25:52","slug":"faculty-of-management-studies-university-of-delhi-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/fms-delhi/faculty-of-management-studies-university-of-delhi-campus/#main","title":{"rendered":"Faculty of Management Studies, University of Delhi campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1192","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/fms-delhi.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"200\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/fms-delhi-300x200.jpg\" class=\"attachment-medium size-medium\" alt=\"Faculty of Management Studies, University of Delhi campus\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/fms-delhi-300x200.jpg 300w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/fms-delhi-1024x682.jpg 1024w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/fms-delhi-768x511.jpg 768w, https://staging.a3educarehub.in/wp-content/uploads/2026/11/fms-delhi.jpg 1280w\" sizes=\"(max-width: 300px) 100vw, 300px\" /></a></p>\n<p>Source: https://commons.wikimedia.org/wiki/File:FMS-_The_Red_Building_of_Dreams.JPG | License: CC BY-S
