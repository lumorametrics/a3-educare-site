    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:08.138Z","entries":{"college:aniims-port-blair":[{"id":1125,"date":"2026-11-04T06:54:58","date_gmt":"2026-11-04T06:54:58","guid":{"rendered":"https://staging.a3educarehub.in/colleges/aniims-port-blair/"},"modified":"2026-11-04T06:54:58","modified_gmt":"2026-11-04T06:54:58","slug":"aniims-port-blair","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/aniims-port-blair/","title":{"rendered":"Andaman and Nicobar Islands Institute of Medical Sciences"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1125","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"Andaman and Nicobar Islands Institute of Medical Sciences in Port Blair is the medical college of the islands, described by the administration as their premier academic institute. The National Medical Commission's seat matrix lists 114 MBBS places.","college_overview":"<p>The Andaman and Nicobar administration describes the institute as the premier academic institute of the islands, focused on medical education and healthcare delivery. It is the only college listed for the territory in the National Medical Commission's MBBS seat matrix, with 114 places.</p><p>The institute publishes its MBBS merit lists and counselling rounds through the islands' college admission site, including category-wise lists for the 2025-26 session.</p>","location":"Port Blair, Andaman and Nicobar Islands, India","city":"Port Blair","state":"Andaman and Nicobar Islands","established":"2015","affiliation":"Constituent college of Netaji Subhash Chandra Bose Institute of Higher Learning, a deemed-to-be-university in the Andaman and Nicobar Islands","recognition":"<p>The institute is listed as a government college in the National Medical Commission's MBBS seat matrix.</p>","courses_offered":"<ul><li><strong>MBBS:</strong> 114 places, according to the National Medical Commission's seat matrix</li></ul>","admission_process":"<p>The institute publishes merit lists and counselling rounds on the islands' college admission site, including category-wise and EWS lists for 2025-26.</p>","eligibility":"<p>MBBS candidates must qualify in NEET UG and meet the counselling conditions for that year.</p>","entrance_exams":"NEET UG for MBBS","fees_information":"<p><strong>MBBS, State Quota counselling, 2026-27:</strong> the first-round counselling notice asks day scholars to pay Rs 61,300 as a single demand draft or UPI payment, in favour of \"ANIIMS, Admission\". The notice does not break this amount down or give a separate hostel charge.</p><h4>Surety bond</h4><p>The 2026-27 surety bond makes an admitted MBBS student liable to pay Rs 10 lakh in any of these cases:</p><ul><li>not joining by the stipulated date</li><li>leaving the course before completion</li><li>having the admission or registration cancelled for misconduct or indiscipline</li><li>not serving the Andaman and Nicobar Administration for 1 year after the degree</li><li>leaving India within 5 years of the degree</li><li>not completing the course within the stipulated time</li></ul><p>The institute may keep the student's original certificates until the amount is paid.</p><p>For queries, the 2026-27 admission notice names the ANIIMS Admission Cell at 03192-230258.</p>","campus_facilities":"<p>The institute's website describes a campus at Dudhline developed in phases since 2016, and says the institute is set for expansion into Corbyns Cove. The 2026-27 MBBS counselling was held in the Library Block at the Corbyns Cove campus.</p><h4>Teaching hospital</h4><p>The 545-bed Govind Ballabh Pant Hospital is attached as the teaching hospital. It is the only referral hospital for the Union Territory.</p><h4>Central Library</h4><p>The library is a double-storey building near the Administrative Block, with books, print medical journals, newspapers and magazines. Reading facilities are on the first floor. Registered users can scan, print and photocopy, and a Computer and Media Room has desktop computers with internet access.</p><h4>Food and recreation</h4><ul><li><strong>Cafeteria:</strong> in the administrative block, serving meals and refreshments daily, with a menu that rotates weekly</li><li><strong>Sports and fitness:</strong> gym and sports facilities</li></ul><h4>Anti-ragging</h4><p>Ragging is prohibited, and the institute has an Anti-Ragging Committee with the Director as Chairman and the Dean as Member Secretary. The national helpline is 1800-180-5522.</p>","hostel_information":"<p>The institute's campus page lists separate boys' and girls' hostels, each accommodating around 66 students in double-seater rooms. The page is undated.</p><ul><li><strong>Facilities:</strong> Wi-Fi, TV lounges, table tennis, indoor courts and outdoor volleyball areas</li><li><strong>Mess:</strong> a common mess run by students under faculty supervision, on a no-loss, no-profit basis, serving breakfast through to dinner</li><li><strong>How to apply, 2026-27:</strong> candidates who want a hostel place submit the hostel application form with proof of residence at counselling</li></ul>","placement_information":"<p>The institute's website pages read for this profile publish no placement rate or salary figures for MBBS graduates. The 2026-27 surety bond requires 1 year of service with the Andaman and Nicobar Administration after the degree, and failing to serve makes the student liable to pay Rs 10 lakh.</p>","scholarships":"","college_image":null,"official_website":"https://aniims.andamannicobar.gov.in","cta_heading":"Hoping to study medicine in the islands?","cta_description":"Get help with NEET UG preparation and the counselling process.","faq_1_question":"How many MBBS places are there?","faq_1_answer":"<p>114, according to the National Medical Commission's seat matrix.</p>","faq_2_question":"Where are merit lists published?","faq_2_answer":"<p>On the islands' college admission site.</p>","faq_3_question":"Which entrance test do I need?","faq_3_answer":"NEET UG.","faq_4_question":"Is it a government college?","faq_4_answer":"<p>Yes. The National Medical Commission lists it as a government college.</p>","faq_5_question":"Where is the institute?","faq_5_answer":"<p>In Port Blair.</p>","featured_image":{"id":1460,"date":"2026-11-14T12:47:18","date_gmt":"2026-11-14T12:47:18","guid":{"rendered":"https://staging.a3educarehub.in/colleges/aniims-port-blair/andaman-and-nicobar-islands-institute-of-medical-sciences-featured-image/"},"modified":"2026-11-14T12:47:18","modified_gmt":"2026-11-14T12:47:18","slug":"andaman-and-nicobar-islands-institute-of-medical-sciences-featured-image","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/aniims-port-blair/andaman-and-nicobar-islands-institute-of-medical-sciences-featured-image/#main","title":{"rendered":"Andaman and Nicobar Islands Institute of Medical Sciences – Featured Image"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1460","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/andaman-and-nicobar-islands-institute-of-medical-sciences-1125-representative.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"225\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/andaman-and-nicobar-islands-institute-of-medical-sciences-1125-representative-300x225.jpg\" class=\"attachment-medium size-medium\" alt=\"Representative educational image for Andaman and Nicobar Islands Institute of Medical Sciences\" srcset=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/andaman-and-nicobar-islands-institute-of-medical-sciences-1125-representative-300x225.jpg 300w, https://staging.a3educarehub
