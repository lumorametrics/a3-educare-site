    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-19T01:24:51.285Z","entries":{"college:iit-goa":[{"id":1111,"date":"2026-11-04T06:54:41","date_gmt":"2026-11-04T06:54:41","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iit-goa/"},"modified":"2026-11-04T06:54:41","modified_gmt":"2026-11-04T06:54:41","slug":"iit-goa","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/iit-goa/","title":{"rendered":"Indian Institute of Technology Goa"},"content":{"rendered":"","protected":false},"featured_media":0,"template":"","class_list":["post-1111","colleges","type-colleges","status-publish","hentry"],"acf":{"college_short_introduction":"IIT Goa teaches from a temporary campus at Government College of Engineering, Goa, according to its 2026 admission brochure. It offers B.Tech in Computer Science, Electrical, Mechanical, and Mathematics and Computing, with income-based tuition remission.","college_overview":"<p>IIT Goa's 2026 B.Tech brochure says the institute is operating from the temporary campus of Government College of Engineering, Goa. Students receive hostel accommodation on arrival and may share rooms.</p><p>Its undergraduate programmes are in Computer Science and Engineering, Electrical Engineering, Mechanical Engineering, and Mathematics and Computing.</p><p>Fees for the first semester depend on category and parental income, ranging down to Rs 24,157 for General, EWS and OBC-NCL students from households below Rs 1 lakh.</p>","location":"Temporary campus at Government College of Engineering, Goa, India","city":"Ponda","state":"Goa","established":"2016 (started functioning on 30 July 2016)","affiliation":"Indian Institute of Technology; awards its own degrees","recognition":"<p>IIT Goa is one of the Indian Institutes of Technology.</p><p>The institute's website publishes its governing documents: the Institutes of Technology Act, 1961, the Institutes of Technology (Amendment) Act, 2016 and the IIT Goa Statutes.</p>","courses_offered":"<ul><li>B.Tech in Computer Science and Engineering</li><li>B.Tech in Electrical Engineering</li><li>B.Tech in Mechanical Engineering</li><li>B.Tech in Mathematics and Computing</li></ul>","admission_process":"<p>Seats come through JEE (Advanced) and JoSAA. Allotted students register with the institute, pay the balance fee and report as directed in the admission brochure.</p>","eligibility":"<p>Candidates must meet JEE (Advanced) and JoSAA conditions for the admission year.</p>","entrance_exams":"JEE (Advanced) for B.Tech","fees_information":"<p><strong>First semester, 2026 B.Tech brochure:</strong></p><ul><li>General, EWS and OBC-NCL: Rs 1,21,750, plus Rs 3,000 security deposit and Rs 2,000 mess advance; Rs 25,000 seat acceptance fee is adjusted</li><li>SC, ST and PwD: Rs 21,750, plus the same deposits; Rs 10,000 seat acceptance fee is adjusted</li></ul><p>Insurance of Rs 2,650 is charged in addition.</p>","campus_facilities":"<p>The institute currently works from the temporary campus of Government College of Engineering, Goa.</p>","hostel_information":"<p>Students receive hostel accommodation on arrival, and rooms may have to be shared.</p>","placement_information":"<p><strong>2025-26 placements, Career Development Cell:</strong></p><ul><li>B.Tech batch 2022-2026: 107 of 116 registered students placed (92.24%). By branch: Computer Science 38 of 39, Mathematics and Computing 26 of 27, Electrical 23 of 29, Mechanical 20 of 21</li><li>M.Tech batch 2024-2026: 10 of 12 registered students placed (83.33%)</li><li>Overall: 117 of 128 registered students placed (91.41%)</li></ul><p>More than 135 companies took part. Recruiters named by the institute include Bharat Electronics Limited, Google, Nvidia, Texas Instruments, MathWorks, Siemens EDA and Samsung R&D. About 91.4% of registered B.Tech students also secured six-month internships.</p><p>The AY 2025-26 placement brochure's past statistics give an overall B.Tech mean package of Rs 19.15 LPA and
