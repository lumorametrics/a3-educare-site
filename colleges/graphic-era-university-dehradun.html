    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-20T07:29:36.886Z","entries":{"college:graphic-era-university-dehradun":[{"id":228,"date":"2026-09-30T08:11:56","date_gmt":"2026-09-30T08:11:56","guid":{"rendered":"https://staging.a3educarehub.in/colleges/graphic-era-deemed-to-be-university/"},"modified":"2026-11-03T10:35:56","modified_gmt":"2026-11-03T10:35:56","slug":"graphic-era-university-dehradun","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/graphic-era-university-dehradun/","title":{"rendered":"Graphic Era (Deemed to be University)"},"content":{"rendered":"","protected":false},"featured_media":824,"template":"","class_list":["post-228","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"Graphic Era (Deemed to be University) is a private deemed university at Clement Town, Dehradun, Uttarakhand. It offers more than 85 undergraduate, postgraduate and doctoral programmes, and admission is based on the merit of the qualifying examination.","college_overview":"<p>Graphic Era (Deemed to be University) grew from a small computer centre that began in 1993 under its founder, Prof. (Dr.) Kamal Ghanshala. In 2008 it was granted deemed-to-be-university status under Section 3 of the UGC Act, 1956. The university says it holds an A+ NAAC grade and has multiple NBA-accredited programmes, and that it placed among the top 50 universities in India in the NIRF Rankings 2025.</p><p>The campus, at Bell Road, Clement Town in Dehradun, has Rajaji National Park as its backdrop. The university states that it offers more than 85 programmes across engineering, computer applications, management, commerce, life sciences, food technology, hospitality, paramedical, humanities and social sciences, and law.</p>","location":"Dehradun, Uttarakhand","city":"Dehradun","state":"Uttarakhand","established":"2008","affiliation":"Deemed-to-be University under Section 3 of the UGC Act, 1956 (granted 2008)","recognition":"<ul><li><strong>UGC:</strong> deemed-to-be-university status granted in 2008 under Section 3 of the UGC Act, 1956, as stated on the university's About page</li><li><strong>NAAC:</strong> the university states that it holds an A+ grade</li><li><strong>NBA:</strong> the university states that it has multiple NBA-accredited programmes</li><li><strong>NIRF 2025:</strong> the university states that it placed among the top 50 universities in India in the NIRF Rankings 2025</li><li><strong>Bar Council of India:</strong> the School of Law states that it is approved by the Bar Council of India</li></ul><p>The Approvals and Accreditations page on the official website lists the regulators and the current disclosures.</p>","courses_offered":"<p>The university states that it offers more than 85 undergraduate, postgraduate and doctoral programmes in these areas:</p><ul><li>Engineering and computer applications</li><li>Management and commerce</li><li>Life sciences and food technology</li><li>Hospitality and paramedical programmes, including the Bachelor of Medical Laboratory Technology (BMLT)</li><li>Humanities and social sciences</li><li>Law: the five-year B.A. LL.B. (Hons.) and the one-year LL.M.</li></ul><p>The programme pages on the official website give the duration and fees of each.</p>","admission_process":"<p>The university states that its application process is strictly based on the merit of the qualifying examination, and that the whole admission process can be completed online. It says it does not outsource any admission activity.</p><ol><li>Choose a programme from the more than 85 on offer.</li><li>Start the online application, fill in the forms and upload the qualifying documents.</li><li>Review and submit the application.</li><li>Pay the application fee of Rs 1,500, which applies to all courses.</li><li>Complete admission by paying the course fee.</li></ol><p>Applications can also be started at the campus or at the university's admission centres across India. Questions: enquiry@geu.ac.in or toll-free 1800 890 6027.</p>","eligibility":"<p>Eligibility is set for each programme and is listed on the official Eligibility and Fee Structure page. For the LL.M., the university states a minimum of 50% aggregate in an LL.B. from a recognised law school approved by the Bar Council of India.</p>","entrance_exams":"No entrance test stated: admission is on the merit of the qualifying examination","fees_information":"<ul><li><strong>Application fee:</strong> Rs 1,500 for all courses, as stated on the admissions page</li><li><strong>Programme fees:</strong> each programme has a fee structure, with its academic scholarship built in, on the official Eligibility and Fee Structure page</li><li><strong>Hostel fees:</strong> boys' and girls' hostel fee structures for 2026-27 are published on the hostel fee page</li></ul><p>Amounts change each session, so they are not copied here.</p>","campus_facilities":"<p>The campus is in Clement Town, Dehradun, with Rajaji National Park as its backdrop. The official website has pages for the library (with an online library portal), academic facilities, student amenities, and sports and adventure activities.</p>","hostel_information":"<p>The university publishes separate boys' and girls' hostel fee structures for 2026-27 for its Dehradun campuses. The hostel fee page also names Bhagirathi Hostel, and states that new hostel students receive a complimentary laundry service and a hostel kit. Room types and capacity are not stated on the page checked.</p>","placement_information":"<p>The university states that it has a dedicated placement team and placement trainers who work with students from the start of their programme. It says its students are placed at companies such as Amazon, Adobe, Microsoft and Google, and that it has had the highest number of tier-1 placements in the region for many years.</p><p>The placement overview page checked on 14 November 2026 gave no placement figures, so none are recorded here. The Placements Record and Our Recruiters pages on the official website hold the details.</p>","scholarships":"<ul><li><strong>Academic scholarships:</strong> merit-based, in all courses, set by the merit of the qualifying examination. The bracket at admission is fixed for the whole course, but it applies in a semester only if the student scores at least 7 SGPA and has no backlog in that semester.</li><li><strong>Additional concessions:</strong> 10% additional scholarship for female candidates and 5% fee concession for wards of defence personnel</li><li><strong>Kaushal Jyoti Scholarship Scheme</strong> and the National Scholarship Portal are linked from the official website</li></ul>","college_image":null,"official_website":"https://geu.ac.in/","cta_heading":"Need Help Choosing the Right College?","cta_description":"Explore courses, admission information and college options with A3 Educare Hub & Research Academy.","faq_1_question":"How is admission decided at Graphic Era (Deemed to be University)?","faq_1_answer":"<p>On the merit of the qualifying examination. The whole process can be completed online, and the application fee is Rs 1,500 for all courses.</p>","faq_2_question":"Is there a scholarship?","faq_2_answer":"<p>Yes. Merit-based academic scholarships apply to all courses, with 10% additional scholarship for female candidates and a 5% concession for wards of defence personnel. A student must keep at least 7 SGPA and no backlog in a semester for the scholarship to apply in that semester.</p>","faq_3_question":"What is the university's status?","faq_3_answer":"<p>It was granted deemed-to-be-university status in 2008 under Section 3 of the UGC Act, 1956.</p>","faq_4_question":"Which law programmes are offered?","faq_4_answer":"<p>A five-year B.A. LL.B. (Hons.) and a one-year LL.M., according to the programme pages.</p>","faq_5_question":"Whom can I contact about admissions?","faq_5_answer":"<p>Write to enquiry@geu.ac.in or call th
