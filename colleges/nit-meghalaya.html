    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-21T07:21:26.179Z","entries":{"college:nit-meghalaya":[{"id":1133,"date":"2026-11-04T06:55:29","date_gmt":"2026-11-04T06:55:29","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-meghalaya/"},"modified":"2026-11-04T06:55:29","modified_gmt":"2026-11-04T06:55:29","slug":"nit-meghalaya","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/nit-meghalaya/","title":{"rendered":"National Institute of Technology Meghalaya"},"content":{"rendered":"","protected":false},"featured_media":1434,"template":"","class_list":["post-1133","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"National Institute of Technology Meghalaya is a centrally funded institution in Sohra, Meghalaya, offering engineering and technology programmes.","college_overview":"<p>National Institute of Technology Meghalaya was established in 2010 under the NIT Act, 2007. It operates from a temporary campus in Shillong while its permanent campus of about 300 acres is developed at Sohra, in East Khasi Hills.</p><p>It offers B.Tech in five disciplines, along with M.Tech, M.Sc. and Ph.D. programmes.</p>","location":"Sohra, Meghalaya, India","city":"Sohra","state":"Meghalaya","established":"2010","affiliation":"National Institute of Technology under the NIT Act, 2007","recognition":"<p>NIT Meghalaya is an Institute of National Importance under the NIT Act, 2007.</p>","courses_offered":"<ul><li><strong>B.Tech:</strong> Civil, Computer Science and Engineering, Electrical, Electronics and Communication, and Mechanical Engineering</li><li><strong>Postgraduate:</strong> M.Tech and M.Sc.</li><li><strong>Doctoral:</strong> Ph.D.</li></ul>","admission_process":"<p>B.Tech places come through JEE (Main) and JoSAA/CSAB, M.Tech through GATE and CCMT, and M.Sc. through JAM and CCMN.</p>","eligibility":"<p>Candidates must meet the conditions of the relevant entrance exam and counselling process for the admission year.</p>","entrance_exams":"JEE (Main) for B.Tech; GATE for M.Tech; JAM for M.Sc.","fees_information":"","campus_facilities":"<p>The institute works from a temporary campus in Shillong. The permanent campus at Sohra is under development, with academic buildings and hostels planned in its first phase.</p>","hostel_information":"<h4>Hostels on the Sohra campus</h4><ul><li><strong>Hostels listed by the institute:</strong> Single Seater PhD Boys Hostel, 3 Seater Boys Hostel, New Girls Hostel and Girls Hostel (Academic Block B), all at the NIT Meghalaya Sohra campus.</li><li><strong>Management:</strong> Hostels are run by the Hostel Management Committee, with a caretaker and a warden named for each hostel. First-year students have separate wardens.</li><li><strong>Contact:</strong> hmc.office@nitm.ac.in (Hostel Management Committee office).</li></ul><p>Room allotment and hostel charges are published by the institute; check its Hostels pages for the current session.</p>","placement_information":"<h4>Placement record, session 2025-26 (till May 2026)</h4><ul><li><strong>Offers:</strong> 180</li><li><strong>Highest CTC:</strong> 45.5 LPA</li><li><strong>Average CTC:</strong> 9.94 LPA</li></ul><h4>Recent recruiters named by the institute</h4><p>ServiceNow, Bharat Petroleum Corporation Limited, JPMorgan Chase &amp; Co, ZS Associates, Vedanta Limited, Mahindra &amp; Mahindra, JSW Energy, Larsen &amp; Toubro Limited, Siemens Limited, Shree Cement, MakeMyTrip, Deloitte, IBM, Oracle, Infosys, HCL Tech, Reliance Industries and others.</p><h4>Centre for Career Development</h4><ul><li>Handles final placement of B.Tech, M.Tech and M.Sc students and research scholars, and internships for 2nd, 4th and 6th semester students.</li><li>Runs employability programmes and workshops.</li><li>Facilities include a pre-placement talk hall (the Rendezvous, capacity 100), a group discussion room (the Oval) and three interview rooms.</li></ul><p>The institute publishes placement brochures for 2020-21 to 2024-25.</p>","scholarships":"<h4>Scholarships listed by the institute</h4><ul><li>Ordinance on Award of Scholarships</li><li>Applications through the National Scholarship Portal</li><li>Applications to the foundation scholarship listed by the institute</li><li>Institute Scholarship, with announcements for 2024-25</li></ul><p>Eligibility and amounts are set in the institute's scholarship ordinance and announcements; check them before applying.</p>","college_image":null,"official_website":"https://nitm.ac.in","cta_heading":"Considering NIT Meghalaya?","cta_description":"Get help with JEE (Main) and your JoSAA branch choices.","faq_1_question":"Where does NIT Meghalaya teach?","faq_1_answer":"<p>From a temporary campus in Shillong.</p>","faq_2_question":"Where will the permanent campus be?","faq_2_answer":"<p>At Sohra, in East Khasi Hills.</p>","faq_3_question":"Which B.Tech branches are offered?","faq_3_answer":"<p>Civil, Computer Science, Electrical, Electronics and Communication, and Mechanical Engineering.</p>","faq_4_question":"How do I get a B.Tech seat?","faq_4_answer":"<p>Through a JEE (Main) rank and JoSAA/CSAB.</p>","faq_5_question":"Does it offer doctoral study?","faq_5_answer":"<p>Yes, Ph.D. programmes are offered.</p>","featured_image":{"id":1434,"date":"2026-11-14T10:25:52","date_gmt":"2026-11-14T10:25:52","guid":{"rendered":"https://staging.a3educarehub.in/colleges/nit-meghalaya/nit-meghalaya-administrative-block/"},"modified":"2026-11-14T10:25:52","modified_gmt":"2026-11-14T10:25:52","slug":"nit-meghalaya-administrative-block","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/nit-meghalaya/nit-meghalaya-administrative-block/#main","title":{"rendered":"NIT Meghalaya administrative block"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1434","attachment","type-at
