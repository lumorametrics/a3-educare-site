    <script id="a3-seed" type="application/json">{"builtAt":"2026-11-17T01:23:14.804Z","entries":{"college:iim-calcutta":[{"id":1090,"date":"2026-11-04T06:53:50","date_gmt":"2026-11-04T06:53:50","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iim-calcutta/"},"modified":"2026-11-04T06:53:50","modified_gmt":"2026-11-04T06:53:50","slug":"iim-calcutta","status":"publish","type":"colleges","link":"https://staging.a3educarehub.in/colleges/iim-calcutta/","title":{"rendered":"Indian Institute of Management Calcutta"},"content":{"rendered":"","protected":false},"featured_media":1180,"template":"","class_list":["post-1090","colleges","type-colleges","status-publish","has-post-thumbnail","hentry"],"acf":{"college_short_introduction":"IIM Calcutta, on Diamond Harbour Road at Joka, runs a flagship two-year MBA and a one-year MBA for Executives. Its 61st batch of 458 students reported 100% placements, with 202 firms and 542 offers in the 2026 recruitment cycle.","college_overview":"<p>IIM Calcutta works from its campus on Diamond Harbour Road at Joka. Alongside its two-year MBA, it runs a one-year MBA for Executives and a Postgraduate Diploma in Business Analytics.</p><p>The domestic admissions policy combines CAT, Class X and XII marks and gender diversity at the first stage, then adds a personal interview and a writing ability test.</p><p>In the 2026 final placement report, 458 students in the 61st batch received 542 offers from 202 participating firms.</p>","location":"Diamond Harbour Road, Joka, Kolkata 700104, West Bengal, India","city":"Kolkata","state":"West Bengal","established":"1961","affiliation":"Institute under the Indian Institutes of Management Act, 2017; awards its own degrees","recognition":"<p>IIM Calcutta is one of the Indian Institutes of Management.</p>","courses_offered":"<ul><li><strong>MBA:</strong> two years, flagship programme</li><li><strong>MBA for Executives:</strong> one year</li><li><strong>PGDBA:</strong> Postgraduate Diploma in Business Analytics</li><li><strong>Doctoral and executive programmes</strong></li></ul>","admission_process":"<p>Domestic MBA candidates are shortlisted on CAT scores along with Class X and XII marks and a gender diversity factor. The final stage adds a personal interview and a writing ability test, plus academic diversity and work experience. Overseas candidates apply with GMAT and are assessed under a separate procedure.</p>","eligibility":"<p>Domestic MBA candidates need a valid CAT score and must meet the conditions in that year's admission policy. Overseas candidates need a GMAT total of at least 735.</p>","entrance_exams":"CAT for domestic MBA candidates; GMAT for overseas candidates","fees_information":"","campus_facilities":"<h4>Joka campus</h4><ul><li>A 135-acre campus with seven lakes; the institute moved here in 1975.</li><li>On campus: a post office, SBI and ICICI ATMs, a café and medical facilities.</li><li>Tata Hall houses participants of Management Development Programmes, with 56 residential rooms, four suites, three conference rooms and a dining hall.</li></ul><h4>Academic facilities</h4><ul><li><strong>B. C. Roy Memorial Library:</strong> set up in 1962; more than 1.6 lakh volumes of books and bound journals, 500 subscribed journals and access to over 40,000 online full-text journals, with group-discussion and private-study areas and extended hours during exams.</li><li><strong>Auditorium:</strong> air-conditioned, seats 750, with professional light and sound; it hosts the convocation and major events.</li><li><strong>Finance Lab (Financial Research and Trading Lab):</strong> a Bloomberg terminal and a trading-exchange simulator with real-time feeds from NSE, BSE, NCDEX and MCX.</li><li>The Management Centre for Human Values (MCHV).</li></ul>","hostel_information":"<h4>Hostels at IIM Calcutta</h4><ul><li><strong>Lake View Hostel:</strong> co-ed hostel; the institute describes it as its newest, with air-conditioned rooms that have French windows opening onto private balconies.</li><li><strong>Ramanujan Hostel:</strong> co-ed hostel with separate wings for girls; air-conditioned rooms, common rooms, games rooms and sports courts.</li><li><strong>White Hostel:</strong> a male hostel with air-conditioned rooms, common rooms, games rooms and sports courts.</li><li><strong>New Hostel:</strong> a male hostel with air-conditioned rooms, common rooms, games rooms and sports courts.</li></ul><p>Inter-hostel competitions and cultural, sports and community activities run across the hostels, according to the institute's Hostel Life page.</p>","placement_information":"<p><strong>61st batch, 2024-26, final placement report:</strong> 100% placements, 458 students, 202 participating firms and 542 offers.</p>","scholarships":"<h4>Doctoral (Ph.D) programme: institutional support</h4><ul><li>No tuition fee.</li><li><strong>Stipend:</strong> Rs 42,000 a month before the comprehensive qualifying exam (CQE), Rs 45,000 after the CQE and up to Rs 50,000 after the thesis proposal.</li><li><strong>Student development grants:</strong> up to Rs 1,05,000 in the first year and Rs 35,000 a year after that, for books, computers, field research and conferences.</li><li><strong>Duration:</strong> stipend and grants for four years, extendable by one year for satisfactory progress.</li><li><strong>Other support:</strong> up to Rs 75,000 for dissertation field research; teaching assistantships paying up to Rs 42,000 per course; HRA of Rs 10,000 a month (single) or Rs 15,000 (married); support for an international conference.</li><li>ST students may take the National Fellowship for ST students instead of the institute stipend.</li></ul><h4>PGDBA</h4><p>Need-based financial assistance (NBFA) is available for deserving candidates, and educational loans may be available from banks.</p>","college_image":null,"official_website":"https://www.iimcal.ac.in","cta_heading":"Aiming for IIM Calcutta?","cta_description":"Get help with CAT planning, your interview and your writing ability test.","faq_1_question":"How does IIM Calcutta shortlist MBA candidates?","faq_1_answer":"<p>On CAT scores along with Class X and XII marks and a gender diversity factor.</p>","faq_2_question":"What does final selection include?","faq_2_answer":"<p>A personal interview and a writing ability test, along with academic diversity and work experience.</p>","faq_3_question":"What were the 2026 placements?","faq_3_answer":"The final report lists 100% placements, with 542 offers from 202 firms for a batch of 458 students.","faq_4_question":"Does IIM Calcutta offer a one-year MBA?","faq_4_answer":"<p>Yes. It runs a one-year MBA for Executives.</p>","faq_5_question":"Where is the campus?","faq_5_answer":"<p>On Diamond Harbour Road at Joka, Kolkata 700104.</p>","featured_image":{"id":1180,"date":"2026-11-04T07:25:07","date_gmt":"2026-11-04T07:25:07","guid":{"rendered":"https://staging.a3educarehub.in/colleges/iim-calcutta/indian-institute-of-management-calcutta-campus/"},"modified":"2026-11-04T07:25:07","modified_gmt":"2026-11-04T07:25:07","slug":"indian-institute-of-management-calcutta-campus","status":"inherit","type":"attachment","link":"https://staging.a3educarehub.in/colleges/iim-calcutta/indian-institute-of-management-calcutta-campus/#main","title":{"rendered":"Indian Institute of Management Calcutta campus"},"author":3,"featured_media":0,"comment_status":"open","ping_status":"closed","template":"","meta":{"_acf_changed":false},"class_list":["post-1180","attachment","type-attachment","status-inherit","hentry"],"acf":[],"description":{"rendered":"<p class=\"attachment\"><a href='https://staging.a3educarehub.in/wp-content/uploads/2026/11/iim-calcutta.jpg'><img fetchpriority=\"high\" decoding=\"async\" width=\"300\" height=\"225\" src=\"https://staging.a3educarehub.in/wp-content/uploads/2026/11/iim-calcutta-300x225.jpg\" class=\"attachment-medium size-medium\" alt=\"Indian Institute of Management Calcutta campus\" srcset=\"https://staging.a3educarehub.
