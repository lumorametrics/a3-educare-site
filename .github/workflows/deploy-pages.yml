# Builds the site in this private repository and publishes only the built files
# to the public repository a3-educare-site, which GitHub Pages serves.
name: Deploy to public site repository

on:
  push:
    branches: [main]
  workflow_dispatch:
  # WordPress asks for a rebuild when public content changes (see a3-rest-performance.php in the theme / the
  # a3-educare-performance plugin; it needs A3_REBUILD_REPO and A3_REBUILD_TOKEN in wp-config.php).
  repository_dispatch:
    types: [wordpress-content-updated]
  # Safety net: pages embed build-time WordPress data, so rebuild regularly even if no trigger arrives. The live app
  # still refreshes from WordPress after load, so this only bounds how old the first paint can be.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore Vite source entrypoint
        run: cp index.source.html index.html
      - run: npm run build
        env:
          VITE_BASE_PATH: /a3-educare-site/
          VITE_SITE_URL: https://lumorametrics.github.io/a3-educare-site
      - name: Prepare the site files
        run: |
          # GitHub Pages serves 404.html for addresses it has no file for, so direct links reach the app.
          # The build already wrote a clean 404.html (the plain app shell); only create one if it is missing.
          test -f dist/404.html || cp dist/index.html dist/404.html
          # Serve the files exactly as built, without Jekyll processing.
          touch dist/.nojekyll
      - name: Stop if the build contains source or secret files
        run: |
          found=$(find dist -type f \( -name '*.map' -o -name '.env*' -o -name '*.jsx' -o -name '*.pem' -o -name '*.key' \))
          if [ -n "$found" ]; then echo "$found"; exit 1; fi
      - name: Publish to the public repository
        run: |
          cp -a dist/. .
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git config user.name "a3-site-deploy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update website build"
          git push
