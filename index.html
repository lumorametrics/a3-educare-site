    <!-- Home page only: fetch the first hero slide image right away instead of after the page's JS
         chunk loads (it is the largest element on screen). Matches the <picture> in HeroSlider.jsx. -->
    <script>
      if (location.pathname === "/a3-educare-site/") {
        [
          { media: "(max-width: 639px)", href: "/a3-educare-site/hero/academic-mobile.webp" },
          { media: "(min-width: 640px)", href: "/a3-educare-site/hero/academic-1408.webp", srcset: "/a3-educare-site/hero/academic-1024.webp 1024w, /a3-educare-site/hero/academic-1408.webp 1408w" },
        ].forEach(function (image) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.type = "image/webp";
          link.media = image.media;
          link.href = image.href;
          link.fetchPriority = "high";
          if (image.srcset) {
            link.setAttribute("imagesrcset", image.srcset);
            link.setAttribute("imagesizes", "100vw");
          }
          document.head.appendChild(link);
        });
      }
    </script>
    <!-- Inter from Google Fonts (weights 400-700, one variable file), loaded without blocking first paint.

    <link rel="preconnect" href="https://fonts.googleapis.com" />
